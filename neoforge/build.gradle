plugins {
    id 'java'
}

description = 'NeoForge loader module scaffold'

def neoforgeVersion = project.findProperty('neoforge_version')?.toString() ?: '0.0.0'
def neoforgeCoordinate = "net.neoforged:neoforge:${neoforgeVersion}"
def neoforgeDependencyEnabled = neoforgeVersion != '0.0.0'

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    mavenCentral()
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    implementation project(':common')

    if (neoforgeDependencyEnabled) {
        compileOnly neoforgeCoordinate
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    inputs.property 'modId', project.archives_base_name
    inputs.property 'loaderVersionRange', project.neoforge_loader_version_range
    inputs.property 'minecraftVersionRange', project.minecraft_version_range
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            modVersion: project.version,
            modId: project.archives_base_name,
            loaderVersionRange: project.neoforge_loader_version_range,
            minecraftVersionRange: project.minecraft_version_range
        )
    }
}

tasks.named('jar').configure {
    archiveClassifier = 'neoforge'
}

tasks.register('loaderStatus') {
    group = 'migration'
    description = 'Shows whether NeoForge dependency coordinates are configured.'
    doLast {
        println "NeoForge dependency enabled: ${neoforgeDependencyEnabled}"
        println "NeoForge coordinate: ${neoforgeCoordinate}"
        if (!neoforgeDependencyEnabled) {
            println 'Set neoforge_version in gradle.properties to enable compileOnly NeoForge dependency.'
        }
    }
}

tasks.register('requireLoaderVersion') {
    group = 'migration'
    description = 'Fails when neoforge_version is still placeholder.'
    doLast {
        if (!neoforgeDependencyEnabled) {
            throw new GradleException('neoforge_version is 0.0.0. Set a real NeoForge version in gradle.properties.')
        }
    }
}

tasks.register('portStatus') {
    group = 'migration'
    description = 'Shows current NeoForge migration status.'
    doLast {
        println 'NeoForge scaffold with optional compileOnly dependency is ready. Next: real NeoForge plugin wiring and @Mod bootstrap.'
    }
}
