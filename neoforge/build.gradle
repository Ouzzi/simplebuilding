plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

description = 'NeoForge loader module for SimpleBuilding'

def resolveSetting = { String key, String defaultValue = null ->
    def fromProject = project.findProperty(key)
    return fromProject != null ? fromProject.toString() : defaultValue
}

def neoVersion = resolveSetting('neo_version', '26.2.0.69')
def minecraftVersionRange = resolveSetting('minecraft_version_range', '[26.2,26.3)')

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Loader-neutral game code from common/src/shared/java + NeoForge-specific adapters here.
// No exclude filter needed: the shared tree contains nothing loader-specific, so every
// loader compiles all of it against its own Minecraft jar.
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir rootProject.layout.projectDirectory.dir('common/src/shared/java')
        }
        resources {
            srcDir 'src/main/resources'
            srcDir rootProject.layout.projectDirectory.dir('src/main/resources')
            srcDir rootProject.layout.projectDirectory.dir('src/main/generated')
            exclude 'fabric.mod.json'
        }
    }
}

neoForge {
    version = neoVersion

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }
        // Headless in-game test run: NeoForge's 'gameTestServer' run type boots
        // net.minecraft.gametest.Main, which accepts --tests (namespaced wildcard selector)
        // and --report (junit-style XML). Task name: :neoforge:runGameTest
        gameTest {
            type = 'gameTestServer'
            programArguments.addAll '--tests', "${project.archives_base_name}:*",
                    '--report', layout.buildDirectory.file('neoforge-junit.xml').get().asFile.absolutePath
            // No 'neoforge.enabledGameTestNamespaces' here: that property is not read
            // anywhere in NeoForge 26.2 any more. The run type already sets
            // neoforge.enableGameTest=true, and the selection happens via --tests.
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.archives_base_name, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', rootProject.file('src/main/resources/').absolutePath,
                    '--existing', rootProject.file('src/main/generated/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${archives_base_name}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    implementation project(':common')
    implementation 'me.shedaniel.cloth:cloth-config-neoforge:26.2.155'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            modVersion           : project.version,
            modId                : project.archives_base_name,
            loaderVersionRange   : resolveSetting('neoforge_loader_version_range', '[11,)'),
            minecraftVersionRange: minecraftVersionRange,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar').configure {
    manifest {
        attributes([
                'Specification-Title'     : 'simplebuilding',
                'Specification-Vendor'    : 'simplebuilding',
                'Specification-Version'   : project.version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
        ])
    }
}
