plugins {
    id 'java'
}

description = 'NeoForge loader module scaffold'

def versionProfile = project.findProperty('versionProfile')?.toString()
def versionProfileProps = new Properties()

if (versionProfile) {
    def profileFile = rootProject.file("profiles/${versionProfile}.properties")
    if (!profileFile.exists()) {
        throw new GradleException("Version profile not found: ${profileFile}")
    }
    profileFile.withInputStream { versionProfileProps.load(it) }
}

def resolveSetting = { String key, String defaultValue = null ->
    if (versionProfileProps.containsKey(key)) {
        return versionProfileProps.getProperty(key)
    }
    def fromProject = project.findProperty(key)
    return fromProject != null ? fromProject.toString() : defaultValue
}

def neoforgeVersionChannel = resolveSetting('neoforge_version_channel', 'fixed')
def neoforgeVersionFixed = resolveSetting('neoforge_version_fixed', null)
def neoforgeVersionLatest = resolveSetting('neoforge_version_latest', null)
def neoforgeVersionLegacy = resolveSetting('neoforge_version', '0.0.0')

def neoforgeVersion = neoforgeVersionChannel == 'latest' ? (neoforgeVersionLatest ?: neoforgeVersionLegacy) : (neoforgeVersionFixed ?: neoforgeVersionLegacy)
def neoforgeLoaderVersionRange = resolveSetting('neoforge_loader_version_range', '[0,)')
def minecraftVersionRange = resolveSetting('minecraft_version_range', '[1.21.11,1.22)')

def neoforgeCoordinate = "net.neoforged:neoforge:${neoforgeVersion}"
def neoforgeDependencyEnabled = neoforgeVersion != '0.0.0'

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    mavenCentral()
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    implementation project(':common')

    if (neoforgeDependencyEnabled) {
        compileOnly neoforgeCoordinate
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    inputs.property 'modId', project.archives_base_name
    inputs.property 'loaderVersionRange', neoforgeLoaderVersionRange
    inputs.property 'minecraftVersionRange', minecraftVersionRange
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
            modVersion: project.version,
            modId: project.archives_base_name,
            loaderVersionRange: neoforgeLoaderVersionRange,
            minecraftVersionRange: minecraftVersionRange
        )
    }
}

tasks.named('jar').configure {
    archiveClassifier = 'neoforge'
}

tasks.register('loaderStatus') {
    group = 'migration'
    description = 'Shows whether NeoForge dependency coordinates are configured.'
    doLast {
        println "Version profile: ${versionProfile ?: '(none)'}"
        println "NeoForge version channel: ${neoforgeVersionChannel}"
        println "NeoForge dependency enabled: ${neoforgeDependencyEnabled}"
        println "NeoForge coordinate: ${neoforgeCoordinate}"
        if (!neoforgeDependencyEnabled) {
            println 'Set neoforge_version_fixed (or legacy neoforge_version) in gradle.properties to enable compileOnly NeoForge dependency.'
        }
    }
}

tasks.register('requireLoaderVersion') {
    group = 'migration'
    description = 'Fails when neoforge_version is still placeholder.'
    doLast {
        if (!neoforgeDependencyEnabled) {
            throw new GradleException('NeoForge dependency is disabled. Configure neoforge_version_fixed or neoforge_version.')
        }
    }
}

tasks.register('portStatus') {
    group = 'migration'
    description = 'Shows current NeoForge migration status.'
    doLast {
        println 'NeoForge scaffold with optional compileOnly dependency is ready. Next: real NeoForge plugin wiring and @Mod bootstrap.'
    }
}
