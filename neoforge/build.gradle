plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

description = 'NeoForge loader module for SimpleBuilding'

def resolveSetting = { String key, String defaultValue = null ->
    def fromProject = project.findProperty(key)
    return fromProject != null ? fromProject.toString() : defaultValue
}

def neoVersion = resolveSetting('neo_version', '26.1.2.75')
def minecraftVersionRange = resolveSetting('minecraft_version_range', '[26.1.2,26.2)')

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Shared game code from the Fabric root module + NeoForge-specific adapters in this module.
def rootFabricJavaDir = rootProject.layout.projectDirectory.dir('src/main/java').asFile.toPath()
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir rootProject.layout.projectDirectory.dir('src/main/java')
            exclude { details ->
                def isRootFabricSource = details.file.toPath().startsWith(rootFabricJavaDir)
                def relative = details.relativePath.pathString
                if (!isRootFabricSource) {
                    return false
                }
                return relative == 'com/simplebuilding/Simplebuilding.java'
                        || relative == 'com/simplebuilding/SimplebuildingClient.java'
                        || relative == 'com/simplebuilding/SimplebuildingDataGenerator.java'
                        || relative.startsWith('com/simplebuilding/compat/')
                        || relative.startsWith('com/simplebuilding/datagen/')
                        || relative == 'com/simplebuilding/platform/HopperMenus.java'
                        || relative == 'com/simplebuilding/screen/ModScreenHandlers.java'
                        || relative == 'com/simplebuilding/command/ModCommands.java'
                        || relative == 'com/simplebuilding/util/ModRegistries.java'
                        || relative == 'com/simplebuilding/recipe/ModRecipes.java'
                        || relative == 'com/simplebuilding/networking/ModMessages.java'
                        || relative == 'com/simplebuilding/items/ModItemGroups.java'
                        || relative == 'com/simplebuilding/blocks/entity/ModBlockEntities.java'
                        || relative == 'com/simplebuilding/world/gen/ModOreGeneration.java'
            }
        }
        resources {
            srcDir 'src/main/resources'
            srcDir rootProject.layout.projectDirectory.dir('src/main/resources')
            srcDir rootProject.layout.projectDirectory.dir('src/main/generated')
            exclude 'fabric.mod.json'
        }
    }
}

neoForge {
    version = neoVersion

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.archives_base_name
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.archives_base_name, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', rootProject.file('src/main/resources/').absolutePath,
                    '--existing', rootProject.file('src/main/generated/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${archives_base_name}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    implementation project(':common')
    implementation 'me.shedaniel.cloth:cloth-config-neoforge:26.1.154'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            modVersion           : project.version,
            modId                : project.archives_base_name,
            loaderVersionRange   : resolveSetting('neoforge_loader_version_range', '[11,)'),
            minecraftVersionRange: minecraftVersionRange,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar').configure {
    manifest {
        attributes([
                'Specification-Title'     : 'simplebuilding',
                'Specification-Vendor'    : 'simplebuilding',
                'Specification-Version'   : project.version,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
        ])
    }
}
