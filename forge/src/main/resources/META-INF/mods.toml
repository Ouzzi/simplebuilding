modLoader="javafml"
loaderVersion="${loaderVersionRange}"
license="CC0-1.0"

[[mixins]]
config="simplebuilding.mixins.json"

[[mixins]]
config="simplebuilding.client.mixins.json"

[[mods]]
modId="${modId}"
version="${modVersion}"
displayName="SimpleBuilding"
logoFile="assets/simplebuilding/icon.png"
description='''
SimpleBuilding for MinecraftForge ${minecraftVersionRange}
'''
authors="simplebuilding"

[[dependencies.${modId}]]
modId="forge"
mandatory=true
versionRange="${loaderVersionRange}"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="minecraft"
mandatory=true
versionRange="${minecraftVersionRange}"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="cloth_config"
mandatory=false
versionRange="[26,)"
ordering="NONE"
side="BOTH"

# Optional integrations (mandatory=false). None of JEI, Jade and AppleSkin has a MinecraftForge 26.2
# build at the moment (2026-09-24), only Mouse Tweaks does; declared anyway so a later build lines up.
[[dependencies.${modId}]]
modId="jei"
mandatory=false
versionRange="[30,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="jade"
mandatory=false
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="appleskin"
mandatory=false
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="mousetweaks"
mandatory=false
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
