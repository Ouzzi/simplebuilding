plugins {
    id 'java'
}

description = 'Forge loader module scaffold'

def forgeVersion = project.findProperty('forge_version')?.toString() ?: '0.0.0'
def minecraftVersion = project.findProperty('minecraft_version')?.toString() ?: '1.21.11'
def forgeCoordinate = "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
def forgeDependencyEnabled = forgeVersion != '0.0.0'

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    implementation project(':common')

    if (forgeDependencyEnabled) {
        compileOnly forgeCoordinate
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    inputs.property 'modId', project.archives_base_name
    inputs.property 'loaderVersionRange', project.forge_loader_version_range
    inputs.property 'minecraftVersionRange', project.minecraft_version_range
    filesMatching('META-INF/mods.toml') {
        expand(
            modVersion: project.version,
            modId: project.archives_base_name,
            loaderVersionRange: project.forge_loader_version_range,
            minecraftVersionRange: project.minecraft_version_range
        )
    }
}

tasks.named('jar').configure {
    archiveClassifier = 'forge'
}

tasks.register('loaderStatus') {
    group = 'migration'
    description = 'Shows whether Forge dependency coordinates are configured.'
    doLast {
        println "Forge dependency enabled: ${forgeDependencyEnabled}"
        println "Forge coordinate: ${forgeCoordinate}"
        if (!forgeDependencyEnabled) {
            println 'Set forge_version in gradle.properties to enable compileOnly Forge dependency.'
        }
    }
}

tasks.register('requireLoaderVersion') {
    group = 'migration'
    description = 'Fails when forge_version is still placeholder.'
    doLast {
        if (!forgeDependencyEnabled) {
            throw new GradleException('forge_version is 0.0.0. Set a real Forge version in gradle.properties.')
        }
    }
}

tasks.register('portStatus') {
    group = 'migration'
    description = 'Shows current Forge migration status.'
    doLast {
        println 'Forge scaffold with optional compileOnly dependency is ready. Next: real Forge plugin wiring and @Mod bootstrap.'
    }
}
