plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.36'
}

description = 'MinecraftForge loader module for SimpleBuilding (LEGACY / best-effort; Fabric + NeoForge are the current loaders)'

def resolveSetting = { String key, String defaultValue = null ->
    def fromProject = project.findProperty(key)
    return fromProject != null ? fromProject.toString() : defaultValue
}

def forgeVersion = resolveSetting('forge_version_fixed', '64.0.9')
def minecraftVersion = resolveSetting('minecraft_version', '26.1.2')
def forgeLoaderVersionRange = resolveSetting('forge_loader_version_range', '[64,)')
def minecraftVersionRange = resolveSetting('minecraft_version_range', '[26.1.2,26.2)')

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${rootProject.archives_base_name}-forge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Shared game code from the Fabric root module + Forge-specific adapters in this
// module. Mirrors the neoforge module: the same root sources are recompiled here,
// excluding the Fabric/loader-specific entrypoints that this module re-provides.
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir rootProject.layout.projectDirectory.dir('common/src/shared/java')
        }
        resources {
            srcDir 'src/main/resources'
            srcDir rootProject.layout.projectDirectory.dir('src/main/resources')
            srcDir rootProject.layout.projectDirectory.dir('src/main/generated')
            exclude 'fabric.mod.json'
        }
    }
}

// Forge laedt einen Klassenpfad-Mod als EIN Verzeichnis: liegen Klassen und Ressourcen getrennt
// (build/classes/java/main vs. build/resources/main), findet es die @Mod-Klasse nicht ("has mods
// that were not found"). Wie im Forge-MDK beide Ausgaben in denselben Ordner legen.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Run-Konfigurationen sind hier standardmaessig ABGESCHALTET. Warum:
//
// ForgeGradle 7.0.36 legt fuer JEDEN `minecraft.runs`-Eintrag zwei Tasks an: die
// Run-Task selbst (Typ SlimeLauncherExec) und -- bedingungslos, siehe
// SlimeLauncherExec.register(), die SlimeLauncherEclipseConfiguration.register()
// direkt mitaufruft -- eine Eclipse-Run-Config-Task `genEclipseRun<Run>For<Dep>`.
// Beide Typen loesen SCHON IM KONSTRUKTOR das "Slime Launcher"-Tool auf, und das
// verlangt ueber SharedUtil.launcherForStrictly(toolchains, 8) zwingend ein
// Java-8-Toolchain. Ohne installiertes JDK 8 scheitert damit bereits das ERSTELLEN
// der Task -- und in der Folge jede Task-Auflistung (`gradlew tasks`,
// `gradlew tasks --all`), weil Gradles TaskReportTask alle registrierten Tasks
// realisiert:
//     Could not create task ':forge:genEclipseRunClientForForge'.
//      > Could not create task of type 'SlimeLauncherEclipseConfiguration'.
//         > Cannot find a Java installation ... matching: {languageVersion=8, ...}
//
// ForgeGradle bietet keinen Schalter, um nur die IDE-/Eclipse-Tasks abzuwaehlen,
// und ein lazy registrierter Gradle-Task laesst sich nachtraeglich nicht mehr
// entfernen (tasks.replace() verweigert einen inkompatiblen Ersatztyp). Der
// einzige saubere Hebel ist deshalb, gar keine Runs zu registrieren.
//
// KOSTEN: :forge:runClient / :forge:runServer und die generierten
// Eclipse-Run-Configs gibt es nicht mehr. Das kostet nichts Funktionierendes --
// :forge:runClient scheiterte hier mit exakt demselben Java-8-Toolchain-Fehler --,
// und das forge-Modul ist ohnehin zurueckgestellt (MULTILOADER_TODO.md, Abschnitt
// "Forge: ZURUECKGESTELLT"): es soll nur weiter bauen, nicht laufen. Fabric und
// NeoForge sind davon nicht beruehrt.
//
// Wer ein JDK 8 installiert hat, schaltet die Runs mit -Pforge_runs=true wieder ein.
def forgeRunsEnabled = Boolean.parseBoolean(resolveSetting('forge_runs', 'false'))

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', rootProject.archives_base_name
            // Im Dev-Lauf gibt es kein Jar-Manifest: die Mixin-Konfigs direkt an den Launcher geben.
            args '-mixin.config=simplebuilding.mixins.json', '-mixin.config=simplebuilding.client.mixins.json', '-mixin.config=simplebuilding.forge.mixins.json'
        }
        if (forgeRunsEnabled) {
            register('client')
            register('server') {
                args '--nogui'
            }
            // Headless in-game tests (tools/testrunner/run.py, Ziel forge-262): Forges
            // 'gameTestServer' startet net.minecraft.gametest.Main mit --tests/--report wie auf
            // NeoForge. Die Tests selbst meldet com.simplebuilding.forge.gametest.ForgeGameTests an.
            // Eigenes Arbeitsverzeichnis, damit die Testwelt nicht in run/ des Dev-Servers landet.
            // Task: :forge:runGameTestServer
            register('gameTestServer') {
                workingDir = layout.projectDirectory.dir('run-gametest')
                args '--tests', (project.findProperty('gametestFilter') ?: "${rootProject.archives_base_name}:*").toString(),
                        '--report', layout.buildDirectory.file('forge-junit.xml').get().asFile.absolutePath
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url = 'https://maven.shedaniel.me/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

// Dev-only runtime mods. Of JEI, Jade, Mouse Tweaks and AppleSkin only Mouse Tweaks has a
// MinecraftForge 26.2 build (checked on Modrinth and maven.blamejared.com, 2026-09-24). It goes
// into the mods folder of the working directory the client and server runs share (run/mods);
// runGameTestServer works in run-gametest/ and never sees it. Sync only manages the files named
// like the dev mods; everything else in run/mods stays. Only wired when the runs exist
// (-Pforge_runs=true). Switch off: -Pdev_mods=false.
def devModsEnabled = (project.findProperty('dev_mods') ?: 'true').toString().toBoolean()
configurations {
    devMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
def syncDevMods = tasks.register('syncDevMods', Sync) {
    description = 'Copies the dev-only runtime mods (Mouse Tweaks) into run/mods for runClient/runServer.'
    from configurations.devMods
    into layout.projectDirectory.dir('run/mods')
    preserve {
        include '**'
        exclude 'MouseTweaks-*.jar'
    }
}
if (devModsEnabled) {
    tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
        dependsOn syncDevMods
    }
}

dependencies {
    implementation project(':common')
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}")
    devMods "maven.modrinth:mouse-tweaks:${rootProject.dev_mousetweaks_forge}"
    // NOTE: cloth-config has no MinecraftForge build for the 26.x line (Fabric +
    // NeoForge only). A minimal me.shedaniel.autoconfig shim is bundled in this
    // module (see src/main/java/me/shedaniel/autoconfig) so the shared config code
    // compiles and runs on Forge with default values (no config GUI/persistence).
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            modVersion           : project.version,
            modId                : rootProject.archives_base_name,
            loaderVersionRange   : forgeLoaderVersionRange,
            minecraftVersionRange: minecraftVersionRange,
    ]
    inputs.properties replaceProperties
    inputs.property 'forgeMixinLevel', 'JAVA_21'
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    // Forges Mixin 0.8.7 kennt hoechstens JAVA_21; die gemeinsamen Konfigs (Fabric/NeoForge) sagen JAVA_25.
    filesMatching('*.mixins.json') {
        filter { String line -> line.replace('"JAVA_25"', '"JAVA_21"') }
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar').configure {
    manifest {
        attributes([
                'Specification-Title'   : 'simplebuilding',
                'Specification-Vendor'  : 'simplebuilding',
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                // Forge 65 liest Mixin-Konfigs nur aus diesem Manifest-Attribut, nicht aus [[mixins]] der mods.toml.
                'MixinConfigs'          : 'simplebuilding.mixins.json,simplebuilding.client.mixins.json,simplebuilding.forge.mixins.json',
        ])
    }
}
