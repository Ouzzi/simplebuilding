plugins {
    id 'java'
}

description = 'Forge loader module scaffold'

def versionProfile = project.findProperty('versionProfile')?.toString()
def versionProfileProps = new Properties()

if (versionProfile) {
    def profileFile = rootProject.file("profiles/${versionProfile}.properties")
    if (!profileFile.exists()) {
        throw new GradleException("Version profile not found: ${profileFile}")
    }
    profileFile.withInputStream { versionProfileProps.load(it) }
}

def resolveSetting = { String key, String defaultValue = null ->
    if (versionProfileProps.containsKey(key)) {
        return versionProfileProps.getProperty(key)
    }
    def fromProject = project.findProperty(key)
    return fromProject != null ? fromProject.toString() : defaultValue
}

def forgeVersionChannel = resolveSetting('forge_version_channel', 'fixed')
def forgeVersionFixed = resolveSetting('forge_version_fixed', null)
def forgeVersionLatest = resolveSetting('forge_version_latest', null)
def forgeVersionLegacy = resolveSetting('forge_version', '0.0.0')

def forgeVersion = forgeVersionChannel == 'latest' ? (forgeVersionLatest ?: forgeVersionLegacy) : (forgeVersionFixed ?: forgeVersionLegacy)
def minecraftVersion = resolveSetting('minecraft_version', '1.21.11')
def forgeLoaderVersionRange = resolveSetting('forge_loader_version_range', '[0,)')
def minecraftVersionRange = resolveSetting('minecraft_version_range', '[1.21.11,1.22)')

def forgeCoordinate = "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
def forgeDependencyEnabled = forgeVersion != '0.0.0'

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    mavenCentral()
}

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    implementation project(':common')

    if (forgeDependencyEnabled) {
        compileOnly forgeCoordinate
    }
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'modVersion', project.version
    inputs.property 'modId', project.archives_base_name
    inputs.property 'loaderVersionRange', forgeLoaderVersionRange
    inputs.property 'minecraftVersionRange', minecraftVersionRange
    filesMatching('META-INF/mods.toml') {
        expand(
            modVersion: project.version,
            modId: project.archives_base_name,
            loaderVersionRange: forgeLoaderVersionRange,
            minecraftVersionRange: minecraftVersionRange
        )
    }
}

tasks.named('jar').configure {
    archiveClassifier = 'forge'
}

tasks.register('loaderStatus') {
    group = 'migration'
    description = 'Shows whether Forge dependency coordinates are configured.'
    doLast {
        println "Version profile: ${versionProfile ?: '(none)'}"
        println "Forge version channel: ${forgeVersionChannel}"
        println "Forge dependency enabled: ${forgeDependencyEnabled}"
        println "Forge coordinate: ${forgeCoordinate}"
        if (!forgeDependencyEnabled) {
            println 'Set forge_version_fixed (or legacy forge_version) in gradle.properties to enable compileOnly Forge dependency.'
        }
    }
}

tasks.register('requireLoaderVersion') {
    group = 'migration'
    description = 'Fails when forge_version is still placeholder.'
    doLast {
        if (!forgeDependencyEnabled) {
            throw new GradleException('Forge dependency is disabled. Configure forge_version_fixed or forge_version.')
        }
    }
}

tasks.register('portStatus') {
    group = 'migration'
    description = 'Shows current Forge migration status.'
    doLast {
        println 'Forge scaffold with optional compileOnly dependency is ready. Next: real Forge plugin wiring and @Mod bootstrap.'
    }
}
