plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

description = 'MinecraftForge loader module for SimpleBuilding (LEGACY / best-effort; Fabric + NeoForge are the current loaders)'

def resolveSetting = { String key, String defaultValue = null ->
    def fromProject = project.findProperty(key)
    return fromProject != null ? fromProject.toString() : defaultValue
}

def forgeVersion = resolveSetting('forge_version_fixed', '64.0.9')
def minecraftVersion = resolveSetting('minecraft_version', '26.1.2')
def forgeLoaderVersionRange = resolveSetting('forge_loader_version_range', '[64,)')
def minecraftVersionRange = resolveSetting('minecraft_version_range', '[26.1.2,26.2)')

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${rootProject.archives_base_name}-forge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Shared game code from the Fabric root module + Forge-specific adapters in this
// module. Mirrors the neoforge module: the same root sources are recompiled here,
// excluding the Fabric/loader-specific entrypoints that this module re-provides.
sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir rootProject.layout.projectDirectory.dir('src/main/java')
            exclude { details ->
                def path = details.file.absolutePath.replace('\\', '/')
                def isRootFabricSource = path.contains('/simplebuilding/src/main/java/')
                def relative = details.relativePath.pathString
                if (!isRootFabricSource) {
                    return false
                }
                return relative == 'com/simplebuilding/Simplebuilding.java'
                        || relative == 'com/simplebuilding/SimplebuildingClient.java'
                        || relative == 'com/simplebuilding/SimplebuildingDataGenerator.java'
                        || relative.startsWith('com/simplebuilding/compat/')
                        || relative.startsWith('com/simplebuilding/datagen/')
                        || relative == 'com/simplebuilding/platform/HopperMenus.java'
                        || relative == 'com/simplebuilding/screen/ModScreenHandlers.java'
                        || relative == 'com/simplebuilding/command/ModCommands.java'
                        || relative == 'com/simplebuilding/util/ModRegistries.java'
                        || relative == 'com/simplebuilding/recipe/ModRecipes.java'
                        || relative == 'com/simplebuilding/networking/ModMessages.java'
                        || relative == 'com/simplebuilding/items/ModItemGroups.java'
                        || relative == 'com/simplebuilding/blocks/entity/ModBlockEntities.java'
                        || relative == 'com/simplebuilding/world/gen/ModOreGeneration.java'
            }
        }
        resources {
            srcDir 'src/main/resources'
            srcDir rootProject.layout.projectDirectory.dir('src/main/resources')
            srcDir rootProject.layout.projectDirectory.dir('src/main/generated')
            exclude 'fabric.mod.json'
        }
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', rootProject.archives_base_name
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

dependencies {
    implementation project(':common')
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}")
    // NOTE: cloth-config has no MinecraftForge build for the 26.x line (Fabric +
    // NeoForge only). A minimal me.shedaniel.autoconfig shim is bundled in this
    // module (see src/main/java/me/shedaniel/autoconfig) so the shared config code
    // compiles and runs on Forge with default values (no config GUI/persistence).
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            modVersion           : project.version,
            modId                : rootProject.archives_base_name,
            loaderVersionRange   : forgeLoaderVersionRange,
            minecraftVersionRange: minecraftVersionRange,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar').configure {
    manifest {
        attributes([
                'Specification-Title'   : 'simplebuilding',
                'Specification-Vendor'  : 'simplebuilding',
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
        ])
    }
}
