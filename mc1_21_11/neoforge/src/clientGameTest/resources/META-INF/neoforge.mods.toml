modLoader="javafml"
# javafml version of the 1.21.11 line: fancymodloader 10.x (see the main mods.toml), so NOT
# "[11,)" like the 26.2 module.
loaderVersion="[10,)"
license="CC0-1.0"

# Test-only mod. It lives in its own source set (src/clientGameTest) and is only added to
# the :mc1_21_11:neoforge:runClientGameTest run configuration, so it can never end up in a
# shipped jar.
[[mods]]
modId="simplebuildingclienttest"
version="1.0.0"
displayName="SimpleBuilding Client Renderer Proof"
description='''
Automated in-world renderer proof for the NeoForge 1.21.11 client. Inert unless the system
property simplebuilding.clienttest is set to true.
'''
authors="simplebuilding"

[[dependencies.simplebuildingclienttest]]
modId="neoforge"
type="required"
versionRange="[21,)"
ordering="NONE"
side="CLIENT"

[[dependencies.simplebuildingclienttest]]
modId="simplebuilding"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
