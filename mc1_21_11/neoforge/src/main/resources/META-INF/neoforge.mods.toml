modLoader="javafml"
loaderVersion="${loaderVersionRange}"
license="CC0-1.0"

[[mixins]]
config="simplebuilding.mixins.json"

[[mixins]]
config="simplebuilding.client.mixins.json"

# Oeffnet LevelRenderer#submitNodeStorage; NeoForge 21.11.45 hat noch kein
# SubmitCustomGeometryEvent (siehe SimplebuildingNeoForgeClient#onRenderLevelStage).
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${modId}"
version="${modVersion}"
displayName="SimpleBuilding"
description='''
SimpleBuilding for NeoForge 21.11 (Minecraft 1.21.11)
'''
authors="simplebuilding"
displayURL="https://azarfane.de/"
logoFile="assets/simplebuilding/icon.png"

[[dependencies.${modId}]]
modId="neoforge"
type="required"
versionRange="[21.11,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="minecraft"
type="required"
versionRange="${minecraftVersionRange}"
ordering="NONE"
side="BOTH"

# Required: the config (SimplebuildingConfig) is registered with cloth's AutoConfig on startup,
# unconditionally, and cloth-config is not bundled (no jarJar).
[[dependencies.${modId}]]
modId="cloth_config"
type="required"
versionRange="[21.11,)"
ordering="NONE"
side="BOTH"

# Optional integrations. type="optional": not needed, but if present the version must fit.
# JEI: the mod ships a JEI plugin (in-world transformation categories, count-based smithing).
[[dependencies.${modId}]]
modId="jei"
type="optional"
versionRange="[27,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="jade"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="appleskin"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modId}]]
modId="mousetweaks"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
