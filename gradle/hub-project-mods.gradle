// Hub launches use the saved project-mod selection on the 26.3 main line.
// Keep ordinary developer runs and test classpaths unchanged.
if (providers.gradleProperty('hub_client').getOrElse('false').toBoolean()) {
    if (project.name == 'fabric') {
        tasks.named('runClient') { systemProperty 'simplebuilding.hub', 'true' }
    } else if (project.name == 'neoforge') {
        neoForge.runs.getByName('client').systemProperty 'simplebuilding.hub', 'true'
    } else if (project.name == 'forge') {
        minecraft.runs.matching { it.name == 'client' }.configureEach {
            systemProperty 'simplebuilding.hub', 'true'
        }
    }
}

if (providers.gradleProperty('hub_mod_selection').getOrElse('false').toBoolean()) {
    def selection = new groovy.json.JsonSlurper().parse(rootProject.file('integration/enabled-mods.json'))
    def registry = new groovy.json.JsonSlurper().parse(rootProject.file('modules/modules.json')).modules
    def loader = project.name
    def selected = registry.findAll { it.id != 'simplebuilding' && selection.modules.contains(it.id) && it.projects[loader] }
    // Resolve only after task dependencies configure the selected producer projects.
    // ModDevGradle jarJar produces a directory embedded by jar, not an archive.
    def jars = files(selected.collect { entry ->
        providers.provider {
            project(entry.projects[loader]).tasks.named('jar').get().archiveFile.get().asFile
        }
    })
    if (loader == 'fabric') {
        tasks.named('stageHubLocalMods') {
            dependsOn selected.collect { "${it.projects[loader]}:jar" }
            // Add to the existing sync source so disabled jars are removed together.
            doLast { copy { from jars; into layout.buildDirectory.dir('hubLocalMods') } }
        }
    } else if (loader == 'neoforge') {
        def launchSources = sourceSets.findByName('devRuns')
        if (launchSources == null) {
            launchSources = sourceSets.create('hubRuns')
            configurations.getByName(launchSources.runtimeOnlyConfigurationName).extendsFrom(configurations.runtimeOnly)
            configurations.getByName(launchSources.implementationConfigurationName).extendsFrom(configurations.implementation)
            neoForge.addModdingDependenciesTo(launchSources)
        }
        launchSources.runtimeClasspath += jars
        ['client', 'server'].each { name -> neoForge.runs.getByName(name).sourceSet = launchSources }
        tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
            dependsOn selected.collect { "${it.projects[loader]}:jar" }
        }
    } else if (loader == 'forge') {
        // These are complete distributable jars, including their mixin manifests.
        dependencies.add('runtimeOnly', jars)
        tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
            dependsOn selected.collect { "${it.projects[loader]}:jar" }
        }
    }
}
