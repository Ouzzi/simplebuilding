// Loader projects all have the name 'forge'; unique groups prevent Gradle from
// resolving one module in place of another when both are present at runtime.
group = 'com.simplebuilding.modules.' + project.parent.name
base { archivesName = project.parent.name + '-26.3-forge' }
version = project.findProperty('moduleVersion') ?: '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
sourceSets.main.java.srcDir '../shared/java'
sourceSets.main.resources.srcDir '../shared/resources'
sourceSets.main.resources.srcDir '../generated/resources'
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:26.3-${rootProject.mc263_forge_version}")
}
apply from: rootProject.file('gradle/forge-framework.gradle')
processResources { inputs.property('version', project.version.toString()); filesMatching('META-INF/mods.toml') { expand version: project.version } }
if (providers.gradleProperty('forge_runs').getOrElse('false').toBoolean()) {
    minecraft.runs {
        configureEach { workingDir = layout.projectDirectory.dir('run') }
        register('client')
        register('server') { args '--nogui' }
    }
}

// Optional module-owned settings. Default builds never apply this convention.
def moduleId = project.parent.name
def entry = new groovy.json.JsonSlurper().parse(rootProject.file('modules/modules.json')).modules.find { it.id == moduleId }
def forgeTest = entry?.tests?.loaders?.forge
if (project.hasProperty('forgeExcludedSources')) sourceSets.main.java.exclude(project.forgeExcludedSources)
if (project.hasProperty('forgeMixinConfigs')) {
    tasks.named('jar') { manifest { attributes 'MixinConfigs': project.forgeMixinConfigs.join(',') } }
    processResources { filesMatching('*.mixins.json') { filter { it.replace('"JAVA_25"', '"JAVA_21"') } } }
    if (providers.gradleProperty('forge_runs').getOrElse('false').toBoolean()) {
        minecraft.runs.configureEach { project.forgeMixinConfigs.each { args "-mixin.config=${it}" } }
    }
}
// Forge 26.3 reads exactly one condition object under "forge:condition" (net.minecraftforge.common.crafting.conditions.
// ICondition.DEFAULT_FIELD); Fabric/NeoForge ignore that key. An explicit "forge:condition" wins, then a "forge:conditions"
// list, then "neoforge:conditions" with NeoForge's built-in types renamed to their Forge twins (same field names).
// tools/check_load_conditions.py applies the same rule and rejects ids a loader does not know.
def forgeBuiltins = ['and', 'or', 'not', 'mod_loaded', 'item_exists', 'tag_empty', 'true', 'false'] as Set
def toForge
toForge = { c ->
    if (c instanceof List) return c.collect { toForge(it) }
    if (!(c instanceof Map)) return c
    def out = c.collectEntries { k, v -> [k, k in ['value', 'values'] ? toForge(v) : v] }
    def type = c.type instanceof String ? c.type : ''
    if (type.startsWith('neoforge:') && type.substring(9) in forgeBuiltins) out.type = 'forge:' + type.substring(9)
    out
}
processResources {
    doLast {
        fileTree(destinationDir).matching { include 'data/**/*.json' }.each { f ->
            def data = new groovy.json.JsonSlurper().parse(f)
            if (data instanceof Map && !data['forge:condition'] && (data['forge:conditions'] || data['neoforge:conditions'])) {
                def conditions = data['forge:conditions'] ?: toForge(data['neoforge:conditions'])
                data['forge:condition'] = conditions.size() == 1 ? conditions[0] : [type:'forge:and', values:conditions]
                f.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n', 'UTF-8')
            }
        }
    }
}
if (forgeTest && providers.gradleProperty('forge_runs').getOrElse('false').toBoolean()) {
    // Required test mods are runtime jars, never implementation imports.
    // Test dependencies are activated only by an explicitly requested manifest test task.
    // -PforgeStandalone=true (manifest tests.standalone.loaders.forge, principle 8): only the module and its hard
    // requirements load, with their own report and world; the run is otherwise the ordinary gameTestServer.
    // The property is global (every Forge project is evaluated); only a module with a declared suite switches over.
    def standaloneSpec = entry.tests.standalone?.loaders?.forge
    def standalone = providers.gradleProperty('forgeStandalone').getOrElse('false').toBoolean() && standaloneSpec != null
    if (!standaloneSpec && providers.gradleProperty('forgeStandalone').isPresent() && gradle.startParameter.taskNames.contains(forgeTest.task))
        throw new GradleException("No Forge standalone suite declared for ${moduleId}")
    def runtimeMods = standalone ? (entry.tests.standalone.requires ?: [])
            : providers.gradleProperty('forgeTestMods').map { it.split(',').findAll { !it.isBlank() } }.getOrElse(forgeTest.testMods ?: [])
    if (gradle.startParameter.taskNames.contains(forgeTest.task)) runtimeMods.each { id ->
        def dependency = new groovy.json.JsonSlurper().parse(rootProject.file('modules/modules.json')).modules.find { it.id == id }
        if (!dependency?.projects?.forge || id == moduleId) throw new GradleException("Invalid Forge test dependency: ${id}")
        dependencies { runtimeOnly project(dependency.projects.forge) }
    }
    minecraft.runs.register('gameTestServer') {
        workingDir = layout.projectDirectory.dir(standalone ? 'run-standalone' : 'run-gametest')
        args '--tests', (project.findProperty('gametestFilter') ?: "${entry.tests.namespace ?: moduleId}:*").toString(), '--report', rootProject.file(standalone ? standaloneSpec.report : forgeTest.report).absolutePath
    }
}
apply from: rootProject.file('gradle/forge-packaged-run.gradle')
