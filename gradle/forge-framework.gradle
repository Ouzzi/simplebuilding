// Forge's Jar-in-Jar metadata gives all modules one version-selected API instance.
dependencies { compileOnly project(':framework') }
def apiProject = project(':framework')
evaluationDependsOn(':framework')
def apiJar = apiProject.tasks.named('jar')
// Optional: also nest SimpleLib (principle 6a) in the same Jar-in-Jar metadata - Forge reads one metadata.json.
def bundleLib = project.findProperty('forgeBundleSimplelib') == true && rootProject.findProject(':modules:simplelib:forge') != null
def libProject = bundleLib ? rootProject.project(':modules:simplelib:forge') : null
if (bundleLib) evaluationDependsOn(':modules:simplelib:forge')
def libJar = bundleLib ? libProject.tasks.named('jar') : null
// Compile against the finished jar (the Forge project shares one output dir for classes and resources).
if (bundleLib) dependencies { compileOnly files(libJar) }
// Optional: nest sub-mods of a super-mod (docs/ai/KONZEPT-SUPERMOD-SUBMOD-2026-10-06.md), e.g.
// ext.forgeBundleModules = [':modules:simpleweather:forge'] - same Jar-in-Jar metadata, one version-selected copy.
def subProjects = (project.findProperty('forgeBundleModules') ?: []).collect { path -> evaluationDependsOn(path); rootProject.project(path) }
def subJars = subProjects.collect { it.tasks.named('jar') }
def metadata = layout.buildDirectory.dir('forgeFrameworkMetadata')
tasks.register('prepareForgeFramework') {
    dependsOn apiJar
    if (bundleLib) dependsOn libJar
    subJars.each { dependsOn it; inputs.file(it.flatMap { j -> j.archiveFile }) }
    inputs.property('frameworkVersion', apiProject.version.toString())
    inputs.file(apiJar.flatMap { it.archiveFile })
    if (bundleLib) inputs.file(libJar.flatMap { it.archiveFile })
    outputs.dir(metadata)
    doLast {
        def jarName = apiJar.get().archiveFileName.get()
        def target = metadata.get().file('META-INF/jarjar/metadata.json').asFile
        target.parentFile.mkdirs()
        def jars = [[
            identifier: [group: apiProject.group.toString(), artifact: apiProject.name],
            version: [range: '[0.1.5,0.2)', artifactVersion: apiProject.version.toString()],
            path: "META-INF/jarjar/${jarName}"
        ]]
        if (bundleLib) {
            def libName = libJar.get().archiveFileName.get()
            jars << [identifier: [group: libProject.group.toString(), artifact: 'simplelib'],
                     version: [range: "[${libProject.version},)", artifactVersion: libProject.version.toString()],
                     path: "META-INF/jarjar/${libName}"]
            copy { from(libJar.flatMap { it.archiveFile }); into target.parentFile }
        }
        subProjects.eachWithIndex { sub, i ->
            def subName = subJars[i].get().archiveFileName.get()
            jars << [identifier: [group: sub.group.toString(), artifact: sub.parent.name],
                     version: [range: "[${sub.version},)", artifactVersion: sub.version.toString()],
                     path: "META-INF/jarjar/${subName}"]
            copy { from(subJars[i].flatMap { it.archiveFile }); into target.parentFile }
        }
        target.text = groovy.json.JsonOutput.toJson([jars: jars])
        copy { from(apiJar.flatMap { it.archiveFile }); into target.parentFile }
    }
}
// Development runs and distributables use the same nested library. A loose runtime
// dependency would collide with a dependency mod's embedded copy in Forge's JPMS layer.
sourceSets.main.resources.srcDir(metadata)
tasks.named('processResources') { dependsOn 'prepareForgeFramework' }
