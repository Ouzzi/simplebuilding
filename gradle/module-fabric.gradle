// Unique group per module: all loader projects are named 'fabric', and a shared group would let Gradle
// resolve one module in place of another (e.g. a module that nests SimpleLib, principle 6a).
group = 'com.simplebuilding.modules.' + project.parent.name
base { archivesName = project.parent.name + '-26.3-' + project.name }
version = project.findProperty('moduleVersion') ?: (new groovy.json.JsonSlurper().parse(rootProject.file('modules/modules.json')).modules.find { it.id == project.parent.name }?.version ?: '0.1.0') // single source: modules.json (new modules start 0.1.0 there)
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
sourceSets.main.java.srcDir '../shared/java'
sourceSets.main.resources.srcDir '../shared/resources'
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.mc263_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.mc263_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.mc263_fabric_version}"
    implementation project(':framework')
}
processResources { inputs.property('version', project.version.toString()); filesMatching('fabric.mod.json') { expand version: project.version } }
// simplebuilding-1 (PLAN40): the texture editor's layer sources (<texture>.layers.json, read from the source tree by the wiki
// pixel editor and tools/textures) never ship in a module jar or its dev runs.
processResources { exclude '**/*.layers.json' }

sourceSets.main.resources.srcDir '../generated/resources'

// Layer sources (*.layers.json, PRINZIPIEN A8 b) are for the repo's generators and the wiki pixel editor; the game never reads
// them, so no module jar ships them (simplelib-1, PLAN40).
tasks.named('jar') { exclude '**/*.layers.json' }

// Every module jar carries the licence text (LicenseRef-SimpleMods-ARR; the module's own LICENSE if it has one, else the root one).
tasks.named('jar') {
    def lic = project.parent.file('LICENSE').exists() ? project.parent.file('LICENSE') : rootProject.file('LICENSE')
    from(lic) { rename { "${it}_${project.base.archivesName.get()}" } }
}
