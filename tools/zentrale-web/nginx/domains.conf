# IG31-55 domain move (stage "domains" of deploy_dom07.sh). Tunnels deliver all hostnames to :8081 (smoke: :8084);
# the wiki server (wiki-one.conf, server_name wiki.simplemods.de) comes first = default for unknown hosts.
# simplemods.de: landing page from /srv/landing (copied by the deploy script from tools/landing/index.html)
server { listen 8081; listen 8084; server_name simplemods.de;
  include /etc/nginx/snippets/simplemods-allow.conf;
  root /srv/landing; index index.html; absolute_redirect off; add_header Cache-Control "no-cache";
  location ~ /\.git { deny all; }
  location / { try_files $uri $uri/ =404; }
  location ^~ /setup/ { return 301 https://wiki.simplemods.de$request_uri; }
  location ^~ /downloads/ { return 301 https://wiki.simplemods.de$request_uri; } }
# every other name -> 301 to the wiki host, same path and query
server { listen 8081; listen 8084;
  server_name www.simplemods.de simplewiki.de www.simplewiki.de;
  include /etc/nginx/snippets/simplemods-allow.conf;
  return 301 https://wiki.simplemods.de$request_uri; }
# old address: 301 too, except /setup/ and /downloads/ (installers at the owner's still use them; as before only
# with the Cloudflare Access header, which the old Access app sets)
server { listen 8081; listen 8084; server_name simplemods-wiki.azarfane.com;
  include /etc/nginx/snippets/simplemods-allow.conf;
  root /srv/zentrale; add_header Cache-Control "no-cache";
  location ^~ /setup/ { if ($http_cf_access_authenticated_user_email = "") { return 403; }
    alias /srv/zentrale/setup/; default_type application/octet-stream;
    types { text/plain ps1; application/json json; } charset utf-8; charset_types text/plain application/json; }
  location ^~ /downloads/ { if ($http_cf_access_authenticated_user_email = "") { return 403; }
    alias /srv/zentrale/downloads/; types { application/java-archive jar; application/json json; } }
  location / { return 301 https://wiki.simplemods.de$request_uri; } }
