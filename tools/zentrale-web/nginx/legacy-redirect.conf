# old hosts after the switch (stage "switch"): only redirects to the one host, except what starter/installer load
# directly (/setup/, /downloads/, /status.json stay here, still behind the Cloudflare Access app of the old host).
server { listen 8082; include /etc/nginx/snippets/simplemods-allow.conf;
  location / { return 302 https://simplemods-wiki.azarfane.com/dev$request_uri; } }
server { listen 8083; include /etc/nginx/snippets/simplemods-allow.conf;
  root /srv/zentrale; add_header Cache-Control "no-cache";
  if ($http_cf_access_authenticated_user_email = "") { return 403; }
  location /downloads/ { alias /srv/zentrale/downloads/; types { application/java-archive jar; application/json json; } }
  location /setup/ { alias /srv/zentrale/setup/; default_type application/octet-stream;
    types { text/plain ps1; application/json json; } charset utf-8; charset_types text/plain application/json; }
  location = /status.json { }
  location ~ ^/wiki(/.*)?$ { return 302 https://simplemods-wiki.azarfane.com/dev$1; }
  location /api/ { return 302 https://simplemods-wiki.azarfane.com$request_uri; }
  location / { return 302 https://simplemods-wiki.azarfane.com/zentrale$request_uri; } }
