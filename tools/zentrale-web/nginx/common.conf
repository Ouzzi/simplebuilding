# a-zw06: shared parts of the simplemods site (http context). Rendered by tools/zentrale-web/deploy_zw06.sh.
# Every server includes /etc/nginx/snippets/simplemods-allow.conf: only the tunnel connector and loopback may connect
# (the connector runs in another container, so binding to loopback is not possible; written by the deploy script).
# Client address for the login rate limit: Cloudflare's CF-Connecting-IP (all traffic comes through the tunnel).
map $http_cf_connecting_ip $sb_client_ip { "" $remote_addr; default $http_cf_connecting_ip; }
limit_req_zone $sb_client_ip zone=sb_login:1m rate=10r/m;
