# old hosts unchanged (stage "parallel"), now only from the tunnel: wiki-dev :8082, zentrale :8083 (Cloudflare Access)
server { listen 8082; include /etc/nginx/snippets/simplemods-allow.conf;
  root /srv/wiki-dev/wiki; index index.html; add_header Cache-Control "no-cache"; location /.git { deny all; }
  if ($http_cf_access_authenticated_user_email = "") { return 403; } }
server { listen 8083; include /etc/nginx/snippets/simplemods-allow.conf;
  root /srv/zentrale; index index.html; add_header Cache-Control "no-cache";
  if ($http_cf_access_authenticated_user_email = "") { return 403; }
  location = / { try_files /dev/null @page; }
  location = /index.html { try_files /dev/null @page; }
  location @page { root /srv/wiki-dev/tools/zentrale-web; try_files /index.html @legacy; }
  location @legacy { root /srv/zentrale; try_files /index.html =404; }
  location /logs/ { default_type text/plain; charset utf-8; }
  location /downloads/ { alias /srv/zentrale/downloads/; types { application/java-archive jar; application/json json; } }
  location /setup/ { alias /srv/zentrale/setup/; default_type application/octet-stream;
    types { text/plain ps1; application/json json; } charset utf-8; charset_types text/plain application/json; }
  location = /wiki { return 302 /wiki/; }
  location /wiki/ { alias /srv/wiki-dev/wiki/; index index.html; location ~ /\.git { deny all; }
    sub_filter '</body>' '<script src="/dev-overlay.js"></script></body>'; sub_filter_once on; }
  location = /dev-overlay.js { root /srv/wiki-dev/tools/zentrale-web; }
  location /api/ { proxy_pass http://127.0.0.1:8090; client_max_body_size 13m;
    proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email; } }
