# ONE host simplemods-wiki.azarfane.com (a-zw06, owner 06.11.):
#   /           public wiki (Production, /srv/wiki-prod), no login
#   /dev/       dev wiki (/srv/wiki-dev) + overlay (pixel editor, suggestions, Vanilla)   -> login
#   /zentrale/  Zentrale (status, starter, downloads, KI-Queue)                            -> login
#   /api/       devqueue                                                                    -> login (except /api/auth/)
# Login: devqueue /api/auth/* (own password sessions; Cloudflare Access JWT prepared, off). nginx asks /api/auth/check
# per request (auth_request) and passes the identity on to devqueue; a client-sent identity header never gets through.
server {
  listen 8084;
  # @LISTEN_MORE@
  include /etc/nginx/snippets/simplemods-allow.conf;
  root /srv/wiki-prod/wiki; index index.html;
  absolute_redirect off;  # behind the tunnel: never "http://host:8084/..." in a Location
  add_header Cache-Control "no-cache";
  location ~ /\.git { deny all; }
  location / { try_files $uri $uri/ =404; }
  # Vanilla-derived textures exist only in the dev checkout; never from the public root
  location ^~ /assets/vanilla/ { return 404; }

  # ---- login ----
  location = /_auth { internal;
    proxy_pass http://127.0.0.1:8090/api/auth/check;
    proxy_pass_request_body off; proxy_set_header Content-Length "";
    proxy_set_header Host $host; proxy_set_header X-Client-IP $sb_client_ip;
    proxy_set_header Cf-Access-Authenticated-User-Email ""; }
  location @login { return 302 /api/auth/login?next=$request_uri; }
  location = /login { return 302 /api/auth/login; }
  location = /api/auth/check { proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host; proxy_set_header X-Client-IP $sb_client_ip;
    proxy_set_header Cf-Access-Authenticated-User-Email ""; }
  location ^~ /api/auth/ { limit_req zone=sb_login burst=5 nodelay; limit_req_status 429; client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host; proxy_set_header X-Client-IP $sb_client_ip;
    proxy_set_header Cf-Access-Authenticated-User-Email ""; }

  # ---- dev wiki with overlay ----
  location = /dev { return 301 /dev/; }
  location ^~ /dev/ { auth_request /_auth; error_page 401 = @login;
    alias /srv/wiki-dev/wiki/; index index.html;
    add_header Cache-Control "no-store";
    location ~ /\.git { deny all; }
    sub_filter '</body>' '<script src="/dev/_overlay.js"></script></body>'; sub_filter_once on; }
  location = /dev/_overlay.js { auth_request /_auth; error_page 401 = @login;
    alias /srv/wiki-dev/tools/zentrale-web/dev-overlay.js; default_type application/javascript; }

  # ---- Zentrale: page from the dev checkout, status.json/logs/downloads/setup from /srv/zentrale ----
  location = /z { return 301 /zentrale/; }
  location = /zentrale { return 301 /zentrale/; }
  location ^~ /zentrale/ { auth_request /_auth; error_page 401 = @login;
    alias /srv/zentrale/; add_header Cache-Control "no-cache";
    location = /zentrale/ { rewrite ^ /zentrale/index.html last; }
    location = /zentrale/index.html { alias /srv/wiki-dev/tools/zentrale-web/index.html; default_type text/html; }
    location ^~ /zentrale/logs/ { alias /srv/zentrale/logs/; default_type text/plain; charset utf-8; }
    location ^~ /zentrale/downloads/ { alias /srv/zentrale/downloads/; types { application/java-archive jar; application/json json; } }
    location ^~ /zentrale/setup/ { alias /srv/zentrale/setup/; default_type application/octet-stream;
      types { text/plain ps1; application/json json; } charset utf-8; charset_types text/plain application/json; } }

  # ---- devqueue API (identity from the login answer, never from the client) ----
  location ^~ /api/ { auth_request /_auth; auth_request_set $sb_user $upstream_http_x_auth_user;
    proxy_pass http://127.0.0.1:8090; client_max_body_size 13m;
    proxy_set_header Host $host; proxy_set_header X-Client-IP $sb_client_ip;
    proxy_set_header Cf-Access-Authenticated-User-Email $sb_user; }
}
