  # ---- IG31-55 (stage "domains" only): /setup/ and /downloads/ also directly on wiki.simplemods.de, behind the login ----
  location ^~ /setup/ { auth_request /_auth; error_page 401 = @login;
    alias /srv/zentrale/setup/; add_header Cache-Control "no-cache"; default_type application/octet-stream;
    types { text/plain ps1; application/json json; } charset utf-8; charset_types text/plain application/json; }
  location ^~ /downloads/ { auth_request /_auth; error_page 401 = @login;
    alias /srv/zentrale/downloads/; add_header Cache-Control "no-cache";
    types { application/java-archive jar; application/json json; } }
