# CLA-Pruefung fuer Pull Requests (CONTRIBUTING.md, CLA.md). Jeder Beitragende unterschreibt einmal per PR-Kommentar
# "I have read the CLA Document and I hereby sign the CLA"; die Signaturen landen in signatures/cla.json auf dem Branch
# cla-signatures (nicht auf master). Nur das automatische GITHUB_TOKEN, keine weiteren Secrets.
# Einmalig einrichten (Besitzer): Branch cla-signatures anlegen (git push origin master:cla-signatures) und unter
# Settings -> Actions -> General "Read and write permissions" fuer Workflows erlauben.
# Sicherheit: pull_request_target laeuft im Kontext von master, checkt aber keinen PR-Code aus und fuehrt keinen aus.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/Ouzzi/simplebuilding/blob/master/CLA.md'
          branch: 'cla-signatures'
          # Besitzer und Bots brauchen keine Signatur
          allowlist: 'Ouzzi,dependabot[bot],github-actions[bot],renovate[bot]'
          lock-pullrequest-aftermerge: false
