<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SimpleBuilding Wiki</title>
<script>
/* Farbschema vor dem ersten Zeichnen setzen, sonst blitzt die falsche Farbe auf.
   auto = Systemeinstellung; light/dark kommen aus dem Umschalter oben rechts. */
(function () {
  try {
    var t = window.localStorage.getItem('simplebuilding-wiki-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (err) { /* ohne Storage: Systemeinstellung */ }
})();
</script>
<style>
/* ------------------------------------------------------------------ */
/* Farben: hell (Pergament, klassischer Inventar-Slot) und dunkel     */
/* (Tiefenschiefer). Dunkel gilt bei Systemeinstellung "dunkel", ausser */
/* der Leser hat oben "hell" gewaehlt, und immer bei data-theme=dark.  */
/* ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --bg: #f2efe6;
  --bg-2: #e9e5d8;
  --panel: #ffffff;
  --panel-2: #f7f5ef;
  --text: #1c1e21;
  --muted: #5f656c;
  --border: #d9d3c3;
  --border-strong: #bdb5a1;
  --accent: #3b7a25;
  --accent-strong: #2d6119;
  --accent-soft: #e2efd9;
  --accent-text: #ffffff;
  --end: #7a4fb8;
  --end-soft: #efe7fa;
  --warn-bg: #fff4dc;
  --warn-border: #d9a441;
  --warn-text: #5f4100;
  --danger-bg: #fdeaea;
  --danger-border: #d79191;
  --danger-text: #7a1f1f;
  --slot-bg: #c6c6c6;
  --slot-hi: #ffffff;
  --slot-lo: #555555;
  --slot-text: #373737;
  --code-bg: #ebe7dc;
  --shadow: 0 1px 2px rgba(40,30,10,.06), 0 2px 8px rgba(40,30,10,.05);
  --shadow-lg: 0 10px 40px rgba(20,15,5,.18);
  --radius: 10px;
  --radius-sm: 6px;
  --topbar-h: 58px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141619;
    --bg-2: #1a1d21;
    --panel: #1e2126;
    --panel-2: #24282e;
    --text: #e7e5e1;
    --muted: #9ca3ab;
    --border: #30353c;
    --border-strong: #454c55;
    --accent: #7cc85a;
    --accent-strong: #97d97a;
    --accent-soft: #1f3019;
    --accent-text: #0f1a0b;
    --end: #b893ea;
    --end-soft: #2a2138;
    --warn-bg: #33290f;
    --warn-border: #8a6a2a;
    --warn-text: #f1d99f;
    --danger-bg: #3a1c1c;
    --danger-border: #8a3d3d;
    --danger-text: #f3b9b9;
    --slot-bg: #2c3036;
    --slot-hi: rgba(255,255,255,.09);
    --slot-lo: rgba(0,0,0,.55);
    --slot-text: #b9bec5;
    --code-bg: #2a2e34;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141619;
  --bg-2: #1a1d21;
  --panel: #1e2126;
  --panel-2: #24282e;
  --text: #e7e5e1;
  --muted: #9ca3ab;
  --border: #30353c;
  --border-strong: #454c55;
  --accent: #7cc85a;
  --accent-strong: #97d97a;
  --accent-soft: #1f3019;
  --accent-text: #0f1a0b;
  --end: #b893ea;
  --end-soft: #2a2138;
  --warn-bg: #33290f;
  --warn-border: #8a6a2a;
  --warn-text: #f1d99f;
  --danger-bg: #3a1c1c;
  --danger-border: #8a3d3d;
  --danger-text: #f3b9b9;
  --slot-bg: #2c3036;
  --slot-hi: rgba(255,255,255,.09);
  --slot-lo: rgba(0,0,0,.55);
  --slot-text: #b9bec5;
  --code-bg: #2a2e34;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
}

/* ------------------------------------------------------------------ */
/* Grundlagen                                                         */
/* ------------------------------------------------------------------ */
* { box-sizing: border-box; }
html { font-size: 15.5px; -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 12px); }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd { font-family: var(--mono); font-size: .84em; background: var(--code-bg); padding: .08em .38em; border-radius: 4px; }
kbd { border: 1px solid var(--border-strong); border-bottom-width: 2px; background: var(--panel); color: var(--muted); font-size: .72rem; padding: 0 .35em; line-height: 1.5; }
h1 { font-size: 1.85rem; margin: 0 0 .3rem; line-height: 1.2; letter-spacing: -.015em; font-weight: 750; }
h2 { font-size: 1.12rem; margin: 0 0 .8rem; padding-bottom: .35rem; border-bottom: 1px solid var(--border); letter-spacing: -.005em; }
h3 { font-size: .8rem; margin: 1.3rem 0 .5rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
p { margin: .4rem 0 .8rem; }
ul { margin: .3rem 0 .6rem; padding-left: 1.3rem; }
li { margin: .2rem 0; }
.muted { color: var(--muted); }
.tiny { font-size: .8rem; }
.lead { font-size: 1.05rem; }
button { font: inherit; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------ */
/* Kopfleiste                                                         */
/* ------------------------------------------------------------------ */
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: .75rem; height: var(--topbar-h); padding: 0 1rem; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: saturate(1.4) blur(8px); -webkit-backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--border); }
.brand { display: inline-flex; align-items: center; gap: .55rem; font-weight: 800; color: var(--text); white-space: nowrap; font-size: 1.05rem; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.brand-icon { width: 30px; height: 30px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--slot-bg); box-shadow: inset 2px 2px 0 var(--slot-lo), inset -2px -2px 0 var(--slot-hi); border-radius: 3px; }
.brand-icon img { width: 22px; height: 22px; image-rendering: pixelated; }
.brand small { color: var(--muted); font-weight: 500; margin-left: .1rem; font-size: .82rem; }
.icon-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: .35rem; height: 36px; min-width: 36px; padding: 0 .55rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel); color: var(--text); cursor: pointer; font-size: .85rem; }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }
.search { flex: 1; max-width: 560px; position: relative; margin-left: .5rem; }
.search input { width: 100%; height: 38px; padding: 0 4.2rem 0 2.3rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: .95rem; }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--panel); }
.search .s-icon { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.search .s-keys { position: absolute; right: .55rem; top: 50%; transform: translateY(-50%); display: flex; gap: .2rem; pointer-events: none; }
.search input:focus ~ .s-keys { display: none; }
.topmeta { margin-left: auto; color: var(--muted); font-size: .8rem; display: flex; gap: .6rem; white-space: nowrap; }
.topmeta span + span::before { content: '·'; margin-right: .6rem; opacity: .6; }
.langsel { flex: none; height: 36px; padding: 0 .45rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel); color: var(--text); font: inherit; font-size: .85rem; cursor: pointer; }

/* Schnellsuche unter dem Suchfeld */
.qs { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: .35rem; max-height: min(70vh, 520px); overflow: auto; z-index: 60; }
.qs[hidden] { display: none; }
.qs-item { display: flex; align-items: center; gap: .65rem; padding: .4rem .55rem; border-radius: var(--radius-sm); color: var(--text); cursor: pointer; }
.qs-item:hover { text-decoration: none; }
.qs-item[aria-selected="true"] { background: var(--accent-soft); }
.qs-item .slot { width: 34px; height: 34px; }
.qs-item .slot img { width: 24px; height: 24px; }
.qs-item .slot .cube { --cs: 15px; }
.qs-item .slot-text { font-size: 7px; }
.qs-ico { width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); background: var(--bg-2); color: var(--muted); font-size: .75rem; font-weight: 700; }
.qs-main { min-width: 0; flex: 1; }
.qs-title { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qs-sub { display: block; color: var(--muted); font-size: .78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qs-sec { flex: none; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.qs-all { justify-content: center; color: var(--accent); font-weight: 600; font-size: .88rem; border-top: 1px solid var(--border); border-radius: 0 0 var(--radius-sm) var(--radius-sm); margin-top: .25rem; padding: .55rem; }
.qs-empty { padding: .8rem; color: var(--muted); font-size: .9rem; }
.qs-foot { display: flex; gap: .9rem; justify-content: flex-end; padding: .35rem .5rem .1rem; font-size: .72rem; color: var(--muted); }

/* ------------------------------------------------------------------ */
/* Aufbau: Seitenleiste + Inhalt                                      */
/* ------------------------------------------------------------------ */
.layout { display: flex; align-items: flex-start; }
.sidebar { width: 264px; flex: none; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow: auto; padding: 1rem .75rem 2rem; border-right: 1px solid var(--border); background: var(--panel); overscroll-behavior: contain; }
.sb-group { margin-bottom: 1.1rem; }
.sb-title { font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 0 .6rem; margin: 0 0 .3rem; }
.sidebar a { display: flex; align-items: center; gap: .55rem; padding: .32rem .6rem; border-radius: var(--radius-sm); color: var(--text); font-size: .92rem; }
.sidebar a:hover { background: var(--bg); text-decoration: none; }
.sidebar a.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 650; }
.sidebar a .n { margin-left: auto; color: var(--muted); font-size: .75rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.sidebar .sb-ico { width: 24px; height: 24px; flex: none; display: inline-flex; align-items: center; justify-content: center; }
.sidebar .sb-ico img { width: 20px; height: 20px; image-rendering: pixelated; }
.sidebar .sb-ico .cube { --cs: 12px; }
.sidebar .sb-ico .glyph { font-size: .95rem; line-height: 1; color: var(--muted); }
.sidebar .sb-note { margin-top: 1rem; padding: .7rem .6rem 0; font-size: .74rem; color: var(--muted); border-top: 1px solid var(--border); }
.backdrop { display: none; }
main { flex: 1; min-width: 0; padding: 1.6rem 2.2rem 4rem; max-width: 1180px; overflow-wrap: anywhere; }
.site-foot { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .78rem; display: flex; flex-wrap: wrap; gap: .4rem 1rem; }

/* ------------------------------------------------------------------ */
/* Bausteine                                                          */
/* ------------------------------------------------------------------ */
.section { margin-top: 1.6rem; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.card.highlight { outline: 2px solid var(--accent); }
.badge { display: inline-flex; align-items: center; gap: .25em; font-size: .72rem; line-height: 1.6; padding: 0 .6em; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); vertical-align: middle; white-space: nowrap; background: var(--panel); }
a.badge:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.badge-ok { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent-strong); background: var(--accent-soft); }
.badge-warn { border-color: var(--warn-border); color: var(--warn-text); background: var(--warn-bg); }
.badge-danger { border-color: var(--danger-border); color: var(--danger-text); background: var(--danger-bg); font-weight: 700; }
.badge-end { border-color: color-mix(in srgb, var(--end) 55%, transparent); color: var(--end); background: var(--end-soft); }
.badges { display: inline-flex; gap: .3rem; flex-wrap: wrap; vertical-align: middle; }
.box { border-left: 4px solid var(--border); padding: .65rem .95rem; background: var(--panel); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: .8rem 0; }
.box-title { font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .2rem; }
.box-controls { border-left-color: var(--accent); background: var(--panel-2); }
.box-caveat { border-left-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
.box-danger { border-left-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
.box-info { border-left-color: var(--accent); background: var(--panel-2); }
.box ul { margin-bottom: .2rem; }
.hint { color: var(--muted); font-style: italic; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { color: var(--muted); font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
.table tr.highlight td { background: var(--accent-soft); }
.table td.num, .table th.num { text-align: right; white-space: nowrap; }
.table td, .table th { overflow-wrap: normal; word-break: normal; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1.2rem; margin: .5rem 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.src { font-size: .78rem; color: var(--muted); margin-top: .6rem; }
.src code { font-size: .95em; }
.ref { display: inline-flex; align-items: baseline; gap: .35em; max-width: 100%; }
.ref .ref-id { color: var(--muted); background: transparent; padding: 0; font-size: .78em; }
.ref-ext { color: var(--text); }
.ref-ext .ref-name { border-bottom: 1px dotted var(--muted); }
.reflist { display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
.tile-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .6rem; }
.tile { display: block; padding: .8rem .9rem; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); box-shadow: var(--shadow); transition: border-color .12s, transform .12s; }
.tile:hover { text-decoration: none; border-color: var(--accent); transform: translateY(-1px); }
.tile .big { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile .lbl { color: var(--muted); font-size: .85rem; }

/* Fortschrittsbaum */
.advtree { list-style: none; margin: 0; padding-left: 1.4rem; border-left: 1px dashed var(--border); }
.advtree.top { padding-left: 0; border-left: 0; }
.advtree li { margin: .45rem 0; }
.adv { display: flex; gap: .7rem; align-items: flex-start; }
.adv .slot { width: 44px; height: 44px; }
.adv .slot img { width: 32px; height: 32px; }
.adv-goal .slot { border-radius: 12px; }
.adv-challenge .slot { outline: 2px solid var(--end); outline-offset: 1px; }
.adv .adv-frame { font-size: .75rem; color: var(--muted); margin-left: .4em; }

/* ------------------------------------------------------------------ */
/* Slots: wie im Inventar, mit Relief                                 */
/* ------------------------------------------------------------------ */
.slot { display: inline-flex; align-items: center; justify-content: center; position: relative; width: 56px; height: 56px; background: var(--slot-bg); border: 0; box-shadow: inset 2px 2px 0 var(--slot-lo), inset -2px -2px 0 var(--slot-hi); border-radius: 2px; color: var(--slot-text); overflow: hidden; flex: none; text-decoration: none; }
a.slot:hover { text-decoration: none; background: color-mix(in srgb, var(--slot-bg) 80%, var(--accent)); }
.slot img { width: 40px; height: 40px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.slot-text { font-size: 9.5px; line-height: 1.12; text-align: center; padding: 2px 3px; word-break: break-word; color: var(--slot-text); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.slot-tag { box-shadow: inset 2px 2px 0 var(--slot-lo), inset -2px -2px 0 var(--slot-hi), inset 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
.slot-tag .slot-text { color: var(--accent-strong); }
.slot-tag .hash { font-weight: 700; }
.slot-empty { opacity: .6; }
.slot-count { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 1px 1px 0 #3f3f3f; line-height: 1.2; }
.slot-alt { position: absolute; left: 3px; top: 1px; font-size: 9px; font-weight: 700; color: var(--slot-text); }
.slot-hash { position: absolute; right: 3px; top: 1px; font-size: 9px; font-weight: 800; color: var(--accent-strong); }
.slot-result { width: 64px; height: 64px; }
.slot-result img { width: 48px; height: 48px; }
.grid { display: grid; gap: 2px; flex: none; }

/* Rezepte */
.recipe { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: .85rem 1rem; margin-bottom: .9rem; box-shadow: var(--shadow); }
.recipe-head { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-bottom: .7rem; font-size: .85rem; }
.recipe-body { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.arrow { font-size: 1.6rem; color: var(--muted); line-height: 1; padding: 0 .2rem; }
.slotcol { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
.slot-label { font-size: .68rem; color: var(--muted); white-space: nowrap; }
.slotrow { display: inline-flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.plus { color: var(--muted); align-self: center; }
.recipe-meta { font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: .15rem; }
.recipe-foot { margin-top: .7rem; font-size: .82rem; color: var(--muted); }
.recipe-foot .reflist { margin-top: .2rem; }
.line-variant { margin-top: .4rem; }

/* Listen */
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem; }
.listhead h1 { margin: 0; }
.listhead input { height: 36px; padding: 0 .75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; min-width: 240px; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; align-items: center; gap: .8rem; padding: .4rem .6rem; border-radius: 8px; color: var(--text); border: 1px solid transparent; }
.row:hover { background: var(--panel); border-color: var(--border); text-decoration: none; }
.row .slot { width: 40px; height: 40px; }
.row .slot img { width: 28px; height: 28px; }
.row .slot-text { font-size: 8px; -webkit-line-clamp: 3; }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 600; }
.row-title .en { font-weight: 400; color: var(--muted); }
.row-sub { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-right { flex: none; display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
.row.hidden { display: none; }

/* ------------------------------------------------------------------ */
/* Kopf einer Detailseite                                             */
/* ------------------------------------------------------------------ */
.crumbs { font-size: .82rem; color: var(--muted); margin-bottom: .8rem; display: flex; flex-wrap: wrap; align-items: center; gap: .15rem .4rem; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--accent); }
.crumbs .sep { opacity: .55; }
.hero { display: flex; gap: 1.4rem; align-items: center; margin-bottom: 1rem; }
.hero > div { min-width: 0; }
.hero h1, .idline code, .crumbs, .row-sub code { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
.hero-card { background: var(--panel); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); padding: 1.2rem 1.3rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
.hero-card .hero { margin-bottom: 0; align-items: flex-start; }
.hero-tex { width: 112px; height: 112px; background: var(--slot-bg); box-shadow: inset 3px 3px 0 var(--slot-lo), inset -3px -3px 0 var(--slot-hi); border-radius: 3px; display: flex; align-items: center; justify-content: center; flex: none; text-align: center; color: var(--slot-text); font-size: .8rem; padding: .4rem; }
.hero-tex img { width: 80px; height: 80px; image-rendering: pixelated; image-rendering: crisp-edges; }
.hero .en { color: var(--muted); font-size: 1rem; }
.hero .idline { margin: .35rem 0 .5rem; }
.hero .idline code { font-size: .82rem; }
.tagline { font-size: 1.08rem; margin: .55rem 0 .2rem; line-height: 1.5; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .8rem; }
.btn { display: inline-flex; align-items: center; gap: .35rem; height: 32px; padding: 0 .75rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-size: .85rem; font-weight: 550; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); text-decoration: none; color: var(--accent-strong); }
.btn kbd { margin-left: .15rem; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-text); }

/* Kennzahlen */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .55rem; margin: 0 0 1rem; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .8rem; box-shadow: var(--shadow); min-width: 0; }
.stat-v { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-v small { font-size: .72rem; font-weight: 500; color: var(--muted); margin-left: .2rem; }
.stat-l { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

/* "So bekommst du es" */
.obtain { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: .9rem 1.1rem; margin: 0 0 1rem; box-shadow: var(--shadow); }
.obtain > h2 { border: 0; padding: 0; margin: 0 0 .6rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-strong); }
.obtain .recipe { box-shadow: none; margin-bottom: .5rem; background: var(--panel-2); }
.obtain-ways { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
.obtain-ways .btn { height: 30px; font-size: .82rem; }
.obtain p { margin: .3rem 0; }

/* Kategorien, Kacheln mit Item */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .7rem; margin: .6rem 0 1.4rem; }
.cat-card { display: flex; gap: .8rem; align-items: flex-start; padding: .85rem .95rem; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); box-shadow: var(--shadow); transition: border-color .12s, transform .12s; }
.cat-card:hover { text-decoration: none; border-color: var(--accent); transform: translateY(-1px); }
.cat-card .slot { width: 48px; height: 48px; }
.cat-card .slot img { width: 34px; height: 34px; }
.cat-card .slot .cube { --cs: 22px; }
.cat-card .ct { font-weight: 700; }
.cat-card .ct .n { color: var(--muted); font-weight: 500; font-size: .8rem; margin-left: .25rem; }
.cat-card .cd { color: var(--muted); font-size: .84rem; line-height: 1.4; margin-top: .15rem; }
.cat-end { border-color: color-mix(in srgb, var(--end) 35%, var(--border)); }
.fam { margin: 0 0 1.2rem; }
.fam-title { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 .45rem; display: flex; gap: .5rem; align-items: baseline; }
.fam-title a { text-transform: none; letter-spacing: 0; font-weight: 500; }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: .5rem; }
.itile { display: flex; flex-direction: column; align-items: center; gap: .4rem; padding: .7rem .5rem .6rem; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); text-align: center; min-width: 0; transition: border-color .12s, transform .12s; }
.itile:hover { text-decoration: none; border-color: var(--accent); transform: translateY(-1px); }
.itile .slot { width: 52px; height: 52px; }
.itile .slot img { width: 36px; height: 36px; }
.itile .slot .cube { --cs: 24px; }
.itile-name { font-size: .82rem; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.itile-sub { font-size: .7rem; color: var(--muted); }
.guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.guide { display: block; padding: .8rem .95rem; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); box-shadow: var(--shadow); }
.guide:hover { text-decoration: none; border-color: var(--accent); }
.guide b { display: block; margin-bottom: .15rem; }
.guide span { color: var(--muted); font-size: .86rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* Startseite */
.home-hero { position: relative; overflow: hidden; border-radius: calc(var(--radius) + 6px); padding: 1.8rem 1.6rem 1.6rem; margin-bottom: 1.4rem; border: 1px solid var(--border); background:
  linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--panel)) 0%, var(--panel) 55%, color-mix(in srgb, var(--end) 14%, var(--panel)) 100%); box-shadow: var(--shadow); }
.home-hero h1 { font-size: 2.1rem; }
.home-hero .lead { max-width: 60ch; }
.home-search { display: flex; align-items: center; gap: .6rem; width: 100%; max-width: 520px; height: 44px; margin-top: 1rem; padding: 0 .9rem; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--panel); color: var(--muted); cursor: text; font-size: .95rem; text-align: left; }
.home-search:hover { border-color: var(--accent); }
.home-search svg { width: 18px; height: 18px; flex: none; }
.home-search .grow { flex: 1; }

/* 3D-Ansicht eines Blocks: drei Flaechen, per CSS-Transform zum Wuerfel
   gestellt - kein WebGL und kein Build noetig. Orthografisch wie im Inventar:
   45 Grad gedreht, 30 Grad von oben, mit reinen 2D-Matrizen (ohne 3D-Kontext,
   der in manchen Renderern platt gezeichnet wird). --cs ist die Kantenlaenge;
   der Wuerfel ist projiziert 1,414 * cs breit und 1,573 * cs hoch. */
.cube { --cs: 56px; width: calc(var(--cs) * 1.4142); height: calc(var(--cs) * 1.5731); position: relative; flex: none; display: block; }
.cube span { position: absolute; left: 0; top: 0; width: var(--cs); height: var(--cs); transform-origin: 0 0; background-size: 100% 100%; background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; }
.cube .f-top { transform: translate(calc(var(--cs) * .7071), 0) matrix(.7071, .3536, -.7071, .3536, 0, 0); }
.cube .f-front { transform: translate(0, calc(var(--cs) * .3536)) matrix(.7071, .3536, 0, .866, 0, 0); filter: brightness(.8); }
.cube .f-side { transform: translate(calc(var(--cs) * .7071), calc(var(--cs) * .7071)) matrix(.7071, -.3536, 0, .866, 0, 0); filter: brightness(.62); }
.slot .cube { --cs: 26px; }
.slot-result .cube { --cs: 30px; }
.row .slot .cube, .iw-entry .slot .cube, .rc .slot .cube { --cs: 18px; }
.rc .slot-result .cube { --cs: 21px; }
.tree-node > summary .slot .cube { --cs: 15px; }
.pool-bar { height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; min-width: 80px; }
.pool-bar i { display: block; height: 100%; background: var(--accent); }
details summary { cursor: pointer; color: var(--accent); }
details.more { margin: -.2rem 0 .6rem; }
details.more > summary { font-size: .88rem; font-weight: 600; margin-left: 1.3rem; }
.search-group { margin-top: 1.2rem; }
mark { background: color-mix(in srgb, var(--warn-border) 40%, transparent); color: inherit; padding: 0 .1em; border-radius: 2px; }
.notfound { padding: 2rem 1rem; text-align: center; color: var(--muted); }
.notfound .rows { text-align: left; max-width: 640px; margin: 1rem auto; }

/* Leere Abschnitte gesammelt am Seitenende */
.empty-sections { margin-top: 1.6rem; border-top: 1px dashed var(--border); padding-top: .4rem; }
.section-empty { margin: .3rem 0; }
.section-empty h2 { font-size: .9rem; color: var(--muted); border: 0; margin: .5rem 0 .1rem; padding: 0; }
.section-empty .hint { margin: 0; font-size: .88rem; }
.tree-hint { margin: .2rem 0 .6rem; }

/* Blaettern in der Kategorie */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 2rem; }
.pager a { display: flex; align-items: center; gap: .6rem; padding: .7rem .85rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); color: var(--text); min-width: 0; }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager a.next { justify-content: flex-end; text-align: right; grid-column: 2; }
.pager .slot { width: 36px; height: 36px; }
.pager .slot img { width: 26px; height: 26px; }
.pager .slot .cube { --cs: 16px; }
.pager small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
.pager b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager span.pm { min-width: 0; }

/* Umwandlung in der Welt */
.iw-entry { flex-wrap: wrap; align-items: center; cursor: default; }
.iw-slots { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.iw-tool { display: inline-flex; align-items: center; padding: 0 .3rem; border-left: 1px dashed var(--border); border-right: 1px dashed var(--border); margin: 0 .2rem; }
.iw-entry .slot { width: 40px; height: 40px; }
.iw-entry .slot img { width: 28px; height: 28px; }
.iw-meta { font-size: .82rem; color: var(--muted); }
.slot-tool { opacity: .92; }

/* Kontextmenue */
.ctxmenu { position: fixed; z-index: 1000; min-width: 180px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: .3rem; font-size: .9rem; }
.ctxmenu .ctx-title { padding: .3rem .6rem; font-size: .75rem; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: .2rem; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctxmenu a { display: block; padding: .38rem .6rem; color: var(--text); border-radius: var(--radius-sm); }
.ctxmenu a:hover, .ctxmenu a:focus { background: var(--accent-soft); text-decoration: none; outline: none; }

/* Rezeptbaum */
.tree-controls { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.tree-controls input, .tree-controls select { height: 32px; padding: 0 .45rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel); color: var(--text); font: inherit; }
.tree-controls input { width: 5.5rem; min-width: 0; }
.tree-node { margin: .15rem 0; }
.tree-node > summary { display: flex; align-items: center; gap: .45rem; list-style: none; padding: .2rem .3rem; border-radius: var(--radius-sm); color: var(--text); flex-wrap: wrap; }
.tree-node > summary::-webkit-details-marker { display: none; }
.tree-node > summary::before { content: '▸'; color: var(--muted); width: .8rem; flex: none; }
.tree-node[open] > summary::before { content: '▾'; }
.tree-node > summary:hover { background: var(--panel); }
.tree-node > summary .slot { width: 32px; height: 32px; }
.tree-node > summary .slot img { width: 24px; height: 24px; }
.tree-node > summary .slot-text { font-size: 7px; -webkit-line-clamp: 3; }
.tree-need { font-variant-numeric: tabular-nums; color: var(--accent-strong); font-weight: 700; min-width: 2.5rem; text-align: right; }
.tree-body { margin-left: 1.1rem; padding-left: .7rem; border-left: 1px solid var(--border); }
.tree-way { margin: .3rem 0 .5rem; }
.tree-way-head { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin: .2rem 0; }
.tree-members { margin: .2rem 0; }

/* Einklappbare Abschnitte */
details.fold { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 1.05rem; box-shadow: var(--shadow); margin-top: .8rem; }
details.fold[open] { padding-bottom: .9rem; }
details.fold > summary { list-style: none; cursor: pointer; color: var(--text); padding: .75rem 0; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { display: flex; align-items: center; gap: .5rem; border: 0; padding: 0; margin: 0; font-size: 1.02rem; }
details.fold > summary h2::before { content: ''; width: .5rem; height: .5rem; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); flex: none; margin: 0 .25rem 0 .1rem; transition: transform .15s; position: relative; top: -2px; }
details.fold:not([open]) > summary h2::before { transform: rotate(-45deg); top: 0; }
details.fold > summary:hover h2 { color: var(--accent-strong); }
details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
details.fold .recipe, details.fold .card { box-shadow: none; background: var(--panel-2); }
details.fold.tech { background: transparent; box-shadow: none; border-style: dashed; }

/* Kernmerkmal der aufgewerteten Maschinen */
.keyfeat { display: flex; gap: .9rem; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--border)); background: var(--accent-soft); border-radius: var(--radius); padding: .8rem 1rem; margin: 0 0 1rem; }
.keyfeat-num { flex: none; font-size: 1.8rem; font-weight: 850; color: var(--accent-strong); line-height: 1; min-width: 3.2rem; text-align: center; font-variant-numeric: tabular-nums; }
.keyfeat-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-strong); font-weight: 750; }
.keyfeat p { margin: .15rem 0; }
.keyfeat .src { margin-top: .3rem; }

/* Alle Rezepte */
.ar-filters { display: flex; flex-direction: column; gap: .55rem; margin: .6rem 0 1rem; padding: .8rem .9rem; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.ar-frow { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.ar-flabel { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; min-width: 5.2rem; font-weight: 700; }
.chip { font: inherit; font-size: .82rem; padding: .2rem .65rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
a.chip:hover { text-decoration: none; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 650; }
.chip .n { opacity: .75; font-size: .9em; margin-left: .25rem; }
.ar-filters input[type=search] { flex: 1 1 240px; min-width: 0; height: 36px; padding: 0 .75rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
.ar-filters label { font-size: .85rem; display: inline-flex; gap: .35rem; align-items: center; cursor: pointer; }
.ar-status { font-size: .85rem; color: var(--muted); margin: .2rem 0 .6rem; }
.ar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .7rem; align-items: start; }
.rc { --slot: 40px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: .65rem .75rem; min-width: 0; box-shadow: var(--shadow); }
.rc .slot { width: 40px; height: 40px; }
.rc .slot img { width: 28px; height: 28px; }
.rc .slot-text { font-size: 8px; -webkit-line-clamp: 3; }
.rc .slot-result { width: 48px; height: 48px; }
.rc .slot-result img { width: 34px; height: 34px; }
.rc .recipe-body { gap: .6rem; }
.rc .grid { gap: 2px; }
.rc-head { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; font-size: .8rem; margin-bottom: .55rem; }
.rc-head .rc-name { font-weight: 650; font-size: .92rem; margin-right: auto; min-width: 0; }
.rc-foot { display: flex; gap: .7rem; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-top: .5rem; }
.rc-variants { display: flex; flex-wrap: wrap; gap: 3px; margin-top: .5rem; }
.rc-variants button { padding: 0; border: 1px solid transparent; background: none; border-radius: 4px; cursor: pointer; line-height: 0; }
.rc-variants button[aria-pressed="true"] { border-color: var(--accent); }
.rc-variants .slot { width: 26px; height: 26px; pointer-events: none; }
.rc-variants .slot img { width: 20px; height: 20px; }
.rc-variants .slot .cube { --cs: 12px; }
.rc-variants .slot-text { display: none; }
.badge-mod { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent-strong); }
.badge-line { font-variant-numeric: tabular-nums; }
.ar-more { display: block; margin: 1rem auto; }
.iw-card-meta { font-size: .78rem; color: var(--muted); margin-top: .35rem; }

/* JEI-Ansicht je Item */
.mk-head { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-bottom: .5rem; }
.mk-head h1 { margin: 0; }
.mk-tabs { display: flex; gap: .3rem; flex-wrap: wrap; margin: .5rem 0 .8rem; }
.mk-station { margin-bottom: 1rem; }
.mk-station > h2 { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.mk-pager { display: inline-flex; align-items: center; gap: .3rem; font-size: .85rem; font-weight: 400; color: var(--muted); margin-left: auto; flex-wrap: wrap; }
.mk-pager button:not(.chip) { font: inherit; width: 2rem; height: 2rem; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
.mk-pager button:not(.chip):hover:not(:disabled) { border-color: var(--accent); }
.mk-pager button:disabled { opacity: .4; cursor: default; }
.mk-pager .chip { font-size: .78rem; }
.mk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .7rem; }

/* ------------------------------------------------------------------ */
/* Schmale Bildschirme                                                */
/* ------------------------------------------------------------------ */
@media (max-width: 1180px) { .topmeta { display: none; } }
@media (max-width: 920px) {
  .menu-btn { display: inline-flex; }
  .sidebar { position: fixed; left: 0; top: var(--topbar-h); z-index: 50; height: calc(100vh - var(--topbar-h)); height: calc(100dvh - var(--topbar-h)); width: min(300px, 86vw); transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow-lg); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .backdrop { display: block; position: fixed; inset: var(--topbar-h) 0 0 0; z-index: 45; background: rgba(0,0,0,.35); }
  main { padding: 1.2rem 1.1rem 3rem; }
}
@media (max-width: 640px) {
  html { font-size: 15px; }
  .topbar { gap: .45rem; padding: 0 .6rem; }
  .brand .brand-text { display: none; }
  .search { margin-left: 0; }
  .search input { padding-right: .7rem; }
  .search .s-keys { display: none; }
    .qs { position: fixed; left: .5rem; right: .5rem; top: calc(var(--topbar-h) - 2px); max-height: calc(100vh - var(--topbar-h) - 1rem); }
  .qs-sec { display: none; }
  .qs-foot { display: none; }
  main { padding: 1rem 1rem 3rem; }
  h1 { font-size: 1.5rem; }
  .home-hero { padding: 1.3rem 1.1rem; }
  .home-hero h1 { font-size: 1.65rem; }
  .home-search kbd { display: none; }
  .hero-card { padding: 1rem; }
  .hero { gap: .9rem; }
  .hero-tex { width: 76px; height: 76px; }
  .hero-tex img { width: 56px; height: 56px; }
  .hero-tex .cube { --cs: 38px; }
  .tagline { font-size: 1rem; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ar-grid, .mk-list { grid-template-columns: 1fr; }
  .ar-flabel { min-width: 0; width: 100%; }
  .keyfeat { flex-direction: column; gap: .3rem; }
  .mk-pager { margin-left: 0; }
  .listhead input { min-width: 0; width: 100%; }
  .tile-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .cat-grid { grid-template-columns: 1fr; }
  .guide-grid { grid-template-columns: 1fr; }
  .pager { grid-template-columns: 1fr; }
  .pager a.next { grid-column: 1; }
  .row { gap: .6rem; padding: .4rem .3rem; }
  .row-right { display: none; }
  .kv { grid-template-columns: 1fr; gap: 0; }
  .kv dd { margin-bottom: .45rem; }
  details.fold { padding: 0 .8rem; }
  .recipe { padding: .75rem .7rem; }
  .slot { width: 48px; height: 48px; }
  .slot img { width: 34px; height: 34px; }
  .slot .cube { --cs: 22px; }
  .slot-result { width: 56px; height: 56px; }
  .slot-result img { width: 40px; height: 40px; }
  .recipe-body { gap: .6rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<div id="app">
  <header class="topbar">
    <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

/* ------------------------------------------------------------------ */
/* Grundhelfer                                                        */
/* ------------------------------------------------------------------ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function arr(x) { return Array.isArray(x) ? x : (x == null ? [] : [x]); }
function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
function strs(list) { return arr(list).filter(function (x) { return x != null && String(x).trim() !== ''; }).map(String); }
function num(x, d) { var n = Number(x); return isFinite(n) ? n : d; }
function norm(s) {
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ß/g, 'ss');
}
function prettyFromId(id) {
  var p = String(id || '').replace(/^#/, '').split(':').pop().split('/').pop();
  return p.split(/[_\-\s]+/).filter(Boolean).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ') || String(id || '?');
}
function nsOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? '' : s.slice(0, i); }
function pathOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? s : s.slice(i + 1); }

var LANGS = ['en', 'de'];
var LANG_NAMES = { en: 'English', de: 'Deutsch' };
var LANG = (function () {
  /* ?lang=de in der Adresse gewinnt - so zeigt ein geteilter Link dieselbe Sprache. */
  try {
    var fromUrl = new URLSearchParams(window.location.search).get('lang');
    if (LANGS.indexOf(fromUrl) >= 0) return fromUrl;
    var hm = /[?&]lang=(en|de)\b/.exec(window.location.hash || '');
    if (hm) return hm[1];
  } catch (err) { /* sehr alter Browser: weiter unten */ }
  try {
    var stored = window.localStorage ? window.localStorage.getItem(LANG_STORE) : null;
    if (LANGS.indexOf(stored) >= 0) return stored;
  } catch (err) { /* privater Modus oder file:// ohne Storage: Standard nehmen */ }
  return 'en';
})();

  var s = dict[key];
  if (s == null) s = STR.en[key];
  if (s == null) return String(key);

/* Reihenfolge der Gruppen auf der Rezeptseite; die Beschriftung kommt aus STR. */
var RECIPE_TYPE_ORDER = ['minecraft:crafting_shaped', 'simplebuilding:reinforced_bundle', 'minecraft:crafting_shapeless', 'minecraft:smithing_transform', 'minecraft:smithing_trim', 'simplebuilding:count_based_smithing', 'minecraft:blasting', 'minecraft:smelting', 'minecraft:smoking', 'minecraft:campfire_cooking', 'minecraft:stonecutting'];
var COOK_DEFAULT = { 'minecraft:blasting': 100, 'minecraft:smelting': 200, 'minecraft:smoking': 100, 'minecraft:campfire_cooking': 600 };
function recipeTypeLabel(type) { return tId('recipe.', type, prettyFromId(type || T('unknown'))); }
function recipeKind(t) {
  t = String(t || '');
  // simplebuilding:reinforced_bundle ist ein geformtes Werkbank-Rezept, das den Behaelter-Inhalt mitnimmt.
  // simplebuilding:backpack_upgrade ebenso (geformt, nimmt den Rucksackinhalt mit).
  if (/crafting_shaped$/.test(t) || t === 'simplebuilding:reinforced_bundle' || t === 'simplebuilding:backpack_upgrade') return 'shaped';
  if (/crafting_shapeless$/.test(t)) return 'shapeless';
  if (/smithing/.test(t)) return 'smithing';
  if (COOK_DEFAULT[t] != null || /smelting|blasting|smoking|cooking/.test(t)) return 'cooking';
  return 'generic';
}
function resultSlot(r) {
  var s = normStack(r.result);

}
function ingredientCounts(r) {
  var counts = new Map(); // key -> {ref, n}
  function add(ref, n) { var alts = arr(ref).filter(Boolean); if (!alts.length) return; var k = alts.join('|'); var e = counts.get(k); if (!e) counts.set(k, { ref: alts, n: 0 }); counts.get(k).n += n; }
  var kind = recipeKind(r.type);
  if (kind === 'shaped') {
    var key = isObj(r.key) ? r.key : {};
    arr(r.pattern).forEach(function (row) { String(row).split('').forEach(function (ch) { if (ch !== ' ' && key[ch] != null) add(key[ch], 1); }); });
  } else if (kind === 'shapeless') {
    var groups = arr(r.ingredientGroups).length ? r.ingredientGroups : arr(r.ingredients).map(function (i) { return [i]; });
    groups.forEach(function (g) { add(g, 1); });
  } else if (kind === 'smithing') {
    var s = isObj(r.slots) ? r.slots : {};
    add(s.template, 1); add(s.base, 1); add(s.addition, Math.max(1, num(r.addition_count, 1)));
  } else if (kind === 'cooking') {
    var sl = isObj(r.slots) ? r.slots : {}; add(sl.ingredient || r.ingredients, 1);
  } else {
    arr(r.ingredients).forEach(function (i) { add(i, 1); });

}

var CATS = [

  { key: 'building', icon: 'simplebuilding:astralit_bricks' },
  { key: 'storage', icon: 'simplebuilding:netherite_backpack' },
  { key: 'machines', icon: 'simplebuilding:netherite_furnace' },

  { key: 'end', icon: 'simplebuilding:enderite_ingot', end: true },
  { key: 'trims', icon: 'simplebuilding:glowing_trim_template' },
  { key: 'materials', icon: 'simplebuilding:netherite_nugget' },
  { key: 'misc', icon: 'simplebuilding:guide_book' }
];
var CAT_RULES = [
  ['misc', /(^|_)guide_book|creative_spacer/],
  ['trims', /trim_template|smithing_template|upgrade_template|_core$/],
  ['storage', /backpack|bundle|quiver/],
  ['machines', /furnace|smoker|hopper|piston|chunk_loader/],
  ['gadgets', /(^|_)(elytra_pad|flypad|launchpad|potion_pad)$|pressure_plate|spawn_teleporter|spawn_elytra|magnet|rotator|ore_detector|velocity|echo_compass|laser_pointer|blaze_(wall_)?head|construction_light/],
  ['tools', /chisel(?!ed)|sledgehammer|building_wand|^octant|blueprint|_(axe|pickaxe|shovel|hoe|sword|spear|helmet|chestplate|leggings|boots)$/],
  ['materials', /ingot|nugget|scrap|^raw_|_dust$|_shard$|_ore$|pebble|^cracked_diamond$|leather_sheet|apple|carrot|^ender_quartz$/],
  ['building', /astralit|nihilith|ender_quartz|checker|end_stone|purpur|polished|suspended|levitating|_block$|_bricks?$|_slab$|_stairs$|_wall$|_pillar$/]
];
var END_RE = /enderite|astralit|nihilith|ender_quartz|end_stone|purpur|stellar|nihil_|astral_|spawn_elytra|elytra_pad/;
var CAT_OF = new Map();   // id -> [Hauptkategorie, evtl. 'end']
function catsOf(id) {
  if (CAT_OF.has(id)) return CAT_OF.get(id);
  var p = pathOf(id), main = 'materials';
  for (var i = 0; i < CAT_RULES.length; i++) if (CAT_RULES[i][1].test(p)) { main = CAT_RULES[i][0]; break; }
  var out = [main];

}
function catLabel(key) { return T('cat.' + key); }
function catDef(key) { for (var i = 0; i < CATS.length; i++) if (CATS[i].key === key) return CATS[i]; return null; }

function catEntries() {

  var seen = {};
  arr(D.items).concat(arr(D.blocks)).forEach(function (e) {
    if (!isObj(e) || !e.id || seen[e.id]) return;
    seen[e.id] = true;

}
function kindOfId(id) { return IX.items.has(id) ? 'items' : IX.blocks.has(id) ? 'blocks' : null; }

var TIERS = ['wooden', 'stone', 'leather', 'chainmail', 'copper', 'iron', 'gold', 'golden', 'diamond', 'reinforced', 'netherite', 'enderite', 'stellar', 'fine'];
var COLORS = ['white', 'light_gray', 'gray', 'black', 'brown', 'red', 'orange', 'yellow', 'lime', 'green', 'cyan', 'light_blue', 'blue', 'purple', 'magenta', 'pink'];

  return (t < 0 ? 0 : t + 1) * 100 + (m ? num(m[1], 0) : 0) + (/^waxed_/.test(raw) ? 50 : 0) + (/exposed_/.test(raw) ? 10 : /weathered_/.test(raw) ? 20 : /oxidized_/.test(raw) ? 30 : 0);

var MATERIAL_GROUPS = ['astralit', 'nihilith', 'ender_quartz', 'checker', 'end_stone', 'purpur', 'sand', 'gravel', 'diamond', 'enderite'];

/* ------------------------------------------------------------------ */
/* Kernmerkmal der aufgewerteten Maschinen                            */
/* ------------------------------------------------------------------ */
/* Die Zahlen liest generate.py aus der Tick-Methode der Block-Entity (machine.source,
   Datei:Zeile) und den Vanilla-Trichtertakt aus dem Datagen-Export. Gerechnet wird hier
   nur, was der Code vorgibt:
   - Ofen: Vanillas serverTick zaehlt +1, die Mod danach +extraTicks, aber nie ueber
     total-1 hinaus; fertig wird es erst, wenn Vanillas eigener +1 den Wert total
     erreicht. Also ceil((total-1)/(1+extra)) Ticks bis zur Kappe, plus einer.
   - Standarddauer: SmeltingRecipe 200, SmokingRecipe und BlastingRecipe 100
     (cookingMapCodec in MC 26.2; in 1.21.11 stehen dieselben Werte in den Rezepten).
   - Trichter: nach jedem erfolgreichen Schritt setzt die Mod die Abklingzeit auf
     cooldownTicks, Vanilla auf MOVE_ITEM_SPEED; ein Schritt bewegt ein Item. */
var COOK_TYPE_OF_VANILLA = { 'minecraft:furnace': 'minecraft:smelting', 'minecraft:smoker': 'minecraft:smoking', 'minecraft:blast_furnace': 'minecraft:blasting' };
function machineFeature(id) {
  var b = IX.blocks.get(id), m = b && b.machine;
  if (!isObj(m)) return '';
  var vname = tId('vn.', m.vanilla, displayName(m.vanilla));
  var factor = null, lines = [], srcs = [m.source];
  if (m.kind === 'cooking' && m.cookingTicksPerTick > 1) {
    factor = m.cookingTicksPerTick;
    lines.push(T('machineCooking', fmtNum(factor), vname, m.cookingTicksPerTick));
    var total = COOK_DEFAULT[COOK_TYPE_OF_VANILLA[m.vanilla]];
    if (total) {
      var ticks = Math.ceil((total - 1) / factor) + 1;
      lines.push(T('machineCookingExample', total, vname, ticks, fmtNum(ticks / 20), fmtNum(total / 20)));
    }
    srcs.push('AbstractFurnaceBlockEntity.serverTick');
  } else if (m.kind === 'hopper' && m.cooldownTicks > 0 && m.vanillaCooldownTicks > 0) {
    factor = m.vanillaCooldownTicks / m.cooldownTicks;
    lines.push(T(m.cooldownTicks === 1 ? 'machineHopperOne' : 'machineHopper', fmtNum(factor), vname, m.cooldownTicks, m.vanillaCooldownTicks));
    lines.push(T('machineHopperExample', fmtNum(20 / m.cooldownTicks), fmtNum(20 / m.vanillaCooldownTicks)));
    srcs.push(m.vanillaCooldownSource);
  }
  if (!lines.length) return '';
  return '<div class="keyfeat"><div class="keyfeat-num">' + (factor ? esc(fmtNum(factor)) + '×' : '') + '</div><div><div class="keyfeat-title">' + esc(T('machineTitle')) + '</div>' +
    lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') +
    '<div class="src">' + esc(T('machineSource')) + ' ' + srcs.filter(Boolean).map(function (s) { return '<code>' + esc(s) + '</code>'; }).join(', ') + '</div></div></div>';
}

/* Aus D.advancements (generate.py liest advancement/** der Datagen-Ausgabe).

function advText(a, field) {

function pageAdvancements() {

    }).filter(Boolean);
    var h = '<li id="adv-' + esc(a.id) + '"><div class="adv adv-' + esc(a.frame || 'task') + '">' + slotHtml(a.icon) + '<div><b>' + esc(advText(a, 'title')) + '</b><span class="adv-frame">' + esc(T('advFrame_' + (a.frame || 'task'))) + '</span>' +

  var teasers = [];

  return h;

/* Aus D.inWorld: generate.py liest dafuer inworld.json (vom Datagen aus
   den Tabellen und Konstanten des Spiels geschrieben) und die wenigen
   Handeintraege aus manual.json. */
var IW = { kinds: new Map(), entries: [], byOutput: new Map(), byInput: new Map(), byTool: new Map() };
function buildInWorld() {
  var src = D && isObj(D.inWorld) ? D.inWorld : {};
  arr(src.kinds).forEach(function (k) { if (isObj(k) && k.id) IW.kinds.set(k.id, k); });
  arr(src.entries).forEach(function (e) {
    if (!isObj(e) || !e.kind) return;
    IW.entries.push(e);
    var o = normStack(e.output); if (o) push(IW.byOutput, o.id, e);
    arr(e.inputs).forEach(function (s) { arr(s && s.id).forEach(function (id) { push(IW.byInput, id, e); }); });
    arr(e.tools).forEach(function (id) { push(IW.byTool, id, e); });
  });
}
function iwKindTitle(kind) {
  var k = IW.kinds.get(kind), v = k ? localised(k.note).v : null;
  return (isObj(v) && v.title) || prettyFromId(kind);
}
function secondsOf(ticks) { return fmtNum(num(ticks, 0) / 20); }
function iwStats(e) {

  if (s.ticks != null) out.push(T('iwStatTime', secondsOf(s.ticks), s.ticks));
  if (s.hits != null) out.push(T('iwStatHits', s.hits));
  if (s.damagePerHit != null) out.push(T('iwStatDamagePerHit', s.damagePerHit));
  if (s.damage != null) out.push(s.damagePerHit != null ? T('iwStatDamageTotal', s.damage) : T('iwStatDamage', s.damage));
  if (s.waterLevels != null) out.push(T('iwStatWater', s.waterLevels));
  if (s.placedHits != null) out.push(T('iwStatPlacedHits', s.placedHits));
  return out;
}

  }).join('') : '<div class="qs-empty">' + esc(T('qsNone')) + '</div>';
  var ai = QS.items.length - 1;
  h += '<a class="qs-item qs-all" id="qs-' + ai + '" role="option" aria-selected="' + (QS.idx === ai) + '" href="#/search/' + esc(encodeURIComponent(q)) + '" data-qi="' + ai + '">' + esc(T('qsAll', q)) + '</a>';
  h += '<div class="qs-foot">' + esc(T('qsNav')) + '</div>';
  $qs.innerHTML = h;
  $qs.hidden = false;
  $q.setAttribute('aria-expanded', 'true');
  $q.setAttribute('aria-activedescendant', 'qs-' + QS.idx);
}
function moveQs(d) {
  if (!QS.items.length) return;
  QS.idx = (QS.idx + d + QS.items.length) % QS.items.length;
  $qs.querySelectorAll('.qs-item').forEach(function (el) { el.setAttribute('aria-selected', String(+el.getAttribute('data-qi') === QS.idx)); });
  var sel = document.getElementById('qs-' + QS.idx);
  if (sel) { sel.scrollIntoView({ block: 'nearest' }); $q.setAttribute('aria-activedescendant', sel.id); }
}
var searchTimer = null;
$q.addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    QS.idx = 0;
    var q = $q.value.trim();
    if (currentRoute().section === 'search') {
      if (q) go({ section: 'search', id: q }, { replace: true, fromSearch: true });
      else closeQs();
      return;
    }
    renderQs();
  }, 90);
});
$q.addEventListener('focus', function () { if ($q.value.trim() && currentRoute().section !== 'search') renderQs(); });
$q.addEventListener('keydown', function (ev) {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); if ($qs.hidden) renderQs(); else moveQs(1); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); moveQs(-1); }
  else if (ev.key === 'Escape') {
    if (!$qs.hidden) { closeQs(); return; }
    $q.value = ''; $q.blur();
    if (currentRoute().section === 'search') go({ section: 'overview' }, { replace: true });
  } else if (ev.key === 'Enter') {
    ev.preventDefault();
    var q = $q.value.trim();
    if (!q) return;
    clearTimeout(searchTimer);
    var target = (ev.ctrlKey || ev.metaKey || $qs.hidden || !QS.items.length) ? '#/search/' + encodeURIComponent(q) : QS.items[QS.idx];
    closeQs();
    if (currentRoute().section === 'search' && target.indexOf('#/search/') === 0) return;
    $q.blur();
    goHref(target);
  }
});
$qs.addEventListener('mousedown', function (ev) { ev.preventDefault(); }); /* Fokus im Feld lassen */
$qs.addEventListener('click', function () { $q.blur(); });
document.addEventListener('click', function (ev) { if (!$qs.hidden && !ev.target.closest('.search')) closeQs(); });
function focusSearch() { closeNav(); $q.focus(); $q.select(); }
document.addEventListener('keydown', function (ev) {
  var t = ev.target; var tag = t && t.tagName;
  var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable);
  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && String(ev.key).toLowerCase() === 'k') { ev.preventDefault(); focusSearch(); return; }
  if (ev.key === '/' && !ev.ctrlKey && !ev.metaKey && !ev.altKey && !typing) { ev.preventDefault(); focusSearch(); return; }
  if (ev.key === 'Escape') closeNav();
});
$main.addEventListener('click', function (ev) { if (ev.target.closest && ev.target.closest('[data-open-search]')) { ev.preventDefault(); focusSearch(); } });

/* Farbschema: System -> hell -> dunkel -> System. */
var THEME_STORE = 'simplebuilding-wiki-theme';
var THEME_ICONS = {
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};
function currentTheme() { var t = document.documentElement.getAttribute('data-theme'); return t === 'light' || t === 'dark' ? t : 'auto'; }
function applyThemeButton() {
  var t = currentTheme(), label = T(t === 'light' ? 'themeLight' : t === 'dark' ? 'themeDark' : 'themeAuto');
  $theme.innerHTML = THEME_ICONS[t];
  $theme.title = label; $theme.setAttribute('aria-label', label);
}
$theme.addEventListener('click', function () {
  var next = { auto: 'light', light: 'dark', dark: 'auto' }[currentTheme()];
  if (next === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', next);
  try { if (next === 'auto') window.localStorage.removeItem(THEME_STORE); else window.localStorage.setItem(THEME_STORE, next); } catch (err) { /* nur diese Sitzung */ }
  applyThemeButton();
});

/* Rechtsklick auf eine Item-Kachel: eigenes kleines Menue mit "Rezeptbaum".
   Linksklick bleibt, wie er ist. Tastatur: Kontextmenue-Taste/Shift+F10. */
document.addEventListener('contextmenu', function (ev) {
  var el = ev.target && ev.target.closest ? ev.target.closest('[data-id]') : null;
  if (!el || !$main.contains(el)) { closeCtx(); return; }
  var id = el.getAttribute('data-id');
  if (!id) return;
  ev.preventDefault();
  var x = ev.clientX, y = ev.clientY;
  if (!x && !y) { var rc = el.getBoundingClientRect(); x = rc.left; y = rc.bottom; }
  openCtx(id, x, y);
});
document.addEventListener('click', function (ev) { if ($ctx && !$ctx.contains(ev.target)) closeCtx(); });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeCtx(); });
window.addEventListener('scroll', closeCtx, { passive: true });
window.addEventListener('resize', closeCtx);
/* Baum: Kinder erst beim Aufklappen bauen. toggle blubbert nicht - daher capture. */
$main.addEventListener('toggle', function (ev) {
  var d = ev.target;
  if (!d || !d.classList || !d.classList.contains('tree-node') || !d.open) return;
  var body = d.querySelector(':scope > .tree-body');
  if (!body || body.getAttribute('data-filled')) return;
  body.setAttribute('data-filled', '1');
  if (body.children.length) return;
  var ref = (d.getAttribute('data-ref') || '').split('|').filter(Boolean);
  var path = (d.getAttribute('data-path') || '').split('|').filter(Boolean);
  body.innerHTML = treeChildren(ref, num(d.getAttribute('data-need'), 1), path);
}, true);
/* Eingeklappte Abschnitte merken. */
$main.addEventListener('toggle', function (ev) {
  var d = ev.target;
  if (d && d.classList && d.classList.contains('fold') && d.getAttribute('data-fold') && !d.hasAttribute('data-noremember')) setFolded(d.getAttribute('data-fold'), !d.open, d.hasAttribute('data-defclosed'));
}, true);
/* Alle Rezepte / JEI-Ansicht: Filter-Chips, Varianten, Blaettern. */
$main.addEventListener('click', function (ev) {
  var t = ev.target && ev.target.closest ? ev.target.closest('button') : null;
  if (!t || !$main.contains(t)) return;
  if (t.hasAttribute('data-ar')) {
    RV[t.getAttribute('data-ar')] = t.getAttribute('data-v'); saveRV();
    $main.querySelectorAll('[data-ar="' + t.getAttribute('data-ar') + '"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); });
    AR.shown = 60; refreshRecipeView();
  } else if (t.hasAttribute('data-ar-more')) {
    AR.shown += 60; arRenderResults();
  } else if (t.hasAttribute('data-vi')) {
    var card = t.closest('.rc[data-g]'), g = card && AR.groups[+card.getAttribute('data-g')];
    if (!g) return;
    var i = +t.getAttribute('data-vi');
    if (g.pinned && g.idx === i) g.pinned = false; else { g.idx = i; g.pinned = true; }
    card.innerHTML = rcInner(g.members[g.idx], g);
    var again = card.querySelector('[data-vi="' + i + '"]'); if (again) again.focus();
  } else if (t.hasAttribute('data-mk-step')) {
    var st = t.getAttribute('data-mk-st');
    MK.idx[st] = Math.max(0, (MK.idx[st] || 0) + num(t.getAttribute('data-mk-step'), 0));
    mkRender();
    var sec = document.getElementById('mk-' + st), btn = sec && sec.querySelector('[data-mk-step="' + t.getAttribute('data-mk-step') + '"]:not([disabled])');
    if (btn) btn.focus();
  } else if (t.hasAttribute('data-mk-all')) {
    var s2 = t.getAttribute('data-mk-all'); MK.all[s2] = !MK.all[s2]; mkRender();
  }
});
var arTimer = null;
$main.addEventListener('input', function (ev) {
  var t = ev.target;
  if (!t || t.id !== 'ar-q') return;
  clearTimeout(arTimer);
  arTimer = setTimeout(function () { RV.q = t.value; AR.shown = 60; arRenderResults(); }, 150);
});
$main.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t && t.id === 'ar-merge') { RV.merge = !!t.checked; saveRV(); refreshRecipeView(); }
});
/* Wie in JEI: R zeigt die Rezepte, U die Verwendung des Items unter dem Mauszeiger. */
var hoverId = null;
document.addEventListener('mouseover', function (ev) { var el = ev.target && ev.target.closest ? ev.target.closest('[data-id]') : null; hoverId = el && $main.contains(el) ? el.getAttribute('data-id') : null; });
document.addEventListener('keydown', function (ev) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || !hoverId || hoverId.charAt(0) === '#') return;
  var tag = ev.target && ev.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var k = String(ev.key || '').toLowerCase();
  if (k === 'r') go({ section: 'make', id: hoverId });
  else if (k === 'u') go({ section: 'use', id: hoverId });
});
$main.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t && t.hasAttribute && t.hasAttribute('data-tree-line')) {
    try { if (window.localStorage) window.localStorage.setItem(MC_LINE_STORE, t.value); } catch (err) { /* nur fuer diese Sitzung */ }
    fillTree();
  }
});
$main.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t && t.hasAttribute && t.hasAttribute('data-tree-amount')) {
    var n = Math.floor(num(t.value, 0));
    if (n >= 1 && n <= 4096) { TREE.amount = n; fillTree(); }
  }
});

/* Beschriftungen ausserhalb von #main und der Seitenleiste - die schreibt
   render() nicht, sie muessen von Hand nachgezogen werden. */
function applyStaticText() {
  document.documentElement.lang = LANG;
  $q.placeholder = T('searchPlaceholder');
  $q.setAttribute('aria-label', T('searchAria'));
  $side.setAttribute('aria-label', T('sidebarAria'));
  $lang.setAttribute('aria-label', T('langAria'));
  $menu.setAttribute('aria-label', T('menuAria'));
  $lang.value = LANG;
  applyThemeButton();
}
/* Sprachwechsel ohne Neuladen. Die Reihenfolge zaehlt: der Suchindex muss
   neu stehen, bevor render() eine Suchseite zeichnet, und buildSearch haengt
   an, statt zu ersetzen - ohne das Leeren waechst der Index bei jedem Wechsel.
   Die Adresse bekommt ?lang=de (bzw. verliert es), damit ein geteilter Link
   dieselbe Sprache zeigt. */
function setLang(next) {
  if (LANGS.indexOf(next) < 0 || next === LANG) return;
  LANG = next;
  try { if (window.localStorage) window.localStorage.setItem(LANG_STORE, LANG); }
  catch (err) { /* ohne Storage gilt die Wahl nur fuer diese Sitzung */ }
  applyStaticText();
  SEARCH.length = 0;
  buildSearch();
  renderMeta();
  if (!HASHMODE) { try { history.replaceState(history.state, '', routeUrl(currentRoute())); } catch (err) { /* Adresse bleibt */ } }
  render({ keepScroll: true });
  rewriteLinks(document.body);
}
$lang.addEventListener('change', function () { setLang($lang.value); });

buildIndex();
buildInWorld();
applyStaticText();
buildSearch();
renderMeta();
/* Alte Hash-Links (#/items/<id>) auf die URL-Form umleiten. Wo der Browser das
   nicht zulaesst (manche file://-Kontexte), bleibt der Hash-Router. */
(function () {
  try {
    var r = (location.hash || '').indexOf('#/') === 0 ? hashToRoute(location.hash) : paramsToRoute(new URLSearchParams(location.search));
    history.replaceState({ y: 0 }, '', location.pathname + routeToSearch(r));
  } catch (err) { HASHMODE = true; }
  rewriteLinks(document.body);
})();
/* Wuerfel der Vanilla-Bloecke: die Datei legt generate.py neben die Vanilla-Texturen
   (nicht committet, nicht veroeffentlicht). Kurz auf sie warten, damit die erste Seite
   schon Wuerfel zeigt; kommt sie spaeter, wird einmal nachgezeichnet. */
(function () {
  var done = false, s = document.createElement('script');
  function first() { if (!done) { done = true; render(); } }
  s.onload = function () {
    if (!done) { first(); return; }
    if (isObj(window.VANILLA_CUBES)) { render({ keepScroll: true }); }
  };
  s.onerror = first;
  s.src = 'assets/textures/minecraft/' + 'cubes.js';
  document.head.appendChild(s);
  setTimeout(first, 600);
})();
})();
</script>
