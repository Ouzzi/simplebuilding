<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleBuilding Wiki</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #646b73;
  --border: #d8dbe0;
  --accent: #2c6e4f;
  --accent-soft: #e4f1e9;
  --warn-bg: #fff5e1;
  --warn-border: #dfae52;
  --warn-text: #5f4100;
  --danger-bg: #fdeaea;
  --danger-border: #dc9a9a;
  --danger-text: #7a1f1f;
  --slot-bg: #e9e8e3;
  --slot-border: #c6c3bb;
  --code-bg: #ebebe8;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141618;
    --panel: #1d2023;
    --text: #e4e6e8;
    --muted: #9ba3ab;
    --border: #2e343a;
    --accent: #7cc39a;
    --accent-soft: #1e2e26;
    --warn-bg: #362b12;
    --warn-border: #8a6a2a;
    --warn-text: #f1d99f;
    --danger-bg: #3a1c1c;
    --danger-border: #8a3d3d;
    --danger-text: #f3b9b9;
    --slot-bg: #282c31;
    --slot-border: #3d434a;
    --code-bg: #282c31;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { font-size: 15px; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, kbd { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: .86em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; }
h1 { font-size: 1.6rem; margin: 0 0 .3rem; line-height: 1.25; }
h2 { font-size: 1.15rem; margin: 0 0 .8rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
h3 { font-size: 1rem; margin: 1.2rem 0 .5rem; color: var(--muted); font-weight: 600; }
p { margin: .4rem 0 .8rem; }
ul { margin: .3rem 0 .6rem; padding-left: 1.3rem; }
li { margin: .15rem 0; }
.muted { color: var(--muted); }
.tiny { font-size: .8rem; }
.lead { font-size: 1.05rem; }

/* Kopf */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem; padding: .55rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; color: var(--text); white-space: nowrap; font-size: 1.05rem; }
.brand:hover { text-decoration: none; }
.brand small { color: var(--muted); font-weight: 400; margin-left: .4rem; font-size: .8rem; }
.search { flex: 1; max-width: 560px; position: relative; }
.search input { width: 100%; padding: .45rem .75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search kbd { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .72rem; pointer-events: none; }
.topmeta { margin-left: auto; color: var(--muted); font-size: .82rem; display: flex; gap: .7rem; flex-wrap: wrap; white-space: nowrap; }
.langsel { flex: none; padding: .3rem .45rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: .82rem; cursor: pointer; }
.langsel:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* Layout */
.layout { display: flex; align-items: flex-start; }
.sidebar { width: 230px; flex: none; position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; padding: .9rem .7rem; border-right: 1px solid var(--border); background: var(--panel); }
.sidebar a { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .35rem .6rem; border-radius: 6px; color: var(--text); }
.sidebar a:hover { background: var(--bg); text-decoration: none; }
.sidebar a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar a .n { color: var(--muted); font-size: .78rem; font-weight: 400; }
.sidebar .sb-note { margin-top: 1rem; padding: .6rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--border); }
main { flex: 1; min-width: 0; padding: 1.5rem 2rem 4rem; max-width: 1120px; }
@media (max-width: 820px) {
  .layout { flex-direction: column; align-items: stretch; }
  main { width: 100%; max-width: 100%; }
  .sidebar { position: static; height: auto; width: 100%; display: flex; flex-wrap: wrap; gap: .15rem; border-right: 0; border-bottom: 1px solid var(--border); padding: .5rem; }
  .sidebar a { padding: .3rem .55rem; }
  .sidebar a .n { display: none; }
  .sidebar .sb-note { display: none; }
  main { padding: 1rem; }
  .topbar { flex-wrap: wrap; gap: .5rem; }
  .topmeta { margin-left: 0; }
}

/* Bausteine */
.section { margin-top: 2rem; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.card.highlight { outline: 2px solid var(--accent); }
.badge { display: inline-block; font-size: .72rem; line-height: 1.5; padding: 0 .55em; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); vertical-align: middle; white-space: nowrap; background: var(--panel); }
.badge-ok { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge-warn { border-color: var(--warn-border); color: var(--warn-text); background: var(--warn-bg); }
.badge-danger { border-color: var(--danger-border); color: var(--danger-text); background: var(--danger-bg); font-weight: 700; }
.badges { display: inline-flex; gap: .3rem; flex-wrap: wrap; vertical-align: middle; }
.box { border-left: 4px solid var(--border); padding: .6rem .9rem; background: var(--panel); border-radius: 0 6px 6px 0; margin: .8rem 0; }
.box-title { font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .2rem; }
.box-controls { border-left-color: var(--accent); }
.box-caveat { border-left-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
.box-danger { border-left-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
.box-info { border-left-color: var(--accent); }
.box ul { margin-bottom: .2rem; }
.hint { color: var(--muted); font-style: italic; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { color: var(--muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
.table tr.highlight td { background: var(--accent-soft); }
.table td.num, .table th.num { text-align: right; white-space: nowrap; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1.2rem; margin: .5rem 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.src { font-size: .78rem; color: var(--muted); margin-top: .6rem; }
.src code { font-size: .95em; }
.ref { display: inline-flex; align-items: baseline; gap: .35em; max-width: 100%; }
.ref .ref-id { color: var(--muted); background: transparent; padding: 0; font-size: .78em; }
.ref-ext { color: var(--text); }
.ref-ext .ref-name { border-bottom: 1px dotted var(--muted); }
.reflist { display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
.tile-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
.tile { display: block; padding: .8rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
.tile:hover { text-decoration: none; border-color: var(--accent); }
.tile .big { font-size: 1.5rem; font-weight: 700; }
.tile .lbl { color: var(--muted); font-size: .85rem; }

/* Slots und Rezepte */
.slot { display: inline-flex; align-items: center; justify-content: center; position: relative; width: 56px; height: 56px; background: var(--slot-bg); border: 1px solid var(--slot-border); border-radius: 4px; color: var(--text); overflow: hidden; flex: none; text-decoration: none; }
a.slot:hover { border-color: var(--accent); text-decoration: none; }
.slot img { width: 40px; height: 40px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.slot-text { font-size: 9.5px; line-height: 1.12; text-align: center; padding: 2px 3px; word-break: break-word; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.slot-tag { border-style: dashed; }
.slot-tag .slot-text { color: var(--accent); }
.slot-tag .hash { font-weight: 700; }
.slot-empty { background: transparent; border-style: dotted; opacity: .55; }
.slot-count { position: absolute; right: 1px; bottom: 0; font-size: 11px; font-weight: 700; background: var(--panel); padding: 0 3px; border-radius: 3px 0 0 0; line-height: 1.3; }
.slot-alt { position: absolute; left: 2px; top: 0; font-size: 9px; color: var(--muted); }
.slot-result { width: 64px; height: 64px; }
.slot-result img { width: 48px; height: 48px; }
.grid { display: grid; gap: 4px; flex: none; }
.recipe { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .8rem 1rem; margin-bottom: .9rem; }
.recipe-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; font-size: .85rem; }
.recipe-body { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.arrow { font-size: 1.6rem; color: var(--muted); line-height: 1; padding: 0 .2rem; }
.slotcol { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.slot-label { font-size: .68rem; color: var(--muted); white-space: nowrap; }
.slotrow { display: inline-flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.plus { color: var(--muted); align-self: center; }
.recipe-meta { font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: .15rem; }
.recipe-foot { margin-top: .6rem; font-size: .82rem; color: var(--muted); }
.recipe-foot .reflist { margin-top: .2rem; }

/* Listen */
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem; }
.listhead input { padding: .4rem .7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; min-width: 240px; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; align-items: center; gap: .8rem; padding: .35rem .6rem; border-radius: 6px; color: var(--text); border: 1px solid transparent; }
.row:hover { background: var(--panel); border-color: var(--border); text-decoration: none; }
.row .slot { width: 40px; height: 40px; }
.row .slot img { width: 28px; height: 28px; }
.row .slot-text { font-size: 8px; -webkit-line-clamp: 3; }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 600; }
.row-title .en { font-weight: 400; color: var(--muted); }
.row-sub { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-right { flex: none; display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
.row.hidden { display: none; }

/* Detailseite */
.hero { display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: .5rem; }
.hero > div { min-width: 0; }
.hero h1, .idline code, .crumbs, .row-sub code { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
main { overflow-wrap: anywhere; }
.hero-tex { width: 128px; height: 128px; background: var(--slot-bg); border: 1px solid var(--slot-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; text-align: center; color: var(--muted); font-size: .8rem; padding: .4rem; }
.hero-tex img { width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }

/* 3D-Ansicht eines Blocks: drei Flaechen, per CSS-Transform zum Wuerfel
   gestellt - kein WebGL und kein Build noetig. Die Abstufung der Helligkeit
   ahmt die Beleuchtung im Spiel nach, damit die Kanten sichtbar bleiben,
   wenn alle drei Flaechen dieselbe Textur tragen. */
.hero-tex.is-cube { perspective: 640px; }
.cube { width: 72px; height: 72px; position: relative; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(-45deg); }
.cube span { position: absolute; inset: 0; background-size: 100% 100%; background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; }
.cube .f-top { transform: rotateX(90deg) translateZ(36px); }
.cube .f-front { transform: translateZ(36px); filter: brightness(.88); }
.cube .f-side { transform: rotateY(90deg) translateZ(36px); filter: brightness(.72); }
.hero .en { color: var(--muted); font-size: 1.05rem; }
.hero .idline { margin: .4rem 0; }
.hero .idline code { font-size: .9rem; }
.pool-bar { height: 6px; background: var(--slot-bg); border-radius: 3px; overflow: hidden; min-width: 80px; }
.pool-bar i { display: block; height: 100%; background: var(--accent); }
.crumbs { font-size: .82rem; color: var(--muted); margin-bottom: .6rem; }
.crumbs a { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); }
.search-group { margin-top: 1.4rem; }
mark { background: var(--warn-bg); color: inherit; padding: 0 .1em; border-radius: 2px; }
.notfound { padding: 2rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/" id="brand">SimpleBuilding Wiki</a>
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="topmeta" id="topmeta"></div>
    <select class="langsel" id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main id="main"></main>
  </div>
</div>

<script src="data/simplebuilding.js"></script>

/* ------------------------------------------------------------------ */
/* Grundhelfer                                                        */
/* ------------------------------------------------------------------ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function arr(x) { return Array.isArray(x) ? x : (x == null ? [] : [x]); }
function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
function strs(list) { return arr(list).filter(function (x) { return x != null && String(x).trim() !== ''; }).map(String); }
function num(x, d) { var n = Number(x); return isFinite(n) ? n : d; }
function norm(s) {
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ß/g, 'ss');
}
function prettyFromId(id) {
  var p = String(id || '').replace(/^#/, '').split(':').pop().split('/').pop();
  return p.split(/[_\-\s]+/).filter(Boolean).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ') || String(id || '?');
}
function nsOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? '' : s.slice(0, i); }
function pathOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? s : s.slice(i + 1); }

  return 'en';

   both | none. Aeltere Daten kennen nur hasEffect; daraus laesst sich
   hoechstens "nirgends" oder "unbekannt" ableiten. */
function implOf(e) {
  if (!isObj(e)) return 'unknown';
  if (typeof e.implementedIn === 'string' && e.implementedIn) return e.implementedIn;
  if (e.hasEffect === false) return 'none';
  return 'unknown';
}
function implBadge(e, long) {

  if (i === 'none') return badge(T(long ? 'badgeNotImplementedLong' : 'badgeNotImplemented'), 'danger');
  if (i === 'data') return badge(T(long ? 'badgeEffectDataLong' : 'badgeEffectData'), 'ok');
  if (i === 'code') return badge(T(long ? 'badgeEffectCodeLong' : 'badgeEffectCode'), 'ok');
  if (i === 'both') return badge(T(long ? 'badgeEffectBothLong' : 'badgeEffectBoth'), 'ok');
  return long ? badge(T('badgeEffectUnknown')) : '';
}
function enchDescription(e) {
  var d = e.description;
  var out = [];
  if (isObj(d)) {
    var first = LANG === 'de' ? 'de_de' : 'en_us', second = LANG === 'de' ? 'en_us' : 'de_de';
    if (strs([d[first]]).length) out.push({ l: first, t: d[first] });
    if (strs([d[second]]).length) out.push({ l: second, t: d[second] });
    Object.keys(d).forEach(function (k) { if (k !== 'de_de' && k !== 'en_us' && strs([d[k]]).length) out.push({ l: k, t: d[k] }); });
  }
  else if (typeof d === 'string' && d.trim()) out.push({ l: '', t: d });
  return out;
}

function entryPage(id, kind) {
  var isBlock = kind === 'blocks';
  var e = isBlock ? IX.blocks.get(id) : IX.items.get(id);
  if (!e) return notFound(isBlock ? T('wordBlock') : T('wordItem'), id);
  var de = nameDe(e), en = nameEn(e), main = nameOf(e) || prettyFromId(id), alt = nameAlt(e);
  var tex = textureOf(id);
  var h = crumbs([{ label: isBlock ? T('navBlocks') : T('navItems'), href: '#/' + kind }, { label: main }]);
  var cube = isBlock ? cubeHtml(e.faces) : '';
  h += '<div class="hero"><div class="hero-tex' + (cube ? ' is-cube' : '') + '">'
     + (cube || (tex ? '<img src="' + esc(tex) + '" alt="' + esc(main) + '" data-name="' + esc(main) + '">' : T('noTexture')))
     + '</div><div>';
  h += '<h1>' + esc(main) + '</h1>';
  if (alt && alt !== main) h += '<div class="en">' + esc(alt) + ' <span class="tiny">(' + (LANG === 'de' ? 'en_us' : 'de_de') + ')</span></div>';
  else if (!de && en) h += '<div class="en tiny">' + esc(T('nameOnlyEn')) + '</div>';
  h += '<div class="idline"><code>' + esc(id) + '</code></div>';
  var badges = [];
  badges.push(badge(isBlock ? T('badgeBlock') : T('badgeItem')));
  if (e.hasCustomBehaviour) badges.push(badge(T('badgeCustomBehaviour'), 'ok'));
  if (e.hasCustomBehaviour && !noteHasContent(e.note)) badges.push(badge(T('badgeNoProse'), 'warn'));
  if (!isBlock && IX.blocks.has(id)) badges.push('<a class="badge" href="#/blocks/' + esc(id) + '">' + esc(T('badgeAlsoAsBlock')) + '</a>');
  if (isBlock && IX.items.has(id)) badges.push('<a class="badge" href="#/items/' + esc(id) + '">' + esc(T('badgeAsItem')) + '</a>');
  h += '<div class="badges">' + badges.join('') + '</div>';
  h += '</div></div>';

  h += section(T('secDescription'), noteBlock(e.note, e.hasCustomBehaviour ? T('hintCustomBehaviour') : T('hintPlainBlock')));
  h += propertiesSection(e);

  var crafted = strs(e.craftedBy);
  h += section(T('secCrafting'), crafted.length ? crafted.map(function (rid) { var r = IX.recipes.get(rid); return r ? recipeCard(r) : '<p class="hint">' + T('recipeNotInData', esc(rid)) + '</p>'; }).join('') : '<p class="hint">' + esc(T('noRecipe')) + '</p>', { count: crafted.length });

  var used = strs(e.usedIn);
  h += section(T('secUsedIn'), used.length ? '<div class="rows">' + used.map(function (rid) { var r = IX.recipes.get(rid); return r ? recipeRow(r) : '<div class="row"><code>' + esc(rid) + '</code></div>'; }).join('') + '</div>' : '<p class="hint">' + esc(T('notAnIngredient')) + '</p>', { count: used.length });

  var trades = strs(e.trades);
  h += section(T('secTrades'), trades.length ? trades.map(function (tid) { var tc = IX.trades.get(tid); return tc ? tradeCard(tc) : '<p class="hint">' + T('tradeNotInData', esc(tid)) + '</p>'; }).join('') : '<p class="hint">' + esc(T('notTraded')) + '</p>', { count: trades.length });

  if (isBlock) {
    var lt = e.lootTable ? IX.loot.get(e.lootTable) : null;
    var drops = strs(e.drops);
    var body = '';
    if (drops.length) body += '<p>' + esc(T('dropsPrefix', '')) + '<span class="reflist">' + drops.map(function (d) { return refLink(d); }).join('') + '</span></p>';
    if (lt) body += lootBlock(lt);
    else if (e.lootTable) body += '<p class="hint">' + T('lootNotInDataOne', esc(e.lootTable)) + '</p>';
    else body += '<p class="hint">' + esc(T('noLootTable')) + (drops.length ? '' : esc(T('noLootTableTail'))) + '.</p>';
    h += section(T('secDrops'), body);
  }
  var dropsFrom = (IX.dropsOf.get(id) || []).filter(function (lid) { return !(isBlock && lid === e.lootTable); });
  if (dropsFrom.length) h += section(T('secDropsFrom'), '<div class="rows">' + dropsFrom.map(function (lid) { return lootRow(IX.loot.get(lid)); }).join('') + '</div>', { count: dropsFrom.length });

  var inTags = IX.tagsContaining.get(id) || [];
  if (inTags.length) h += section(T('secInTags'), '<div class="reflist">' + inTags.map(function (tid) { return '<a href="#/tags/' + esc(tid) + '"><code>' + esc(tid) + '</code></a>'; }).join('') + '</div>', { count: inTags.length });

  var feats = arr(D.features).filter(function (f) { return isObj(f) && strs(f.related).indexOf(id) >= 0; });
  if (feats.length) h += section(T('secFeatures'), '<div class="reflist">' + feats.map(function (f) { return '<a href="#/features/' + esc(f.id) + '">' + esc(featureTitle(f)) + '</a>'; }).join('') + '</div>');
  return h;
}

function pageRecipes() {
  var groups = new Map();
  arr(D.recipes).filter(isObj).forEach(function (r) { var k = r.type || 'unbekannt'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  var order = RECIPE_TYPE_ORDER; var keys = Array.from(groups.keys()).sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });
  var h = '<div class="listhead"><h1>' + esc(T('navRecipes')) + ' <span class="muted tiny" style="font-weight:400">' + arr(D.recipes).length + '</span></h1><input type="search" data-filter placeholder="' + esc(T('filterRecipes')) + '" aria-label="' + esc(T('filterRecipes')) + '"></div>';
  if (!keys.length) h += '<p class="hint">' + esc(T('noRecipes')) + '</p>';
  keys.forEach(function (k) {
    var rows = groups.get(k).slice().sort(function (a, b) { var ra = normStack(a.result), rb = normStack(b.result); return norm(ra ? displayName(ra.id) : a.id).localeCompare(norm(rb ? displayName(rb.id) : b.id), LANG); });
    h += section(recipeTypeLabel(k) + ' ', '<div class="tiny muted" style="margin:-.5rem 0 .5rem"><code>' + esc(k) + '</code></div><div class="rows" data-filter-target>' + rows.map(recipeRow).join('') + '</div>', { count: rows.length });
  });
  h += '<p class="hint" data-filter-empty hidden>' + esc(T('filterEmpty')) + '</p>';
  return h;
}

function pageLoot() { return listPage(T('navLoot'), arr(D.lootTables).filter(isObj).slice().sort(function (a, b) { return a.id.localeCompare(b.id); }).map(lootRow)); }

  h += '<p class="muted">' + esc(T('tradesIntro')) + (flags.length ? T('tradesToggle', flags.map(function (f) { return '<a href="#/config/' + esc(f) + '"><code>' + esc(f) + '</code></a>'; }).join(', ')) : '') + '</p>';

function tagValuesHtml(tg, registry) {
  var vals = arr(tg.values);
  if (!vals.length) return '<p class="hint">' + esc(T('emptyTag')) + '</p>';
  var h = '<div class="table-wrap"><table class="table"><thead><tr><th>' + esc(T('thValue')) + '</th><th>' + esc(T('thId')) + '</th><th></th></tr></thead><tbody>';
  vals.forEach(function (v) {
    var id = tagValueId(v); var req = isObj(v) && v.required === false;
    var isT = id.charAt(0) === '#';
    h += '<tr><td>' + (isT ? '' : slotHtml(id, 1, { cls: '' }) + ' ') + refLink(id, { noId: true, hint: registry }) + '</td><td>' + idLink(id, registry) + '</td><td>' + (isT ? badge(T('badgeTag')) : '') + (req ? ' ' + badge(T('badgeOptional'), 'warn') : '') + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

var SEARCH = [];
var SECTION_ORDER = ['features', 'items', 'blocks', 'recipes', 'loot', 'trades', 'enchantments', 'tags', 'config'];
var SECTION_KEYS = { features: 'secFeatures', items: 'navItems', blocks: 'navBlocks', recipes: 'navRecipes', loot: 'navLoot', trades: 'navTrades', enchantments: 'navEnchantments', tags: 'navTags', config: 'navConfig' };
function sectionLabel(s) { return T(SECTION_KEYS[s] || 'unknown'); }
/* Titel eines Features in der gewaehlten Sprache. */
function featureTitle(f) { if (!isObj(f)) return ''; var v = localised(f).v; return (isObj(v) && v.title) || f.title || prettyFromId(f.id || 'feature'); }
/* Fuer den Suchindex: beide Sprachfassungen, damit ein Treffer nicht davon
   abhaengt, welche Sprache gerade eingestellt ist. */
function noteText(n) {
  if (!isObj(n)) return '';
  var parts = [];
  function take(o) { if (isObj(o)) parts.push([o.summary].concat(arr(o.details), arr(o.controls), arr(o.tiers), arr(o.caveats)).filter(Boolean).join(' ')); }
  if (isObj(n.en) || isObj(n.de)) { take(n.en); take(n.de); } else take(n);
  return parts.join(' ');
}
function buildSearch() {
  if (!D) return;
  function add(section, id, title, sub, text, href) { SEARCH.push({ section: section, id: String(id), title: String(title || ''), sub: String(sub || ''), text: norm([title, sub, text].join(' ')), ntitle: norm(title), nid: norm(id), href: href }); }
  arr(D.features).filter(isObj).forEach(function (f) { var fv = localised(f).v || {}; add('features', f.id, featureTitle(f) || f.id, fv.summary || f.summary || '', noteText(f) + ' ' + arr(f.related).join(' '), '#/features/' + f.id); });
  arr(D.items).filter(isObj).forEach(function (e) { add('items', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), noteText(e.note), '#/items/' + e.id); });
  arr(D.blocks).filter(isObj).forEach(function (e) { add('blocks', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), noteText(e.note) + ' ' + arr(e.drops).join(' '), '#/blocks/' + e.id); });
  arr(D.recipes).filter(isObj).forEach(function (r) { var res = normStack(r.result); var ings = allIngredientRefs(r); add('recipes', r.id, (res ? displayName(res.id) : r.id) + ' (' + recipeTypeLabel(r.type) + ')', r.id, ings.map(function (i) { return displayName(i) + ' ' + i; }).join(' ') + ' ' + (r.group || ''), '#/recipes/' + r.id); });
  arr(D.lootTables).filter(isObj).forEach(function (l) { var items = []; arr(l.pools).forEach(function (p) { arr(p && p.items).forEach(function (it) { var s = normStack(it); if (s) items.push(displayName(s.id) + ' ' + s.id); }); }); add('loot', l.id, prettyFromId(l.id), l.id, items.join(' '), '#/loot/' + l.id); });
  arr(D.trades).filter(isObj).forEach(function (t) { var g = normStack(t.gives), w = normStack(t.wants); add('trades', t.id, (g ? displayName(g.id) : t.id) + ' – ' + professionLabel(t.profession) + ', ' + levelLabel(t.level), t.id, [g && g.id, w && displayName(w.id), w && w.id, t.profession].concat(arr(t.enchantmentPool).map(function (p) { return isObj(p) ? displayName(p.enchantment) + ' ' + p.enchantment : ''; }), strs(t.configFlags)).filter(Boolean).join(' '), '#/trades/' + t.id); });
  arr(D.enchantments).filter(isObj).forEach(function (e) { add('enchantments', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), enchDescription(e).map(function (d) { return d.t; }).join(' ') + ' ' + noteText(e.note) + ' ' + [e.supportedItems, e.exclusiveSet].join(' ') + ' implemented-in-' + implOf(e) + (implOf(e) === 'none' ? ' not implemented nicht implementiert ohne wirkung' : ''), '#/enchantments/' + e.id); });
  arr(D.tags).filter(isObj).forEach(function (t) { var info = tagRefOf(t); add('tags', t.id, info.ref, t.id, arr(t.values).map(function (v) { var id = tagValueId(v); return id + ' ' + displayName(id); }).join(' '), '#/tags/' + t.id); });
  arr(D.config).filter(isObj).forEach(function (c) { add('config', c.name, c.name, [c.type, c.default].filter(Boolean).join(' = '), [c.tooltip, c.note].filter(Boolean).join(' '), '#/config/' + c.name); });
}
function search(q) {
  var tokens = norm(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  var out = [];
  SEARCH.forEach(function (e) {
    var score = 0;
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      if (e.text.indexOf(t) < 0) return;
      if (e.ntitle === t || e.nid === t) score += 6;
      else if (e.ntitle.indexOf(t) === 0) score += 4;
      else if (e.ntitle.indexOf(t) >= 0) score += 3;
      else if (e.nid.indexOf(t) >= 0) score += 2;
      else score += 1;
    }
    out.push({ e: e, score: score });
  });
  out.sort(function (a, b) { return b.score - a.score || a.e.title.localeCompare(b.e.title, LANG); });
  return out;
}
/* Die Tokens sind normalisiert (klein, ohne Akzente, ss statt ss-Ligatur),
   der Text nicht. Deshalb wird der Text zeichenweise normalisiert und dabei
   die Zuordnung auf die Originalstellen mitgefuehrt - sonst bleiben Treffer
   mit Umlauten unmarkiert. */
function normMap(text) {
  var out = '', idx = [];
  for (var i = 0; i < text.length; i++) {
    var piece = norm(text.charAt(i));
    for (var j = 0; j < piece.length; j++) { out += piece.charAt(j); idx.push(i); }
  }
  idx.push(text.length);
  return { n: out, idx: idx };
}
function highlight(text, tokens) {
  text = String(text == null ? '' : text);
  var m = normMap(text), marks = [];
  tokens.forEach(function (tok) {
    if (!tok || tok.length < 2) return;
    var from = 0, at;
    while ((at = m.n.indexOf(tok, from)) >= 0) { marks.push([m.idx[at], m.idx[at + tok.length]]); from = at + tok.length; }
  });
  if (!marks.length) return esc(text);
  marks.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  var merged = [];
  marks.forEach(function (r) {
    var last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push([r[0], r[1]]);
  });
  var h = '', pos = 0;
  merged.forEach(function (r) { h += esc(text.slice(pos, r[0])) + '<mark>' + esc(text.slice(r[0], r[1])) + '</mark>'; pos = r[1]; });
  return h + esc(text.slice(pos));
}
function pageSearch(q) {
  q = String(q || '').trim();
  var h = '<h1>' + esc(T('titleSearch')) + '</h1>';
  if (!q) return h + '<p class="hint">' + esc(T('searchHint')) + '</p>';
  var res = search(q);
  var tokens = norm(q).split(/\s+/).filter(Boolean);
  h += '<p class="muted">' + esc(T('searchResultsFor', plural(res.length, 'hitOne', 'hitMany'), q)) + '</p>';
  if (!res.length) return h + '<p class="hint">' + T('searchNothing') + '</p>';
  var groups = new Map();
  res.forEach(function (r) { if (!groups.has(r.e.section)) groups.set(r.e.section, []); groups.get(r.e.section).push(r.e); });
  SECTION_ORDER.forEach(function (sec) {
    var list = groups.get(sec); if (!list) return;
    h += '<div class="search-group">' + section(sectionLabel(sec), '<div class="rows">' + list.map(function (e) {
      var tex = (sec === 'items' || sec === 'blocks') ? slotHtml(e.id, 1, { noLink: true }) : '';
      return '<a class="row" href="' + esc(e.href) + '">' + tex + '<div class="row-main"><div class="row-title">' + highlight(e.title, tokens) + '</div><div class="row-sub">' + highlight(e.sub, tokens) + '</div></div></a>';
    }).join('') + '</div>', { count: list.length }) + '</div>';
  });
  return h;
}

/* ------------------------------------------------------------------ */
/* Router, Seitenleiste, Ereignisse                                   */
/* ------------------------------------------------------------------ */
var $main = document.getElementById('main');
var $side = document.getElementById('sidebar');
var $q = document.getElementById('q');
var $meta = document.getElementById('topmeta');
var $lang = document.getElementById('lang');
/* label kommt aus STR, damit der Sprachwechsel die Leiste mitnimmt. */
var NAV = [
  { key: 'overview', labelKey: 'navOverview', href: '#/', count: function () { return arr(D.features).length ? T('navFeatureCount', arr(D.features).length) : null; } },
  { key: 'items', labelKey: 'navItems', count: function () { return arr(D.items).length; } },
  { key: 'blocks', labelKey: 'navBlocks', count: function () { return arr(D.blocks).length; } },
  { key: 'recipes', labelKey: 'navRecipes', count: function () { return arr(D.recipes).length; } },
  { key: 'loot', labelKey: 'navLoot', count: function () { return arr(D.lootTables).length; } },
  { key: 'trades', labelKey: 'navTrades', count: function () { return arr(D.trades).length; } },
  { key: 'enchantments', labelKey: 'navEnchantments', count: function () { return arr(D.enchantments).length; } },
  { key: 'tags', labelKey: 'navTags', count: function () { return arr(D.tags).length; } },
  { key: 'config', labelKey: 'navConfig', count: function () { return arr(D.config).length; } }
];
function parseHash() {
  var h = location.hash || '';
  if (h.charAt(0) === '#') h = h.slice(1);
  if (h.charAt(0) === '/') h = h.slice(1);
  var i = h.indexOf('/');
  var section = i < 0 ? h : h.slice(0, i);
  var rest = i < 0 ? '' : h.slice(i + 1);
  try { rest = decodeURIComponent(rest); } catch (e) { /* kaputte Kodierung: roh weiterreichen */ }
  return { section: section || 'overview', id: rest };
}
function renderSidebar(active) {
  if (!D) { $side.innerHTML = ''; return; }
  $side.innerHTML = NAV.map(function (n) {
    var c = n.count ? n.count() : null;
    return '<a href="' + esc(n.href || '#/' + n.key) + '" class="' + (n.key === active ? 'active' : '') + '">' + esc(T(n.labelKey)) + (c != null ? '<span class="n">' + esc(c) + '</span>' : '') + '</a>';
  }).join('') + '<div class="sb-note">' + T('sbNote', esc((D.generatedFrom && D.generatedFrom.generator) || 'wiki/generate.py')) + '</div>';
}
function renderMeta() {
  if (!D) { $meta.innerHTML = ''; return; }
  var g = isObj(D.generatedFrom) ? D.generatedFrom : {};
  $meta.innerHTML = '<span>' + esc(MOD.version ? 'v' + MOD.version : '') + '</span><span>MC ' + esc(arr(MOD.minecraftLines).join(' / ') || '?') + '</span><span>' + esc(arr(MOD.loaders).join(' + ') || '') + '</span>' + (g.line ? '<span title="' + esc(T('metaDataTitle')) + '">' + esc(T('metaData', g.line)) + '</span>' : '');
  document.getElementById('brand').innerHTML = esc(MOD.name || 'SimpleBuilding') + ' <small>Wiki</small>';
}
function render() {
  if (!D) {
    $main.innerHTML = '<div class="box box-danger"><div class="box-title">' + esc(T('noDataTitle')) + '</div>' + T('noDataBody') + '</div>';
    document.title = T('docTitleNoData');
    return;
  }
  var r = parseHash();
  var html = '', title = '', active = r.section;
  try {
    switch (r.section) {
      case 'overview': case '': html = pageOverview(); title = T('navOverview'); active = 'overview'; break;
      case 'features': html = pageFeature(r.id); title = featureTitle(IX.features.get(r.id)) || T('wordFeature'); active = 'overview'; break;
      case 'items': html = r.id ? entryPage(r.id, 'items') : pageItems(); title = r.id ? displayName(r.id) : T('navItems'); break;
      case 'blocks': html = r.id ? entryPage(r.id, 'blocks') : pageBlocks(); title = r.id ? displayName(r.id) : T('navBlocks'); break;
      case 'recipes': html = r.id ? pageRecipe(r.id) : pageRecipes(); title = r.id ? T('titleRecipePrefix', r.id) : T('navRecipes'); break;
      case 'loot': html = r.id ? pageLootOne(r.id) : pageLoot(); title = r.id ? T('titleLootPrefix', r.id) : T('navLoot'); break;
      case 'trades': html = r.id ? pageTrade(r.id) : pageTrades(); title = r.id ? T('titleTradePrefix', r.id) : T('navTrades'); break;
      case 'enchantments': html = r.id ? pageEnchantment(r.id) : pageEnchantments(); title = r.id ? displayName(r.id) : T('navEnchantments'); break;
      case 'tags': html = r.id ? pageTag(r.id) : pageTags(); title = r.id ? T('titleTagPrefix', r.id) : T('navTags'); break;
      case 'config': html = pageConfig(r.id); title = T('navConfig'); break;
      case 'search': html = pageSearch(r.id); title = T('titleSearch'); active = ''; if (document.activeElement !== $q) $q.value = r.id || ''; break;
      default: html = notFound(T('wordSection'), r.section); title = T('titleNotFound'); active = '';
    }
  } catch (err) {
    html = '<div class="box box-danger"><div class="box-title">' + esc(T('renderError')) + '</div><p>' + esc(err && err.message ? err.message : String(err)) + '</p><p><a href="#/">' + esc(T('notFoundOverview')) + '</a></p></div>';
    title = T('titleError');
    if (window.console) console.error(err);
  }
  if (!html) html = '<div class="notfound">' + T('emptyPage') + '</div>';
  $main.innerHTML = html;
  renderSidebar(active);
  document.title = (title ? title + ' – ' : '') + (MOD.name || 'SimpleBuilding') + ' Wiki';
  if (r.section === 'config' && r.id) {
    var row = document.getElementById('cfg-' + r.id);
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
  } else if (r.section !== 'search') {
    window.scrollTo(0, 0);
  }
}

/* Bildfehler: Textur fehlt -> Text-Kachel */
$main.addEventListener('error', function (ev) {
  var img = ev.target;
  if (!img || img.tagName !== 'IMG') return;
  var name = img.getAttribute('data-name') || img.getAttribute('alt') || '?';
  var parent = img.parentNode;
  if (parent && parent.classList && parent.classList.contains('hero-tex')) { parent.innerHTML = T('texNotFound'); return; }
  var span = document.createElement('span'); span.className = 'slot-text'; span.textContent = name;
  if (parent && parent.classList) parent.classList.add('slot-plain');
  img.replaceWith(span);
}, true);

/* Listenfilter */
$main.addEventListener('input', function (ev) {
  var inp = ev.target;
  if (!inp || !inp.hasAttribute || !inp.hasAttribute('data-filter')) return;
  var q = norm(inp.value).trim();
  var any = false;
  $main.querySelectorAll('[data-filter-target] > .row').forEach(function (row) {
    var s = row.getAttribute('data-s') || norm(row.textContent);
    var hit = !q || s.indexOf(q) >= 0;
    row.classList.toggle('hidden', !hit);
    if (hit) any = true;
  });
  var empty = $main.querySelector('[data-filter-empty]');
  if (empty) empty.hidden = any;
});

/* Suche */
var searchTimer = null;
$q.addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    var q = $q.value.trim();
    var cur = parseHash();
    if (q) { var target = '#/search/' + encodeURIComponent(q); if (location.hash !== target) location.replace(target); }
    else if (cur.section === 'search') location.replace('#/');
  }, 120);
});
$q.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { $q.value = ''; $q.blur(); if (parseHash().section === 'search') location.replace('#/'); }
  if (ev.key === 'Enter') { var first = $main.querySelector('.row'); if (first && first.href) { location.hash = first.getAttribute('href'); } }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === '/' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    var t = ev.target; var tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
    ev.preventDefault(); $q.focus(); $q.select();
  }
});

window.addEventListener('hashchange', render);

/* Beschriftungen ausserhalb von #main und der Seitenleiste - die schreibt
   render() nicht, sie muessen von Hand nachgezogen werden. */
function applyStaticText() {
  document.documentElement.lang = LANG;
  $q.placeholder = T('searchPlaceholder');
  $q.setAttribute('aria-label', T('searchAria'));
  $side.setAttribute('aria-label', T('sidebarAria'));
  $lang.setAttribute('aria-label', T('langAria'));
  $lang.value = LANG;
}
/* Sprachwechsel ohne Neuladen. Die Reihenfolge zaehlt: der Suchindex muss
   neu stehen, bevor render() eine Suchseite zeichnet, und buildSearch haengt
   an, statt zu ersetzen - ohne das Leeren waechst der Index bei jedem Wechsel. */
function setLang(next) {
  if (LANGS.indexOf(next) < 0 || next === LANG) return;
  LANG = next;
  try { if (window.localStorage) window.localStorage.setItem(LANG_STORE, LANG); }
  catch (err) { /* ohne Storage gilt die Wahl nur fuer diese Sitzung */ }
  applyStaticText();
  SEARCH.length = 0;
  buildSearch();
  renderMeta();
  var y = window.pageYOffset || 0;
  render();
  window.scrollTo(0, y);   /* render() springt sonst an den Seitenanfang */
}
$lang.addEventListener('change', function () { setLang($lang.value); });

buildIndex();
applyStaticText();
buildSearch();
renderMeta();
render();
})();
</script>
