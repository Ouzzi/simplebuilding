<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleBuilding Wiki</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #646b73;
  --border: #d8dbe0;
  --accent: #2c6e4f;
  --accent-soft: #e4f1e9;
  --warn-bg: #fff5e1;
  --warn-border: #dfae52;
  --warn-text: #5f4100;
  --danger-bg: #fdeaea;
  --danger-border: #dc9a9a;
  --danger-text: #7a1f1f;
  --slot-bg: #e9e8e3;
  --slot-border: #c6c3bb;
  --code-bg: #ebebe8;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141618;
    --panel: #1d2023;
    --text: #e4e6e8;
    --muted: #9ba3ab;
    --border: #2e343a;
    --accent: #7cc39a;
    --accent-soft: #1e2e26;
    --warn-bg: #362b12;
    --warn-border: #8a6a2a;
    --warn-text: #f1d99f;
    --danger-bg: #3a1c1c;
    --danger-border: #8a3d3d;
    --danger-text: #f3b9b9;
    --slot-bg: #282c31;
    --slot-border: #3d434a;
    --code-bg: #282c31;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { font-size: 15px; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, kbd { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: .86em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; }
h1 { font-size: 1.6rem; margin: 0 0 .3rem; line-height: 1.25; }
h2 { font-size: 1.15rem; margin: 0 0 .8rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
h3 { font-size: 1rem; margin: 1.2rem 0 .5rem; color: var(--muted); font-weight: 600; }
p { margin: .4rem 0 .8rem; }
ul { margin: .3rem 0 .6rem; padding-left: 1.3rem; }
li { margin: .15rem 0; }
.muted { color: var(--muted); }
.tiny { font-size: .8rem; }
.lead { font-size: 1.05rem; }

/* Kopf */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem; padding: .55rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; color: var(--text); white-space: nowrap; font-size: 1.05rem; }
.brand:hover { text-decoration: none; }
.brand small { color: var(--muted); font-weight: 400; margin-left: .4rem; font-size: .8rem; }
.search { flex: 1; max-width: 560px; position: relative; }
.search input { width: 100%; padding: .45rem .75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search kbd { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .72rem; pointer-events: none; }
.topmeta { margin-left: auto; color: var(--muted); font-size: .82rem; display: flex; gap: .7rem; flex-wrap: wrap; white-space: nowrap; }

/* Layout */
.layout { display: flex; align-items: flex-start; }
.sidebar { width: 230px; flex: none; position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; padding: .9rem .7rem; border-right: 1px solid var(--border); background: var(--panel); }
.sidebar a { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .35rem .6rem; border-radius: 6px; color: var(--text); }
.sidebar a:hover { background: var(--bg); text-decoration: none; }
.sidebar a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar a .n { color: var(--muted); font-size: .78rem; font-weight: 400; }
.sidebar .sb-note { margin-top: 1rem; padding: .6rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--border); }
main { flex: 1; min-width: 0; padding: 1.5rem 2rem 4rem; max-width: 1120px; }
@media (max-width: 820px) {
  .layout { flex-direction: column; align-items: stretch; }
  main { width: 100%; max-width: 100%; }
  .sidebar { position: static; height: auto; width: 100%; display: flex; flex-wrap: wrap; gap: .15rem; border-right: 0; border-bottom: 1px solid var(--border); padding: .5rem; }
  .sidebar a { padding: .3rem .55rem; }
  .sidebar a .n { display: none; }
  .sidebar .sb-note { display: none; }
  main { padding: 1rem; }
  .topbar { flex-wrap: wrap; gap: .5rem; }
  .topmeta { margin-left: 0; }
}

/* Bausteine */
.section { margin-top: 2rem; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.card.highlight { outline: 2px solid var(--accent); }
.badge { display: inline-block; font-size: .72rem; line-height: 1.5; padding: 0 .55em; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); vertical-align: middle; white-space: nowrap; background: var(--panel); }
.badge-ok { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge-warn { border-color: var(--warn-border); color: var(--warn-text); background: var(--warn-bg); }
.badge-danger { border-color: var(--danger-border); color: var(--danger-text); background: var(--danger-bg); font-weight: 700; }
.badges { display: inline-flex; gap: .3rem; flex-wrap: wrap; vertical-align: middle; }
.box { border-left: 4px solid var(--border); padding: .6rem .9rem; background: var(--panel); border-radius: 0 6px 6px 0; margin: .8rem 0; }
.box-title { font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .2rem; }
.box-controls { border-left-color: var(--accent); }
.box-caveat { border-left-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
.box-danger { border-left-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
.box-info { border-left-color: var(--accent); }
.box ul { margin-bottom: .2rem; }
.hint { color: var(--muted); font-style: italic; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { color: var(--muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
.table tr.highlight td { background: var(--accent-soft); }
.table td.num, .table th.num { text-align: right; white-space: nowrap; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1.2rem; margin: .5rem 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.src { font-size: .78rem; color: var(--muted); margin-top: .6rem; }
.src code { font-size: .95em; }
.ref { display: inline-flex; align-items: baseline; gap: .35em; max-width: 100%; }
.ref .ref-id { color: var(--muted); background: transparent; padding: 0; font-size: .78em; }
.ref-ext { color: var(--text); }
.ref-ext .ref-name { border-bottom: 1px dotted var(--muted); }
.reflist { display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
.tile-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
.tile { display: block; padding: .8rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
.tile:hover { text-decoration: none; border-color: var(--accent); }
.tile .big { font-size: 1.5rem; font-weight: 700; }
.tile .lbl { color: var(--muted); font-size: .85rem; }

/* Slots und Rezepte */
.slot { display: inline-flex; align-items: center; justify-content: center; position: relative; width: 56px; height: 56px; background: var(--slot-bg); border: 1px solid var(--slot-border); border-radius: 4px; color: var(--text); overflow: hidden; flex: none; text-decoration: none; }
a.slot:hover { border-color: var(--accent); text-decoration: none; }
.slot img { width: 40px; height: 40px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.slot-text { font-size: 9.5px; line-height: 1.12; text-align: center; padding: 2px 3px; word-break: break-word; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.slot-tag { border-style: dashed; }
.slot-tag .slot-text { color: var(--accent); }
.slot-tag .hash { font-weight: 700; }
.slot-empty { background: transparent; border-style: dotted; opacity: .55; }
.slot-count { position: absolute; right: 1px; bottom: 0; font-size: 11px; font-weight: 700; background: var(--panel); padding: 0 3px; border-radius: 3px 0 0 0; line-height: 1.3; }
.slot-alt { position: absolute; left: 2px; top: 0; font-size: 9px; color: var(--muted); }
.slot-result { width: 64px; height: 64px; }
.slot-result img { width: 48px; height: 48px; }
.grid { display: grid; gap: 4px; flex: none; }
.recipe { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .8rem 1rem; margin-bottom: .9rem; }
.recipe-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; font-size: .85rem; }
.recipe-body { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.arrow { font-size: 1.6rem; color: var(--muted); line-height: 1; padding: 0 .2rem; }
.slotcol { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.slot-label { font-size: .68rem; color: var(--muted); white-space: nowrap; }
.slotrow { display: inline-flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.plus { color: var(--muted); align-self: center; }
.recipe-meta { font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: .15rem; }
.recipe-foot { margin-top: .6rem; font-size: .82rem; color: var(--muted); }
.recipe-foot .reflist { margin-top: .2rem; }

/* Listen */
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem; }
.listhead input { padding: .4rem .7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; min-width: 240px; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; align-items: center; gap: .8rem; padding: .35rem .6rem; border-radius: 6px; color: var(--text); border: 1px solid transparent; }
.row:hover { background: var(--panel); border-color: var(--border); text-decoration: none; }
.row .slot { width: 40px; height: 40px; }
.row .slot img { width: 28px; height: 28px; }
.row .slot-text { font-size: 8px; -webkit-line-clamp: 3; }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 600; }
.row-title .en { font-weight: 400; color: var(--muted); }
.row-sub { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-right { flex: none; display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
.row.hidden { display: none; }

/* Detailseite */
.hero { display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: .5rem; }
.hero > div { min-width: 0; }
.hero h1, .idline code, .crumbs, .row-sub code { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
main { overflow-wrap: anywhere; }
.hero-tex { width: 128px; height: 128px; background: var(--slot-bg); border: 1px solid var(--slot-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; text-align: center; color: var(--muted); font-size: .8rem; padding: .4rem; }
.hero-tex img { width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }
.hero .en { color: var(--muted); font-size: 1.05rem; }
.hero .idline { margin: .4rem 0; }
.hero .idline code { font-size: .9rem; }
.pool-bar { height: 6px; background: var(--slot-bg); border-radius: 3px; overflow: hidden; min-width: 80px; }
.pool-bar i { display: block; height: 100%; background: var(--accent); }
.crumbs { font-size: .82rem; color: var(--muted); margin-bottom: .6rem; }
.crumbs a { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); }
.search-group { margin-top: 1.4rem; }
mark { background: var(--warn-bg); color: inherit; padding: 0 .1em; border-radius: 2px; }
.notfound { padding: 2rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/" id="brand">SimpleBuilding Wiki</a>
    <div class="search">
      <input id="q" type="search" placeholder="Suchen: Name, Id, Text …" autocomplete="off" spellcheck="false" aria-label="Volltextsuche">
      <kbd>/</kbd>
    </div>
    <div class="topmeta" id="topmeta"></div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Bereiche"></nav>
    <main id="main"></main>
  </div>
</div>

<script src="data/simplebuilding.js"></script>
<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ */
/* Grundhelfer                                                        */
/* ------------------------------------------------------------------ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function arr(x) { return Array.isArray(x) ? x : (x == null ? [] : [x]); }
function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
function strs(list) { return arr(list).filter(function (x) { return x != null && String(x).trim() !== ''; }).map(String); }
function num(x, d) { var n = Number(x); return isFinite(n) ? n : d; }
function norm(s) {
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ß/g, 'ss');
}
function prettyFromId(id) {
  var p = String(id || '').replace(/^#/, '').split(':').pop().split('/').pop();
  return p.split(/[_\-\s]+/).filter(Boolean).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ') || String(id || '?');
}
function nsOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? '' : s.slice(0, i); }
function pathOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? s : s.slice(i + 1); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function fmtNum(x) { var n = Number(x); if (!isFinite(n)) return String(x); return String(Math.round(n * 100) / 100).replace('.', ','); }

/* ------------------------------------------------------------------ */
/* Daten und Indizes                                                  */
/* ------------------------------------------------------------------ */
var D = isObj(window.WIKI_DATA) ? window.WIKI_DATA : null;
var MOD = D && isObj(D.mod) ? D.mod : {};
var MODID = MOD.id || 'simplebuilding';

var IX = {
  items: new Map(), blocks: new Map(), recipes: new Map(), loot: new Map(), trades: new Map(),
  ench: new Map(), tags: new Map(), tagByRef: new Map(), features: new Map(), config: new Map(),
  dropsOf: new Map(),        // item id -> [loot ids]
  tagsContaining: new Map(), // value id / #ref -> [tag ids]
  tradesWithEnch: new Map(), // enchantment id -> [trade ids]
  tradesWithFlag: new Map(), // config flag -> [trade ids]
  recipesUsingTag: new Map(),// #ref -> [recipe ids]
  enchUsingTag: new Map(),   // #ref -> [enchantment ids]
  lootOfBlock: new Map()     // block id -> loot id
};

function push(map, k, v) { if (!k) return; var l = map.get(k); if (!l) { l = []; map.set(k, l); } if (l.indexOf(v) < 0) l.push(v); }
function tagRefOf(tag) {
  var id = String(tag.id || ''); var ns = nsOf(id); var p = pathOf(id); var i = p.indexOf('/');
  return { registry: i < 0 ? '' : p.slice(0, i), ref: '#' + ns + ':' + (i < 0 ? p : p.slice(i + 1)) };
}
function normStack(x) {
  if (!x) return null;
  if (typeof x === 'string') return { id: x, count: 1 };
  if (isObj(x)) { var id = x.id || x.item || x.name; if (!id) return null; return { id: String(id), count: Math.max(1, num(x.count, 1)) }; }
  return null;
}
function tagValueId(v) { if (typeof v === 'string') return v; if (isObj(v)) return String(v.id || v.name || ''); return ''; }

function buildIndex() {
  if (!D) return;
  arr(D.items).forEach(function (e) { if (isObj(e) && e.id) IX.items.set(e.id, e); });
  arr(D.blocks).forEach(function (e) { if (isObj(e) && e.id) { IX.blocks.set(e.id, e); if (e.lootTable) IX.lootOfBlock.set(e.id, e.lootTable); } });
  arr(D.recipes).forEach(function (e) { if (isObj(e) && e.id) IX.recipes.set(e.id, e); });
  arr(D.lootTables).forEach(function (e) { if (isObj(e) && e.id) IX.loot.set(e.id, e); });
  arr(D.trades).forEach(function (e) { if (isObj(e) && e.id) IX.trades.set(e.id, e); });
  arr(D.enchantments).forEach(function (e) { if (isObj(e) && e.id) IX.ench.set(e.id, e); });
  arr(D.tags).forEach(function (e) { if (isObj(e) && e.id) { IX.tags.set(e.id, e); push(IX.tagByRef, tagRefOf(e).ref, e.id); } });
  arr(D.features).forEach(function (e) { if (isObj(e) && e.id) IX.features.set(e.id, e); });
  arr(D.config).forEach(function (e) { if (isObj(e) && e.name) IX.config.set(e.name, e); });

  IX.loot.forEach(function (l) {
    arr(l.pools).forEach(function (p) { arr(p && p.items).forEach(function (it) { var s = normStack(it); if (s) push(IX.dropsOf, s.id, l.id); }); });
  });
  IX.tags.forEach(function (t) { arr(t.values).forEach(function (v) { push(IX.tagsContaining, tagValueId(v), t.id); }); });
  IX.trades.forEach(function (t) {
    arr(t.enchantmentPool).forEach(function (p) { if (isObj(p) && p.enchantment) push(IX.tradesWithEnch, p.enchantment, t.id); });
    strs(t.configFlags).forEach(function (f) { push(IX.tradesWithFlag, f, t.id); });
  });
  IX.recipes.forEach(function (r) {
    allIngredientRefs(r).forEach(function (ref) { if (ref.charAt(0) === '#') push(IX.recipesUsingTag, ref, r.id); });
  });
  IX.ench.forEach(function (e) {
    [e.supportedItems, e.primaryItems, e.exclusiveSet].forEach(function (ref) { if (typeof ref === 'string' && ref.charAt(0) === '#') push(IX.enchUsingTag, ref, e.id); });
  });
}
function allIngredientRefs(r) {
  var out = [];
  function add(x) { if (typeof x === 'string') { if (out.indexOf(x) < 0) out.push(x); } else if (Array.isArray(x)) x.forEach(add); else if (isObj(x)) { if (x.id || x.item || x.tag) add(x.tag ? '#' + x.tag : String(x.id || x.item)); else Object.keys(x).forEach(function (k) { add(x[k]); }); } }
  add(r.ingredients); add(r.key); add(r.ingredientGroups); add(r.slots);
  return out;
}
function resolveTag(ref, registryHint) {
  if (typeof ref !== 'string') return null;
  if (IX.tags.has(ref)) return IX.tags.get(ref);
  var r = ref.charAt(0) === '#' ? ref : '#' + ref;
  var ids = IX.tagByRef.get(r) || [];
  if (!ids.length) return null;
  if (registryHint) { for (var i = 0; i < ids.length; i++) { if (tagRefOf(IX.tags.get(ids[i])).registry === registryHint) return IX.tags.get(ids[i]); } }
  return IX.tags.get(ids[0]);
}

/* ------------------------------------------------------------------ */
/* Namen, Links, Slots                                                */
/* ------------------------------------------------------------------ */
function nameDe(e) { var n = e && e.name; return isObj(n) ? (n.de_de || '') : (typeof n === 'string' ? n : ''); }
function nameEn(e) { var n = e && e.name; return isObj(n) ? (n.en_us || '') : ''; }
function nameOf(e) { if (!e) return ''; var n = e.name; if (isObj(n)) { return n.de_de || n.en_us || Object.keys(n).map(function (k) { return n[k]; }).filter(Boolean)[0] || ''; } return typeof n === 'string' ? n : (e.title || ''); }
function entryFor(id) { return IX.items.get(id) || IX.blocks.get(id) || IX.ench.get(id) || null; }
function displayName(id) { if (!id) return '?'; if (id.charAt(0) === '#') return id; var e = entryFor(id); return (e && nameOf(e)) || prettyFromId(id); }
function isVanilla(id) { return nsOf(id) === 'minecraft'; }
function hrefFor(id, hint) {
  if (!id) return null;
  if (id.charAt(0) === '#') { var t = resolveTag(id, hint); return t ? '#/tags/' + t.id : null; }
  if (IX.items.has(id)) return '#/items/' + id;
  if (IX.blocks.has(id)) return '#/blocks/' + id;
  if (IX.ench.has(id)) return '#/enchantments/' + id;
  if (IX.recipes.has(id)) return '#/recipes/' + id;
  if (IX.loot.has(id)) return '#/loot/' + id;
  if (IX.trades.has(id)) return '#/trades/' + id;
  if (IX.tags.has(id)) return '#/tags/' + id;
  if (IX.config.has(id)) return '#/config/' + id;
  if (IX.features.has(id)) return '#/features/' + id;
  return null;
}
function refLink(id, opts) {
  opts = opts || {};
  id = String(id || '');
  var href = hrefFor(id, opts.hint);
  var isTag = id.charAt(0) === '#';
  var label = isTag ? id : displayName(id);
  var showId = !isTag && !opts.noId && label !== id;
  var inner = '<span class="ref-name">' + esc(label) + '</span>' + (showId ? '<code class="ref-id">' + esc(id) + '</code>' : '');
  if (href) return '<a class="ref" href="' + esc(href) + '" title="' + esc(id) + '">' + inner + '</a>';

}

  if (inTags.length) h += section('In Tags', '<div class="reflist">' + inTags.map(function (tid) { return '<a href="#/tags/' + esc(tid) + '"><code>' + esc(tid) + '</code></a>'; }).join('') + '</div>', { count: inTags.length });
  return h;
}

function tagValuesHtml(t, registry) {
  var vals = arr(t.values);
  if (!vals.length) return '<p class="hint">Leerer Tag.</p>';
  var h = '<div class="table-wrap"><table class="table"><thead><tr><th>Wert</th><th>Id</th><th></th></tr></thead><tbody>';
  vals.forEach(function (v) {
    var id = tagValueId(v); var req = isObj(v) && v.required === false;
    var isT = id.charAt(0) === '#';
    h += '<tr><td>' + (isT ? '' : slotHtml(id, 1, { cls: '' }) + ' ') + refLink(id, { noId: true, hint: registry }) + '</td><td>' + idLink(id, registry) + '</td><td>' + (isT ? badge('Tag') : '') + (req ? ' ' + badge('optional (required: false)', 'warn') : '') + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}
function pageTags() {
  var rows = arr(D.tags).filter(isObj).slice().sort(function (a, b) { return a.id.localeCompare(b.id); }).map(function (t) {
    var info = tagRefOf(t);
    return '<a class="row" href="#/tags/' + esc(t.id) + '" data-s="' + esc(norm(t.id + ' ' + info.ref + ' ' + arr(t.values).map(tagValueId).join(' '))) + '">' +
      '<div class="row-main"><div class="row-title"><code>' + esc(info.ref) + '</code></div><div class="row-sub">' + esc(t.id) + ' · ' + esc(arr(t.values).map(function (v) { var id = tagValueId(v); return id.charAt(0) === '#' ? id : displayName(id); }).join(', ')) + '</div></div>' +
      '<div class="row-right">' + badge('Registry: ' + (info.registry || '?')) + badge(plural(arr(t.values).length, 'Wert', 'Werte')) + (t.replace ? badge('replace', 'warn') : '') + '</div></a>';
  });
  return listPage('Tags', rows, { intro: '<p class="muted tiny">Tags werden in Rezepten und Verzauberungen als <code>#namespace:pfad</code> referenziert; die Registry (item, enchantment, …) steht im Dateipfad.</p>' });
}
function pageTag(id) {
  var t = IX.tags.get(id) || resolveTag(id);
  if (!t) return notFound('Tag', id);
  var info = tagRefOf(t);
  var h = crumbs([{ label: 'Tags', href: '#/tags' }, { label: info.ref }]);
  h += '<h1><code style="font-size:1.2rem">' + esc(info.ref) + '</code></h1><div class="idline"><code>' + esc(t.id) + '</code></div>';
  h += '<div class="badges">' + badge('Registry: ' + (info.registry || '?')) + (t.replace ? badge('replace: true – ersetzt den Tag komplett statt zu ergänzen', 'warn') : badge('replace: false – ergänzt bestehende Werte')) + '</div>';
  h += section('Werte', tagValuesHtml(t, info.registry), { count: arr(t.values).length });
  var usedByEnch = IX.enchUsingTag.get(info.ref) || [];
  var usedByRecipes = IX.recipesUsingTag.get(info.ref) || [];
  var usedByTags = IX.tagsContaining.get(info.ref) || [];
  var body = '';
  if (usedByEnch.length) body += '<h3>Verzauberungen</h3><div class="rows">' + usedByEnch.map(function (eid) { return enchRow(IX.ench.get(eid)); }).join('') + '</div>';
  if (usedByRecipes.length) body += '<h3>Rezepte</h3><div class="rows">' + usedByRecipes.map(function (rid) { return recipeRow(IX.recipes.get(rid)); }).join('') + '</div>';
  if (usedByTags.length) body += '<h3>Enthalten in Tags</h3><div class="reflist">' + usedByTags.map(function (tid) { return '<a href="#/tags/' + esc(tid) + '"><code>' + esc(tid) + '</code></a>'; }).join('') + '</div>';
  h += section('Verwendet von', body || '<p class="hint">Wird in den Wiki-Daten nirgends referenziert.</p>');
  h += sourceLine(t.source);
  return h;
}

function pageConfig(highlightName) {
  var rows = arr(D.config).filter(isObj);
  var h = '<h1>Konfiguration <span class="muted tiny" style="font-weight:400">' + rows.length + '</span></h1>';
  h += '<p class="muted tiny">Aus <code>SimplebuildingConfig.java</code>. Änderungen erfolgen in der Konfigurationsdatei der Mod, nicht hier.</p>';
  if (!rows.length) return h + '<p class="hint">Keine Optionen.</p>';
  h += '<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Typ</th><th>Standard</th><th>Tooltip</th><th>Notiz</th><th>Bezug</th></tr></thead><tbody>';
  rows.forEach(function (c) {
    var tr = IX.tradesWithFlag.get(c.name) || [];
    h += '<tr id="cfg-' + esc(c.name) + '"' + (c.name === highlightName ? ' class="highlight"' : '') + '><td><a href="#/config/' + esc(c.name) + '"><code>' + esc(c.name) + '</code></a></td><td>' + esc(c.type || '–') + '</td><td><code>' + esc(c.default != null ? c.default : '–') + '</code></td><td>' + (strs([c.tooltip]).length ? esc(c.tooltip) : '<span class="muted">–</span>') + '</td><td>' + (strs([c.note]).length ? esc(c.note) : '<span class="muted">–</span>') + '</td><td>' + (tr.length ? '<a href="#/trades">' + plural(tr.length, 'Handel', 'Handel') + '</a>' : '<span class="muted">–</span>') + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function notFound(what, id) {
  var q = String(id || '').split(':').pop().split('/').pop();
  return '<div class="notfound"><h1>' + esc(what) + ' nicht gefunden</h1><p><code>' + esc(id) + '</code> gibt es in den Wiki-Daten nicht.</p><p><a href="#/search/' + encodeURIComponent(q) + '">Nach „' + esc(q) + '“ suchen</a> · <a href="#/">Zur Übersicht</a></p></div>';
}

/* ------------------------------------------------------------------ */
/* Suche                                                              */
/* ------------------------------------------------------------------ */
var SEARCH = [];
var SECTION_LABELS = { features: 'Features', items: 'Items', blocks: 'Blöcke', recipes: 'Rezepte', loot: 'Loot-Tabellen', trades: 'Handel', enchantments: 'Verzauberungen', tags: 'Tags', config: 'Konfiguration' };
function noteText(n) { if (!isObj(n)) return ''; return [n.summary].concat(arr(n.details), arr(n.controls), arr(n.tiers), arr(n.caveats)).filter(Boolean).join(' '); }
function buildSearch() {
  if (!D) return;
  function add(section, id, title, sub, text, href) { SEARCH.push({ section: section, id: String(id), title: String(title || ''), sub: String(sub || ''), text: norm([title, sub, text].join(' ')), ntitle: norm(title), nid: norm(id), href: href }); }
  arr(D.features).filter(isObj).forEach(function (f) { add('features', f.id, f.title || f.id, f.summary || '', arr(f.details).join(' ') + ' ' + arr(f.related).join(' '), '#/features/' + f.id); });
  arr(D.items).filter(isObj).forEach(function (e) { add('items', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), noteText(e.note), '#/items/' + e.id); });
  arr(D.blocks).filter(isObj).forEach(function (e) { add('blocks', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), noteText(e.note) + ' ' + arr(e.drops).join(' '), '#/blocks/' + e.id); });
  arr(D.recipes).filter(isObj).forEach(function (r) { var res = normStack(r.result); var ings = allIngredientRefs(r); add('recipes', r.id, (res ? displayName(res.id) : r.id) + ' (' + recipeTypeLabel(r.type) + ')', r.id, ings.map(function (i) { return displayName(i) + ' ' + i; }).join(' ') + ' ' + (r.group || ''), '#/recipes/' + r.id); });
  arr(D.lootTables).filter(isObj).forEach(function (l) { var items = []; arr(l.pools).forEach(function (p) { arr(p && p.items).forEach(function (it) { var s = normStack(it); if (s) items.push(displayName(s.id) + ' ' + s.id); }); }); add('loot', l.id, prettyFromId(l.id), l.id, items.join(' '), '#/loot/' + l.id); });
  arr(D.trades).filter(isObj).forEach(function (t) { var g = normStack(t.gives), w = normStack(t.wants); add('trades', t.id, (g ? displayName(g.id) : t.id) + ' – ' + professionLabel(t.profession) + ', ' + levelLabel(t.level), t.id, [g && g.id, w && displayName(w.id), w && w.id, t.profession].concat(arr(t.enchantmentPool).map(function (p) { return isObj(p) ? displayName(p.enchantment) + ' ' + p.enchantment : ''; }), strs(t.configFlags)).filter(Boolean).join(' '), '#/trades/' + t.id); });
  arr(D.enchantments).filter(isObj).forEach(function (e) { add('enchantments', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), enchDescription(e).map(function (d) { return d.t; }).join(' ') + ' ' + noteText(e.note) + ' ' + [e.supportedItems, e.exclusiveSet].join(' ') + (e.hasEffect === false ? ' ohne wirkung' : ''), '#/enchantments/' + e.id); });
  arr(D.tags).filter(isObj).forEach(function (t) { var info = tagRefOf(t); add('tags', t.id, info.ref, t.id, arr(t.values).map(function (v) { var id = tagValueId(v); return id + ' ' + displayName(id); }).join(' '), '#/tags/' + t.id); });
  arr(D.config).filter(isObj).forEach(function (c) { add('config', c.name, c.name, [c.type, c.default].filter(Boolean).join(' = '), [c.tooltip, c.note].filter(Boolean).join(' '), '#/config/' + c.name); });
}
function search(q) {
  var tokens = norm(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  var out = [];
  SEARCH.forEach(function (e) {
    var score = 0;
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      if (e.text.indexOf(t) < 0) return;
      if (e.ntitle === t || e.nid === t) score += 6;
      else if (e.ntitle.indexOf(t) === 0) score += 4;
      else if (e.ntitle.indexOf(t) >= 0) score += 3;
      else if (e.nid.indexOf(t) >= 0) score += 2;
      else score += 1;
    }
    out.push({ e: e, score: score });
  });
  out.sort(function (a, b) { return b.score - a.score || a.e.title.localeCompare(b.e.title, 'de'); });
  return out;
}
function highlight(text, tokens) {
  var h = esc(text);
  tokens.forEach(function (t) { if (t.length < 2) return; var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); h = h.replace(re, '<mark>$1</mark>'); });
  return h;
}
function pageSearch(q) {
  q = String(q || '').trim();
  var h = '<h1>Suche</h1>';
  if (!q) return h + '<p class="hint">Suchbegriff oben eingeben – gesucht wird in Namen (de/en), Ids und Fließtext.</p>';
  var res = search(q);
  var tokens = norm(q).split(/\s+/).filter(Boolean);
  h += '<p class="muted">' + plural(res.length, 'Treffer', 'Treffer') + ' für „' + esc(q) + '“</p>';
  if (!res.length) return h + '<p class="hint">Nichts gefunden. Tipp: kürzere Begriffe oder die englische Id-Form (z. B. <code>sledgehammer</code>).</p>';
  var groups = new Map();
  res.forEach(function (r) { if (!groups.has(r.e.section)) groups.set(r.e.section, []); groups.get(r.e.section).push(r.e); });
  Object.keys(SECTION_LABELS).forEach(function (sec) {
    var list = groups.get(sec); if (!list) return;
    h += '<div class="search-group">' + section(SECTION_LABELS[sec], '<div class="rows">' + list.map(function (e) {
      var tex = (sec === 'items' || sec === 'blocks') ? slotHtml(e.id, 1, { noLink: true }) : '';
      return '<a class="row" href="' + esc(e.href) + '">' + tex + '<div class="row-main"><div class="row-title">' + highlight(e.title, tokens) + '</div><div class="row-sub">' + highlight(e.sub, tokens) + '</div></div></a>';
    }).join('') + '</div>', { count: list.length }) + '</div>';
  });
  return h;
}

/* ------------------------------------------------------------------ */
/* Router, Seitenleiste, Ereignisse                                   */
/* ------------------------------------------------------------------ */
var $main = document.getElementById('main');
var $side = document.getElementById('sidebar');
var $q = document.getElementById('q');
var $meta = document.getElementById('topmeta');
var NAV = [
  { key: 'overview', label: 'Übersicht', href: '#/', count: function () { return arr(D.features).length ? arr(D.features).length + ' Features' : null; } },
  { key: 'items', label: 'Items', count: function () { return arr(D.items).length; } },
  { key: 'blocks', label: 'Blöcke', count: function () { return arr(D.blocks).length; } },
  { key: 'recipes', label: 'Rezepte', count: function () { return arr(D.recipes).length; } },
  { key: 'loot', label: 'Loot-Tabellen', count: function () { return arr(D.lootTables).length; } },
  { key: 'trades', label: 'Handel', count: function () { return arr(D.trades).length; } },
  { key: 'enchantments', label: 'Verzauberungen', count: function () { return arr(D.enchantments).length; } },
  { key: 'tags', label: 'Tags', count: function () { return arr(D.tags).length; } },
  { key: 'config', label: 'Konfiguration', count: function () { return arr(D.config).length; } }
];
function parseHash() {
  var h = location.hash || '';
  if (h.charAt(0) === '#') h = h.slice(1);
  if (h.charAt(0) === '/') h = h.slice(1);
  var i = h.indexOf('/');
  var section = i < 0 ? h : h.slice(0, i);
  var rest = i < 0 ? '' : h.slice(i + 1);
  try { rest = decodeURIComponent(rest); } catch (e) { /* kaputte Kodierung: roh weiterreichen */ }
  return { section: section || 'overview', id: rest };
}
function renderSidebar(active) {
  if (!D) { $side.innerHTML = ''; return; }
  $side.innerHTML = NAV.map(function (n) {
    var c = n.count ? n.count() : null;
    return '<a href="' + esc(n.href || '#/' + n.key) + '" class="' + (n.key === active ? 'active' : '') + '">' + esc(n.label) + (c != null ? '<span class="n">' + esc(c) + '</span>' : '') + '</a>';
  }).join('') + '<div class="sb-note">Erzeugt aus den Daten der Mod: <code>' + esc((D.generatedFrom && D.generatedFrom.generator) || 'wiki/generate.py') + '</code></div>';
}
function renderMeta() {
  if (!D) { $meta.innerHTML = ''; return; }
  var g = isObj(D.generatedFrom) ? D.generatedFrom : {};
  $meta.innerHTML = '<span>' + esc(MOD.version ? 'v' + MOD.version : '') + '</span><span>MC ' + esc(arr(MOD.minecraftLines).join(' / ') || '?') + '</span><span>' + esc(arr(MOD.loaders).join(' + ') || '') + '</span>' + (g.line ? '<span title="Datenstand dieser Wiki-Erzeugung">Daten: ' + esc(g.line) + '</span>' : '');
  document.getElementById('brand').innerHTML = esc(MOD.name || 'SimpleBuilding') + ' <small>Wiki</small>';
}
function render() {
  if (!D) {
    $main.innerHTML = '<div class="box box-danger"><div class="box-title">Keine Daten</div><p><code>wiki/data/simplebuilding.js</code> wurde nicht geladen oder setzt <code>window.WIKI_DATA</code> nicht.</p><p>Erzeugen mit <code>python wiki/generate.py</code> im Repo-Wurzelverzeichnis, dann diese Seite neu laden.</p></div>';
    document.title = 'SimpleBuilding Wiki – keine Daten';
    return;
  }
  var r = parseHash();
  var html = '', title = '', active = r.section;
  try {
    switch (r.section) {
      case 'overview': case '': html = pageOverview(); title = 'Übersicht'; active = 'overview'; break;
      case 'features': html = pageFeature(r.id); title = (IX.features.get(r.id) || {}).title || 'Feature'; active = 'overview'; break;
      case 'items': html = r.id ? entryPage(r.id, 'items') : pageItems(); title = r.id ? displayName(r.id) : 'Items'; break;
      case 'blocks': html = r.id ? entryPage(r.id, 'blocks') : pageBlocks(); title = r.id ? displayName(r.id) : 'Blöcke'; break;
      case 'recipes': html = r.id ? pageRecipe(r.id) : pageRecipes(); title = r.id ? 'Rezept ' + r.id : 'Rezepte'; break;
      case 'loot': html = r.id ? pageLootOne(r.id) : pageLoot(); title = r.id ? 'Loot ' + r.id : 'Loot-Tabellen'; break;
      case 'trades': html = r.id ? pageTrade(r.id) : pageTrades(); title = r.id ? 'Handel ' + r.id : 'Handel'; break;
      case 'enchantments': html = r.id ? pageEnchantment(r.id) : pageEnchantments(); title = r.id ? displayName(r.id) : 'Verzauberungen'; break;
      case 'tags': html = r.id ? pageTag(r.id) : pageTags(); title = r.id ? 'Tag ' + r.id : 'Tags'; break;
      case 'config': html = pageConfig(r.id); title = 'Konfiguration'; break;
      case 'search': html = pageSearch(r.id); title = 'Suche'; active = ''; if (document.activeElement !== $q) $q.value = r.id || ''; break;
      default: html = notFound('Bereich', r.section); title = 'Nicht gefunden'; active = '';
    }
  } catch (err) {
    html = '<div class="box box-danger"><div class="box-title">Fehler beim Aufbau der Seite</div><p>' + esc(err && err.message ? err.message : String(err)) + '</p><p><a href="#/">Zur Übersicht</a></p></div>';
    title = 'Fehler';
    if (window.console) console.error(err);
  }
  if (!html) html = '<div class="notfound">Diese Seite ist leer – <a href="#/">zur Übersicht</a>.</div>';
  $main.innerHTML = html;
  renderSidebar(active);
  document.title = (title ? title + ' – ' : '') + (MOD.name || 'SimpleBuilding') + ' Wiki';
  if (r.section === 'config' && r.id) {
    var row = document.getElementById('cfg-' + r.id);
    if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
  } else if (r.section !== 'search') {
    window.scrollTo(0, 0);
  }
}

/* Bildfehler: Textur fehlt -> Text-Kachel */
$main.addEventListener('error', function (ev) {
  var img = ev.target;
  if (!img || img.tagName !== 'IMG') return;
  var name = img.getAttribute('data-name') || img.getAttribute('alt') || '?';
  var parent = img.parentNode;
  if (parent && parent.classList && parent.classList.contains('hero-tex')) { parent.innerHTML = 'Textur nicht<br>gefunden'; return; }
  var span = document.createElement('span'); span.className = 'slot-text'; span.textContent = name;
  if (parent && parent.classList) parent.classList.add('slot-plain');
  img.replaceWith(span);
}, true);

/* Listenfilter */
$main.addEventListener('input', function (ev) {
  var inp = ev.target;
  if (!inp || !inp.hasAttribute || !inp.hasAttribute('data-filter')) return;
  var q = norm(inp.value).trim();
  var any = false;
  $main.querySelectorAll('[data-filter-target] > .row').forEach(function (row) {
    var s = row.getAttribute('data-s') || norm(row.textContent);
    var hit = !q || s.indexOf(q) >= 0;
    row.classList.toggle('hidden', !hit);
    if (hit) any = true;
  });
  var empty = $main.querySelector('[data-filter-empty]');
  if (empty) empty.hidden = any;
});

/* Suche */
var searchTimer = null;
$q.addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    var q = $q.value.trim();
    var cur = parseHash();
    if (q) { var target = '#/search/' + encodeURIComponent(q); if (location.hash !== target) location.replace(target); }
    else if (cur.section === 'search') location.replace('#/');
  }, 120);
});
$q.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') { $q.value = ''; $q.blur(); if (parseHash().section === 'search') location.replace('#/'); }
  if (ev.key === 'Enter') { var first = $main.querySelector('.row'); if (first && first.href) { location.hash = first.getAttribute('href'); } }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key === '/' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
    var t = ev.target; var tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
    ev.preventDefault(); $q.focus(); $q.select();
  }
});

window.addEventListener('hashchange', render);
buildIndex();
buildSearch();
renderMeta();
render();
})();
</script>
