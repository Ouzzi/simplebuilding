<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleBuilding Wiki</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #646b73;
  --border: #d8dbe0;
  --accent: #2c6e4f;
  --accent-soft: #e4f1e9;
  --warn-bg: #fff5e1;
  --warn-border: #dfae52;
  --warn-text: #5f4100;
  --danger-bg: #fdeaea;
  --danger-border: #dc9a9a;
  --danger-text: #7a1f1f;
  --slot-bg: #e9e8e3;
  --slot-border: #c6c3bb;
  --code-bg: #ebebe8;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141618;
    --panel: #1d2023;
    --text: #e4e6e8;
    --muted: #9ba3ab;
    --border: #2e343a;
    --accent: #7cc39a;
    --accent-soft: #1e2e26;
    --warn-bg: #362b12;
    --warn-border: #8a6a2a;
    --warn-text: #f1d99f;
    --danger-bg: #3a1c1c;
    --danger-border: #8a3d3d;
    --danger-text: #f3b9b9;
    --slot-bg: #282c31;
    --slot-border: #3d434a;
    --code-bg: #282c31;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { font-size: 15px; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, kbd { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: .86em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; }
h1 { font-size: 1.6rem; margin: 0 0 .3rem; line-height: 1.25; }
h2 { font-size: 1.15rem; margin: 0 0 .8rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
h3 { font-size: 1rem; margin: 1.2rem 0 .5rem; color: var(--muted); font-weight: 600; }
p { margin: .4rem 0 .8rem; }
ul { margin: .3rem 0 .6rem; padding-left: 1.3rem; }
li { margin: .15rem 0; }
.muted { color: var(--muted); }
.tiny { font-size: .8rem; }
.lead { font-size: 1.05rem; }

/* Kopf */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem; padding: .55rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; color: var(--text); white-space: nowrap; font-size: 1.05rem; }
.brand:hover { text-decoration: none; }
.brand small { color: var(--muted); font-weight: 400; margin-left: .4rem; font-size: .8rem; }
.search { flex: 1; max-width: 560px; position: relative; }
.search input { width: 100%; padding: .45rem .75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search kbd { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .72rem; pointer-events: none; }
.topmeta { margin-left: auto; color: var(--muted); font-size: .82rem; display: flex; gap: .7rem; flex-wrap: wrap; white-space: nowrap; }
.langsel { flex: none; padding: .3rem .45rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; font-size: .82rem; cursor: pointer; }
.langsel:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* Layout */
.layout { display: flex; align-items: flex-start; }
.sidebar { width: 230px; flex: none; position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; padding: .9rem .7rem; border-right: 1px solid var(--border); background: var(--panel); }
.sidebar a { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .35rem .6rem; border-radius: 6px; color: var(--text); }
.sidebar a:hover { background: var(--bg); text-decoration: none; }
.sidebar a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.sidebar a .n { color: var(--muted); font-size: .78rem; font-weight: 400; }
.sidebar .sb-note { margin-top: 1rem; padding: .6rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--border); }
main { flex: 1; min-width: 0; padding: 1.5rem 2rem 4rem; max-width: 1120px; }
@media (max-width: 820px) {
  .layout { flex-direction: column; align-items: stretch; }
  main { width: 100%; max-width: 100%; }
  .sidebar { position: static; height: auto; width: 100%; display: flex; flex-wrap: wrap; gap: .15rem; border-right: 0; border-bottom: 1px solid var(--border); padding: .5rem; }
  .sidebar a { padding: .3rem .55rem; }
  .sidebar a .n { display: none; }
  .sidebar .sb-note { display: none; }
  main { padding: 1rem; }
  .topbar { flex-wrap: wrap; gap: .5rem; }
  .topmeta { margin-left: 0; }
}

/* Bausteine */
.section { margin-top: 2rem; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.card.highlight { outline: 2px solid var(--accent); }
.badge { display: inline-block; font-size: .72rem; line-height: 1.5; padding: 0 .55em; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); vertical-align: middle; white-space: nowrap; background: var(--panel); }
.badge-ok { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge-warn { border-color: var(--warn-border); color: var(--warn-text); background: var(--warn-bg); }
.badge-danger { border-color: var(--danger-border); color: var(--danger-text); background: var(--danger-bg); font-weight: 700; }
.badges { display: inline-flex; gap: .3rem; flex-wrap: wrap; vertical-align: middle; }
.box { border-left: 4px solid var(--border); padding: .6rem .9rem; background: var(--panel); border-radius: 0 6px 6px 0; margin: .8rem 0; }
.box-title { font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .2rem; }
.box-controls { border-left-color: var(--accent); }
.box-caveat { border-left-color: var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
.box-danger { border-left-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
.box-info { border-left-color: var(--accent); }
.box ul { margin-bottom: .2rem; }
.hint { color: var(--muted); font-style: italic; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.table th { color: var(--muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
.table tr.highlight td { background: var(--accent-soft); }
.table td.num, .table th.num { text-align: right; white-space: nowrap; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1.2rem; margin: .5rem 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.src { font-size: .78rem; color: var(--muted); margin-top: .6rem; }
.src code { font-size: .95em; }
.ref { display: inline-flex; align-items: baseline; gap: .35em; max-width: 100%; }
.ref .ref-id { color: var(--muted); background: transparent; padding: 0; font-size: .78em; }
.ref-ext { color: var(--text); }
.ref-ext .ref-name { border-bottom: 1px dotted var(--muted); }
.reflist { display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
.tile-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .6rem; }
.tile { display: block; padding: .8rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
.tile:hover { text-decoration: none; border-color: var(--accent); }
.tile .big { font-size: 1.5rem; font-weight: 700; }
.tile .lbl { color: var(--muted); font-size: .85rem; }

/* Slots und Rezepte */
.slot { display: inline-flex; align-items: center; justify-content: center; position: relative; width: 56px; height: 56px; background: var(--slot-bg); border: 1px solid var(--slot-border); border-radius: 4px; color: var(--text); overflow: hidden; flex: none; text-decoration: none; }
a.slot:hover { border-color: var(--accent); text-decoration: none; }
.slot img { width: 40px; height: 40px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.slot-text { font-size: 9.5px; line-height: 1.12; text-align: center; padding: 2px 3px; word-break: break-word; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.slot-tag { border-style: dashed; }
.slot-tag .slot-text { color: var(--accent); }
.slot-tag .hash { font-weight: 700; }
.slot-empty { background: transparent; border-style: dotted; opacity: .55; }
.slot-count { position: absolute; right: 1px; bottom: 0; font-size: 11px; font-weight: 700; background: var(--panel); padding: 0 3px; border-radius: 3px 0 0 0; line-height: 1.3; }
.slot-alt { position: absolute; left: 2px; top: 0; font-size: 9px; color: var(--muted); }
.slot-hash { position: absolute; right: 2px; top: 0; font-size: 9px; font-weight: 700; color: var(--accent); }
.slot-result { width: 64px; height: 64px; }
.slot-result img { width: 48px; height: 48px; }
.grid { display: grid; gap: 4px; flex: none; }
.recipe { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .8rem 1rem; margin-bottom: .9rem; }
.recipe-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem; font-size: .85rem; }
.recipe-body { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.arrow { font-size: 1.6rem; color: var(--muted); line-height: 1; padding: 0 .2rem; }
.slotcol { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.slot-label { font-size: .68rem; color: var(--muted); white-space: nowrap; }
.slotrow { display: inline-flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.plus { color: var(--muted); align-self: center; }
.recipe-meta { font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: .15rem; }
.recipe-foot { margin-top: .6rem; font-size: .82rem; color: var(--muted); }
.recipe-foot .reflist { margin-top: .2rem; }

/* Listen */
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .8rem; }
.listhead input { padding: .4rem .7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; min-width: 240px; }
.rows { display: flex; flex-direction: column; gap: 2px; }
.row { display: flex; align-items: center; gap: .8rem; padding: .35rem .6rem; border-radius: 6px; color: var(--text); border: 1px solid transparent; }
.row:hover { background: var(--panel); border-color: var(--border); text-decoration: none; }
.row .slot { width: 40px; height: 40px; }
.row .slot img { width: 28px; height: 28px; }
.row .slot-text { font-size: 8px; -webkit-line-clamp: 3; }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 600; }
.row-title .en { font-weight: 400; color: var(--muted); }
.row-sub { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-right { flex: none; display: flex; gap: .3rem; flex-wrap: wrap; justify-content: flex-end; }
.row.hidden { display: none; }

/* Detailseite */
.hero { display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: .5rem; }
.hero > div { min-width: 0; }
.hero h1, .idline code, .crumbs, .row-sub code { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
main { overflow-wrap: anywhere; }
.hero-tex { width: 128px; height: 128px; background: var(--slot-bg); border: 1px solid var(--slot-border); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; text-align: center; color: var(--muted); font-size: .8rem; padding: .4rem; }
.hero-tex img { width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }

/* 3D-Ansicht eines Blocks: drei Flaechen, per CSS-Transform zum Wuerfel
   gestellt - kein WebGL und kein Build noetig. Die Abstufung der Helligkeit
   ahmt die Beleuchtung im Spiel nach, damit die Kanten sichtbar bleiben,
   wenn alle drei Flaechen dieselbe Textur tragen. */
/* Orthografisch wie im Inventar: 45 Grad gedreht, 30 Grad von oben. Bewusst mit
   reinen 2D-Matrizen statt rotateX/rotateY - dieselbe Projektion, aber ohne
   3D-Kontext, der in manchen Renderern (Software-Compositing, Screenshots) platt
   gezeichnet wird. --cs ist die Kantenlaenge; der Wuerfel ist projiziert
   1,414 * cs breit und 1,573 * cs hoch (Oberseite 0,707, Seiten 0,866). */
.cube { --cs: 60px; width: calc(var(--cs) * 1.4142); height: calc(var(--cs) * 1.5731); position: relative; flex: none; display: block; }
.cube span { position: absolute; left: 0; top: 0; width: var(--cs); height: var(--cs); transform-origin: 0 0; background-size: 100% 100%; background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; }
.cube .f-top { transform: translate(calc(var(--cs) * .7071), 0) matrix(.7071, .3536, -.7071, .3536, 0, 0); }
.cube .f-front { transform: translate(0, calc(var(--cs) * .3536)) matrix(.7071, .3536, 0, .866, 0, 0); filter: brightness(.8); }
.cube .f-side { transform: translate(calc(var(--cs) * .7071), calc(var(--cs) * .7071)) matrix(.7071, -.3536, 0, .866, 0, 0); filter: brightness(.62); }
.slot .cube { --cs: 26px; }
.slot-result .cube { --cs: 30px; }
.row .slot .cube, .iw-entry .slot .cube, .rc .slot .cube { --cs: 18px; }
.rc .slot-result .cube { --cs: 21px; }
.tree-node > summary .slot .cube { --cs: 15px; }
.hero .en { color: var(--muted); font-size: 1.05rem; }
.hero .idline { margin: .4rem 0; }
.hero .idline code { font-size: .9rem; }
.pool-bar { height: 6px; background: var(--slot-bg); border-radius: 3px; overflow: hidden; min-width: 80px; }
.pool-bar i { display: block; height: 100%; background: var(--accent); }
.crumbs { font-size: .82rem; color: var(--muted); margin-bottom: .6rem; }
.crumbs a { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); }
.search-group { margin-top: 1.4rem; }
mark { background: var(--warn-bg); color: inherit; padding: 0 .1em; border-radius: 2px; }
.notfound { padding: 2rem; text-align: center; color: var(--muted); }

/* Leere Abschnitte gesammelt am Seitenende */
.empty-sections { margin-top: 1.6rem; border-top: 1px dashed var(--border); padding-top: .4rem; }
.section-empty { margin: .3rem 0; }
.section-empty h2 { font-size: .95rem; color: var(--muted); border: 0; margin: .5rem 0 .1rem; padding: 0; }
.section-empty .hint { margin: 0; }
.tree-hint { margin: .2rem 0 .6rem; }

/* Umwandlung in der Welt */
.iw-entry { flex-wrap: wrap; align-items: center; cursor: default; }
.iw-slots { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.iw-tool { display: inline-flex; align-items: center; padding: 0 .3rem; border-left: 1px dashed var(--border); border-right: 1px dashed var(--border); margin: 0 .2rem; }
.iw-entry .slot { width: 40px; height: 40px; }
.iw-entry .slot img { width: 28px; height: 28px; }
.iw-meta { font-size: .82rem; color: var(--muted); }
.slot-tool { opacity: .9; }

/* Kontextmenue */
.ctxmenu { position: fixed; z-index: 1000; min-width: 170px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25); padding: .25rem 0; font-size: .9rem; }
.ctxmenu .ctx-title { padding: .3rem .8rem; font-size: .75rem; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: .2rem; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctxmenu a { display: block; padding: .35rem .8rem; color: var(--text); }
.ctxmenu a:hover, .ctxmenu a:focus { background: var(--slot-bg); text-decoration: none; outline: none; }

/* Rezeptbaum */
.tree-controls { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.tree-controls input, .tree-controls select { padding: .25rem .4rem; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
.tree-controls input { width: 5.5rem; min-width: 0; }
.tree-node { margin: .15rem 0 .15rem 0; }
.tree-node > summary { display: flex; align-items: center; gap: .45rem; list-style: none; padding: .15rem .3rem; border-radius: 6px; color: var(--text); }
.tree-node > summary::-webkit-details-marker { display: none; }
.tree-node > summary::before { content: '▸'; color: var(--muted); width: .8rem; flex: none; }
.tree-node[open] > summary::before { content: '▾'; }
.tree-node > summary:hover { background: var(--panel); }
.tree-node > summary .slot { width: 32px; height: 32px; }
.tree-node > summary .slot img { width: 24px; height: 24px; }
.tree-node > summary .slot-text { font-size: 7px; -webkit-line-clamp: 3; }
.tree-need { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; min-width: 2.5rem; text-align: right; }
.tree-body { margin-left: 1.1rem; padding-left: .7rem; border-left: 1px solid var(--border); }
.tree-way { margin: .3rem 0 .5rem; }
.tree-way-head { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; margin: .2rem 0; }
.tree-members { margin: .2rem 0; }

/* Einklappbare Abschnitte (Item-Seite) */
details.fold > summary { list-style: none; cursor: pointer; color: var(--text); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { display: flex; align-items: center; gap: .45rem; }
details.fold > summary h2::before { content: '▾'; color: var(--muted); font-size: .85em; width: .9rem; flex: none; transition: transform .12s; }
details.fold:not([open]) > summary h2::before { transform: rotate(-90deg); }
details.fold:not([open]) > summary h2 { margin-bottom: 0; }
details.fold > summary:hover h2 { color: var(--accent); }
details.fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Kernmerkmal der aufgewerteten Maschinen */
.keyfeat { display: flex; gap: .8rem; align-items: flex-start; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: .7rem .9rem; margin: .6rem 0 .4rem; }
.keyfeat-num { flex: none; font-size: 1.7rem; font-weight: 800; color: var(--accent); line-height: 1; min-width: 3.2rem; text-align: center; font-variant-numeric: tabular-nums; }
.keyfeat-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 700; }
.keyfeat p { margin: .15rem 0; }
.keyfeat .src { margin-top: .3rem; }

/* Alle Rezepte */
.ar-filters { display: flex; flex-direction: column; gap: .5rem; margin: .6rem 0 1rem; padding: .7rem .8rem; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
.ar-frow { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.ar-flabel { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-width: 5.2rem; }
.chip { font: inherit; font-size: .82rem; padding: .18rem .6rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
.chip .n { opacity: .7; font-size: .9em; margin-left: .25rem; }
.ar-filters input[type=search] { flex: 1 1 240px; min-width: 0; padding: .4rem .7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.ar-filters label { font-size: .85rem; display: inline-flex; gap: .35rem; align-items: center; cursor: pointer; }
.ar-status { font-size: .85rem; color: var(--muted); margin: .2rem 0 .6rem; }
.ar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .7rem; align-items: start; }
.rc { --slot: 40px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .7rem; min-width: 0; }
.rc .slot { width: 40px; height: 40px; }
.rc .slot img { width: 28px; height: 28px; }
.rc .slot-text { font-size: 8px; -webkit-line-clamp: 3; }
.rc .slot-result { width: 48px; height: 48px; }
.rc .slot-result img { width: 34px; height: 34px; }
.rc .recipe-body { gap: .6rem; }
.rc .grid { gap: 3px; }
.rc-head { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; font-size: .8rem; margin-bottom: .5rem; }
.rc-head .rc-name { font-weight: 600; font-size: .92rem; margin-right: auto; min-width: 0; }
.rc-foot { display: flex; gap: .7rem; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-top: .45rem; }
.rc-variants { display: flex; flex-wrap: wrap; gap: 3px; margin-top: .45rem; }
.rc-variants button { padding: 0; border: 1px solid transparent; background: none; border-radius: 4px; cursor: pointer; line-height: 0; }
.rc-variants button[aria-pressed="true"] { border-color: var(--accent); }
.rc-variants .slot { width: 26px; height: 26px; pointer-events: none; }
.rc-variants .slot img { width: 20px; height: 20px; }
.rc-variants .slot .cube { --cs: 12px; }
.rc-variants .slot-text { display: none; }

.mk-pager button:not(.chip) { font: inherit; width: 2rem; height: 2rem; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
.mk-pager button:not(.chip):hover:not(:disabled) { border-color: var(--accent); }
.mk-pager button:disabled { opacity: .4; cursor: default; }
.mk-pager .chip { font-size: .78rem; }
.mk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .7rem; }

  .ar-flabel { min-width: 0; width: 100%; }
  .keyfeat { flex-direction: column; gap: .3rem; }
  .mk-pager { margin-left: 0; }

/* ------------------------------------------------------------------ */
/* Grundhelfer                                                        */
/* ------------------------------------------------------------------ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function arr(x) { return Array.isArray(x) ? x : (x == null ? [] : [x]); }
function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
function strs(list) { return arr(list).filter(function (x) { return x != null && String(x).trim() !== ''; }).map(String); }
function num(x, d) { var n = Number(x); return isFinite(n) ? n : d; }
function norm(s) {
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ß/g, 'ss');
}
function prettyFromId(id) {
  var p = String(id || '').replace(/^#/, '').split(':').pop().split('/').pop();
  return p.split(/[_\-\s]+/).filter(Boolean).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ') || String(id || '?');
}
function nsOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? '' : s.slice(0, i); }
function pathOf(id) { var s = String(id || '').replace(/^#/, ''); var i = s.indexOf(':'); return i < 0 ? s : s.slice(i + 1); }

/* Die Zahlen liest generate.py aus der Tick-Methode der Block-Entity (machine.source,
   Datei:Zeile) und den Vanilla-Trichtertakt aus dem Datagen-Export. Gerechnet wird hier
   nur, was der Code vorgibt:
   - Ofen: Vanillas serverTick zaehlt +1, die Mod danach +extraTicks, aber nie ueber
     total-1 hinaus; fertig wird es erst, wenn Vanillas eigener +1 den Wert total
     erreicht. Also ceil((total-1)/(1+extra)) Ticks bis zur Kappe, plus einer.
   - Standarddauer: SmeltingRecipe 200, SmokingRecipe und BlastingRecipe 100
     (cookingMapCodec in MC 26.2; in 1.21.11 stehen dieselben Werte in den Rezepten).
   - Trichter: nach jedem erfolgreichen Schritt setzt die Mod die Abklingzeit auf
     cooldownTicks, Vanilla auf MOVE_ITEM_SPEED; ein Schritt bewegt ein Item. */
var COOK_TYPE_OF_VANILLA = { 'minecraft:furnace': 'minecraft:smelting', 'minecraft:smoker': 'minecraft:smoking', 'minecraft:blast_furnace': 'minecraft:blasting' };
function machineFeature(id) {
  var b = IX.blocks.get(id), m = b && b.machine;

  var factor = null, lines = [], srcs = [m.source];
  if (m.kind === 'cooking' && m.cookingTicksPerTick > 1) {
    factor = m.cookingTicksPerTick;
    lines.push(T('machineCooking', fmtNum(factor), vname, m.cookingTicksPerTick));
    var total = COOK_DEFAULT[COOK_TYPE_OF_VANILLA[m.vanilla]];
    if (total) {
      var ticks = Math.ceil((total - 1) / factor) + 1;
      lines.push(T('machineCookingExample', total, vname, ticks, fmtNum(ticks / 20), fmtNum(total / 20)));
    }
    srcs.push('AbstractFurnaceBlockEntity.serverTick');
  } else if (m.kind === 'hopper' && m.cooldownTicks > 0 && m.vanillaCooldownTicks > 0) {
    factor = m.vanillaCooldownTicks / m.cooldownTicks;
    lines.push(T(m.cooldownTicks === 1 ? 'machineHopperOne' : 'machineHopper', fmtNum(factor), vname, m.cooldownTicks, m.vanillaCooldownTicks));
    lines.push(T('machineHopperExample', fmtNum(20 / m.cooldownTicks), fmtNum(20 / m.vanillaCooldownTicks)));
    srcs.push(m.vanillaCooldownSource);
  }
  if (!lines.length) return '';
  return '<div class="keyfeat"><div class="keyfeat-num">' + (factor ? esc(fmtNum(factor)) + '×' : '') + '</div><div><div class="keyfeat-title">' + esc(T('machineTitle')) + '</div>' +
    lines.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') +
    '<div class="src">' + esc(T('machineSource')) + ' ' + srcs.filter(Boolean).map(function (s) { return '<code>' + esc(s) + '</code>'; }).join(', ') + '</div></div></div>';
}

function stationOfType(t) {

  if (p === 'smelting' || p === 'blasting' || p === 'smoking') return p;

}
function stationLabel(st) { return T('st.' + st); }
var AR_STORE = 'simplebuilding-wiki-allrecipes';
var RV = (function () {
  var d = { st: 'all', src: 'all', line: 'all', q: '', merge: true };
  try {
    var v = JSON.parse(window.localStorage.getItem(AR_STORE) || '{}');
    ['st', 'src', 'line'].forEach(function (k) { if (typeof v[k] === 'string') d[k] = v[k]; });
    if (v.merge === false) d.merge = false;

})();
function saveRV() { try { window.localStorage.setItem(AR_STORE, JSON.stringify({ st: RV.st, src: RV.src, line: RV.line, merge: RV.merge })); } catch (err) { /* nur diese Sitzung */ } }
var AR = { mod: null, van: {}, shown: 60, groups: [] };
function arEntry(src, st, lines, r, e) {

}
function arModEntries() {

  var out = [];
  arr(D.recipes).concat(arr(D.recipesOtherLines)).filter(isObj).forEach(function (r) { out.push(arEntry('mod', stationOfType(r.type), arr(r.lines).length ? r.lines : [gl], r, null)); });
  IW.entries.forEach(function (e) { out.push(arEntry('mod', 'inworld', arr(e.lines).length ? e.lines : [gl], null, e)); });
  return (AR.mod = out);
}
/* Dasselbe Vanilla-Rezept in beiden Linien wird eine Karte. 26.2 laesst die
   Standard-Garzeit weg, 1.21.11 schreibt sie aus - fuer den Vergleich gleichgezogen. */
/* Die Reihenfolge der Alternativen einer Zutat ist bedeutungslos (1.21.11 sortiert sie, 26.2 nicht). */
function sortAlts(v) {
  if (Array.isArray(v)) return v.length && v.every(function (x) { return typeof x === 'string'; }) ? v.slice().sort() : v.map(sortAlts);
  if (isObj(v)) { var o = {}; Object.keys(v).sort().forEach(function (k) { o[k] = sortAlts(v[k]); }); return o; }
  return v;
}
function vanSig(r) {
  var c = {};
  Object.keys(r).forEach(function (k) { if (k !== 'vanilla' && k !== 'storedCookingtime') c[k] = k === 'pattern' ? r[k] : sortAlts(r[k]); });
  if (c.cookingtime == null && COOK_DEFAULT[r.type] != null) c.cookingtime = COOK_DEFAULT[r.type];
  return Object.keys(c).sort().map(function (k) { return JSON.stringify(k) + ':' + JSON.stringify(c[k]); }).join(',');

function arVanillaEntries(lines) {

  if (AR.van[key]) return AR.van[key];
  var map = new Map(), out = [];
  lines.forEach(function (line) {
    var v = VR.loaded[line]; if (!v) return;
    v.byResult.forEach(function (list) {
      list.forEach(function (r) {
        var sig = vanSig(r), ex = map.get(sig);

        var en = arEntry('vanilla', stationOfType(r.type), [line], r, null);

}
function arWantedLines() { return RV.line === 'all' ? mcLines() : [RV.line]; }
function arCandidates() {

  if (RV.src !== 'mod') list = list.concat(arVanillaEntries(arWantedLines().filter(function (l) { return VR.loaded[l]; })));
  return list;
}

function arEnsureVanilla(done) {

/* Varianten: 16 Farben, die Holzarten. Die Karte gilt als Variante einer anderen,

var VARIANT_TOKENS = ['light_blue', 'light_gray', 'white', 'orange', 'magenta', 'yellow', 'lime', 'pink', 'gray', 'cyan', 'purple', 'blue', 'brown', 'green', 'red', 'black',
  'dark_oak', 'pale_oak', 'oak', 'spruce', 'birch', 'jungle', 'acacia', 'mangrove', 'cherry', 'bamboo', 'crimson', 'warped'];

var IW = { kinds: new Map(), entries: [], byOutput: new Map(), byInput: new Map(), byTool: new Map() };

/* ------------------------------------------------------------------ */
/* Vanilla-Rezepte je Minecraft-Linie (fuer den Rezeptbaum)           */
/* ------------------------------------------------------------------ */
/* generate.py zieht sie aus dem Client-Jar der Linie nach
   data/vanilla-<linie>.js - nur Rezeptdaten und die Item-Tags, die sie
   nennen. Geladen wird erst, wenn der Baum sie braucht; ein Script-Element statt
   fetch(), damit es auch per file:// geht. */
var MC_LINE_STORE = 'simplebuilding-wiki-mcline';
var VR = { loaded: {}, failed: {}, waiting: {} };
function mcLines() { var l = D && isObj(D.vanillaRecipes) ? arr(D.vanillaRecipes.lines) : []; return l.length ? l : arr(MOD.minecraftLines); }
function currentMcLine() {
  var lines = mcLines(), stored = null;
  try { stored = window.localStorage ? window.localStorage.getItem(MC_LINE_STORE) : null; } catch (err) { /* ohne Storage: Standard */ }
  if (lines.indexOf(stored) >= 0) return stored;
  var g = D && isObj(D.generatedFrom) ? D.generatedFrom.line : null;
  return lines.indexOf(g) >= 0 ? g : lines[0];
}
function mcId(x) {
  x = String(x || '');
  if (x.charAt(0) === '#') return x.indexOf(':') < 0 ? '#minecraft:' + x.slice(1) : x;
  return x.indexOf(':') < 0 ? 'minecraft:' + x : x;
}
function normVanilla(raw, line) {
  var out = { line: line, byResult: new Map(), tags: new Map(), count: 0 };
  function ids(v) { return arr(v).map(mcId); }
  Object.keys(raw.tags || {}).forEach(function (k) { out.tags.set(mcId(k), ids(raw.tags[k])); });
  arr(raw.recipes).forEach(function (r) {
    if (!isObj(r) || !isObj(r.result)) return;
    var n = { id: mcId(r.id), type: mcId(r.type), group: r.group, result: { id: mcId(r.result.id), count: num(r.result.count, 1) }, vanilla: true };
    if (r.pattern) { n.pattern = r.pattern; n.key = {}; Object.keys(r.key || {}).forEach(function (c) { n.key[c] = ids(r.key[c]); }); }
    if (r.ingredientGroups) n.ingredientGroups = r.ingredientGroups.map(ids);
    if (r.slots) { n.slots = {}; Object.keys(r.slots).forEach(function (s) { n.slots[s] = ids(r.slots[s]); }); }
    ['cookingtime', 'storedCookingtime', 'experience', 'count', 'addition_count'].forEach(function (k) { if (r[k] != null) n[k] = r[k]; });
    push(out.byResult, n.result.id, n);
    out.count++;
  });
  return out;
}
function loadVanilla(line, done) {
  if (VR.loaded[line] || VR.failed[line]) { done(VR.loaded[line] || null); return; }
  var pre = window.VANILLA_RECIPES && window.VANILLA_RECIPES[line];
  if (pre) { VR.loaded[line] = normVanilla(pre, line); done(VR.loaded[line]); return; }
  if (VR.waiting[line]) { VR.waiting[line].push(done); return; }
  VR.waiting[line] = [done];
  var s = document.createElement('script');
  s.src = 'data/vanilla-' + encodeURIComponent(line) + '.js';
  function finish() {
    var raw = window.VANILLA_RECIPES && window.VANILLA_RECIPES[line];
    if (raw) VR.loaded[line] = normVanilla(raw, line); else VR.failed[line] = true;
    var cbs = VR.waiting[line] || []; delete VR.waiting[line];
    cbs.forEach(function (cb) { cb(VR.loaded[line] || null); });
  }
  s.onload = finish; s.onerror = finish;
  document.head.appendChild(s);
}

/* ------------------------------------------------------------------ */
/* Rezeptbaum: "Wie bekomme ich X?"                                   */
/* ------------------------------------------------------------------ */
var TREE = { id: null, amount: 1, v: null };
var TREE_MAX_DEPTH = 12;
function modRecipesFor(id) { var out = []; IX.recipes.forEach(function (r) { var s = normStack(r.result); if (s && s.id === id) out.push(r); }); return out; }
function tradesGiving(id) { var out = []; IX.trades.forEach(function (t) { var g = normStack(t.gives); if (g && g.id === id) out.push(t); }); return out; }
function tagMembers(ref) {
  var seen = {}, out = [];
  function walk(r) {
    if (seen[r]) return; seen[r] = true;
    var t = resolveTag(r, 'item'), vals = t ? arr(t.values).map(tagValueId) : (TREE.v && TREE.v.tags.get(mcId(r))) || [];
    vals.forEach(function (v) { if (!v) return; if (v.charAt(0) === '#') walk(v); else if (out.indexOf(v) < 0) out.push(v); });
  }
  walk(ref);
  return out;
}
/* Stellvertreter einer Variantengruppe ("irgendwelche Bretter"): lieber Eiche,
   sonst das erste Mitglied. */
function representative(members) {
  for (var i = 0; i < members.length; i++) if (/:oak_/.test(members[i])) return members[i];
  return members[0];
}
function waysToGet(id) {
  var ways = [];
  modRecipesFor(id).forEach(function (r) { ways.push({ t: 'recipe', r: r }); });
  if (TREE.v) arr(TREE.v.byResult.get(id)).forEach(function (r) { ways.push({ t: 'recipe', r: r }); });
  arr(IW.byOutput.get(id)).forEach(function (e) { ways.push({ t: 'inworld', e: e }); });
  /* Der eigene Block-Drop ("abbauen gibt sich selbst") hilft beim Planen nicht. */
  arr(IX.dropsOf.get(id)).forEach(function (lid) { if (IX.lootOfBlock.get(id) !== lid) ways.push({ t: 'loot', l: IX.loot.get(lid) }); });
  tradesGiving(id).forEach(function (tr) { ways.push({ t: 'trade', tr: tr }); });
  return ways;
}
/* Wie ingredientCounts, aber auch fuer Steinsaege und Umfaerben (transmute):
   deren Zutaten liegen in slots, nicht in einer Zutatenliste. */
function treeIngredients(r) {
  if (recipeKind(r.type) === 'generic' && isObj(r.slots)) return Object.keys(r.slots).map(function (s) { return { ref: arr(r.slots[s]), n: 1 }; }).filter(function (x) { return x.ref.length; });
  return ingredientCounts(r);
}
function ceilDiv(a, b) { return Math.ceil(a / Math.max(1, b)); }
/* Ein Knoten: ein Item (oder eine Tag-Gruppe) mit der benoetigten Menge.
   Kinder werden erst beim Aufklappen gebaut - sonst liefe der Baum ueber
   Vanilla-Rezepte schnell in die Tausende. */
function treeNode(ref, need, path, open, role) {
  var alts = arr(ref).filter(Boolean);
  var first = alts[0];
  var label, members = null;
  if (alts.length > 1) { members = alts; label = T('treeAnyOf', displayName(representative(alts)), alts.length); }
  else if (first && first.charAt(0) === '#') { members = tagMembers(first); label = T('treeAnyTag', first, members.length); }
  else label = displayName(first);
  var h = '<details class="tree-node"' + (open ? ' open' : '') + ' data-ref="' + esc(alts.join('|')) + '" data-need="' + need + '" data-path="' + esc(path.join('|')) + '">';
  h += '<summary>' + slotHtml(alts, 1, { noLink: true }) + '<span class="tree-need">' + need + '×</span> <span class="tree-name">' + esc(label) + '</span>' + (role ? ' <span class="badge">' + esc(role) + '</span>' : '') + (first && first.charAt(0) !== '#' && alts.length === 1 && hrefFor(first) ? ' <a class="tiny" href="' + esc(hrefFor(first)) + '">' + esc(T('treeOpenPage')) + '</a>' : '') + '</summary>';
  h += '<div class="tree-body">' + (open ? treeChildren(alts, need, path) : '') + '</div></details>';
  return h;
}
function treeChildren(alts, need, path) {
  var target = alts[0];
  var h = '';
  if (alts.length > 1 || (target && target.charAt(0) === '#')) {
    var members = alts.length > 1 ? alts : tagMembers(target);
    if (!members.length) return '<p class="hint tiny">' + esc(T('treeTagUnknown')) + '</p>';
    h += '<div class="tree-members reflist">' + members.slice(0, 40).map(function (m) { return refLink(m, { noId: true }); }).join('') + (members.length > 40 ? ' …' : '') + '</div>';
    var rep = representative(members);
    h += '<p class="tiny muted">' + esc(T('treeVariantMerged', displayName(rep))) + '</p>';
    return h + treeNode(rep, need, path, false);
  }
  if (path.indexOf(target) >= 0) return '<p class="hint tiny">' + esc(T('treeCycle')) + '</p>';
  if (path.length >= TREE_MAX_DEPTH) return '<p class="hint tiny">' + esc(T('treeTooDeep')) + '</p>';
  var ways = waysToGet(target);
  if (!ways.length) return '<p class="hint tiny">' + esc(isVanilla(target) ? T('treeBaseVanilla') : T('treeBaseMod')) + '</p>';
  var next = path.concat([target]);
  ways.forEach(function (w, i) { h += treeWay(w, need, next, i === 0 && ways.length === 1); });
  return h;
}
function treeWay(w, need, path, open) {
  var h = '<div class="tree-way">';
  if (w.t === 'recipe') {

var SEARCH = [];

var SECTION_KEYS = { features: 'secFeatures', items: 'navItems', blocks: 'navBlocks', recipes: 'navRecipes', inworld: 'navInWorld', loot: 'navLoot', trades: 'navTrades', enchantments: 'navEnchantments', tags: 'navTags', config: 'navConfig' };

/* Titel eines Features in der gewaehlten Sprache. */
function featureTitle(f) { if (!isObj(f)) return ''; var v = localised(f).v; return (isObj(v) && v.title) || f.title || prettyFromId(f.id || 'feature'); }
/* Fuer den Suchindex: beide Sprachfassungen, damit ein Treffer nicht davon
   abhaengt, welche Sprache gerade eingestellt ist. */
function noteText(n) {
  if (!isObj(n)) return '';
  var parts = [];
  function take(o) { if (isObj(o)) parts.push([o.summary].concat(arr(o.details), arr(o.controls), arr(o.tiers), arr(o.caveats)).filter(Boolean).join(' ')); }
  if (isObj(n.en) || isObj(n.de)) { take(n.en); take(n.de); } else take(n);
  return parts.join(' ');
}
function buildSearch() {
  if (!D) return;
  function add(section, id, title, sub, text, href) { SEARCH.push({ section: section, id: String(id), title: String(title || ''), sub: String(sub || ''), text: norm([title, sub, text].join(' ')), ntitle: norm(title), nid: norm(id), href: href }); }
  arr(D.features).filter(isObj).forEach(function (f) { var fv = localised(f).v || {}; add('features', f.id, featureTitle(f) || f.id, fv.summary || f.summary || '', noteText(f) + ' ' + arr(f.related).join(' '), '#/features/' + f.id); });
  arr(D.items).filter(isObj).forEach(function (e) { add('items', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), noteText(e.note), '#/items/' + e.id); });
  arr(D.blocks).filter(isObj).forEach(function (e) { add('blocks', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), noteText(e.note) + ' ' + arr(e.drops).join(' '), '#/blocks/' + e.id); });
  arr(D.recipes).filter(isObj).forEach(function (r) { var res = normStack(r.result); var ings = allIngredientRefs(r); add('recipes', r.id, (res ? displayName(res.id) : r.id) + ' (' + recipeTypeLabel(r.type) + ')', r.id, ings.map(function (i) { return displayName(i) + ' ' + i; }).join(' ') + ' ' + (r.group || ''), '#/recipes/' + r.id); });
  arr(D.lootTables).filter(isObj).forEach(function (l) { var items = []; arr(l.pools).forEach(function (p) { arr(p && p.items).forEach(function (it) { var s = normStack(it); if (s) items.push(displayName(s.id) + ' ' + s.id); }); }); add('loot', l.id, prettyFromId(l.id), l.id, items.join(' '), '#/loot/' + l.id); });
  arr(D.trades).filter(isObj).forEach(function (t) { var g = normStack(t.gives), w = normStack(t.wants); add('trades', t.id, (g ? displayName(g.id) : t.id) + ' – ' + professionLabel(t.profession) + ', ' + levelLabel(t.level), t.id, [g && g.id, w && displayName(w.id), w && w.id, t.profession].concat(arr(t.enchantmentPool).map(function (p) { return isObj(p) ? displayName(p.enchantment) + ' ' + p.enchantment : ''; }), strs(t.configFlags)).filter(Boolean).join(' '), '#/trades/' + t.id); });
  arr(D.enchantments).filter(isObj).forEach(function (e) { add('enchantments', e.id, nameOf(e) || prettyFromId(e.id), [nameEn(e) !== nameOf(e) ? nameEn(e) : '', e.id].filter(Boolean).join(' · '), enchDescription(e).map(function (d) { return d.t; }).join(' ') + ' ' + noteText(e.note) + ' ' + [e.supportedItems, e.exclusiveSet].join(' ') + ' implemented-in-' + implOf(e) + (implOf(e) === 'none' ? ' not implemented nicht implementiert ohne wirkung' : ''), '#/enchantments/' + e.id); });
  arr(D.tags).filter(isObj).forEach(function (t) { var info = tagRefOf(t); add('tags', t.id, info.ref, t.id, arr(t.values).map(function (v) { var id = tagValueId(v); return id + ' ' + displayName(id); }).join(' '), '#/tags/' + t.id); });
  IW.kinds.forEach(function (k) { add('inworld', k.id, iwKindTitle(k.id), T('navInWorld'), noteText(k.note), '#/inworld/' + k.id); });
  arr(D.config).filter(isObj).forEach(function (c) { add('config', c.name, c.name, [c.type, c.default].filter(Boolean).join(' = '), [c.tooltip, c.note].filter(Boolean).join(' '), '#/config/' + c.name); });
}
function search(q) {
  var tokens = norm(q).split(/\s+/).filter(Boolean);
  if (!tokens.length) return [];
  var out = [];
  SEARCH.forEach(function (e) {
    var score = 0;
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      if (e.text.indexOf(t) < 0) return;
      if (e.ntitle === t || e.nid === t) score += 6;
      else if (e.ntitle.indexOf(t) === 0) score += 4;
      else if (e.ntitle.indexOf(t) >= 0) score += 3;
      else if (e.nid.indexOf(t) >= 0) score += 2;
      else score += 1;
    }
    out.push({ e: e, score: score });
  });
  out.sort(function (a, b) { return b.score - a.score || a.e.title.localeCompare(b.e.title, LANG); });
  return out;
}
/* Die Tokens sind normalisiert (klein, ohne Akzente, ss statt ss-Ligatur),
   der Text nicht. Deshalb wird der Text zeichenweise normalisiert und dabei
   die Zuordnung auf die Originalstellen mitgefuehrt - sonst bleiben Treffer
   mit Umlauten unmarkiert. */
function normMap(text) {
  var out = '', idx = [];
  for (var i = 0; i < text.length; i++) {
    var piece = norm(text.charAt(i));
    for (var j = 0; j < piece.length; j++) { out += piece.charAt(j); idx.push(i); }
  }
  idx.push(text.length);
  return { n: out, idx: idx };
}
function highlight(text, tokens) {
  text = String(text == null ? '' : text);
  var m = normMap(text), marks = [];
  tokens.forEach(function (tok) {
    if (!tok || tok.length < 2) return;
    var from = 0, at;
    while ((at = m.n.indexOf(tok, from)) >= 0) { marks.push([m.idx[at], m.idx[at + tok.length]]); from = at + tok.length; }
  });
  if (!marks.length) return esc(text);
  marks.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  var merged = [];
  marks.forEach(function (r) {
    var last = merged[merged.length - 1];
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push([r[0], r[1]]);
  });
  var h = '', pos = 0;
  merged.forEach(function (r) { h += esc(text.slice(pos, r[0])) + '<mark>' + esc(text.slice(r[0], r[1])) + '</mark>'; pos = r[1]; });
  return h + esc(text.slice(pos));
}
function pageSearch(q) {
  q = String(q || '').trim();
  var h = '<h1>' + esc(T('titleSearch')) + '</h1>';
  if (!q) return h + '<p class="hint">' + esc(T('searchHint')) + '</p>';
  var res = search(q);
  var tokens = norm(q).split(/\s+/).filter(Boolean);
  h += '<p class="muted">' + esc(T('searchResultsFor', plural(res.length, 'hitOne', 'hitMany'), q)) + '</p>';
  if (!res.length) return h + '<p class="hint">' + T('searchNothing') + '</p>';
  var groups = new Map();
  res.forEach(function (r) { if (!groups.has(r.e.section)) groups.set(r.e.section, []); groups.get(r.e.section).push(r.e); });
  SECTION_ORDER.forEach(function (sec) {
    var list = groups.get(sec); if (!list) return;
    h += '<div class="search-group">' + section(sectionLabel(sec), '<div class="rows">' + list.map(function (e) {
      var tex = (sec === 'items' || sec === 'blocks') ? slotHtml(e.id, 1, { noLink: true }) : '';
      return '<a class="row" href="' + esc(e.href) + '">' + tex + '<div class="row-main"><div class="row-title">' + highlight(e.title, tokens) + '</div><div class="row-sub">' + highlight(e.sub, tokens) + '</div></div></a>';
    }).join('') + '</div>', { count: list.length }) + '</div>';
  });
  return h;
}

function parseHash() {

  if (h.charAt(0) === '/') h = h.slice(1);
  var i = h.indexOf('/');
  var section = i < 0 ? h : h.slice(0, i);
  var rest = i < 0 ? '' : h.slice(i + 1);
  try { rest = decodeURIComponent(rest); } catch (e) { /* kaputte Kodierung: roh weiterreichen */ }
  return { section: section || 'overview', id: rest };
}

});

window.addEventListener('hashchange', render);

/* Rechtsklick auf eine Item-Kachel: eigenes kleines Menue mit "Rezeptbaum".
   Linksklick bleibt, wie er ist. Tastatur: Kontextmenue-Taste/Shift+F10. */
document.addEventListener('contextmenu', function (ev) {
  var el = ev.target && ev.target.closest ? ev.target.closest('[data-id]') : null;
  if (!el || !$main.contains(el)) { closeCtx(); return; }
  var id = el.getAttribute('data-id');
  if (!id) return;
  ev.preventDefault();
  var x = ev.clientX, y = ev.clientY;
  if (!x && !y) { var rc = el.getBoundingClientRect(); x = rc.left; y = rc.bottom; }
  openCtx(id, x, y);
});
document.addEventListener('click', function (ev) { if ($ctx && !$ctx.contains(ev.target)) closeCtx(); });
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeCtx(); });
window.addEventListener('scroll', closeCtx, { passive: true });
window.addEventListener('resize', closeCtx);
/* Baum: Kinder erst beim Aufklappen bauen. toggle blubbert nicht - daher capture. */
$main.addEventListener('toggle', function (ev) {
  var d = ev.target;
  if (!d || !d.classList || !d.classList.contains('tree-node') || !d.open) return;
  var body = d.querySelector(':scope > .tree-body');
  if (!body || body.getAttribute('data-filled')) return;
  body.setAttribute('data-filled', '1');
  if (body.children.length) return;
  var ref = (d.getAttribute('data-ref') || '').split('|').filter(Boolean);
  var path = (d.getAttribute('data-path') || '').split('|').filter(Boolean);
  body.innerHTML = treeChildren(ref, num(d.getAttribute('data-need'), 1), path);
}, true);
/* Eingeklappte Abschnitte merken. */
$main.addEventListener('toggle', function (ev) {
  var d = ev.target;
  if (d && d.classList && d.classList.contains('fold') && d.getAttribute('data-fold')) setFolded(d.getAttribute('data-fold'), !d.open);
}, true);
/* Alle Rezepte / JEI-Ansicht: Filter-Chips, Varianten, Blaettern. */
$main.addEventListener('click', function (ev) {
  var t = ev.target && ev.target.closest ? ev.target.closest('button') : null;
  if (!t || !$main.contains(t)) return;
  if (t.hasAttribute('data-ar')) {
    RV[t.getAttribute('data-ar')] = t.getAttribute('data-v'); saveRV();
    $main.querySelectorAll('[data-ar="' + t.getAttribute('data-ar') + '"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); });
    AR.shown = 60; refreshRecipeView();
  } else if (t.hasAttribute('data-ar-more')) {
    AR.shown += 60; arRenderResults();
  } else if (t.hasAttribute('data-vi')) {
    var card = t.closest('.rc[data-g]'), g = card && AR.groups[+card.getAttribute('data-g')];
    if (!g) return;
    var i = +t.getAttribute('data-vi');
    if (g.pinned && g.idx === i) g.pinned = false; else { g.idx = i; g.pinned = true; }
    card.innerHTML = rcInner(g.members[g.idx], g);
    var again = card.querySelector('[data-vi="' + i + '"]'); if (again) again.focus();
  } else if (t.hasAttribute('data-mk-step')) {
    var st = t.getAttribute('data-mk-st');
    MK.idx[st] = Math.max(0, (MK.idx[st] || 0) + num(t.getAttribute('data-mk-step'), 0));
    mkRender();
    var sec = document.getElementById('mk-' + st), btn = sec && sec.querySelector('[data-mk-step="' + t.getAttribute('data-mk-step') + '"]:not([disabled])');
    if (btn) btn.focus();
  } else if (t.hasAttribute('data-mk-all')) {
    var s2 = t.getAttribute('data-mk-all'); MK.all[s2] = !MK.all[s2]; mkRender();
  }
});
var arTimer = null;
$main.addEventListener('input', function (ev) {
  var t = ev.target;
  if (!t || t.id !== 'ar-q') return;
  clearTimeout(arTimer);
  arTimer = setTimeout(function () { RV.q = t.value; AR.shown = 60; arRenderResults(); }, 150);
});
$main.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t && t.id === 'ar-merge') { RV.merge = !!t.checked; saveRV(); refreshRecipeView(); }
});
/* Wie in JEI: R zeigt die Rezepte, U die Verwendung des Items unter dem Mauszeiger. */
var hoverId = null;
document.addEventListener('mouseover', function (ev) { var el = ev.target && ev.target.closest ? ev.target.closest('[data-id]') : null; hoverId = el && $main.contains(el) ? el.getAttribute('data-id') : null; });
document.addEventListener('keydown', function (ev) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey || !hoverId || hoverId.charAt(0) === '#') return;
  var tag = ev.target && ev.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var k = String(ev.key || '').toLowerCase();
  if (k === 'r') location.hash = '#/make/' + encodeURIComponent(hoverId);
  else if (k === 'u') location.hash = '#/use/' + encodeURIComponent(hoverId);
});
$main.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t && t.hasAttribute && t.hasAttribute('data-tree-line')) {
    try { if (window.localStorage) window.localStorage.setItem(MC_LINE_STORE, t.value); } catch (err) { /* nur fuer diese Sitzung */ }
    fillTree();
  }
});
$main.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t && t.hasAttribute && t.hasAttribute('data-tree-amount')) {
    var n = Math.floor(num(t.value, 0));
    if (n >= 1 && n <= 4096) { TREE.amount = n; fillTree(); }
  }
});

/* Beschriftungen ausserhalb von #main und der Seitenleiste - die schreibt
   render() nicht, sie muessen von Hand nachgezogen werden. */
function applyStaticText() {
  document.documentElement.lang = LANG;
  $q.placeholder = T('searchPlaceholder');
  $q.setAttribute('aria-label', T('searchAria'));
  $side.setAttribute('aria-label', T('sidebarAria'));
  $lang.setAttribute('aria-label', T('langAria'));
  $lang.value = LANG;
}
/* Sprachwechsel ohne Neuladen. Die Reihenfolge zaehlt: der Suchindex muss
   neu stehen, bevor render() eine Suchseite zeichnet, und buildSearch haengt
   an, statt zu ersetzen - ohne das Leeren waechst der Index bei jedem Wechsel. */
function setLang(next) {
  if (LANGS.indexOf(next) < 0 || next === LANG) return;
  LANG = next;
  try { if (window.localStorage) window.localStorage.setItem(LANG_STORE, LANG); }
  catch (err) { /* ohne Storage gilt die Wahl nur fuer diese Sitzung */ }
  applyStaticText();
  SEARCH.length = 0;
  buildSearch();
  renderMeta();
  var y = window.pageYOffset || 0;
  render();
  window.scrollTo(0, y);   /* render() springt sonst an den Seitenanfang */
}
$lang.addEventListener('change', function () { setLang($lang.value); });

buildIndex();
buildInWorld();
applyStaticText();
buildSearch();
renderMeta();
/* Wuerfel der Vanilla-Bloecke: die Datei legt generate.py neben die Vanilla-Texturen
   (nicht committet, nicht veroeffentlicht). Kurz auf sie warten, damit die erste Seite
   schon Wuerfel zeigt; kommt sie spaeter, wird einmal nachgezeichnet. */
(function () {
  var done = false, s = document.createElement('script');
  function first() { if (!done) { done = true; render(); } }
  s.onload = function () {
    if (!done) { first(); return; }
    if (isObj(window.VANILLA_CUBES)) { var y = window.pageYOffset || 0; render(); window.scrollTo(0, y); }
  };
  s.onerror = first;
  s.src = 'assets/textures/minecraft/' + 'cubes.js';
  document.head.appendChild(s);
  setTimeout(first, 600);
})();
})();
</script>
</body>
</html>
