<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleBuilding – Testläufe</title>
<style>
/* Farbtokens wie im Wiki (wiki/index.html), damit beide Seiten zusammengehoeren.
   Ergaenzt um drei ZUSTANDSfarben: die sind semantisch und bewusst vom Akzent
   verschieden, damit "gruen" nicht mit "das ist ein Link" verwechselt wird. */
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --panel: #ffffff;
  --text: #1f2328;
  --muted: #646b73;
  --border: #d8dbe0;
  --accent: #2c6e4f;
  --accent-soft: #e4f1e9;
  --warn-bg: #fff5e1;
  --warn-border: #dfae52;
  --warn-text: #5f4100;
  --danger-bg: #fdeaea;
  --danger-border: #dc9a9a;
  --danger-text: #7a1f1f;
  --slot-bg: #e9e8e3;
  --slot-border: #c6c3bb;
  --code-bg: #ebebe8;
  --shadow: 0 1px 2px rgba(0,0,0,.05);

  --pass: #1f7a4d;
  --pass-bg: #dff0e6;
  --fail: #a32020;
  --fail-bg: #fbe3e3;
  --skip: #6d7580;
  --skip-bg: #e6e8ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141618;
    --panel: #1d2023;
    --text: #e4e6e8;
    --muted: #9ba3ab;
    --border: #2e343a;
    --accent: #7cc39a;
    --accent-soft: #1e2e26;
    --warn-bg: #362b12;
    --warn-border: #8a6a2a;
    --warn-text: #f1d99f;
    --danger-bg: #3a1c1c;
    --danger-border: #8a3d3d;
    --danger-text: #f3b9b9;
    --slot-bg: #282c31;
    --slot-border: #3d434a;
    --code-bg: #282c31;
    --shadow: none;

    --pass: #64c08c;
    --pass-bg: #18301f;
    --fail: #e58b8b;
    --fail-bg: #3a1c1c;
    --skip: #8b939c;
    --skip-bg: #262b30;
  }
}

* { box-sizing: border-box; }
html { font-size: 15px; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
       background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--accent); }
code, kbd { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
            font-size: .86em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px;
            word-break: break-word; }
h1 { font-size: 1.6rem; margin: 0 0 .3rem; line-height: 1.25; }
h2 { font-size: 1.15rem; margin: 0 0 .8rem; padding-bottom: .3rem; border-bottom: 1px solid var(--border); }
h3 { font-size: 1rem; margin: 0 0 .5rem; }
p { margin: .4rem 0 .8rem; }
.muted { color: var(--muted); }
.tiny { font-size: .8rem; }
.nums { font-variant-numeric: tabular-nums; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Kopfleiste */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem;
          padding: .55rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; margin-left: .4rem; font-size: .8rem; }
.search { flex: 1; min-width: 200px; max-width: 480px; }
.search input { width: 100%; padding: .45rem .75rem; border: 1px solid var(--border); border-radius: 6px;
                background: var(--bg); color: var(--text); font: inherit; }

main { max-width: 1180px; margin: 0 auto; padding: 1.2rem 1rem 5rem; }
section { margin-bottom: 2.2rem; }

.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
         box-shadow: var(--shadow); padding: 1rem 1.1rem; }

/* Zustandsfeld: Farbe NIE allein - immer mit Zeichen und Wort. */
.state { display: inline-flex; align-items: center; gap: .35em; padding: .12rem .5rem; border-radius: 5px;
         font-size: .8rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.state.pass { background: var(--pass-bg); color: var(--pass); border-color: currentColor; }
.state.fail { background: var(--fail-bg); color: var(--fail); border-color: currentColor; }
.state.skip { background: var(--skip-bg); color: var(--skip); border-color: currentColor; }
.state .mark { font-family: ui-monospace, monospace; }

/* Zielkarten oben */
.targets { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .8rem; }
.tcard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: .8rem .9rem;
         display: flex; flex-direction: column; gap: .45rem; box-shadow: var(--shadow); }
.tcard .name { font-weight: 600; }
.tcard .figures { font-size: 1.5rem; font-weight: 700; }
.tcard .figures small { font-size: .8rem; font-weight: 400; color: var(--muted); margin-left: .3rem; }
.tcard .err { font-size: .8rem; color: var(--fail); }

/* Verlaufsstreifen je Test: ein Feld pro Lauf, neuester links */
.strip { display: inline-flex; gap: 2px; vertical-align: middle; }
.strip i { width: 9px; height: 14px; border-radius: 2px; display: block; background: var(--skip-bg);
           border: 1px solid var(--border); }
.strip i.pass { background: var(--pass); border-color: var(--pass); }
.strip i.fail { background: var(--fail); border-color: var(--fail); }

/* Tabellen */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600;
     white-space: nowrap; }
tbody tr:hover { background: var(--accent-soft); }
td.id { font-family: ui-monospace, monospace; font-size: .82rem; word-break: break-all; }
td.right { text-align: right; }
.msg { color: var(--fail); font-size: .82rem; white-space: pre-wrap; word-break: break-word; margin-top: .2rem; }

/* Läufe */
.run { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin-bottom: .6rem;
       box-shadow: var(--shadow); }
.run > summary { cursor: pointer; padding: .6rem .9rem; display: flex; gap: .8rem; align-items: center;
                 flex-wrap: wrap; list-style: none; }
.run > summary::-webkit-details-marker { display: none; }
.run > summary::before { content: "▸"; color: var(--muted); }
.run[open] > summary::before { content: "▾"; }
.run .body { padding: 0 .9rem .9rem; border-top: 1px solid var(--border); }

/* Steuerung */
/* minmax(0, 1fr) statt 1fr: eine Grid-Spalte ist sonst mindestens so breit wie
   ihr breitestes Kind, und die Karte schiebt in einem schmalen Fenster die ganze
   Seite waagerecht auf. Gleiches gilt fuer die Kinder selbst. */
.controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: .8rem; }
.controls > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
label.chip { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .6rem; border-radius: 6px;
             border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: .88rem; }
label.chip input { margin: 0; }
.row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
input[type=text], select { padding: .4rem .6rem; border: 1px solid var(--border); border-radius: 6px;
                           background: var(--bg); color: var(--text); font: inherit; max-width: 100%; }
/* min-width:0 ist hier tragend: ein Flex-Kind bekommt sonst die Breite seines
   Inhalts als Untergrenze und schiebt in einem schmalen Fenster die ganze Seite
   waagerecht auf. Die 16rem sind nur der Wunsch, nicht das Minimum. */
input[type=text] { flex: 1 1 16rem; min-width: 0; font-family: ui-monospace, monospace; font-size: .86rem; }
button { padding: .45rem .9rem; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent);
         color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
button.secondary { background: var(--bg); color: var(--text); border-color: var(--border); font-weight: 400; }
button[disabled] { opacity: .55; cursor: not-allowed; }
@media (prefers-color-scheme: dark) { button { color: #11150f; } }

.note { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text);
        border-radius: 8px; padding: .8rem 1rem; }
.note code { background: rgba(0,0,0,.08); }
pre.tail { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: .6rem .8rem;
           font-size: .8rem; max-height: 14rem; overflow: auto; margin: .5rem 0 0; white-space: pre-wrap; }
.empty { color: var(--muted); font-style: italic; padding: 1.5rem 0; }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">SimpleBuilding <small>Testläufe</small></span>
  <div class="search"><input id="q" type="search" placeholder="Test filtern: Name, Klasse, Meldung …"
       autocomplete="off" spellcheck="false" aria-label="Tests filtern"></div>
  <a class="tiny" href="../wiki/index.html">→ Wiki</a>
</div>

<main>
  <div id="app"></div>
</main>

<script src="data/catalogue.js"></script>
<script src="data/runs.js"></script>
<script>
(function () {
  'use strict';

  var RUNS = Array.isArray(window.TEST_RUNS) ? window.TEST_RUNS.slice() : null;
  var CATALOGUE = window.TEST_CATALOGUE || null;
  var LIVE = location.protocol === 'http:' || location.protocol === 'https:';
  var $app = document.getElementById('app');
  var $q = document.getElementById('q');

  var TARGETS = [
    { id: 'fabric-262', label: 'Fabric – MC 26.2', line: '26.2' },
    { id: 'neoforge-262', label: 'NeoForge – MC 26.2', line: '26.2' },
    { id: 'fabric-12111', label: 'Fabric – MC 1.21.11', line: '1.21.11' },
    { id: 'neoforge-12111', label: 'NeoForge – MC 1.21.11', line: '1.21.11' }
  ];

  var selection = { targets: TARGETS.map(function (t) { return t.id; }), filter: '' };
  var status = null;
  var poll = null;

  // ---------------------------------------------------------------- Helfer

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ago(iso) {
    var then = Date.parse(iso);
    if (isNaN(then)) return '';
    var s = Math.max(0, Math.round((Date.now() - then) / 1000));
    if (s < 60) return 'vor ' + s + ' s';
    if (s < 3600) return 'vor ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'vor ' + Math.round(s / 3600) + ' h';
    return 'vor ' + Math.round(s / 86400) + ' Tagen';
  }

  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return esc(iso);
    return d.toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
  }

  function secs(ms) { return (ms / 1000).toFixed(1) + ' s'; }

  /* Ein Zustandsfeld. Das Wort steht immer dabei: wer Rot und Gruen nicht
     unterscheiden kann, liest sonst nichts. */
  function badge(kind, text) {
    var mark = kind === 'pass' ? '✓' : kind === 'fail' ? '✕' : '–';
    return '<span class="state ' + kind + '"><span class="mark" aria-hidden="true">' + mark +
           '</span>' + esc(text) + '</span>';
  }

  function targetState(t) {
    if (!t || !t.selected) return badge('skip', 'nicht gelaufen');
    if (t.error) return badge('fail', 'Fehler');
    if (t.counts.failed > 0) return badge('fail', t.counts.failed + ' rot');
    if (t.exitCode !== 0) return badge('fail', 'Exit ' + t.exitCode);
    return badge('pass', t.counts.passed + ' grün');
  }

  function catalogueFor(line) {
    return (CATALOGUE && CATALOGUE[line]) || [];
  }

  function classOf(line, id) {
    var list = catalogueFor(line);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].testClass;
    return null;
  }

  // ------------------------------------------------------------- Bausteine

  function headSection() {
    var run = RUNS[0];
    var git = run.git || {};
    var bits = [
      when(run.startedAt) + ' (' + ago(run.startedAt) + ')',
      'Version ' + esc(run.modVersion),
      git.short ? ('Commit ' + esc(git.short) + (git.dirty ? ' – Arbeitsbaum schmutzig' : '')) : null,
      git.branch ? ('Branch ' + esc(git.branch)) : null,
      'Auswahl: ' + (run.filter ? '<code>' + esc(run.filter) + '</code>' : 'alles'),
      'ausgelöst: ' + esc(run.trigger)
    ].filter(Boolean);

    var cards = TARGETS.map(function (spec) {
      var t = (run.targets || []).filter(function (x) { return x.id === spec.id; })[0];
      var expected = catalogueFor(spec.line).length;
      var ran = t && t.selected ? t.counts.total : 0;
      var missing = expected - ran;
      return '<div class="tcard">' +
        '<span class="name">' + esc(spec.label) + '</span>' +
        '<span class="figures nums">' + (t && t.selected ? ran : '–') +
          '<small>von ' + expected + ' Tests</small></span>' +
        targetState(t) +
        (t && t.selected && missing > 0
          ? '<span class="tiny muted">' + missing + ' nicht gelaufen (gefiltert)</span>' : '') +
        (t && t.selected ? '<span class="tiny muted nums">' + secs(t.durationMs) + '</span>' : '') +
        (t && t.error ? '<span class="err">' + esc(t.error) + '</span>' : '') +
        '</div>';
    }).join('');

    /* Ein Teillauf darf nie klingen wie ein vollstaendiger. "alles grün" nach
       einem gefilterten Lauf waere genau die Aussage, die man spaeter bereut. */
    var complete = !run.filter &&
      (run.targets || []).filter(function (t) { return t.selected; }).length === TARGETS.length;
    var headline = run.ok
      ? (complete ? 'Letzter Lauf: alles grün' : 'Letzter Lauf: grün, aber nur ein Teil')
      : 'Letzter Lauf: nicht grün';

    return '<section>' +
      '<h1>' + headline + '</h1>' +
      '<p class="muted tiny">' + bits.join(' · ') + '</p>' +
      '<div class="targets">' + cards + '</div>' +
      '</section>';
  }

  function controlsSection() {
    var chips = TARGETS.map(function (t) {
      var on = selection.targets.indexOf(t.id) >= 0;
      return '<label class="chip"><input type="checkbox" data-target="' + t.id + '"' +
        (on ? ' checked' : '') + '> ' + esc(t.label) + '</label>';
    }).join('');

    var suggestions = [];
    var seen = {};
    ['26.2', '1.21.11'].forEach(function (line) {
      catalogueFor(line).forEach(function (e) {
        if (seen[e.testClass]) return;
        seen[e.testClass] = true;
        var same = catalogueFor(line).filter(function (x) { return x.testClass === e.testClass; })
                     .map(function (x) { return x.id.split(':')[1]; });
        suggestions.push({ label: e.testClass, value: 'simplebuilding:' + commonPrefix(same) + '*' });
      });
    });

    var options = '<option value="">alles</option>' + suggestions.map(function (s) {
      return '<option value="' + esc(s.value) + '">' + esc(s.label) + '</option>';
    }).join('');

    var cmd = buildCommand();

    var action = LIVE
      ? '<div class="row">' +
          '<button id="start"' + (status && status.running ? ' disabled' : '') + '>Lauf starten</button>' +
          '<span class="tiny muted" id="runhint">' +
            (status && status.running
              ? 'läuft gerade' + (status.target ? ': ' + esc(status.target) : '') + ' …'
              : 'startet die ausgewählten Ziele im Hintergrund') +
          '</span>' +
        '</div>' +
        (status && status.running && status.tail && status.tail.length
          ? '<pre class="tail">' + esc(status.tail.join('\n')) + '</pre>' : '')
      : '<div class="note">' +
          '<strong>Diese Seite liegt auf der Festplatte.</strong> Zum Starten von Läufen braucht sie den ' +
          'kleinen lokalen Server:<br><code>python tools/testrunner/serve.py</code>' +
          '<br><br>Oder direkt in der Konsole, mit der Auswahl von oben:<br><code>' + esc(cmd) + '</code>' +
        '</div>';

    return '<section><h2>Lauf auslösen</h2><div class="panel controls">' +
      '<div><div class="tiny muted" style="margin-bottom:.35rem">Ziele</div>' +
        '<div class="chips">' + chips + '</div></div>' +
      '<div><div class="tiny muted" style="margin-bottom:.35rem">Auswahl der Tests</div>' +
        '<div class="row">' +
          '<select id="preset" aria-label="Vorschlag übernehmen">' + options + '</select>' +
          '<input id="filter" type="text" placeholder="simplebuilding:*" value="' + esc(selection.filter) + '">' +
        '</div></div>' +
      action +
      (LIVE ? '<div class="tiny muted">Konsole: <code>' + esc(cmd) + '</code></div>' : '') +
      '</div></section>';
  }

  function commonPrefix(list) {
    if (!list.length) return '';
    var p = list[0];
    for (var i = 1; i < list.length; i++) {
      var j = 0;
      while (j < p.length && j < list[i].length && p[j] === list[i][j]) j++;
      p = p.slice(0, j);
    }
    return p;
  }

  function buildCommand() {
    var parts = ['python tools/testrunner/run.py'];
    if (selection.targets.length && selection.targets.length < TARGETS.length) {
      parts.push('--targets ' + selection.targets.join(','));
    }
    if (selection.filter) parts.push('--filter "' + selection.filter + '"');
    return parts.join(' ');
  }

  /* Verlauf je Test: was interessiert, ist nicht nur der letzte Lauf, sondern
     ob ein Test schon einmal rot war. Ein Feld je Lauf, neuester links. */
  function stripFor(testId) {
    var cells = RUNS.slice(0, 12).map(function (run) {
      var state = 'skip', title = when(run.startedAt) + ': nicht gelaufen';
      (run.targets || []).forEach(function (t) {
        if (!t.selected) return;
        (t.tests || []).forEach(function (test) {
          if (test.id !== testId) return;
          if (test.status === 'failed') { state = 'fail'; title = when(run.startedAt) + ': rot'; }
          else if (state !== 'fail') { state = 'pass'; title = when(run.startedAt) + ': grün'; }
        });
      });
      return '<i class="' + state + '" title="' + esc(title) + '"></i>';
    }).join('');
    return '<span class="strip" role="img" aria-label="Verlauf der letzten Läufe">' + cells + '</span>';
  }

  function testsSection() {
    var run = RUNS[0];
    var query = ($q.value || '').trim().toLowerCase();

    var blocks = TARGETS.map(function (spec) {
      var t = (run.targets || []).filter(function (x) { return x.id === spec.id; })[0];
      if (!t) return '';

      var byId = {};
      (t.tests || []).forEach(function (test) { byId[test.id] = test; });

      var rows = catalogueFor(spec.line).map(function (entry) {
        var test = byId[entry.id];
        var status = !t.selected ? 'skip' : (test ? test.status : 'skip');
        return {
          id: entry.id,
          testClass: entry.testClass,
          status: status === 'passed' ? 'pass' : status === 'failed' ? 'fail' : 'skip',
          timeMs: test ? test.timeMs : null,
          message: test ? test.message : null
        };
      });

      // Fremde Testfaelle (Fabric faehrt in minecraft:default) unten anhaengen,
      // damit sichtbar ist, dass sie da sind, ohne die Zahlen zu bewegen.
      (t.tests || []).forEach(function (test) {
        if (!test.foreign) return;
        rows.push({ id: test.id, testClass: '(fremd)', status: test.status === 'failed' ? 'fail' : 'pass',
                    timeMs: test.timeMs, message: test.message, foreign: true });
      });

      if (query) {
        rows = rows.filter(function (r) {
          return r.id.toLowerCase().indexOf(query) >= 0 ||
                 (r.testClass || '').toLowerCase().indexOf(query) >= 0 ||
                 (r.message || '').toLowerCase().indexOf(query) >= 0;
        });
      }
      if (!rows.length) return '';

      // Rote zuerst - danach nach Klasse und Name.
      rows.sort(function (a, b) {
        var rank = { fail: 0, skip: 1, pass: 2 };
        if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
        if (a.testClass !== b.testClass) return (a.testClass || '').localeCompare(b.testClass || '');
        return a.id.localeCompare(b.id);
      });

      var body = rows.map(function (r) {
        var label = r.status === 'pass' ? 'grün' : r.status === 'fail' ? 'rot' : 'nicht gelaufen';
        return '<tr>' +
          '<td>' + badge(r.status, label) + '</td>' +
          '<td class="id">' + esc(r.id.split(':')[1] || r.id) +
            (r.message ? '<div class="msg">' + esc(r.message) + '</div>' : '') + '</td>' +
          '<td class="tiny muted">' + esc(r.testClass || '') + '</td>' +
          '<td class="right nums tiny">' + (r.timeMs == null ? '' : r.timeMs + ' ms') + '</td>' +
          '<td>' + (r.foreign ? '' : stripFor(r.id)) + '</td>' +
          '</tr>';
      }).join('');

      return '<h3>' + esc(spec.label) + ' <span class="tiny muted">' + rows.length + ' angezeigt</span></h3>' +
        '<div class="scroll"><table>' +
        '<thead><tr><th>Zustand</th><th>Test</th><th>Klasse</th><th class="right">Dauer</th>' +
        '<th>letzte Läufe</th></tr></thead><tbody>' + body + '</tbody></table></div>';
    }).join('');

    return '<section><h2>Tests im letzten Lauf</h2>' +
      (blocks || '<p class="empty">Nichts passt zum Filter.</p>') + '</section>';
  }

  function historySection() {
    if (RUNS.length < 2) return '';
    var items = RUNS.map(function (run) {
      var states = TARGETS.map(function (spec) {
        var t = (run.targets || []).filter(function (x) { return x.id === spec.id; })[0];
        return '<span title="' + esc(spec.label) + '">' + targetState(t) + '</span>';
      }).join(' ');

      var failing = [];
      (run.targets || []).forEach(function (t) {
        (t.tests || []).forEach(function (test) {
          if (test.status === 'failed') failing.push(t.id + ' · ' + (test.id.split(':')[1] || test.id));
        });
      });

      return '<details class="run">' +
        '<summary>' +
          badge(run.ok ? 'pass' : 'fail', run.ok ? 'grün' : 'rot') +
          '<span class="nums">' + when(run.startedAt) + '</span>' +
          '<span class="tiny muted">' + ago(run.startedAt) + '</span>' +
          '<span class="tiny muted">v' + esc(run.modVersion) + ' · ' + esc((run.git || {}).short || '?') +
            ((run.git || {}).dirty ? '+' : '') + '</span>' +
          '<span class="tiny muted">' + (run.filter ? esc(run.filter) : 'alles') + '</span>' +
          '<span style="margin-left:auto">' + states + '</span>' +
        '</summary>' +
        '<div class="body">' +
          '<p class="tiny muted nums">' + run.totals.passed + '/' + run.totals.total + ' bestanden · ' +
            secs(run.durationMs) + ' · ausgelöst: ' + esc(run.trigger) + ' · <code>' + esc(run.runId) + '</code></p>' +
          (failing.length
            ? '<ul class="tiny">' + failing.map(function (f) {
                return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>'
            : '<p class="tiny muted">kein roter Test.</p>') +
        '</div></details>';
    }).join('');
    return '<section><h2>Verlauf</h2>' + items + '</section>';
  }

  function emptyState() {
    return '<section><h1>Noch kein Testlauf aufgezeichnet</h1>' +
      '<div class="note"><p>Diese Seite zeigt, was <code>tools/testrunner/run.py</code> aufzeichnet. ' +
      'Bisher gibt es nichts – der erste Lauf legt die Daten an:</p>' +
      '<p><code>python tools/testrunner/run.py</code></p>' +
      '<p>Nur ein Teil davon, wenn es schnell gehen soll:</p>' +
      '<p><code>python tools/testrunner/run.py --targets neoforge-262 --filter "simplebuilding:block_behaviour_*"</code></p>' +
      '<p>Und mit Oberfläche zum Anklicken:</p>' +
      '<p><code>python tools/testrunner/serve.py</code></p></div></section>';
  }

  // ---------------------------------------------------------------- Rendern

  function render() {
    if (!RUNS || !RUNS.length) { $app.innerHTML = emptyState(); return; }
    $app.innerHTML = headSection() + controlsSection() + testsSection() + historySection();
    wire();
  }

  function wire() {
    Array.prototype.forEach.call($app.querySelectorAll('input[data-target]'), function (box) {
      box.addEventListener('change', function () {
        var id = box.getAttribute('data-target');
        var at = selection.targets.indexOf(id);
        if (box.checked && at < 0) selection.targets.push(id);
        if (!box.checked && at >= 0) selection.targets.splice(at, 1);
        render();
      });
    });

    var preset = $app.querySelector('#preset');
    var filter = $app.querySelector('#filter');
    if (preset) preset.addEventListener('change', function () {
      selection.filter = preset.value; render();
    });
    if (filter) filter.addEventListener('input', function () { selection.filter = filter.value.trim(); });

    var start = $app.querySelector('#start');
    if (start) start.addEventListener('click', startRun);
  }

  // ------------------------------------------------------------------ Server

  function startRun() {
    if (!LIVE) return;
    var body = JSON.stringify({
      targets: selection.targets.length === TARGETS.length ? null : selection.targets,
      filter: selection.filter || null
    });
    fetch('api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok) { alert(res.body.error || 'Der Lauf konnte nicht gestartet werden.'); return; }
        watch();
      })
      .catch(function (e) { alert('Der Server antwortet nicht: ' + e); });
  }

  function watch() {
    if (poll) return;
    poll = setInterval(function () {
      fetch('api/status').then(function (r) { return r.json(); }).then(function (s) {
        var wasRunning = status && status.running;
        status = s;
        if (!s.running && wasRunning) {
          clearInterval(poll); poll = null;
          // Die Daten liegen jetzt neu geschrieben auf der Platte.
          fetch('api/runs').then(function (r) { return r.json(); }).then(function (runs) {
            RUNS = runs; render();
          });
          return;
        }
        render();
      }).catch(function () { clearInterval(poll); poll = null; });
    }, 1500);
  }

  $q.addEventListener('input', function () {
    if (RUNS && RUNS.length) { $app.innerHTML = headSection() + controlsSection() + testsSection() + historySection(); wire(); }
  });

  // Beim Laden nachsehen, ob gerade schon ein Lauf unterwegs ist.
  if (LIVE) {
    fetch('api/status').then(function (r) { return r.json(); }).then(function (s) {
      status = s;
      if (s.running) { render(); watch(); }
    }).catch(function () { /* Server nicht da: die Seite bleibt statisch nutzbar. */ });
  }

  render();
})();
</script>
</body>
</html>
