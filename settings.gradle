pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'simplebuilding'

include 'common'
include 'neoforge'
// -PskipForge262=true leaves the 26.2 Forge project out: configuring it always runs ForgeGradle's Mavenizer,
// which downloads the launcher manifest (no offline switch), so offline runs (tools/testrunner/offline_gate.ps1) skip it.
if (!providers.gradleProperty('skipForge262').getOrElse('false').toBoolean()) include 'forge'
include 'mc1_21_11:fabric'
include 'mc1_21_11:neoforge'
include 'mc26_3:fabric'
include 'mc26_3:neoforge'
if (providers.gradleProperty('forge263').getOrElse('false').toBoolean()) include 'mc26_3:forge'
// MC 26.4 SNAPSHOT line - experimental, only with -Pmc264=true: keeps the snapshot out of the normal
// build and the release gate. :mc26_4:forge additionally needs mc264_forge_version (Forge ships no
// snapshot builds).
if (providers.gradleProperty('mc264').getOrElse('false').toBoolean()) {
	include 'mc26_4:fabric'
	if (providers.gradleProperty('mc264_forge_version').getOrElse('')) include 'mc26_4:forge'
}
// Loaders: Fabric (root project, Fabric Loom) + NeoForge (:neoforge, ModDevGradle).
// Each applies its own loader plugin to its own project; both build under Gradle 9.

// Additive 26.3 modules. Existing project paths remain unchanged.
include 'framework', 'integration'
def moduleRegistry = new groovy.json.JsonSlurper().parse(file('modules/modules.json'))
moduleRegistry.modules.findAll { it.id != 'simplebuilding' }.each { entry ->
    entry.projects.each { loader, path ->
        if (loader == 'forge' && !providers.gradleProperty('forge263').getOrElse('false').toBoolean()) return
        if (!(path ==~ /:modules:[a-z][a-z0-9_]+:(fabric|neoforge|forge)/)) throw new GradleException("Invalid module project: ${path}")
        include path
    }
}
