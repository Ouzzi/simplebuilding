pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'simplebuilding'

include 'common'

// Current / actively maintained loaders:
include 'neoforge'   // NeoForge (ModDevGradle) — current

// Legacy loader (low relevance today; kept building but not prioritised):
include 'forge'      // MinecraftForge (ForgeGradle 7) — legacy / best-effort

// The root project itself is the Fabric loader (current), built with Loom.
// Each subproject applies its own loader plugin; all build under Gradle 9.