pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'simplebuilding'

include 'common'
include 'neoforge'
include 'forge'
// Forge uses ForgeGradle 7 (the only FG that supports Gradle 9 + MC 26.1.2),
// applied to the :forge subproject. Loom (root) and NeoForge moddev (:neoforge)
// each apply their own loader plugin to their own subproject.