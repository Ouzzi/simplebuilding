// Shared resource layout of the MC 26.3 modules (applied by mc26_3/fabric and mc26_3/neoforge) and,
// with one more layer on top, of the 26.4 snapshot modules (mc26_4/resources.gradle).
//
// The 26.3 line reuses the 26.2 resources and datagen output wherever they are valid and only adds
// what must differ, the same way the Java sources work:
//
//   src/main/resources          hand-written assets/data of the mod (shared)
//   mc26_3/overlay/resources    hand-written files that must differ on 26.3 (the Enderite equipment
//                               asset with its trim_overrides); hides the file with the same path in
//                               src/main/resources
//   src/main/generated          26.2 datagen output (shared where 26.3 would write the same)
//   mc26_3/generated            26.3 datagen output, ONLY the files that differ from
//                               src/main/generated; syncGenerated263 (after :mc26_3:fabric:runDatagen)
//                               keeps it that way. A file here hides its 26.2 twin, and
//                               mc26_3/generated/removed-on-26.3.txt lists 26.2 files that 26.3 does
//                               not generate at all (they are hidden as well).
//
// Precedence is decided per path by mergeResources263 (one merged tree per module), and
// checkResources263 (part of check) verifies the shipped result. The 26.4 snapshot line stacks
// mc26_4/overlay/resources and mc26_4/generated on top of the same layers (mcLayeredResources).

import groovy.io.FileType

def rootDirFile = rootProject.projectDir

ext.mc263RelativeFiles = { File dir ->
    Set<String> out = [] as Set
    if (dir.isDirectory()) {
        dir.eachFileRecurse(FileType.FILES) { f ->
            out << dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
        }
    }
    return out
}

ext.mc263RemovedList = new File(rootDirFile, 'mc26_3/generated/removed-on-26.3.txt')

ext.mc263Layer = [overlay  : new File(rootDirFile, 'mc26_3/overlay/resources'),
                  generated: new File(rootDirFile, 'mc26_3/generated'),
                  removed  : new File(rootDirFile, 'mc26_3/generated/removed-on-26.3.txt')]

ext.mc263ConfigureResources = { SourceSet sourceSet, List<String> extraSharedDirs ->
    mcLayeredResources(sourceSet, extraSharedDirs, '263', [mc263Layer])
}

// Generic version-overlay resource merge. layers: newest first, each
// [overlay: File, generated: File, removed: File]:
//   - a layer's overlay resources hide older overlays and the shared resources (+ loader dirs);
//   - a layer's generated files hide older generated files and src/main/generated;
//   - a layer's removed list hides generated files of OLDER layers and of src/main/generated that
//     this version no longer produces.
// Textures derived from Mojang textures (a recolour/mask of a sprite from the client jar) are never
// committed (owner rule 2026-10-12, AGENTS.md): tools/textures/vanilla_derived.py draws them from the
// local 26.3 client jar into build/generated-resources/vanillaDerived, and the merge below takes them
// before every other layer. Python 3.8+ with Pillow and numpy: -PsbPython / SB_PYTHON (a path or a command
// such as "py -3"), else the first of py -3 (Windows launcher), python3.12, python3, python that runs and has
// both modules (the Microsoft Store stub python.exe does not run and is skipped). The probe happens when the
// task runs, not at configuration. Jar: -PsbClientJar / SB_CLIENT_JAR, else the Loom, NeoForm or ForgeGradle
// cache of this Gradle user home (the script searches). Without a jar the build fails (a missing sprite
// would ship as magenta) only with -PsbVanillaDerivedStrict; by default a missing Python/module/jar or a
// failing script logs a WARNING and ships grey placeholders (drawn in Groovy, no Python needed);
// -PsbSkipVanillaDerived does that without trying Python; -PsbVanillaDerivedPlaceholders lets the script
// write its labelled placeholders when no jar is found.
// The script's output (stdout + stderr) goes to the Gradle log, and its last lines into the failure message.
ext.sbPythonCandidates = { String explicit, boolean windows ->
    if (explicit) {
        // A path (may contain spaces, e.g. C:\Program Files\Python312\python.exe) or a command line.
        return [new File(explicit).isFile() ? [explicit] : (explicit.trim().split(/\s+/) as List<String>)]
    }
    List<List<String>> c = windows ? [['py', '-3']] : []
    c += [['python3.12'], ['python3'], ['python']]
    return c
}
ext.sbVanillaDerivedProbe = 'import sys\nmissing = []\nfor m in ("PIL", "numpy"):\n    try:\n        __import__(m)\n' +
        '    except ImportError:\n        missing.append("pillow" if m == "PIL" else m)\n' +
        'print("SBPY", "%d.%d" % sys.version_info[:2], " ".join(missing) if sys.version_info >= (3, 8) else "python>=3.8")\n'
// Runs cmd + args; returns [exit code, merged output]. exit -1 when the command cannot be started.
ext.sbRunProcess = { List<String> cmd, File dir, Map<String, String> env ->
    try {
        ProcessBuilder pb = new ProcessBuilder(cmd).directory(dir).redirectErrorStream(true)
        pb.environment().putAll(env)
        Process p = pb.start()
        p.outputStream.close()
        String text = new String(p.inputStream.readAllBytes(), 'UTF-8')
        return [p.waitFor(), text]
    } catch (IOException e) {
        return [-1, e.message ?: e.toString()]
    }
}
// [command, null] for the first candidate with Python 3.8+ and the modules; else [null, failure message].
ext.sbFindPython = { List<List<String>> candidates, boolean needModules, File dir, Map<String, String> env ->
    List<String> tried = []
    for (List<String> cmd : candidates) {
        def (int code, String text) = sbRunProcess(cmd + ['-c', sbVanillaDerivedProbe], dir, env)
        def m = code == 0 ? (text =~ /SBPY (\d+\.\d+) ?(.*)/) : null
        if (m == null || !m.find()) {
            tried << "  ${cmd.join(' ')}: does not run (exit ${code}${text?.trim() ? ', ' + text.trim().readLines()[0] : ''})"
            continue
        }
        String missing = m.group(2).trim()
        if (!missing || !needModules) return [cmd, null]
        tried << "  ${cmd.join(' ')} (Python ${m.group(1)}): missing ${missing} -> ${cmd.join(' ')} -m pip install ${missing}"
    }
    return [null, 'generateVanillaDerived needs Python 3.8+ with Pillow and numpy. Tried:\n' + tried.join('\n') +
            '\nInstall Python 3 (python.org, tick "Add python.exe to PATH"; the Microsoft Store alias does not ' +
            'count), then: py -3 -m pip install pillow numpy (Linux/macOS: python3 -m pip install pillow numpy).\n' +
            'Or point the build at one: -PsbPython=<path or command> / SB_PYTHON.']
}
ext.mcVanillaDerivedTask = { ->
    if (tasks.names.contains('generateVanillaDerived')) return tasks.named('generateVanillaDerived')
    File script = new File(rootDirFile, 'tools/textures/vanilla_derived.py')
    File out = layout.buildDirectory.dir('generated-resources/vanillaDerived').get().asFile
    String python = (project.findProperty('sbPython') ?: System.getenv('SB_PYTHON')) as String
    String jar = (project.findProperty('sbClientJar') ?: System.getenv('SB_CLIENT_JAR')) as String
    boolean placeholders = project.hasProperty('sbVanillaDerivedPlaceholders')
    boolean skip = project.hasProperty('sbSkipVanillaDerived')
    boolean strict = project.hasProperty('sbVanillaDerivedStrict')
    boolean windows = System.getProperty('os.name', '').toLowerCase(Locale.ROOT).contains('windows')
    File gradleHome = gradle.gradleUserHomeDir
    def candidates = sbPythonCandidates(python, windows)
    def findPython = sbFindPython
    def runProcess = sbRunProcess
    return tasks.register('generateVanillaDerived') {
        description = 'Draws the Vanilla-derived textures (never committed) from the local 26.3 client jar.'
        inputs.files(fileTree(script.parentFile) { include '*.py' }).withPropertyName('generators')
        inputs.property('jar', jar ?: '')
        inputs.property('placeholders', placeholders)
        inputs.property('skip', skip)
        outputs.dir(out)
        // a fallback run must not stay up to date once Python/the jar is there
        outputs.upToDateWhen { !new File(out.parentFile, 'vanillaDerived.placeholder').exists() }
        doLast {
            project.delete(out)
            project.delete(new File(out.parentFile, 'vanillaDerived.placeholder'))
            // Never break the build on a missing Python/Pillow/numpy/jar (owner blocked on Windows 2026-10-12):
            // warn and ship grey placeholders drawn here in Groovy. -PsbVanillaDerivedStrict fails instead.
            def fallback = { String why ->
                if (strict) throw new GradleException(why)
                logger.warn("WARNING generateVanillaDerived: ${why}\n-> grey placeholder textures instead " +
                        '(the build goes on; the real textures need Python + Pillow + numpy and a 26.3 client jar).')
                sbVanillaDerivedPlaceholders(script, out)
            }
            if (skip) {
                logger.lifecycle('generateVanillaDerived: -PsbSkipVanillaDerived -> placeholder textures, no Python.')
                sbVanillaDerivedPlaceholders(script, out)
                return
            }
            Map<String, String> env = ['GRADLE_USER_HOME': gradleHome.absolutePath, 'PYTHONUTF8': '1',
                                       'PYTHONIOENCODING': 'utf-8']
            def (List<String> py, String problem) = findPython(candidates, !placeholders, rootDirFile, env)
            if (py == null) { fallback(problem); return }
            List<String> cmd = py + ['-B', script.absolutePath, '--out', out.absolutePath]
            if (jar) cmd += ['--jar', jar]
            if (placeholders) cmd << '--placeholder-if-missing'
            def (int code, String text) = runProcess(cmd, rootDirFile, env)
            text.readLines().each { logger.lifecycle(it) }
            if (code != 0) {
                List<String> lines = text.readLines()
                project.delete(out)
                fallback("vanilla_derived.py failed (exit ${code}, ${py.join(' ')}):\n" +
                        lines.drop(Math.max(0, lines.size() - 25)).join('\n'))
            }
        }
    }
}

// Placeholders without Python: every OUTPUTS entry of vanilla_derived.py ('path': ((w, h), ...)) as a grey
// checker PNG (no Mojang pixels). Same idea as vanilla_derived.placeholder_png, not the same tints.
ext.sbVanillaDerivedPlaceholders = { File script, File out ->
    def entries = (script.getText('UTF-8') =~ /(?m)^\s+'([a-z0-9_\/]+\.png)': \(\((\d+), (\d+)\)/).collect { it }
    if (!entries) throw new GradleException("no OUTPUTS found in ${script}")
    entries.each { m ->
        int w = m[2] as int, h = m[3] as int, step = Math.max(1, w.intdiv(8))
        def img = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        for (int y = 0; y < h; y++) for (int x = 0; x < w; x++) {
            img.setRGB(x, y, ((x.intdiv(step) + y.intdiv(step)) % 2) ? (int) 0xFF8A8A8AL : (int) 0xFF454545L)
        }
        File f = new File(out, "assets/simplebuilding/textures/${m[1]}")
        f.parentFile.mkdirs()
        javax.imageio.ImageIO.write(img, 'png', f)
    }
    new File(out.parentFile, 'vanillaDerived.placeholder').text = 'placeholders, see generateVanillaDerived\n'
    println "generateVanillaDerived: ${entries.size()} placeholder textures -> ${out}"
}

ext.mcLayeredResources = { SourceSet sourceSet, List<String> extraSharedDirs, String tag, List<Map> layers ->
    File sharedResources = new File(rootDirFile, 'src/main/resources')
    def vanillaDerived = sourceSet.name == 'main' ? mcVanillaDerivedTask() : null
    File derivedDir = vanillaDerived ? layout.buildDirectory.dir('generated-resources/vanillaDerived').get().asFile : null
    def isDerived = { FileTreeElement e -> derivedDir != null && !e.directory && new File(derivedDir, e.relativePath.pathString).isFile() }
    File sharedGenerated = new File(rootDirFile, 'src/main/generated')
    Map<File, Set<String>> removedCache = [:]
    def removedOf = { Map layer ->
        File f = layer.removed
        if (f == null || !f.isFile()) return [] as Set
        removedCache.computeIfAbsent(f) { (it.readLines().findAll { l -> l.trim() && !l.startsWith('#') } as Set) }
    }
    // Among the layers [0, below): index of the layer whose generated file ships for rel, -2 when a
    // removed list hides it first, -1 when none of them decides.
    def generatedWinner = { String rel, int below ->
        for (int i = 0; i < below; i++) {
            if (new File(layers[i].generated as File, rel).isFile()) return i
            if (removedOf(layers[i]).contains(rel)) return -2
        }
        return -1
    }
    def isRemovedList = { String rel -> rel ==~ /removed-on-[^\/]*\.txt/ }

    // One merged tree per module instead of several source directories with "first file wins":
    // with DuplicatesStrategy.EXCLUDE the winner depended on the order Gradle visited the
    // directories, and in one checkout the 26.2 datagen files won over their 26.3 twins (Fabric 26.3
    // then failed to load its registries). The merge task decides per path, explicitly (see above).
    String taskSuffix = sourceSet.name == 'main' ? '' : sourceSet.name.capitalize()
    File merged = layout.buildDirectory.dir('merged' + tag + taskSuffix).get().asFile
    def merge = tasks.register('mergeResources' + tag + taskSuffix, Sync) {
        description = "Merges the shared and the ${tag} overlay resources into one tree (newest layer wins per path)."
        into merged
        duplicatesStrategy = DuplicatesStrategy.FAIL
        List<File> sharedDirs = extraSharedDirs.collect { new File(rootDirFile, it) } + [sharedResources]
        (layers.collectMany { [it.overlay as File, it.generated as File] } + [sharedGenerated] + sharedDirs).each { File d ->
            if (d.isDirectory()) inputs.dir(d).withPropertyName('in_' + rootDirFile.toPath().relativize(d.toPath()).toString().replaceAll('[^A-Za-z0-9]', '_'))
        }
        // Vanilla-derived textures first; a stale local copy under an overlay must not collide with them.
        if (vanillaDerived) {
            dependsOn vanillaDerived
            from(derivedDir)
        }
        layers.eachWithIndex { Map layer, int i ->
            List<File> newerOverlays = layers.take(i).collect { it.overlay as File }
            from(layer.overlay) {
                exclude { FileTreeElement e -> !e.directory && newerOverlays.any { new File(it, e.relativePath.pathString).isFile() } }
                exclude isDerived
            }
        }
        sharedDirs.each { dir ->
            from(dir) {
                exclude { FileTreeElement e -> !e.directory && layers.any { new File(it.overlay as File, e.relativePath.pathString).isFile() } }
                exclude isDerived
            }
        }
        layers.eachWithIndex { Map layer, int i ->
            from(layer.generated) {
                exclude '.cache/**', 'wiki/**'
                exclude { FileTreeElement e -> !e.directory && (isRemovedList(e.relativePath.pathString) || generatedWinner(e.relativePath.pathString, i) != -1) }
                exclude isDerived
            }
        }
        from(sharedGenerated) {
            exclude '.cache/**', 'wiki/**'
            exclude { FileTreeElement e -> !e.directory && generatedWinner(e.relativePath.pathString, layers.size()) != -1 }
            exclude isDerived
        }
    }
    sourceSet.resources.setSrcDirs([merged])
    // sourcesJar packs the merged tree (Gradle 9 validation: declare the dependency).
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn merge }
    sourceSet.resources.exclude 'wiki/**'
    tasks.named(sourceSet.processResourcesTaskName, ProcessResources).configure {
        dependsOn merge
    }

    // Every winning overlay datagen file must reach the processed resources unchanged in content,
    // and no removed file may. Catches a precedence mistake like the one described above.
    def checkTask = tasks.register('checkResources' + tag + taskSuffix) {
        group = 'verification'
        description = "Checks that the ${tag} datagen and overlay files are what the module actually ships."
        dependsOn sourceSet.processResourcesTaskName
        File out = sourceSet.output.resourcesDir
        doLast {
            def norm = { File f -> f.getText('UTF-8').replace('\r\n', '\n').trim() }
            List<String> problems = []
            int checked = 0
            layers.eachWithIndex { Map layer, int i ->
                File generated = layer.generated
                // Wiki exports are metadata, excluded by mergeResources and processResources above.
                mc263RelativeFiles(generated).findAll { !isRemovedList(it) && !it.startsWith('.cache') && !it.startsWith('wiki/') }.each { String rel ->
                    if (generatedWinner(rel, i) != -1) return
                    File shipped = new File(out, rel)
                    checked++
                    if (!shipped.isFile()) problems << "missing: ${rel}"
                    else if (norm(shipped) != norm(new File(generated, rel))) problems << "not the ${generated.parentFile.name} version: ${rel}"
                }
                removedOf(layer).each { String rel ->
                    if (generatedWinner(rel, i) == -1 && new File(out, rel).isFile()) problems << "removed (${(layer.removed as File).name}) but shipped: ${rel}"
                }
            }
            if (problems) {
                throw new GradleException("${tag} resources of ${project.path} are wrong:\n  " + problems.take(20).join('\n  '))
            }
            logger.lifecycle("checkResources${tag}: ${checked} overlay datagen files shipped as generated")
        }
    }
    tasks.named('check') { dependsOn checkTask }

    mcVersionResourceRewrites(sourceSet)
}

// Build-time rewrites of shared resources written in 26.2 terms into the 26.3 format (the 26.4
// snapshot line uses them as well until a snapshot changes these formats again).
ext.mcVersionResourceRewrites = { SourceSet sourceSet ->
    File sharedResources = new File(rootDirFile, 'src/main/resources')
    // 26.3 trims read their colours from palette textures (textures/palettes/<id>.png) instead of
    // the armor trim atlas. The mod's palettes are copied, not duplicated in the repository: the
    // trim materials name simplebuilding:trim/<name> (McVersion.trimMaterial) and the items atlas
    // (rewritten below) points its permutations there as well.
    tasks.named(sourceSet.processResourcesTaskName, ProcessResources).configure {
        from(new File(sharedResources, 'assets/simplebuilding/textures/trims/color_palettes')) {
            into 'assets/simplebuilding/textures/palettes/trim'
        }
        // ...and the 26.2 copies stay out. 26.3 reads no palette from textures/trims/color_palettes
        // (vanilla moved its own to textures/palettes/trim), but NeoForge 26.3 still ships an items
        // atlas source neoforge:directory_paletted_permutations that pairs every palette found there
        // with every texture in textures/trims/items, keyed with the 26.2 palette
        // minecraft:trims/color_palettes/trim_palette. With the mod's 26.2 palettes present that made
        // 456 broken sprites (6 palettes x 76 trim masks, "Failed to load palette image") and replaced
        // the mod's own Astralit/Enderite/Nihilith trim item sprites. The armor_trims atlas is gone in
        // 26.3 as well. checkAtlases (gradle/check-atlases.gradle) guards both.
        List<String> droppedOn263 = ['assets/*/textures/trims/color_palettes/**', 'assets/minecraft/atlases/armor_trims.json']
        filesMatching(droppedOn263) {
            exclude()
        }
        // ProcessResources copies without deleting: copies from an earlier build would stay behind.
        doFirst {
            File out = destinationDir
            project.delete(project.fileTree(out) { include droppedOn263 })
        }
        // The items atlas (vanilla trim layers + the mod's 72 trim pattern masks) is written once, in
        // 26.2 terms, in src/main/resources. 26.3 names the palettes differently: key palette
        // minecraft:trim_base (pixel for pixel the 26.2 trim_palette) and palettes under
        // textures/palettes/trim - minecraft:trim/<x> for vanilla, simplebuilding:trim/<x> for the
        // mod's materials (copied above). Rewritten line by line at build time.
        filesMatching('assets/minecraft/atlases/items.json') {
            filter { String line ->
                line.replace('"minecraft:trims/color_palettes/trim_palette"', '"minecraft:trim_base"')
                        .replaceAll(/"minecraft:trims\/color_palettes\/((?:astralit|enderite|nihilith)(?:_darker)?)"/, '"simplebuilding:trim/$1"')
                        .replace('"minecraft:trims/color_palettes/', '"minecraft:trim/')
            }
        }
        // The hand-written villager trades (src/main/resources/data/simplebuilding/villager_trade)
        // use the 26.2 keys. 26.3 renamed "given_item_modifiers" to "given_item_modifier" and
        // dispatches item modifiers on "type" instead of "function"; nothing else in these files
        // uses either key (the load conditions say "condition"/"type"). One source, rewritten at
        // build time - TradeRegistryGameTest checks the result on 26.3.
        filesMatching('data/simplebuilding/villager_trade/**/*.json') {
            filter { String line ->
                line.replace('"given_item_modifiers":', '"given_item_modifier":')
                        .replace('"function":', '"type":')
                        // merchant_predicate (rare wandering trader cores): 26.3 dispatches loot
                        // conditions on "type" as well. Only this spelling - the load conditions
                        // keep their own "condition" key.
                        .replace('"condition": "minecraft:random_chance"', '"type": "minecraft:random_chance"')
            }
        }
    }
}
