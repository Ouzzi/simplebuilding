// Shared resource layout of the MC 26.3 modules (applied by mc26_3/fabric and mc26_3/neoforge) and,
// with one more layer on top, of the 26.4 snapshot modules (mc26_4/resources.gradle).
//
// The 26.3 line reuses the 26.2 resources and datagen output wherever they are valid and only adds
// what must differ, the same way the Java sources work:
//
//   src/main/resources          hand-written assets/data of the mod (shared)
//   mc26_3/overlay/resources    hand-written files that must differ on 26.3 (the Enderite equipment
//                               asset with its trim_overrides); hides the file with the same path in
//                               src/main/resources
//   src/main/generated          26.2 datagen output (shared where 26.3 would write the same)
//   mc26_3/generated            26.3 datagen output, ONLY the files that differ from
//                               src/main/generated; syncGenerated263 (after :mc26_3:fabric:runDatagen)
//                               keeps it that way. A file here hides its 26.2 twin, and
//                               mc26_3/generated/removed-on-26.3.txt lists 26.2 files that 26.3 does
//                               not generate at all (they are hidden as well).
//
// Precedence is decided per path by mergeResources263 (one merged tree per module), and
// checkResources263 (part of check) verifies the shipped result. The 26.4 snapshot line stacks
// mc26_4/overlay/resources and mc26_4/generated on top of the same layers (mcLayeredResources).

import groovy.io.FileType

def rootDirFile = rootProject.projectDir

ext.mc263RelativeFiles = { File dir ->
    Set<String> out = [] as Set
    if (dir.isDirectory()) {
        dir.eachFileRecurse(FileType.FILES) { f ->
            out << dir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
        }
    }
    return out
}

ext.mc263RemovedList = new File(rootDirFile, 'mc26_3/generated/removed-on-26.3.txt')

ext.mc263Layer = [overlay  : new File(rootDirFile, 'mc26_3/overlay/resources'),
                  generated: new File(rootDirFile, 'mc26_3/generated'),
                  removed  : new File(rootDirFile, 'mc26_3/generated/removed-on-26.3.txt')]

ext.mc263ConfigureResources = { SourceSet sourceSet, List<String> extraSharedDirs ->
    mcLayeredResources(sourceSet, extraSharedDirs, '263', [mc263Layer])
}

// Generic version-overlay resource merge. layers: newest first, each
// [overlay: File, generated: File, removed: File]:
//   - a layer's overlay resources hide older overlays and the shared resources (+ loader dirs);
//   - a layer's generated files hide older generated files and src/main/generated;
//   - a layer's removed list hides generated files of OLDER layers and of src/main/generated that
//     this version no longer produces.
ext.mcLayeredResources = { SourceSet sourceSet, List<String> extraSharedDirs, String tag, List<Map> layers ->
    File sharedResources = new File(rootDirFile, 'src/main/resources')
    File sharedGenerated = new File(rootDirFile, 'src/main/generated')
    Map<File, Set<String>> removedCache = [:]
    def removedOf = { Map layer ->
        File f = layer.removed
        if (f == null || !f.isFile()) return [] as Set
        removedCache.computeIfAbsent(f) { (it.readLines().findAll { l -> l.trim() && !l.startsWith('#') } as Set) }
    }
    // Among the layers [0, below): index of the layer whose generated file ships for rel, -2 when a
    // removed list hides it first, -1 when none of them decides.
    def generatedWinner = { String rel, int below ->
        for (int i = 0; i < below; i++) {
            if (new File(layers[i].generated as File, rel).isFile()) return i
            if (removedOf(layers[i]).contains(rel)) return -2
        }
        return -1
    }
    def isRemovedList = { String rel -> rel ==~ /removed-on-[^\/]*\.txt/ }

    // One merged tree per module instead of several source directories with "first file wins":
    // with DuplicatesStrategy.EXCLUDE the winner depended on the order Gradle visited the
    // directories, and in one checkout the 26.2 datagen files won over their 26.3 twins (Fabric 26.3
    // then failed to load its registries). The merge task decides per path, explicitly (see above).
    String taskSuffix = sourceSet.name == 'main' ? '' : sourceSet.name.capitalize()
    File merged = layout.buildDirectory.dir('merged' + tag + taskSuffix).get().asFile
    def merge = tasks.register('mergeResources' + tag + taskSuffix, Sync) {
        description = "Merges the shared and the ${tag} overlay resources into one tree (newest layer wins per path)."
        into merged
        duplicatesStrategy = DuplicatesStrategy.FAIL
        List<File> sharedDirs = extraSharedDirs.collect { new File(rootDirFile, it) } + [sharedResources]
        (layers.collectMany { [it.overlay as File, it.generated as File] } + [sharedGenerated] + sharedDirs).each { File d ->
            if (d.isDirectory()) inputs.dir(d).withPropertyName('in_' + rootDirFile.toPath().relativize(d.toPath()).toString().replaceAll('[^A-Za-z0-9]', '_'))
        }
        layers.eachWithIndex { Map layer, int i ->
            List<File> newerOverlays = layers.take(i).collect { it.overlay as File }
            from(layer.overlay) {
                exclude { FileTreeElement e -> !e.directory && newerOverlays.any { new File(it, e.relativePath.pathString).isFile() } }
            }
        }
        sharedDirs.each { dir ->
            from(dir) {
                exclude { FileTreeElement e -> !e.directory && layers.any { new File(it.overlay as File, e.relativePath.pathString).isFile() } }
            }
        }
        layers.eachWithIndex { Map layer, int i ->
            from(layer.generated) {
                exclude '.cache/**', 'wiki/**'
                exclude { FileTreeElement e -> !e.directory && (isRemovedList(e.relativePath.pathString) || generatedWinner(e.relativePath.pathString, i) != -1) }
            }
        }
        from(sharedGenerated) {
            exclude '.cache/**', 'wiki/**'
            exclude { FileTreeElement e -> !e.directory && generatedWinner(e.relativePath.pathString, layers.size()) != -1 }
        }
    }
    sourceSet.resources.setSrcDirs([merged])
    sourceSet.resources.exclude 'wiki/**'
    tasks.named(sourceSet.processResourcesTaskName, ProcessResources).configure {
        dependsOn merge
    }

    // Every winning overlay datagen file must reach the processed resources unchanged in content,
    // and no removed file may. Catches a precedence mistake like the one described above.
    def checkTask = tasks.register('checkResources' + tag + taskSuffix) {
        group = 'verification'
        description = "Checks that the ${tag} datagen and overlay files are what the module actually ships."
        dependsOn sourceSet.processResourcesTaskName
        File out = sourceSet.output.resourcesDir
        doLast {
            def norm = { File f -> f.getText('UTF-8').replace('\r\n', '\n').trim() }
            List<String> problems = []
            int checked = 0
            layers.eachWithIndex { Map layer, int i ->
                File generated = layer.generated
                mc263RelativeFiles(generated).findAll { !isRemovedList(it) && !it.startsWith('.cache') }.each { String rel ->
                    if (generatedWinner(rel, i) != -1) return
                    File shipped = new File(out, rel)
                    checked++
                    if (!shipped.isFile()) problems << "missing: ${rel}"
                    else if (norm(shipped) != norm(new File(generated, rel))) problems << "not the ${generated.parentFile.name} version: ${rel}"
                }
                removedOf(layer).each { String rel ->
                    if (generatedWinner(rel, i) == -1 && new File(out, rel).isFile()) problems << "removed (${(layer.removed as File).name}) but shipped: ${rel}"
                }
            }
            if (problems) {
                throw new GradleException("${tag} resources of ${project.path} are wrong:\n  " + problems.take(20).join('\n  '))
            }
            logger.lifecycle("checkResources${tag}: ${checked} overlay datagen files shipped as generated")
        }
    }
    tasks.named('check') { dependsOn checkTask }

    mcVersionResourceRewrites(sourceSet)
}

// Build-time rewrites of shared resources written in 26.2 terms into the 26.3 format (the 26.4
// snapshot line uses them as well until a snapshot changes these formats again).
ext.mcVersionResourceRewrites = { SourceSet sourceSet ->
    File sharedResources = new File(rootDirFile, 'src/main/resources')
    // 26.3 trims read their colours from palette textures (textures/palettes/<id>.png) instead of
    // the armor trim atlas. The mod's palettes are copied, not duplicated in the repository: the
    // trim materials name simplebuilding:trim/<name> (McVersion.trimMaterial) and the items atlas
    // (rewritten below) points its permutations there as well.
    tasks.named(sourceSet.processResourcesTaskName, ProcessResources).configure {
        from(new File(sharedResources, 'assets/simplebuilding/textures/trims/color_palettes')) {
            into 'assets/simplebuilding/textures/palettes/trim'
        }
        // The items atlas (vanilla trim layers + the mod's 72 trim pattern masks) is written once, in
        // 26.2 terms, in src/main/resources. 26.3 names the palettes differently: key palette
        // minecraft:trim_base (pixel for pixel the 26.2 trim_palette) and palettes under
        // textures/palettes/trim - minecraft:trim/<x> for vanilla, simplebuilding:trim/<x> for the
        // mod's materials (copied above). Rewritten line by line at build time.
        filesMatching('assets/minecraft/atlases/items.json') {
            filter { String line ->
                line.replace('"minecraft:trims/color_palettes/trim_palette"', '"minecraft:trim_base"')
                        .replaceAll(/"minecraft:trims\/color_palettes\/((?:astralit|enderite|nihilith)(?:_darker)?)"/, '"simplebuilding:trim/$1"')
                        .replace('"minecraft:trims/color_palettes/', '"minecraft:trim/')
            }
        }
        // The hand-written villager trades (src/main/resources/data/simplebuilding/villager_trade)
        // use the 26.2 keys. 26.3 renamed "given_item_modifiers" to "given_item_modifier" and
        // dispatches item modifiers on "type" instead of "function"; nothing else in these files
        // uses either key (the load conditions say "condition"/"type"). One source, rewritten at
        // build time - TradeRegistryGameTest checks the result on 26.3.
        filesMatching('data/simplebuilding/villager_trade/**/*.json') {
            filter { String line ->
                line.replace('"given_item_modifiers":', '"given_item_modifier":')
                        .replace('"function":', '"type":')
            }
        }
    }
}
