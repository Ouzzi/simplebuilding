plugins {
	id 'net.fabricmc.fabric-loom'
}

// Third supported Minecraft line (26.3), Fabric. NOT a copy: it compiles the same trees as the
// 26.2 root project - common/src/shared/java, the Fabric sources in the root src/main/java and the
// JEI plugin - plus mc26_3/overlay/java, which holds only the files that must differ on 26.3.
// Their 26.2 counterparts live in common/src/mc26_2/java, which only the 26.2 modules compile.
// checkOverlays (root build) guarantees that no class exists both in a shared tree and in an
// overlay.
version = rootProject.version
group = rootProject.group

base {
	archivesName = "${rootProject.archives_base_name}-${project.mc263_minecraft_version}"
}

def root = rootProject.layout.projectDirectory

sourceSets {
	main {
		java {
			srcDir root.dir('common/src/shared/java')
			srcDir root.dir('common/src/jei/java')
			srcDir root.dir('common/src/jade/java')
			srcDir root.dir('src/main/java')
			srcDir root.dir('mc26_3/overlay/java')
		}
	}
}

// Resources: shared trees plus the 26.3 overlays, see mc26_3/resources.gradle.
apply from: rootProject.file('mc26_3/resources.gradle')
mc263ConfigureResources(sourceSets.main, [])

// 26.3 datagen writes its full output to build/datagen263; syncGenerated263 then keeps in
// mc26_3/generated only what differs from the 26.2 output in src/main/generated (loot tables,
// advancements, worldgen features, trim materials, ...), and lists 26.2 files that 26.3 no longer
// generates in mc26_3/generated/removed-on-26.3.txt.
def datagenOut = layout.buildDirectory.dir('datagen263').get().asFile
fabricApi {
	configureDataGeneration {
		client = true
		outputDirectory = datagenOut
		// Not a resource dir: the full output lives only here until syncGenerated263 keeps the
		// differing part in mc26_3/generated. Loom would otherwise put build/datagen263 in front of
		// every other resource dir - which hid a broken resource precedence in checkouts that had
		// run datagen (the 26.2 files won wherever build/datagen263 did not exist).
		addToResources = false
	}

	// Same client test shape as the 26.2 root project (task :mc26_3:fabric:runClientGameTest).
	configureTests {
		createSourceSet = true
		modId = "simplebuilding-test"
		enableGameTests = false
	}
}

sourceSets.named('gametest') {
	java.srcDir root.dir('common/src/shared/clientgametest/java')
	java.srcDir root.dir('mc26_3/overlay/clientgametest/java')
	java.srcDir root.dir('src/gametest/java')
	resources.srcDir root.dir('src/gametest/resources')
}

loom {
	runs {
		gametest {
			server()
			name = "Game Test 26.3"
			vmArg "-Dfabric-api.gametest"
			// The full suite builds the whole test centre (TZ22); the default heap (1/4 of RAM) ran out in the gate.
			vmArg "-Xmx8G"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
			def gametestFilter = project.findProperty('gametestFilter')
			if (gametestFilter) {
				vmArg "-Dfabric-api.gametest.filter=${gametestFilter}"
			}
			runDir "build/gametest"
		}
	}
}
// Fresh world per run: world-saved state (e.g. capped ledgers) must not leak from earlier runs.
tasks.matching { it.name == 'runGametest' }.configureEach { doFirst { project.delete(file('build/gametest/world')) } }

repositories {
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://maven.blamejared.com/" }
	// Trinkets Updated (optional accessory slots, compileOnly API), see TrinketsCompat
	exclusiveContent {
		forRepository { maven { url = "https://maven.nucleoid.xyz/" } }
		filter { includeGroup "eu.pb4" }
	}
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

// Dev-only runtime mods (JEI, Jade, Mouse Tweaks, AppleSkin): synced into build/devMods and handed
// to runClient/runServer with -Dfabric.addMods, never to gametest/clientGameTest - same scheme as
// the root build.gradle. Switch off: -Pdev_mods=false.
def devModsEnabled = (project.findProperty('dev_mods') ?: 'true').toString().toBoolean()
configurations {
	devMods {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}
def syncDevMods = tasks.register('syncDevMods', Sync) {
	from configurations.devMods
	into layout.buildDirectory.dir('devMods')
}
if (devModsEnabled) {
	def devModsDir = layout.buildDirectory.dir('devMods').get().asFile.absolutePath
	tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
		dependsOn syncDevMods
		systemProperty 'fabric.addMods', devModsDir
	}
}

dependencies {
	implementation project(':common')
	minecraft "com.mojang:minecraft:${project.mc263_minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.mc263_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.mc263_fabric_version}"
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.mc263_cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	implementation "com.terraformersmc:modmenu:${project.mc263_modmenu_version}"

	compileOnly "mezz.jei:jei-${project.mc263_minecraft_version}-common-api:${project.mc263_jei_version}"
	// Trinkets Updated API for TrinketsCompat (optional, see the root build.gradle)
	compileOnly("eu.pb4:trinkets:${project.mc263_trinkets_version}") { transitive = false }
	// Jade plugin (common/src/jade/java), see the root build.gradle
	compileOnly "maven.modrinth:jade:${project.mc263_dev_jade_fabric}"
	devMods "mezz.jei:jei-${project.mc263_minecraft_version}-fabric:${project.mc263_jei_version}"
	devMods "maven.modrinth:jade:${project.mc263_dev_jade_fabric}"
	devMods "maven.modrinth:mouse-tweaks:${project.mc263_dev_mousetweaks_fabric}"
	devMods "maven.modrinth:appleskin:${project.mc263_dev_appleskin_fabric}"
	devMods "maven.modrinth:distanthorizons:${project.mc263_dev_dh_fabric}"
	devMods "maven.modrinth:voxy:${project.mc263_dev_voxy_fabric}"
	devMods "maven.modrinth:sodium:${project.mc263_dev_sodium_fabric}"

	implementation fabricApi.module("fabric-gametest-api-v1", project.mc263_fabric_version)
}

// B1 (b-lib01): SimpleBuilding's sub-mods come from modules/modules.json only - "requires" are the required sub-mods
// (depends, nested, on the classpath), "optional" the optional ones (nested), "fabricDevClasspath" optional ones SB's
// dev/test runs load as well. Order as in modules.json. Adding a sub-mod needs no edit here (AGENTS.md).
def sbModuleRegistry = new groovy.json.JsonSlurper().parse(rootProject.file('modules/modules.json')).modules
def sbModuleById = sbModuleRegistry.collectEntries { [(it.id): it] }
def sbEntry = sbModuleById['simplebuilding']
def sbRequiredSubMods = sbEntry.requires.findAll { sbModuleById[it]?.projects?.fabric }
def sbOptionalSubMods = sbEntry.optional.findAll { sbModuleById[it]?.projects?.fabric }
def sbFabricModId = { String id -> sbModuleById[id].modId ?: id }
def sbRequiredDepends = sbRequiredSubMods.collect { "\"${sbFabricModId(it)}\": \">=${sbModuleById[it].version}\"" }.join(', ')

processResources {
	inputs.property "version", project.version
	inputs.property "requiredSubMods", sbRequiredDepends
	// fabric.mod.json is shared with the 26.2 line; only the Minecraft and Cloth Config ranges
	// differ.
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
		filter { String line ->
			String out = line.replace('"minecraft": "~26.2"', '"minecraft": "~26.3"')
				// Required sub-mods of the 26.3 super-mod (PLAN-MODULAUFTEILUNG stage 4), bundled below.
				.replace('"cloth-config": ">=26.2"', '"cloth-config": ">=26.3", ' + sbRequiredDepends)
				// No REI for this line: the REI plugin tree is not compiled here, so no entrypoints.
				.replace('"com.simplebuilding.compat.rei.SimplebuildingReiClientPlugin"', '')
				.replace('"com.simplebuilding.compat.rei.SimplebuildingReiCommonPlugin"', '')
			// A required sub-mod is in depends now (above), not only suggested.
			sbRequiredSubMods.each { out = out.replace("\"${sbFabricModId(it)}\": \"*\",", '') }
			out
		}
	}
}

def syncGenerated263 = tasks.register('syncGenerated263') {
	group = 'fabric'
	description = 'Keeps in mc26_3/generated only the 26.3 datagen files that differ from src/main/generated.'
	doLast {
		File shared = rootProject.file('src/main/generated')
		File target = rootProject.file('mc26_3/generated')
		def norm = { File f -> f.getText('UTF-8').replace('\r\n', '\n') }
		Set<String> produced = mc263RelativeFiles(datagenOut).findAll { !it.startsWith('.cache') && (!it.startsWith('wiki/') || it == 'wiki/inworld.json' || it == 'wiki/items.json') } as Set
		if (produced.isEmpty()) {
			throw new GradleException("runDatagen produced nothing in ${datagenOut}")
		}
		Set<String> kept = [] as Set
		produced.each { String rel ->
			File out = new File(datagenOut, rel)
			File twin = new File(shared, rel)
			File dest = new File(target, rel)
			// A final newline is not a resource difference; avoid redundant overlays and wiki source drift.
            if (twin.isFile() && norm(twin).trim() == norm(out).trim()) {
				dest.delete()
			} else {
				dest.parentFile.mkdirs()
				dest.setText(norm(out), 'UTF-8')
				kept << rel
			}
		}
		// Stale files of an earlier run.
		mc263RelativeFiles(target).each { String rel ->
			if (rel != 'removed-on-26.3.txt' && !kept.contains(rel)) new File(target, rel).delete()
		}
		List<String> removed = (mc263RelativeFiles(shared).findAll { !it.startsWith('.cache') && !it.startsWith('wiki/') }
				- produced).toSorted()
		mc263RemovedList.setText('# 26.2 datagen files that the 26.3 datagen does not produce; hidden on 26.3.\n'
				+ '# Written by :mc26_3:fabric:syncGenerated263 - do not edit.\n'
				+ removed.collect { it + '\n' }.join(''), 'UTF-8')
		// Empty directories left behind.
		def dirs = []
		target.eachDirRecurse { dirs << it }
		dirs.reverse().each { if (it.list().length == 0) it.delete() }
		logger.lifecycle("mc26_3/generated: ${kept.size()} files differ from 26.2, ${removed.size()} 26.2 files removed")
	}
}
tasks.matching { it.name == 'runDatagen' }.configureEach {
	doFirst { project.delete(datagenOut) }
	finalizedBy syncGenerated263
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Texture atlas sources vs. the textures the game finds (gradle/check-atlases.gradle).
apply from: rootProject.file('gradle/check-atlases.gradle')
apply from: rootProject.file('gradle/jukebox-264.gradle')  // 26.4 jukebox from the snapshot jar (never on mc26_4)

apply from: rootProject.file('gradle/hub-devmods.gradle')
apply from: rootProject.file('gradle/hub-project-mods.gradle')

// Public cross-mod contracts are packaged on the main line only.
dependencies { implementation project(':framework'); include project(':framework') }
// Sub-mods of the super-mod from modules/modules.json (B1, see sbRequiredSubMods above): every sub-mod is nested for
// production (include); required ones and "fabricDevClasspath" are also compiled against and loaded in SB's dev/test
// runs (SB code reaches most of them only by id, util/*Refs). The other optional sub-mods are only nested: SB's own
// dev/test runs stay without them, each sub-mod's integration target loads it together with SimpleBuilding.
dependencies {
    (sbRequiredSubMods + sbEntry.fabricDevClasspath).unique().each { implementation project(sbModuleById[it].projects.fabric) }
    (sbRequiredSubMods + sbOptionalSubMods).unique().each { include project(sbModuleById[it].projects.fabric) }
}
// The development classpath already contains common; production jars must carry its bootstrap too.
tasks.named('jar') { from project(':common').sourceSets.main.output }
// The release jar carries the licence text (LicenseRef-SimpleMods-ARR), like every module jar (gradle/module-fabric.gradle).
tasks.named('jar') { from(rootProject.file('LICENSE')) { rename { "${it}_${project.base.archivesName.get()}" } } }

// REV24-F-14: the server gametests share the main source set with the mod (the trees are shared with 26.2/NeoForge), but
// only runGametest needs them, and it loads the class folders, not this jar. The release jar (also the one
// integration/standalone runs put in their mods folder, where SB's own suite never runs) leaves them out, together with
// their fabric-gametest entrypoints. The test centre (com.simplebuilding.dev, /sbtestcentre) stays: the owner builds it in
// his own worlds. The check below fails the build if an entrypoint lacks its class, a gametest class slipped in or the
// test centre is missing.
tasks.named('jar', Jar) {
	exclude 'com/simplebuilding/gametest/**'
	filesMatching('fabric.mod.json') {
		filter { String line -> line ==~ /\s*"com\.simplebuilding\.gametest\.[^"]*",?\s*/ ? null : line }
	}
	doLast {
		def zip = new java.util.zip.ZipFile(archiveFile.get().asFile)
		try {
			def json = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('fabric.mod.json')), 'UTF-8')
			def missing = json.entrypoints.collectMany { kind, list -> list.collect { it instanceof Map ? it.value : it } }
					.findAll { it.startsWith('com.simplebuilding.') }
					.collect { it.split('::')[0] }
					.findAll { zip.getEntry(it.replace('.', '/') + '.class') == null }
			def leaked = zip.entries().toList()*.name.findAll { it ==~ /com\/simplebuilding\/gametest\/.+/ }
			def centre = zip.getEntry('com/simplebuilding/dev/testcentre/TestCentreCommand.class') != null
			if (missing || leaked || !centre) {
				throw new GradleException("Release jar: entrypoints without class ${missing}, gametest classes ${leaked.take(5)}, test centre present: ${centre}")
			}
		} finally {
			zip.close()
		}
	}
}

sourceSets.main.java.srcDir rootProject.file('mc26_3/framework/java')
sourceSets.main.resources.srcDir rootProject.file('mc26_3/framework/resources')
