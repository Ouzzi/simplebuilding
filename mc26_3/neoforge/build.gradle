plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

// Third supported Minecraft line (26.3), NeoForge. NOT a copy: it compiles the same trees as the
// 26.2 :neoforge module - common/src/shared/java, neoforge/src/main/java and the JEI plugin - plus
// mc26_3/overlay/java, which holds only the files that must differ on 26.3 (their 26.2
// counterparts live in common/src/mc26_2/java). See mc26_3/fabric/build.gradle.
description = 'NeoForge 26.3 loader module for SimpleBuilding'

group = rootProject.group
version = rootProject.version

base {
    archivesName = "${rootProject.archives_base_name}-${rootProject.mc263_minecraft_version}-neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def root = rootProject.layout.projectDirectory

sourceSets {
    main {
        java {
            srcDir root.dir('common/src/shared/java')
            srcDir root.dir('common/src/jei/java')
            srcDir root.dir('common/src/jade/java')
            srcDir root.dir('neoforge/src/main/java')
            srcDir root.dir('mc26_3/overlay/java')
        }
    }

    // Automated in-world renderer proof, same shape as the 26.2 :neoforge module.
    clientGameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        java.srcDir root.dir('neoforge/src/clientGameTest/java')
        java.srcDir root.dir('common/src/shared/clientgametest/java')
        java.srcDir root.dir('mc26_3/overlay/clientgametest/java')
        resources.srcDir root.dir('neoforge/src/clientGameTest/resources')
    }
}

// Resources: shared trees plus the 26.3 overlays, see mc26_3/resources.gradle.
apply from: rootProject.file('mc26_3/resources.gradle')
mc263ConfigureResources(sourceSets.main, ['neoforge/src/main/resources'])
sourceSets.main.resources.exclude 'fabric.mod.json'

configurations {
    clientGameTestImplementation.extendsFrom implementation
    clientGameTestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = rootProject.mc263_neoforge_version

    mods {
        "${archives_base_name}" {
            sourceSet sourceSets.main
        }
        "${archives_base_name}clienttest" {
            sourceSet sourceSets.clientGameTest
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.clientGameTest)

def mainMod = neoForge.mods.getByName(project.archives_base_name.toString())
def clientTestMod = neoForge.mods.getByName(project.archives_base_name.toString() + 'clienttest')

def seedClientGameTestConfig = tasks.register('seedClientGameTestConfig') {
    description = 'Writes the NeoForge client config the automated renderer proof needs.'
    def configFile = layout.buildDirectory.file('run/clientGameTest/config/neoforge-client.toml')
    outputs.upToDateWhen { false }
    doLast {
        def file = configFile.get().asFile
        file.parentFile.mkdirs()
        def text = file.exists() ? file.text : ''
        if (text.contains('showLoadWarnings')) {
            file.text = text.replaceAll(/(?m)^showLoadWarnings\s*=.*$/, 'showLoadWarnings = false')
        } else {
            file.text = 'showLoadWarnings = false\n' + text
        }
    }
}

neoForge {
    runs {
        client {
            client()
            loadedMods = [mainMod]
        }
        // Task name: :mc26_3:neoforge:runClientGameTest
        clientGameTest {
            client()
            sourceSet = sourceSets.clientGameTest
            loadedMods = [mainMod, clientTestMod]
            gameDirectory = layout.buildDirectory.dir('run/clientGameTest')
            taskBefore seedClientGameTestConfig
            systemProperty 'simplebuilding.clienttest', 'true'
            programArguments.addAll '--width', '854', '--height', '480'
        }
        server {
            server()
            loadedMods = [mainMod]
            programArgument '--nogui'
        }
        // Task name: :mc26_3:neoforge:runGameTest
        gameTest {
            type = 'gameTestServer'
            loadedMods = [mainMod]
            programArguments.addAll '--tests',
                    (project.findProperty('gametestFilter') ?: "${project.archives_base_name}:*").toString(),
                    '--report', layout.buildDirectory.file('neoforge-junit.xml').get().asFile.absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.blamejared.com/' }
    // Curios API (optional accessory slots, compileOnly), see CuriosCompat
    exclusiveContent {
        forRepository { maven { url = 'https://maven.theillusivec4.top/' } }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// Dev-only runtime mods (JEI, Jade, Mouse Tweaks, AppleSkin), for the 'client' and 'server' runs only -
// same source-less 'devRuns' scheme as the 26.2 :neoforge module. Switch off: -Pdev_mods=false.
def devModsEnabled = (project.findProperty('dev_mods') ?: 'true').toString().toBoolean()
configurations {
    devMods {
        canBeConsumed = false
        canBeResolved = false
    }
}
if (devModsEnabled) {
    sourceSets {
        devRuns {
        }
    }
    configurations {
        devRunsImplementation.extendsFrom implementation
        devRunsRuntimeOnly.extendsFrom runtimeOnly, devMods
    }
    neoForge.addModdingDependenciesTo(sourceSets.devRuns)
    ['client', 'server'].each { runName ->
        neoForge.runs.getByName(runName).sourceSet = sourceSets.devRuns
    }
}

dependencies {
    implementation project(':common')
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}"

    compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}"
    // Curios API for CuriosCompat (optional, see neoforge/build.gradle)
    compileOnly("top.theillusivec4.curios:curios-neoforge:${rootProject.mc263_curios_version}:api") { transitive = false }
    // Jade plugin (common/src/jade/java), see the root build.gradle
    compileOnly("maven.modrinth:jade:${rootProject.mc263_dev_jade_neoforge}") { transitive = false }
    devMods("mezz.jei:jei-${rootProject.mc263_minecraft_version}-neoforge:${rootProject.mc263_jei_version}") { transitive = false }
    devMods("maven.modrinth:jade:${rootProject.mc263_dev_jade_neoforge}") { transitive = false }
    devMods("maven.modrinth:mouse-tweaks:${rootProject.mc263_dev_mousetweaks_neoforge}") { transitive = false }
    devMods("maven.modrinth:appleskin:${rootProject.mc263_dev_appleskin_neoforge}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            modVersion           : project.version,
            modId                : project.archives_base_name,
            loaderVersionRange   : rootProject.findProperty('neoforge_loader_version_range') ?: '[11,)',
            minecraftVersionRange: rootProject.mc263_minecraft_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
        filter { String line -> line.replace('SimpleBuilding for NeoForge 26.2', 'SimpleBuilding for NeoForge 26.3') }
        // Required sub-mods of the 26.3 super-mod (PLAN-MODULAUFTEILUNG stage 4), nested below.
        filter { String line -> line.startsWith('# Bundled optional Sub-Mods') ? '# Required Sub-Mods (26.3, split stage 4), nested.\n[[dependencies.simplebuilding]]\nmodId="simpleovens"\ntype="required"\nversionRange="[1.0.0,)"\nordering="NONE"\nside="BOTH"\n[[dependencies.simplebuilding]]\nmodId="simplemobheads"\ntype="required"\nversionRange="[1.0.0,)"\nordering="NONE"\nside="BOTH"\n[[dependencies.simplebuilding]]\nmodId="simplecrucibles"\ntype="required"\nversionRange="[1.0.0,)"\nordering="NONE"\nside="BOTH"\n[[dependencies.simplebuilding]]\nmodId="simpleoctets"\ntype="required"\nversionRange="[1.0.0,)"\nordering="NONE"\nside="BOTH"\n[[dependencies.simplebuilding]]\nmodId="simpleblocks"\ntype="required"\nversionRange="[1.0.0,)"\nordering="NONE"\nside="BOTH"\n[[dependencies.simplebuilding]]\nmodId="simplehammers"\ntype="required"\nversionRange="[1.0.0,)"\nordering="NONE"\nside="BOTH"\n[[dependencies.simplebuilding]]\nmodId="simplestorage"\ntype="required"\nversionRange="[1.0.0,)"\nordering="NONE"\nside="BOTH"\n\n' + line : line }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Texture atlas sources vs. the textures the game finds (gradle/check-atlases.gradle).
apply from: rootProject.file('gradle/check-atlases.gradle')
apply from: rootProject.file('gradle/jukebox-264.gradle')  // 26.4 jukebox from the snapshot jar (never on mc26_4)

apply from: rootProject.file('gradle/hub-devmods.gradle')
apply from: rootProject.file('gradle/hub-project-mods.gradle')

// Public cross-mod contracts are packaged on the main line only.
dependencies { implementation project(':framework'); jarJar project(':framework') }
// SimpleLib (crucibles, warm food) nested per principle 6a.
dependencies { jarJar project(':modules:simplelib:neoforge') }
// SB 26.3 code uses com.simplelib.api (crucible P5): compile against it and load it as its own mod in every dev/test run.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { implementation project(':modules:simplelib:neoforge') }
neoForge.mods { simplelib { sourceSet project(':modules:simplelib:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simplelib) }
// Simple Ovens: required Sub-Mod (PLAN-MODULAUFTEILUNG stage 4), nested and loaded in every dev/test run (it does not
// evaluate this project, so no cycle). SB code never imports it.
dependencies { jarJar project(':modules:simpleovens:neoforge') }
evaluationDependsOn(':modules:simpleovens:neoforge')
dependencies { implementation project(':modules:simpleovens:neoforge') }
neoForge.mods { simpleovens { sourceSet project(':modules:simpleovens:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simpleovens) }
// Simple Crucibles: required Sub-Mod (PLAN-MODULAUFTEILUNG stage 5), nested, compiled against (SimpleCruciblesApi) and loaded in every dev/test run.
dependencies { jarJar project(':modules:simplecrucibles:neoforge') }
evaluationDependsOn(':modules:simplecrucibles:neoforge')
dependencies { implementation project(':modules:simplecrucibles:neoforge') }
neoForge.mods { simplecrucibles { sourceSet project(':modules:simplecrucibles:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simplecrucibles) }
// Simple Octets: required Sub-Mod (split stage 6) - the octets moved there (simpleoctets:*, ids migrate); compiled against (cell API).
dependencies { jarJar project(':modules:simpleoctets:neoforge') }
evaluationDependsOn(':modules:simpleoctets:neoforge')
dependencies { implementation project(':modules:simpleoctets:neoforge') }
neoForge.mods { simpleoctets { sourceSet project(':modules:simpleoctets:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simpleoctets) }
// Simple Blocks: required Sub-Mod (b-blocksmove) - the building blocks without a home moved there (simpleblocks:*, ids migrate).
dependencies { jarJar project(':modules:simpleblocks:neoforge') }
evaluationDependsOn(':modules:simpleblocks:neoforge')
dependencies { implementation project(':modules:simpleblocks:neoforge') }
neoForge.mods { simpleblocks { sourceSet project(':modules:simpleblocks:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simpleblocks) }
// Simple Hammers: required Sub-Mod (split stage 7) - the sledgehammers moved there (simplehammers:*, ids migrate); compiled against (engine statics).
dependencies { jarJar project(':modules:simplehammers:neoforge') }
evaluationDependsOn(':modules:simplehammers:neoforge')
dependencies { implementation project(':modules:simplehammers:neoforge') }
neoForge.mods { simplehammers { sourceSet project(':modules:simplehammers:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simplehammers) }
// Simple Storage: required Sub-Mod (split stage 8a) - the crates and the Storage Crafting Table moved there (simplestorage:*, ids migrate).
dependencies { jarJar project(':modules:simplestorage:neoforge') }
evaluationDependsOn(':modules:simplestorage:neoforge')
dependencies { implementation project(':modules:simplestorage:neoforge') }
neoForge.mods { simplestorage { sourceSet project(':modules:simplestorage:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simplestorage) }
// Simple Maps bundled as a Sub-Mod (Super-/Sub-Mod concept); switch "Enable Simple Maps" in the config.
dependencies { jarJar project(':modules:simplemaps:neoforge') }
evaluationDependsOn(':modules:simplemaps:neoforge')
dependencies { implementation project(':modules:simplemaps:neoforge') }
neoForge.mods { simplemaps { sourceSet project(':modules:simplemaps:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simplemaps) }
// Simple Questionary bundled as a Sub-Mod; switch "Enable Simple Questionary" in the config.
dependencies { jarJar project(':modules:simplequestionary:neoforge') }
evaluationDependsOn(':modules:simplequestionary:neoforge')
dependencies { implementation project(':modules:simplequestionary:neoforge') }
neoForge.mods { simplequestionary { sourceSet project(':modules:simplequestionary:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simplequestionary) }
// Simple Mobheads: required Sub-Mod (KONZEPT-SIMPLE-MOBHEADS-2026-10-13), nested and loaded in every dev/test run.
dependencies { jarJar project(':modules:simplemobheads:neoforge') }
evaluationDependsOn(':modules:simplemobheads:neoforge')
dependencies { implementation project(':modules:simplemobheads:neoforge') }
neoForge.mods { simplemobheads { sourceSet project(':modules:simplemobheads:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simplemobheads) }
// Simple Trims: SB worlds hold trim data that migrates to simpletrims:* (N18 stage 2-4); loaded in SB's dev/test runs
// like Simple Maps (it does not evaluate this project, so no cycle). SB code never imports it.
evaluationDependsOn(':modules:simpletrims:neoforge')
dependencies { implementation project(':modules:simpletrims:neoforge') }
neoForge.mods { simpletrims { sourceSet project(':modules:simpletrims:neoforge').sourceSets.main } }
neoForge.runs.configureEach { loadedMods.add(neoForge.mods.simpletrims) }
// Optional Sub-Mods bundled for production (PLAN-MODULAUFTEILUNG stage 1a); switches "Enable Simple X" reach them via
// framework SubMods. Only jarJar: several of them evaluate this project for their integration runs, so no
// evaluationDependsOn/dev-run mods here (would be circular); SB code never imports them.
dependencies {
    jarJar project(':modules:simpleriding:neoforge')
    jarJar project(':modules:simplesandwiches:neoforge')
    jarJar project(':modules:simpletweaks:neoforge')
    jarJar project(':modules:simplemoney:neoforge')
    jarJar project(':modules:simplefun:neoforge')
    jarJar project(':modules:simpledimensions:neoforge')
    jarJar project(':modules:simpletrims:neoforge')
    jarJar project(':modules:simplemobs:neoforge')
    jarJar project(':modules:simpleend:neoforge')
    jarJar project(':modules:simplerespawn:neoforge')
    jarJar project(':modules:simplebeacons:neoforge')
    jarJar project(':modules:simpleshops:neoforge')
    jarJar project(':modules:simplewanderers:neoforge')
}
// The development classpath already contains common; production jars must carry its bootstrap too.
tasks.named('jar') { from project(':common').sourceSets.main.output }

sourceSets.main.java.srcDir rootProject.file('mc26_3/framework/java')
sourceSets.main.resources.srcDir rootProject.file('mc26_3/framework/resources')
