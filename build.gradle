plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		java {
			// Loader-neutral game code lives in common/src/shared/java and is compiled by
			// every loader module against its own Minecraft jar. Only Fabric-specific
			// classes (entrypoints, registration, datagen) stay in this module's src/main/java.
			srcDir "common/src/shared/java"
		}
		resources {
			srcDir "src/main/generated"
		}
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

    // Cloth Config Repository
	maven { url = "https://maven.shedaniel.me/" }

    // Mod Menu Repository
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

fabricApi {
	configureDataGeneration {
		client = true
	}

	// Client-side in-game tests: drive a real client, create a world, join it and
	// assert on what is actually on screen. This is the only way to cover the
	// in-world renderers, which a headless server test can never reach.
	configureTests {
		createSourceSet = true
		modId = "simplebuilding-test"
		enableGameTests = false
	}
}

// Automated in-game tests. Runs a headless server, loads the mod, executes every
// registered GameTest and fails the build on the first failing one.
loom {
	runs {
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
			runDir "build/gametest"
		}
	}
}

dependencies {
	implementation project(':common')

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config API (für das Config System)
    implementation("me.shedaniel.cloth:cloth-config-fabric:26.2.155") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Mod Menu (damit du den Config-Button im Spiel siehst)
    implementation "com.terraformersmc:modmenu:20.0.1"

	// In-game test framework
	implementation fabricApi.module("fabric-gametest-api-v1", project.fabric_version)

	// Test dependencies
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testImplementation "com.google.code.gson:gson:2.11.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	// WikiDataProvider schreibt nach src/main/generated/wiki/, und dieses
	// Verzeichnis ist ein resources-srcDir. Der Export ist reine Bauzeit-Zutat
	// fuer wiki/generate.py und hat im Mod-Jar nichts verloren.
	exclude "wiki/**"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
}

// The wiki under wiki/ is generated out of the mod's own data files, so it can only be
// wrong in one way: someone changed the mod and did not regenerate. This task turns
// that into a build failure instead of a stale page nobody notices. It writes nothing;
// it only compares what the mod would generate now with what is committed, and lists
// anything in the game that wiki/manual.json does not describe.
//   fix:   python wiki/generate.py        (regenerate)
//   skip:  gradlew build -PskipWiki       (only if python is unavailable on this machine)
tasks.register('checkWiki', Exec) {
	group = 'verification'
	description = 'Fails when wiki/data is out of date with the mod or something is undocumented.'
	workingDir = rootDir
	commandLine project.findProperty('wikiPython') ?: 'python', 'wiki/generate.py', '--check'
	onlyIf { !project.hasProperty('skipWiki') }
	inputs.dir('wiki')
	inputs.dir('src/main/generated')
	inputs.dir('src/main/resources/data')
	inputs.dir('src/main/resources/assets/simplebuilding/lang')
	inputs.file('common/src/shared/java/com/simplebuilding/config/SimplebuildingConfig.java')
	inputs.file('common/src/shared/java/com/simplebuilding/items/ModItems.java')
	inputs.file('common/src/shared/java/com/simplebuilding/blocks/ModBlocks.java')
	outputs.upToDateWhen { false }
}
tasks.named('check') { dependsOn 'checkWiki' }

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

