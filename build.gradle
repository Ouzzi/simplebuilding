plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		java {
			// Loader-neutral game code lives in common/src/shared/java and is compiled by
			// every loader module against its own Minecraft jar. Only Fabric-specific
			// classes (entrypoints, registration, datagen) stay in this module's src/main/java.
			srcDir "common/src/shared/java"
			// Files that must differ between Minecraft 26.2 and 26.3: the 26.2 side lives here and is
			// compiled only by the 26.2 modules (this one, :neoforge, :forge); the 26.3 twins live in
			// mc26_3/overlay/java. checkOverlays below keeps the two sets in step.
			srcDir "common/src/mc26_2/java"
			// JEI plugin (compileOnly JEI API, only ever loaded by JEI itself). Its own tree
			// because the forge module compiles common/src/shared/java too and there is no JEI
			// for Forge 26.2.
			srcDir "common/src/jei/java"
		}
		resources {
			srcDir "src/main/generated"
		}
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

    // Cloth Config Repository
	maven { url = "https://maven.shedaniel.me/" }

    // Mod Menu Repository
	maven { url = "https://maven.terraformersmc.com/releases/" }

	// JEI (API + dev runtime)
	maven { url = "https://maven.blamejared.com/" }

	// Dev-only runtime mods (Jade, Mouse Tweaks, AppleSkin), see devMods below
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

// Dev-only runtime mods: JEI, Jade, Mouse Tweaks, AppleSkin. They only reach the runClient and
// runServer TASKS - never the gametest or clientGameTest runs, whose screenshots and results must not
// change. Why not modLocalRuntime/localRuntime: those land on the main runtime classpath, which the
// server gametest run uses directly and the clientGameTest run inherits (Loom creates it with
// inherit(client) on a source set that extends main). Instead the jars are synced into
// build/devMods and handed to Fabric Loader with -Dfabric.addMods=<dir> on the two tasks only.
// IDE run configurations generated by Loom do not get them. Switch off: -Pdev_mods=false.
def devModsEnabled = (project.findProperty('dev_mods') ?: 'true').toString().toBoolean()
configurations {
	devMods {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}
def syncDevMods = tasks.register('syncDevMods', Sync) {
	description = 'Copies the dev-only runtime mods (JEI, Jade, Mouse Tweaks, AppleSkin) for runClient/runServer.'
	from configurations.devMods
	into layout.buildDirectory.dir('devMods')
}
if (devModsEnabled) {
	def devModsDir = layout.buildDirectory.dir('devMods').get().asFile.absolutePath
	tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
		dependsOn syncDevMods
		systemProperty 'fabric.addMods', devModsDir
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}

	// Client-side in-game tests: drive a real client, create a world, join it and
	// assert on what is actually on screen. This is the only way to cover the
	// in-world renderers, which a headless server test can never reach.
	configureTests {
		createSourceSet = true
		modId = "simplebuilding-test"
		enableGameTests = false
	}
}

// Automated in-game tests. Runs a headless server, loads the mod, executes every
// registered GameTest and fails the build on the first failing one.
// Client test bodies are shared across both loaders and both Minecraft lines, the same way
// the server tests share common/src/shared/java. The 'gametest' source set itself is
// created by Loom, so it is extended here rather than declared above - declaring it a
// second time fails the build with "a SourceSet with that name already exists".
// Only the client test source sets pull this in, so none of it can reach a shipped jar.
sourceSets.named('gametest') {
	java.srcDir 'common/src/shared/clientgametest/java'
}

loom {
	runs {
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/junit.xml"
			// Selektive Laeufe: ./gradlew <task> -PgametestFilter="simplebuilding:block_behaviour_*".
			// Fabric waehlt ueber eine JVM-Eigenschaft aus, nicht ueber ein Programmargument wie
			// NeoForge; der Name steht in GameTestSystemProperties von fabric-gametest-api-v1.
			// Ein LEERER Filter wird bewusst nicht gesetzt: der Laeufer wuerde dann gegen einen
			// Leerstring pruefen statt gegen "alles", und der Lauf waere still leer.
			def gametestFilter = project.findProperty('gametestFilter')
			if (gametestFilter) {
				vmArg "-Dfabric-api.gametest.filter=${gametestFilter}"
			}
			runDir "build/gametest"
		}
	}
}

dependencies {
	implementation project(':common')

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config API (für das Config System)
    implementation("me.shedaniel.cloth:cloth-config-fabric:26.2.155") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Mod Menu (damit du den Config-Button im Spiel siehst)
    implementation "com.terraformersmc:modmenu:20.0.1"

	// JEI plugin API (common/src/jei/java). compileOnly: the mod runs without JEI.
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"

	// Dev-only runtime mods, see configurations.devMods above. The JEI jar is the full distributable
	// (its mezz_config dependency is jar-in-jar), so no transitive resolution is needed.
	devMods "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	devMods "maven.modrinth:jade:${project.dev_jade_fabric}"
	devMods "maven.modrinth:mouse-tweaks:${project.dev_mousetweaks_fabric}"
	devMods "maven.modrinth:appleskin:${project.dev_appleskin_fabric}"

	// In-game test framework
	implementation fabricApi.module("fabric-gametest-api-v1", project.fabric_version)

	// Test dependencies
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testImplementation "com.google.code.gson:gson:2.11.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	// WikiDataProvider schreibt nach src/main/generated/wiki/, und dieses
	// Verzeichnis ist ein resources-srcDir. Der Export ist reine Bauzeit-Zutat
	// fuer wiki/generate.py und hat im Mod-Jar nichts verloren.
	exclude "wiki/**"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

test {
	useJUnitPlatform()
	// The source checks (ConstructorsTouchSingleSourceTest, LanguageFilesTest) read these trees
	// straight from disk. Declared as inputs, or a change in forge/ alone would leave the test task
	// "up to date" and the check would not run at all.
	inputs.dir("forge/src/main/java").withPropertyName("forgeSources")
	inputs.dir("neoforge/src/main/java").withPropertyName("neoforgeSources")
	inputs.dir("mc1_21_11/fabric/src/main/resources/assets/simplebuilding/lang").withPropertyName("legacyLang")
	inputs.dir("mc1_21_11/shared/java").withPropertyName("legacySharedSources")
	inputs.dir("mc1_21_11/fabric/src/main/java").withPropertyName("legacyFabricSources")
	inputs.dir("mc1_21_11/neoforge/src/main/java").withPropertyName("legacyNeoforgeSources")
}

// The wiki under wiki/ is generated out of the mod's own data files, so it can only be
// wrong in one way: someone changed the mod and did not regenerate.
//   generateWiki  regenerates wiki/data (python wiki/generate.py). Runs by itself after
//                 runDatagen: datagen is the step that turns Java constants into files, so
//                 one datagen run now updates mod data and wiki together.
//   checkWiki     turns a stale wiki into a build failure instead of a page nobody notices:
//                 it compares what the mod would generate now with what is committed and
//                 lists anything in the game that wiki/manual.json does not describe. It
//                 writes no wiki/data, but generate.py re-copies changed textures into
//                 wiki/assets on the way (the CI workflow .github/workflows/wiki.yml catches
//                 that with a git diff).
//   fix:   python wiki/generate.py        (regenerate)
//   skip:  gradlew ... -PskipWiki         (both tasks; only if python is unavailable here)
//   python elsewhere:  -PwikiPython=<path>
def wikiPython = project.findProperty('wikiPython') ?: 'python'
def wikiTaskGraph = gradle.taskGraph

tasks.register('generateWiki', Exec) {
	group = 'documentation'
	description = 'Regenerates wiki/data from the mod (python wiki/generate.py). Runs after runDatagen.'
	workingDir = rootDir
	commandLine wikiPython, 'wiki/generate.py'
	onlyIf { !project.hasProperty('skipWiki') }
	// A finalizer runs even when runDatagen failed; half-written datagen output is no base
	// for a wiki.
	onlyIf { !wikiTaskGraph.allTasks.any { it.name == 'runDatagen' && it.state.failure != null } }
}
// Loom registers runDatagen itself; matching() also catches a task registered later.
tasks.matching { it.name == 'runDatagen' }.configureEach { finalizedBy 'generateWiki' }

tasks.register('checkWiki', Exec) {
	group = 'verification'
	description = 'Fails when wiki/data is out of date with the mod or something is undocumented.'
	workingDir = rootDir
	commandLine wikiPython, 'wiki/generate.py', '--check'
	onlyIf { !project.hasProperty('skipWiki') }
	mustRunAfter 'generateWiki'
	inputs.dir('wiki')
	inputs.dir('src/main/generated')
	inputs.dir('src/main/resources/data')
	inputs.dir('src/main/resources/assets/simplebuilding/lang')
	inputs.file('common/src/shared/java/com/simplebuilding/config/SimplebuildingConfig.java')
	inputs.file('common/src/shared/java/com/simplebuilding/items/ModItems.java')
	inputs.file('common/src/shared/java/com/simplebuilding/blocks/ModBlocks.java')
	outputs.upToDateWhen { false }
}
tasks.named('check') { dependsOn 'checkWiki' }

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

