# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Mod Properties
mod_version=1.3.1
maven_group=com.simplebuilding
archives_base_name=simplebuilding

# Dependencies
fabric_version=0.158.0+26.2

# NeoForge
neoforge_version_channel=fixed
neoforge_version_fixed=26.2.0.69
neoforge_version_latest=26.+
neo_version=26.2.0.69
# javafml language provider version (NOT the NeoForge/Minecraft line version)
neoforge_loader_version_range=[11,)
minecraft_version_range=[26.2,26.3)

# Forge
forge_version_fixed=65.1.3
forge_loader_version_range=[65,)

# --- MC 1.21.11 line (second supported Minecraft version) ---
mc11_minecraft_version=1.21.11
mc11_fabric_version=0.141.6+1.21.11
mc11_cloth_version=21.11.153
mc11_modmenu_version=17.0.1-beta.1
mc11_neoforge_version=21.11.45
mc11_minecraft_version_range=[1.21.11,1.22)

# --- Recipe viewer + dev-only runtime mods ---
# JEI: compileOnly common API for the plugin (common/src/jei/java, mc1_21_11/jei/java) and the dev
# runtime jar. There is no JEI for MinecraftForge 26.2 (maven.blamejared.com has no jei-26.2-forge).
jei_version=30.38.0.229
mc11_jei_version=27.44.0.103
# Dev-only runtime mods from maven.modrinth, pinned by Modrinth VERSION ID because version numbers
# are not unique per loader (AppleSkin 3.0.10+mc26.2 is one number for Fabric AND NeoForge).
# They only reach the runClient/runServer tasks, never a gametest/clientGameTest run; -Pdev_mods=false
# switches them off. Human-readable versions: docs/PUBLISHING.md.
#   26.2:    Jade 26.2.11+fabric / 26.2.10+neoforge, Mouse Tweaks 2.31, AppleSkin 3.0.10+mc26.2
dev_jade_fabric=ue8CO97w
dev_jade_neoforge=GBES6etT
dev_mousetweaks_fabric=jOiTBIaB
dev_mousetweaks_neoforge=rokwij6O
dev_mousetweaks_forge=A88Ep3CF
dev_appleskin_fabric=uo5bAN1Y
dev_appleskin_neoforge=slnk1Qah
#   1.21.11: Jade 21.1.6+fabric / 21.1.7+neoforge, Mouse Tweaks 2.30, AppleSkin 3.0.8+mc1.21.11
mc11_dev_jade_fabric=swJhAyak
mc11_dev_jade_neoforge=LDFqgwEA
mc11_dev_mousetweaks_fabric=i1duwnJl
mc11_dev_mousetweaks_neoforge=bSiQNj2W
mc11_dev_appleskin_fabric=59ti1rvg
mc11_dev_appleskin_neoforge=MH9ov9DW

# --- MC 26.3 line (third Minecraft version, overlay build) ---
# No third full copy: the mc26_3 modules compile common/src/shared/java plus the small overlay
# mc26_3/overlay/java (only files that must differ on 26.3). Files that must differ on 26.2 live in
# common/src/mc26_2/java, compiled only by the 26.2 modules (root Fabric, neoforge, forge).
# Forge stays 26.2-only.
mc263_minecraft_version=26.3
mc263_loader_version=0.19.5
mc263_fabric_version=0.161.0+26.3
mc263_cloth_version=26.3.159
mc263_modmenu_version=21.0.0
mc263_neoforge_version=26.3.0.16-beta
mc263_minecraft_version_range=[26.3,26.4)
mc263_jei_version=31.7.0.37
