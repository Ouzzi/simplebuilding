# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.19.2
yarn_mappings=1.19.2+build.28
loader_version=0.14.25
loom_version=1.14-SNAPSHOT

# Mod Properties
mod_version=1.3
maven_group=com.simplebuilding
archives_base_name=simplebuilding

# Dependencies
fabric_version=0.76.1+1.19.2

# Multiloader scaffold (to be pinned per target Minecraft line)
forge_version_channel=fixed
forge_version_fixed=0.0.0
forge_version_latest=0.+

neoforge_version_channel=fixed
neoforge_version_fixed=0.0.0
neoforge_version_latest=26.+

# Legacy direct properties (still supported by build scripts)
forge_version=0.0.0
neoforge_version=0.0.0
forge_loader_version_range=[0,)
neoforge_loader_version_range=[26,)
minecraft_version_range=[1.19.2,1.20)