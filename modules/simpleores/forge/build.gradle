plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
// IG31-13: SimpleLib (IdMoves, provided Enderite, CoreHooks) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')
// ABN30-10: all textures are Vanilla-derived (recoloured gold sprites; built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
