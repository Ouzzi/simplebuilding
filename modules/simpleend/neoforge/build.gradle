plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
apply from: rootProject.file('gradle/module-neoforge.gradle')
// framework (SubMods switch of the SimpleBuilding super-mod) nested per principle 3.
dependencies { jarJar project(':framework') }
// Super-mod level 2 (docs/ai/PLAN-SIMPLE-END-2026-10-12.md): nests its optional sub-mod; no class imports.
dependencies { jarJar project(':modules:simpleenddragonfight:neoforge') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simpleend:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
