plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
apply from: rootProject.file('gradle/module-neoforge.gradle')
// framework (SubMods switch of the Simple QoL super-mod) nested per principle 3.
dependencies { jarJar project(':framework') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simpletools:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
repositories { maven { url = "https://maven.shedaniel.me/" } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}" }

// Module test run with SimpleBuilding (cross-mod checks with public ids); the standalone run stays without it.
dependencies { implementation project(':common') }
evaluationDependsOn(':mc26_3:neoforge')
neoForge { mods { simplebuilding { sourceSet project(':mc26_3:neoforge').sourceSets.main } } }
neoForge.runs.moduleIntegrationGameTest.loadedMods=[neoForge.mods.simpletools,neoForge.mods.simplebuilding]
