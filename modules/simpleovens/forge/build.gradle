plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simpleovens.mixins.json', 'simpleovens.forge.mixins.json']
// SimpleLib (IdMoves migration, in-world upgrades and their axe way, shared materials) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')
// Furnace minecart item textures are Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
