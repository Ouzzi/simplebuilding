plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
// 0.9.0: SimpleBuilding 26.3 requires simpleovens >=0.9.0 (modules stay 0.x until the owner's approval, then 1.0.0).
ext.moduleVersion = '0.9.0'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { jarJar project(':framework') }
// SimpleLib (IdMoves migration, in-world upgrades and their axe way, shared materials) nested per principle 6a; compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simpleovens:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
// Furnace minecart item textures are Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
