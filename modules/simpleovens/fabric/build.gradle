plugins { id 'net.fabricmc.fabric-loom' }
// 0.9.0-beta.1: SimpleBuilding 26.3 requires simpleovens >=0.9.0-beta.1 (first public files are betas, owner W3B 15.11.; version = modules.json).
ext.moduleVersion = '0.9.0-beta.1'
apply from: rootProject.file('gradle/module-fabric.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { include project(':framework') }
// SimpleLib (IdMoves migration, in-world upgrades and their axe way, shared materials) nested per principle 6a; compiled against.
dependencies { include project(':modules:simplelib:fabric'); implementation project(':modules:simplelib:fabric') }
// Furnace minecart item textures are Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Sub-mod Simple Foundry (ABN30-13, optional bundle): switched by "enableSimpleFoundry" in simpleovens-server.json. Not nested
// (simplebuilding-1, owner RELSB31 f1=A): an optional sub-mod is its own download once its release checklist is green.
// Sub-mod Simple Crucibles (IG31-15 B): nested (required bundle, stays its own mod with its own ids), switched by "enableSimpleCrucibles" in simpleovens-server.json.
dependencies { include project(':modules:simplecrucibles:fabric') }
