plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simpleloot.mixins.json', 'simpleloot.forge.mixins.json']
apply from: rootProject.file('gradle/module-forge.gradle')
ext.forgeNativeConfig = [id: 'simpleloot', modId: 'simpleloot', root: 'modules/simpleloot/shared/java', screens: ['com/simplebuilding/modules/simpleloot/LootScreen.java'], factory: 'com.simplebuilding.modules.simpleloot.LootScreen.create(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
