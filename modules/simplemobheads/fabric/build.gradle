plugins { id 'net.fabricmc.fabric-loom' }
ext.moduleVersion = '0.9.0'
apply from: rootProject.file('gradle/module-fabric.gradle')
// SimpleLib (IdMoves: the heads that moved in from Simple Fun and SimpleBuilding) nested per principle 6a; framework
// (WornHeads, SubMods, ConfigFiles, CreativeTabSettings) nested for standalone runs.
dependencies {
    include project(':modules:simplelib:fabric')
    implementation project(':modules:simplelib:fabric')
    include project(':framework')
}

repositories { maven { url = "https://maven.shedaniel.me/" }; maven { url = "https://maven.terraformersmc.com/releases/" } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.mc263_cloth_version}" }
dependencies { compileOnly "com.terraformersmc:modmenu:${rootProject.mc263_modmenu_version}" }

repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}" }
