plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.moduleVersion = '0.9.0'
ext.forgeExcludedSources = ['**/compat/MobHeadsJeiPlugin.java']
ext.forgeMixinConfigs = ['simplemobheads.mixins.json', 'simplemobheads.forge.mixins.json']
// SimpleLib (IdMoves) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')

ext.forgeNativeConfig = [id: 'simplemobheads', modId: 'simplemobheads', root: 'modules/simplemobheads/shared/java', screens: ['com/simplemobheads/client/MobHeadsConfigScreen.java'], factory: 'com.simplemobheads.client.MobHeadsConfigScreen.build(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
