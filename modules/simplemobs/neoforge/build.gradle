plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
apply from: rootProject.file('gradle/module-neoforge.gradle')
// framework (SubMods switch of the SimpleBuilding super-mod) nested per principle 3.
dependencies { jarJar project(':framework') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplemobs:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
// Shellker Shell item texture is Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
