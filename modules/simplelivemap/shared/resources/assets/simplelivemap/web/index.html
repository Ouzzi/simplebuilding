<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Simple Livemap</title>
<style>
  :root { --bg: #0f1418; --panel: rgba(16, 22, 28, 0.88); --text: #eef2f4; --muted: #b4bec6; --line: #3a4652; --accent: #7cc4ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; image-rendering: pixelated; }
  canvas.drag { cursor: grabbing; }
  .bar { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  select, button { background: #1c252e; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; padding: 4px 8px; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); }
  #info { position: fixed; left: 12px; bottom: 12px; color: var(--muted); }
  #report { position: fixed; right: 12px; bottom: 12px; color: var(--muted); font-size: 12px; text-decoration: underline; }
  #report:focus-visible { outline: 2px solid var(--accent); color: var(--text); }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80vw; text-align: center; display: none; }
  .title { font-weight: 600; }
  input[type=text] { background: #1c252e; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; padding: 4px 6px; width: 9.5em; }
  #panel { position: fixed; right: 12px; top: 64px; width: min(280px, calc(100vw - 24px)); display: none; }
  #panel.open { display: block; }
  #panel label { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  #panel h2 { font-size: 15px; margin: 0 0 6px; }
  #panel p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  #panel fieldset { border: 0; border-bottom: 1px solid var(--line); margin: 0 0 6px; padding: 0 0 6px; }
  #panel legend { padding: 0; font-weight: 600; }
  @media (max-width: 600px) { .bar { gap: 6px; } .box { padding: 4px 6px; } button, select { padding: 6px 9px; } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div class="bar">
  <span class="box title">Simple Livemap</span>
  <span class="box"><label>Dimension <select id="dim"></select></label></span>
  <span class="box"><button id="zin" aria-label="Zoom in">+</button> <button id="zout" aria-label="Zoom out">&minus;</button> <button id="home">0 / 0</button></span>
  <form class="box" id="goto"><input type="text" id="coords" placeholder="x z" aria-label="Go to coordinates (x z)" inputmode="numeric" autocomplete="off"> <button>Go</button></form>
  <span class="box" id="players" hidden><span id="pcount"></span> <label>Follow <select id="follow"><option value="">&ndash;</option></select></label></span>
  <span class="box"><button id="full" aria-label="Full screen" title="Full screen"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9" fill="none" stroke="currentColor" stroke-width="2"/></svg></button> <button id="gear" aria-label="View settings" title="View settings" aria-expanded="false" aria-controls="panel"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 3h10M2 7h10M2 11h10" stroke="currentColor" stroke-width="2"/><circle cx="5" cy="3" r="1.6" fill="currentColor"/><circle cx="9" cy="7" r="1.6" fill="currentColor"/><circle cx="4" cy="11" r="1.6" fill="currentColor"/></svg></button></span>
</div>
<div id="panel" class="box" role="dialog" aria-label="View settings">
  <h2>View settings</h2>
  <fieldset id="styles"><legend>Map style</legend>
    <label><input type="radio" name="style" value="blocks"> Blocks</label>
    <label><input type="radio" name="style" value="shaded"> Shaded relief</label>
    <label><input type="radio" name="style" value="paper"> Cartographer (paper map)</label>
  </fieldset>
  <label><input type="checkbox" id="o-players" checked> Show players</label>
  <label><input type="checkbox" id="o-coords" checked> Show coordinates</label>
  <label><input type="checkbox" id="o-grid"> Region grid (512 blocks)</label>
  <label><input type="checkbox" id="o-keep" checked> Remember position</label>
  <p>Kept in this browser only. Server settings: /simplelivemap config in game.</p>
</div>
<div id="info" class="box">x 0, z 0</div>
<a id="report" class="box" href="/report" hidden>Report map</a>
<div id="msg" class="box"></div>
<script>
"use strict";
// Viewer of Simple Livemap: tiles /tiles/<dim>/<z>/<x>/<y>.png (128 px; zoom 4 = 1 block per pixel), /live.json (players).
// The same page serves the built-in server of the mod (self-host) and livemap.simplemods.de (N34): relative paths only.
// A private map needs its key: the link carries it in the fragment (#t=...), which the browser never sends to a server;
// it goes out only as an Authorization header. Names are drawn on the canvas (no HTML from the server is ever shown).
// Map styles (N34c, chosen in the view settings, kept in this browser): "blocks" (default) = the tile pictures with block edges
// when zoomed in; "shaded" = hillshade and water depth from the height layer <dim>.h (red/green = y + 32768, blue = Vanilla
// brightness * 64 + fluid depth); "paper" = a cartographer's paper map with contour lines. Without a height tile the styles
// fall back to the colours alone.
const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const dimSel = document.getElementById("dim"), info = document.getElementById("info"), msg = document.getElementById("msg");
const playersBox = document.getElementById("players"), pcount = document.getElementById("pcount"), followSel = document.getElementById("follow");
const panel = document.getElementById("panel"), gear = document.getElementById("gear");
// View settings (this browser only; never sent anywhere). Storage can be missing (private windows): defaults then.
const STYLES = ["blocks", "shaded", "paper"];
const OPTS = { players: true, coords: true, grid: false, keep: true, style: "blocks" };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
try { Object.assign(OPTS, JSON.parse(store.get("slm-opts") || "{}")); } catch (e) {}
if (!STYLES.includes(OPTS.style)) OPTS.style = "blocks";
const VIEW_KEY = "slm-view:" + location.pathname;
const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
// On livemap.simplemods.de (/m/<map>/) the key goes in its own header, so a password prompt in front of the site (dev stage)
// keeps working; the built-in server of the mod reads the Authorization header.
const HOSTED = /^\/m\/[a-z0-9-]{1,64}\/$/.test(location.pathname);
const headers = token ? (HOSTED ? { "X-Livemap-Token": token } : { Authorization: "Bearer " + token }) : {};
if (HOSTED) { const rep = document.getElementById("report"); rep.href = "/report?map=" + location.pathname.split("/")[2]; rep.hidden = false; }
const TILE = 128, N = TILE * TILE, MAX_Z = 4, CACHE = 500, NO = -32768, RENDERS_PER_FRAME = 12;
const BG = { blocks: "#0f1418", shaded: "#0f1418", paper: "#d4c29a" };
let view = { x: 0, z: 0, s: 1 };            // centre in blocks, s = screen pixels per block
let dims = [], players = [], folder = "minecraft_overworld";
// key -> { img (colour bitmap), hd (heights {y, b} of a ".h" tile), px (colour bytes), r/rs (styled picture + its inputs),
// t (last use), at (last load), loading, v (finished loads) }; img/hd null = empty or failed.
const tiles = new Map();
let pending = 0, dirty = true, denied = false, following = "", pollMs = 2000, pollTimer = 0, budget = 0;
try { const v = OPTS.keep && JSON.parse(store.get(VIEW_KEY) || "null"); if (v && isFinite(v.x) && isFinite(v.z) && v.s > 0) { view = { x: v.x, z: v.z, s: v.s }; if (v.f) folder = v.f; } } catch (e) {}
// N106: optional start position in the link (#x=..&z=..[&s=..], also with #t=token) - wins over the stored view, so a shared
// link opens where it points; invalid values are ignored.
{ const h = new URLSearchParams(location.hash.slice(1)), hx = Number(h.get("x")), hz = Number(h.get("z")), hs = Number(h.get("s"));
  if (h.has("x") && h.has("z") && isFinite(hx) && isFinite(hz)) view = { x: hx + 0.5, z: hz + 0.5, s: hs > 0 && hs <= 16 ? hs : view.s }; }

let layer = null, lctx = null;                // off-screen copy for the block edges (only drawn where tiles are)
function resize() {
  const r = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * r); canvas.height = Math.round(innerHeight * r);
  ctx.setTransform(r, 0, 0, r, 0, 0);
  if (layer) { layer.width = canvas.width; layer.height = canvas.height; lctx.setTransform(r, 0, 0, r, 0, 0); }
  dirty = true;
}
function level() { return Math.max(0, Math.min(MAX_Z, Math.round(MAX_Z + Math.log2(view.s)))); }

// ------------------------------------------------------------------ tiles (colour pictures and the height layer)
function entry(key) {
  const now = performance.now();
  let t = tiles.get(key);
  if (t) {
    t.t = now;
    if (!t.loading && now - t.at > 30000 && pending < 8) load(key, t);   // tiles change while players explore
    return t;
  }
  if (pending >= 8) return null;
  t = { img: null, hd: null, px: null, r: null, rs: "", t: now, at: now, loading: false, v: 0 };
  tiles.set(key, t);
  load(key, t);
  if (tiles.size > CACHE) {
    const old = [...tiles.entries()].sort((a, b) => a[1].t - b[1].t).slice(0, tiles.size - CACHE);
    for (const [k, v] of old) { if (v.img && v.img.close) v.img.close(); tiles.delete(k); }
  }
  return t;
}

function load(key, t) {
  const height = key.includes(".h/");          // a dimension folder never ends with ".h" (TileStore.folder)
  t.loading = true; t.at = performance.now(); pending++;
  let raw = null;
  fetch("tiles/" + key + ".png", { headers, cache: "no-cache" }).then(r => {
    if (r.status === 401) { denied = true; throw 0; }
    return r.status === 200 ? r.arrayBuffer() : null;
  }).then(async buf => {
    if (!buf) return null;
    raw = await decodePng(buf).catch(() => null);
    if (height && raw) return null;             // heights need no picture
    return createImageBitmap(new Blob([buf], { type: "image/png" }), height ? { premultiplyAlpha: "none", colorSpaceConversion: "none" } : {});
  }).then(img => {
    if (height) {
      t.hd = raw ? heightsOf(raw) : img ? heightsOf(bytes(img)) : null;
      if (img && img.close) img.close();
    } else {
      if (t.img && t.img.close && t.img !== img) t.img.close();
      t.img = img; t.px = img ? raw : null;
    }
    t.v++;
  }).catch(() => {}).finally(() => { t.loading = false; pending--; dirty = true; });
}

// Own PNG reader (8-bit RGBA, the format of the mod's tiles) for the pixel values of the styles: reading them back from a canvas
// is not exact in every browser (fingerprinting protection adds noise in Safari private windows, Brave, Firefox with
// resistFingerprinting; colour management). Null for any other format or a missing DecompressionStream -> canvas fallback.
async function decodePng(buf) {
  if (typeof DecompressionStream !== "function") return null;
  const d = new Uint8Array(buf), dv = new DataView(buf), parts = [];
  if (d.length < 33 || dv.getUint32(0) !== 0x89504e47 || dv.getUint32(4) !== 0x0d0a1a0a) return null;
  let p = 8, w = 0, h = 0;
  while (p + 12 <= d.length) {
    const len = dv.getUint32(p), type = dv.getUint32(p + 4);
    if (p + 12 + len > d.length) return null;
    if (type === 0x49484452) {                  // IHDR: 8 bit, colour type 6 (RGBA), not interlaced
      w = dv.getUint32(p + 8); h = dv.getUint32(p + 12);
      if (d[p + 16] !== 8 || d[p + 17] !== 6 || d[p + 20] !== 0) return null;
    } else if (type === 0x49444154) parts.push(d.subarray(p + 8, p + 8 + len));
    else if (type === 0x49454e44) break;
    p += 12 + len;
  }
  if (w !== TILE || h !== TILE || !parts.length) return null;
  const z = new Uint8Array(await new Response(new Blob(parts).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer());
  const stride = TILE * 4, out = new Uint8ClampedArray(N * 4);
  if (z.length < TILE * (stride + 1)) return null;
  for (let y = 0; y < TILE; y++) {
    const f = z[y * (stride + 1)], s = y * (stride + 1) + 1, o = y * stride;
    for (let x = 0; x < stride; x++) {
      const a = x >= 4 ? out[o + x - 4] : 0, b = y ? out[o - stride + x] : 0, c = x >= 4 && y ? out[o - stride + x - 4] : 0;
      let v = z[s + x];
      if (f === 1) v += a; else if (f === 2) v += b; else if (f === 3) v += (a + b) >> 1;
      else if (f === 4) { const q = a + b - c, pa = Math.abs(q - a), pb = Math.abs(q - b), pc = Math.abs(q - c); v += pa <= pb && pa <= pc ? a : pb <= pc ? b : c; }
      else if (f !== 0) return null;
      out[o + x] = v & 255;
    }
  }
  return out;
}

const scratch = document.createElement("canvas"); scratch.width = scratch.height = TILE;
const sctx = scratch.getContext("2d", { willReadFrequently: true });
const outImg = sctx.createImageData(TILE, TILE);
function bytes(img) { sctx.clearRect(0, 0, TILE, TILE); sctx.drawImage(img, 0, 0); return sctx.getImageData(0, 0, TILE, TILE).data; }
function heightsOf(d) {
  const y = new Int16Array(N), b = new Uint8Array(N);
  for (let i = 0, p = 0; i < N; i++, p += 4) {
    if (d[p + 3]) { y[i] = ((d[p] << 8) | d[p + 1]) - 32768; b[i] = d[p + 2]; } else y[i] = NO;
  }
  return { y, b };
}

// ------------------------------------------------------------------ styles "shaded" and "paper": one 128 x 128 picture per tile
const MOD = [180, 220, 255, 135];             // Vanilla map brightness LOW, NORMAL, HIGH, LOWEST (of 255)
const DEEP = Array.from({ length: 64 }, (_, d) => 1 - Math.exp(-d / 7));
const P = TILE + 2, padY = new Int16Array(P * P), padB = new Uint8Array(P * P);
const PAPER = [238, 226, 196], WATER_INK = [112, 150, 160], SHORE_INK = [52, 76, 86], CONTOUR = [104, 72, 42];

/** Own heights in the middle, one row/column of each loaded neighbour around them (NO where unknown): shading without seams. */
function pad(h, n, s, e, w) {
  padY.fill(NO); padB.fill(0);
  if (h) for (let y = 0; y < TILE; y++) { padY.set(h.y.subarray(y * TILE, y * TILE + TILE), (y + 1) * P + 1); padB.set(h.b.subarray(y * TILE, y * TILE + TILE), (y + 1) * P + 1); }
  if (n) { padY.set(n.y.subarray(N - TILE), 1); padB.set(n.b.subarray(N - TILE), 1); }
  if (s) { padY.set(s.y.subarray(0, TILE), (P - 1) * P + 1); padB.set(s.b.subarray(0, TILE), (P - 1) * P + 1); }
  for (let y = 0; y < TILE; y++) {
    if (w) { padY[(y + 1) * P] = w.y[y * TILE + TILE - 1]; padB[(y + 1) * P] = w.b[y * TILE + TILE - 1]; }
    if (e) { padY[(y + 1) * P + P - 1] = e.y[y * TILE]; padB[(y + 1) * P + P - 1] = e.b[y * TILE]; }
  }
}

function styled(t, z, tx, ty, style) {
  const hk = folder + ".h/" + z + "/";
  const H = entry(hk + tx + "/" + ty);
  if (!H || (H.loading && !H.v)) return null;                   // wait for the own height tile once
  const nb = [hk + tx + "/" + (ty - 1), hk + tx + "/" + (ty + 1), hk + (tx + 1) + "/" + ty, hk + (tx - 1) + "/" + ty].map(k => tiles.get(k));
  const sig = style + "|" + t.v + "|" + H.v + nb.map(e => "|" + (e ? e.v : -1)).join("");
  if (t.r && t.rs === sig) return t.r;
  if (budget <= 0) { dirty = true; return t.r && t.rs.startsWith(style + "|") ? t.r : null; }
  budget--;
  pad(H.hd, ...nb.map(e => e && e.hd));
  paint(t.px || (t.px = bytes(t.img)), z, style);
  if (!t.r) { t.r = document.createElement("canvas"); t.r.width = t.r.height = TILE; }
  t.r.getContext("2d").putImageData(outImg, 0, 0);
  t.rs = sig;
  return t.r;
}

function paint(c, z, style) {
  const o = outImg.data, step = 1 << (MAX_Z - z), paper = style === "paper";
  const ex = paper ? 0.9 : 1.1, minor = 8 * (z >= 3 ? 1 : z === 2 ? 2 : 4), major = minor * 4;
  for (let y = 0; y < TILE; y++) for (let x = 0; x < TILE; x++) {
    const p = (y * TILE + x) * 4, q = (y + 1) * P + x + 1;
    if (!c[p + 3]) { o[p + 3] = 0; continue; }
    let r = c[p], g = c[p + 1], b = c[p + 2];
    const h = padY[q], bb = padB[q], depth = h === NO ? 0 : bb & 63;
    let shade = 1, lo = h;
    if (h !== NO) {
      const k = 220 / MOD[bb >> 6];                              // take the Vanilla relief back out of the colour
      r = Math.min(255, r * k); g = Math.min(255, g * k); b = Math.min(255, b * k);
      const hw = padY[q - 1], he = padY[q + 1], hn = padY[q - P], hs = padY[q + P];
      const w = hw === NO ? h : hw, e = he === NO ? h : he, n = hn === NO ? h : hn, s = hs === NO ? h : hs;
      const nx = -(e - w) / (2 * step) * ex, nz = -(s - n) / (2 * step) * ex;   // light from the north-west, 45 degrees up
      shade = Math.max(0, (-0.5 * nx - 0.5 * nz + 0.7071) / Math.sqrt(nx * nx + nz * nz + 1)) / 0.7071;
      lo = Math.min(w, e, n, s);
    }
    if (!paper) {
      const f = depth ? 1.12 - 0.62 * DEEP[depth]
        : h === NO ? 1 : (0.4 + 0.6 * shade) * (1 + 0.1 * Math.max(-0.5, Math.min(1, (h - 64) / 128)));
      o[p] = Math.min(255, r * f); o[p + 1] = Math.min(255, g * f); o[p + 2] = Math.min(255, b * f); o[p + 3] = 255;
      continue;
    }
    if (depth && b > r + 30 && b > g) {                          // water: blue-grey wash, darker when deep, inked shore
      const m = 0.32 + 0.33 * DEEP[depth];
      let cr = PAPER[0] + (WATER_INK[0] - PAPER[0]) * m, cg = PAPER[1] + (WATER_INK[1] - PAPER[1]) * m, cb = PAPER[2] + (WATER_INK[2] - PAPER[2]) * m;
      let shore = false;
      for (const d of [-1, 1, -P, P]) if (padY[q + d] !== NO && (padB[q + d] & 63) === 0) shore = true;
      if (shore) { cr += (SHORE_INK[0] - cr) * 0.8; cg += (SHORE_INK[1] - cg) * 0.8; cb += (SHORE_INK[2] - cb) * 0.8; }
      o[p] = cr; o[p + 1] = cg; o[p + 2] = cb; o[p + 3] = 255;
      continue;
    }
    // land: the block colour as a sepia ink wash on the paper, soft relief, contour lines on the upper side of each step
    const l = 0.3 * r + 0.59 * g + 0.11 * b;
    const ir = r + (l * 1.06 + 18 - r) * 0.62, ig = g + (l * 0.94 + 8 - g) * 0.62, ib = b + (l * 0.72 - b) * 0.62;
    const f = 0.86 + 0.14 * Math.min(1.4, shade);
    let cr = PAPER[0] * (0.4 + 0.6 * ir / 255) * f, cg = PAPER[1] * (0.4 + 0.6 * ig / 255) * f, cb = PAPER[2] * (0.4 + 0.6 * ib / 255) * f;
    // no contour lines on tree tops (Vanilla map colour "plant" of leaves): they follow the canopy, not the ground
    const leaves = r < 24 && b < 24 && g > 80 && g < 135;
    if (h !== NO && !leaves && Math.floor(h / minor) > Math.floor(lo / minor)) {
      const a = Math.floor(h / major) > Math.floor(lo / major) ? 0.78 : 0.42;
      cr += (CONTOUR[0] - cr) * a; cg += (CONTOUR[1] - cg) * a; cb += (CONTOUR[2] - cb) * a;
    }
    o[p] = Math.min(255, cr); o[p + 1] = Math.min(255, cg); o[p + 2] = Math.min(255, cb); o[p + 3] = 255;
  }
}

// ------------------------------------------------------------------ own small textures (no game pixels)
function noiseCanvas(size, seed, fill) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d"), d = x.createImageData(size, size);
  for (let i = 0; i < size * size; i++) { seed = (seed * 16807) % 2147483647; fill(d.data, i * 4, seed / 2147483647); }
  x.putImageData(d, 0, 0);
  return c;
}
// One texel per block: a little lighter or darker, so neighbouring blocks of one colour still read as blocks.
const blockNoise = noiseCanvas(128, 4711, (d, p, v) => { const c = v < 0.5 ? 0 : 255; d[p] = d[p + 1] = d[p + 2] = c; d[p + 3] = Math.abs(v - 0.5) * 56; });
const paperGrain = noiseCanvas(128, 99, (d, p, v) => { d[p] = d[p + 1] = d[p + 2] = 226 + v * 29; d[p + 3] = 255; });
let blockPattern = null;
const grainPattern = ctx.createPattern(paperGrain, "repeat");

/** Style "blocks", zoomed in: per-block texture from 3 px per block, bevelled block edges from 6 px (only where tiles are). */
function blockEdges(g, left, top, w, h) {
  const s = view.s;
  g.save();
  g.globalCompositeOperation = "source-atop";
  g.globalAlpha = Math.min(1, (s - 2) / 4);
  blockPattern.setTransform(new DOMMatrix([s, 0, 0, s, -left * s, -top * s]));
  g.fillStyle = blockPattern; g.fillRect(0, 0, w, h);
  if (s >= 6) {
    g.globalAlpha = Math.min(1, (s - 5) / 3); g.lineWidth = 1;
    const x0 = Math.floor(left), x1 = Math.ceil(left + w / s), z0 = Math.floor(top), z1 = Math.ceil(top + h / s);
    for (const [shift, colour] of [[0.5, "rgba(255,255,255,0.16)"], [-0.5, "rgba(0,0,0,0.26)"]]) {
      g.beginPath();
      for (let bx = x0; bx <= x1; bx++) { const sx = Math.round((bx - left) * s) + shift; g.moveTo(sx, 0); g.lineTo(sx, h); }
      for (let bz = z0; bz <= z1; bz++) { const sz = Math.round((bz - top) * s) + shift; g.moveTo(0, sz); g.lineTo(w, sz); }
      g.strokeStyle = colour; g.stroke();
    }
  }
  g.restore();
}

/** Style "paper": paper grain, darker edges and a compass rose (north = up = -z). */
function paperFinish(w, h) {
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = grainPattern; ctx.fillRect(0, 0, w, h);
  const v = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.hypot(w, h) / 2);
  v.addColorStop(0, "rgba(140,104,60,0)"); v.addColorStop(1, "rgba(140,104,60,0.38)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);
  ctx.restore();
}
function compass(w, h) {
  const r = w < 600 ? 24 : 34, ink = "#2a1f14", light = "#efe3c4";
  ctx.save();
  ctx.translate(w - r - 20, h - r - 22 - (HOSTED ? 34 : 0));   // above the "Report map" link of the hosted map
  ctx.lineWidth = 1.2; ctx.strokeStyle = ink; ctx.fillStyle = "rgba(239,227,196,0.8)";
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  for (const k of [1, 3, 5, 7, 0, 2, 4, 6]) {
    const len = k % 2 ? r * 0.58 : r, wd = k % 2 ? r * 0.12 : r * 0.19;
    ctx.save(); ctx.rotate(k * Math.PI / 4);
    ctx.beginPath(); ctx.moveTo(0, -len); ctx.lineTo(wd, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fillStyle = ink; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -len); ctx.lineTo(-wd, 0); ctx.lineTo(0, 0); ctx.closePath(); ctx.fillStyle = light; ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.font = "bold " + Math.round(r * 0.46) + "px Georgia, serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.lineWidth = 3; ctx.strokeStyle = light; ctx.strokeText("N", 0, -r - 1);   // light halo: readable on the darker paper edge
  ctx.fillStyle = ink; ctx.fillText("N", 0, -r - 1);
  ctx.restore();
}

// ------------------------------------------------------------------ drawing
function draw() {
  requestAnimationFrame(draw);
  if (!dirty) return;
  dirty = false; budget = RENDERS_PER_FRAME;
  const style = OPTS.style, w = innerWidth, h = innerHeight, z = level(), span = TILE * (1 << (MAX_Z - z));
  ctx.fillStyle = BG[style]; ctx.fillRect(0, 0, w, h);
  const edges = style === "blocks" && view.s >= 3;
  if (edges && !layer) {
    layer = document.createElement("canvas"); lctx = layer.getContext("2d");
    blockPattern = lctx.createPattern(blockNoise, "repeat"); resize();
  }
  const g = edges ? lctx : ctx;
  if (edges) g.clearRect(0, 0, w, h);
  g.imageSmoothingEnabled = false; ctx.imageSmoothingEnabled = false;
  const left = view.x - w / 2 / view.s, top = view.z - h / 2 / view.s;
  const tx0 = Math.floor(left / span), tz0 = Math.floor(top / span);
  const tx1 = Math.floor((left + w / view.s) / span), tz1 = Math.floor((top + h / view.s) / span);
  for (let ty = tz0; ty <= tz1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const t = entry(folder + "/" + z + "/" + tx + "/" + ty);
    if (!t || !t.img) continue;
    let src = t.img;
    if (style !== "blocks") src = styled(t, z, tx, ty, style) || (style === "shaded" ? t.img : null);
    if (src) g.drawImage(src, (tx * span - left) * view.s, (ty * span - top) * view.s, span * view.s, span * view.s);
  }
  if (edges) { blockEdges(g, left, top, w, h); ctx.drawImage(layer, 0, 0, w, h); }
  if (style === "paper") paperFinish(w, h);
  if (OPTS.grid) {
    ctx.strokeStyle = style === "paper" ? "rgba(74,56,38,0.4)" : "rgba(255,255,255,0.18)"; ctx.lineWidth = 1; ctx.beginPath();
    for (let gx = Math.floor(left / 512) * 512; gx < left + w / view.s; gx += 512) { const sx = Math.round((gx - left) * view.s) + 0.5; ctx.moveTo(sx, 0); ctx.lineTo(sx, h); }
    for (let gz = Math.floor(top / 512) * 512; gz < top + h / view.s; gz += 512) { const sz = Math.round((gz - top) * view.s) + 0.5; ctx.moveTo(0, sz); ctx.lineTo(w, sz); }
    ctx.stroke();
  }
  const dimId = (dims.find(d => d.folder === folder) || {}).id;
  ctx.font = "13px system-ui, sans-serif"; ctx.textBaseline = "middle";
  for (const p of OPTS.players ? players : []) {
    if (p.dimension !== dimId) continue;
    const px = (p.x + 0.5 - left) * view.s, pz = (p.z + 0.5 - top) * view.s;
    ctx.fillStyle = "#ff5a4e"; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, pz, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const label = String(p.name).slice(0, 32), tw = ctx.measureText(label).width;
    ctx.fillStyle = "rgba(16,22,28,0.85)"; ctx.fillRect(px + 9, pz - 9, tw + 8, 18);
    ctx.fillStyle = "#eef2f4"; ctx.fillText(label, px + 13, pz);
  }
  if (style === "paper") compass(w, h);
  if (denied) show("This map is private. Open it with the link from /simplelivemap link.");
}

function show(text) { msg.textContent = text; msg.style.display = text ? "block" : "none"; }

async function poll() {
  if (document.hidden) return;
  try {
    const r = await fetch("live.json", { headers, cache: "no-store" });
    if (r.status === 401) { denied = true; dirty = true; return; }
    if (!r.ok) return;
    const live = await r.json();
    denied = false; show("");
    players = Array.isArray(live.players) ? live.players : [];
    const list = Array.isArray(live.dimensions) ? live.dimensions : [];
    if (JSON.stringify(list) !== JSON.stringify(dims)) {
      dims = list; dimSel.textContent = "";
      for (const d of dims) { const o = document.createElement("option"); o.value = d.folder; o.textContent = d.id; dimSel.appendChild(o); }
      if (dims.length && !dims.some(d => d.folder === folder)) folder = dims[0].folder;
      dimSel.value = folder;
      if (!dims.length) show("Nothing explored yet.");
    }
    playersBox.hidden = players.length === 0 || !OPTS.players;
    pcount.textContent = players.length + (players.length === 1 ? " player" : " players");
    const names = players.map(p => String(p.name).slice(0, 32));
    if (JSON.stringify(names) !== JSON.stringify([...followSel.options].slice(1).map(o => o.value))) {
      followSel.length = 1;
      for (const n of names) { const o = document.createElement("option"); o.value = n; o.textContent = n; followSel.appendChild(o); }
      followSel.value = names.includes(following) ? following : "";
    }
    if (following) {
      const p = players.find(q => q.name === following);
      if (p) {
        const d = dims.find(x => x.id === p.dimension);
        if (d && d.folder !== folder) { folder = d.folder; dimSel.value = folder; }
        view.x = p.x + 0.5; view.z = p.z + 0.5;
      }
    }
    // A hosted map tells its live rhythm ("poll", seconds); the built-in server keeps 2 s.
    const want = Math.max(1, Math.min(60, Number(live.poll) || 2)) * 1000;
    if (want !== pollMs) { pollMs = want; clearInterval(pollTimer); pollTimer = setInterval(poll, pollMs); }
    dirty = true;
  } catch (e) { /* server away: keep the last picture */ }
}

function zoom(f, cx, cy) {
  const s = Math.max(1 / 16, Math.min(8, view.s * f));
  const wx = view.x + (cx - innerWidth / 2) / view.s, wz = view.z + (cy - innerHeight / 2) / view.s;
  view.x = wx - (cx - innerWidth / 2) / s; view.z = wz - (cy - innerHeight / 2) / s; view.s = s; dirty = true;
}

let drag = null;
const pointers = new Map();
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); drag = { x: e.clientX, y: e.clientY }; canvas.classList.add("drag"); });
canvas.addEventListener("pointermove", e => {
  const wx = Math.floor(view.x + (e.clientX - innerWidth / 2) / view.s), wz = Math.floor(view.z + (e.clientY - innerHeight / 2) / view.s);
  info.textContent = "x " + wx + ", z " + wz;
  info.hidden = !OPTS.coords;
  if (pointers.size === 2 && pointers.has(e.pointerId)) {
    const [a, b] = [...pointers.values()], before = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    pointers.set(e.pointerId, e);
    const [c, d] = [...pointers.values()], after = Math.hypot(c.clientX - d.clientX, c.clientY - d.clientY);
    if (before > 0) zoom(after / before, (c.clientX + d.clientX) / 2, (c.clientY + d.clientY) / 2);
    return;
  }
  if (!drag) return;
  if (following) { following = ""; followSel.value = ""; }
  pointers.set(e.pointerId, e);
  view.x -= (e.clientX - drag.x) / view.s; view.z -= (e.clientY - drag.y) / view.s;
  drag = { x: e.clientX, y: e.clientY }; dirty = true;
});
for (const ev of ["pointerup", "pointercancel"]) canvas.addEventListener(ev, e => { pointers.delete(e.pointerId); if (!pointers.size) { drag = null; canvas.classList.remove("drag"); } });
canvas.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.25 : 0.8, e.clientX, e.clientY); }, { passive: false });
document.getElementById("zin").onclick = () => zoom(2, innerWidth / 2, innerHeight / 2);
document.getElementById("zout").onclick = () => zoom(0.5, innerWidth / 2, innerHeight / 2);
document.getElementById("home").onclick = () => { following = ""; followSel.value = ""; view = { x: 0, z: 0, s: 1 }; dirty = true; };
dimSel.onchange = () => { folder = dimSel.value; dirty = true; };
followSel.onchange = () => { following = followSel.value; poll(); };
document.getElementById("goto").onsubmit = e => {
  e.preventDefault();
  const n = (document.getElementById("coords").value.match(/-?\d+/g) || []).map(Number);
  if (n.length >= 2) { following = ""; followSel.value = ""; view.x = n[0] + 0.5; view.z = n[n.length >= 3 ? 2 : 1] + 0.5; view.s = Math.max(view.s, 1); dirty = true; }
};
document.getElementById("full").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
};
gear.onclick = () => { const open = panel.classList.toggle("open"); gear.setAttribute("aria-expanded", String(open)); };
for (const [id, key] of [["o-players", "players"], ["o-coords", "coords"], ["o-grid", "grid"], ["o-keep", "keep"]]) {
  const box = document.getElementById(id);
  box.checked = !!OPTS[key];
  box.onchange = () => { OPTS[key] = box.checked; store.set("slm-opts", JSON.stringify(OPTS)); info.hidden = !OPTS.coords; playersBox.hidden = !OPTS.players || players.length === 0; dirty = true; };
}
for (const radio of document.querySelectorAll('#styles input[name="style"]')) {
  radio.checked = radio.value === OPTS.style;
  radio.onchange = () => { if (radio.checked) { OPTS.style = radio.value; store.set("slm-opts", JSON.stringify(OPTS)); dirty = true; } };
}
info.hidden = !OPTS.coords;
setInterval(() => { if (OPTS.keep) store.set(VIEW_KEY, JSON.stringify({ x: Math.round(view.x), z: Math.round(view.z), s: view.s, f: folder })); }, 3000);
addEventListener("resize", resize);
document.addEventListener("visibilitychange", poll);
resize(); poll(); pollTimer = setInterval(poll, pollMs); requestAnimationFrame(draw);
</script>
</body>
</html>
