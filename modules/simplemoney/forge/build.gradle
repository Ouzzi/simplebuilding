plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '7.0.36' }
ext.moduleVersion = '1.2.16'
ext.forgeExcludedSources = []
ext.forgeMixinConfigs = ['simplemoney.links.mixins.json', 'simplemoney.forge.mixins.json']
apply from: rootProject.file('gradle/module-forge.gradle')

ext.forgeNativeConfig = [id: 'simplemoney', modId: 'simplemoney', root: 'modules/simplemoney/shared/java', screens: ['com/simplemoney/client/MoneyConfigScreen.java'], factory: 'com.simplemoney.client.MoneyConfigScreen.create(parent, net.minecraftforge.fml.loading.FMLPaths.CONFIGDIR.get())']
apply from: rootProject.file('gradle/forge-native-config.gradle')
