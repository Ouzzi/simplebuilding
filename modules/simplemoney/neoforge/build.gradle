plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
ext.moduleVersion = '1.2.16'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API (guide-book quest installer) for standalone runs.
dependencies { jarJar project(':framework') }


repositories { maven { url = 'https://maven.shedaniel.me/' }; maven { url = 'https://maven.terraformersmc.com/releases/' } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}" }

// SimpleBuilding joins integration runs through the mods container only; a classpath dependency would
// also load it into the standalone run (principle 8).
// SimpleBuilding's shared library (not a mod) for the integration run, like the other modules.
dependencies { implementation project(':common') }
evaluationDependsOn(':mc26_3:neoforge')
neoForge {
 mods { simplebuildingIntegration { sourceSet project(':mc26_3:neoforge').sourceSets.main } }
 runs {
  moneyIntegrationGameTest {
   type = 'gameTestServer'
   programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplemoney:*').toString(), '--report', layout.buildDirectory.file('money-junit.xml').get().asFile.absolutePath
  }
 }
}

repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}" }
