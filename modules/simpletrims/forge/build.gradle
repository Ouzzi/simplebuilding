plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simpletrims.mixins.json', 'simpletrims.forge.mixins.json']
// SimpleLib (IdMoves migration, InWorldStrikes, axe-way switch) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')
