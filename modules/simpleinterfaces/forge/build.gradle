plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simpleinterfaces.mixins.json']
// SimpleLib (shared UI style blocks) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')

ext.forgeNativeConfig = [id: 'simpleinterfaces', modId: 'simpleinterfaces', root: 'modules/simpleinterfaces/shared/java', screens: ['com/simplebuilding/modules/simpleinterfaces/ContainersScreen.java'], factory: 'com.simplebuilding.modules.simpleinterfaces.ContainersScreen.create(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
