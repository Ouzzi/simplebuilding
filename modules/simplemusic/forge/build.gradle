plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simplemusic.mixins.json', 'simplemusic.forge.mixins.json']
// SimpleLib (code field UiCodeArea) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')
