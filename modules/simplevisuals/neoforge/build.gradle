plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
ext.moduleVersion = '1.0.7'
apply from: rootProject.file('gradle/module-neoforge.gradle')
dependencies { jarJar project(':framework') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplevisuals:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}

repositories { maven { url = "https://maven.shedaniel.me/" }; maven { url = "https://maven.terraformersmc.com/releases/" } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}"; implementation project(':common') }
evaluationDependsOn(':mc26_3:neoforge')
neoForge { mods { simplebuilding { sourceSet project(':mc26_3:neoforge').sourceSets.main } }; runs.moduleIntegrationGameTest { loadedMods=[mods.simplevisuals,mods.simplebuilding] } }
