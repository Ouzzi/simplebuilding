plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '7.0.36' }
ext.moduleVersion = '1.0.7'
ext.forgeExcludedSources = ['**/client/ClientAssertions.java']
ext.forgeMixinConfigs = ['simplevisuals.mixins.json', 'simplevisuals.forge.mixins.json']
// SimpleLib (style blocks for the model browser box, N43) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')

ext.forgeNativeConfig = [id: 'simplevisuals', modId: 'simplevisuals', root: 'modules/simplevisuals/shared/java', screens: ['com/simplevisuals/client/VisualsConfigScreen.java'], factory: 'com.simplevisuals.client.VisualsConfigScreen.create(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
