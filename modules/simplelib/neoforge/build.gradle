plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
ext.moduleVersion = '0.3.0'
apply from: rootProject.file('gradle/module-neoforge.gradle')

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplelib:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
// Bundles the shared framework API (creative-tab switch) for standalone runs.
dependencies { jarJar project(':framework') }

// Optional JEI plugin (shared/java/com/simplelib/compat/jei, the shared in-world upgrade tab): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}" }
