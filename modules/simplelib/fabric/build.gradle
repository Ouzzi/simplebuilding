plugins { id 'net.fabricmc.fabric-loom' }
ext.moduleVersion = '0.3.0'
apply from: rootProject.file('gradle/module-fabric.gradle')
// Bundles the shared framework API (creative-tab switch) for standalone runs.
dependencies { include project(':framework') }
// Config screen (legendary moments): Cloth Config and Mod Menu stay optional for SimpleLib, compiled against only.
repositories { maven { url = "https://maven.shedaniel.me/" }; maven { url = "https://maven.terraformersmc.com/releases/" } }
dependencies { compileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.mc263_cloth_version}"; compileOnly "com.terraformersmc:modmenu:${rootProject.mc263_modmenu_version}" }

// Optional JEI plugin (shared/java/com/simplelib/compat/jei, the shared in-world upgrade tab): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}" }
