plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.moduleVersion = '0.3.0'
// Forge 26.3 has no JEI: the plugin and its tabs are left out; the JEI-free records (InWorldUpgrade, MobDrop) stay for RecipeViewer.
ext.forgeExcludedSources = ['**/compat/jei/*JeiPlugin.java', '**/compat/jei/*Category.java']
ext.forgeMixinConfigs = ['simplelib.mixins.json', 'simplelib.forge.mixins.json']
apply from: rootProject.file('gradle/module-forge.gradle')
