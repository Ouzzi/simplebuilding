plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simplecreatures.mixins.json', 'simplecreatures.forge.mixins.json']
apply from: rootProject.file('gradle/module-forge.gradle')
ext.forgeNativeConfig = [id: 'simplecreatures', modId: 'simplecreatures', root: 'modules/simplecreatures/shared/java', screens: ['com/simplebuilding/modules/simplecreatures/CreaturesScreen.java'], factory: 'com.simplebuilding.modules.simplecreatures.CreaturesScreen.create(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
