plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
ext.moduleVersion = '1.0.6'
apply from: rootProject.file('gradle/module-neoforge.gradle')
dependencies { jarJar project(':framework') }
// Super-mod (docs/ai/KONZEPT-SUPERMOD-SUBMOD-2026-10-06.md): requires and nests its sub-mods; no class imports.
evaluationDependsOn(':modules:simpleweather:neoforge')
dependencies { jarJar project(':modules:simpleweather:neoforge'); runtimeOnly project(':modules:simpleweather:neoforge') }
neoForge { mods { simpleweather { sourceSet project(':modules:simpleweather:neoforge').sourceSets.main } } }
evaluationDependsOn(':modules:simpleinterfaces:neoforge')
dependencies { jarJar project(':modules:simpleinterfaces:neoforge'); runtimeOnly project(':modules:simpleinterfaces:neoforge') }
neoForge { mods { simpleinterfaces { sourceSet project(':modules:simpleinterfaces:neoforge').sourceSets.main } } }
evaluationDependsOn(':modules:simpleloot:neoforge')
dependencies { jarJar project(':modules:simpleloot:neoforge'); runtimeOnly project(':modules:simpleloot:neoforge') }
neoForge { mods { simpleloot { sourceSet project(':modules:simpleloot:neoforge').sourceSets.main } } }
evaluationDependsOn(':modules:simplecreatures:neoforge')
dependencies { jarJar project(':modules:simplecreatures:neoforge'); runtimeOnly project(':modules:simplecreatures:neoforge') }
neoForge { mods { simplecreatures { sourceSet project(':modules:simplecreatures:neoforge').sourceSets.main } } }
evaluationDependsOn(':modules:simplefarming:neoforge')
dependencies { jarJar project(':modules:simplefarming:neoforge'); runtimeOnly project(':modules:simplefarming:neoforge') }
neoForge { mods { simplefarming { sourceSet project(':modules:simplefarming:neoforge').sourceSets.main } } }
// SimpleLib (style blocks for the linked panel) nested per principle 6a; compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplequalityoflife:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}

repositories { maven { url="https://maven.shedaniel.me/" }; maven { url="https://maven.terraformersmc.com/releases/" } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}" }

dependencies { implementation project(':common') }
evaluationDependsOn(':mc26_3:neoforge')
neoForge { mods { simplebuilding { sourceSet project(':mc26_3:neoforge').sourceSets.main } } }
neoForge.runs.moduleIntegrationGameTest.loadedMods=[neoForge.mods.simplequalityoflife,neoForge.mods.simplebuilding,neoForge.mods.simpleweather,neoForge.mods.simpleinterfaces,neoForge.mods.simpleloot,neoForge.mods.simplecreatures,neoForge.mods.simplefarming]
