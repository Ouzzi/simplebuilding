plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '7.0.36' }
ext.moduleVersion = '1.0.5'
ext.forgeExcludedSources = []
ext.forgeMixinConfigs = ['simpleriding.mixins.json', 'simpleriding.forge.mixins.json']
apply from: rootProject.file('gradle/module-forge.gradle')

ext.forgeNativeConfig = [id: 'simpleriding', modId: 'simpleriding', root: 'modules/simpleriding/shared/java', screens: ['com/simpleriding/client/RidingConfigScreen.java'], factory: 'com.simpleriding.client.RidingConfigScreen.create(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
