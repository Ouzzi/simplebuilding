plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
ext.moduleVersion = '1.0.5'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API (guide-book quest installer) for standalone runs.
dependencies { jarJar project(':framework') }
// SimpleLib (style blocks for the hoof panel) nested per principle 6a; compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }


repositories { maven { url = "https://maven.shedaniel.me/" }; maven { url = "https://maven.terraformersmc.com/releases/" } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}"; implementation project(':common') }

evaluationDependsOn(':mc26_3:neoforge')
neoForge {
 mods { simplebuilding { sourceSet project(':mc26_3:neoforge').sourceSets.main } }
 runs { ridingIntegrationGameTest {
  type='gameTestServer'
  loadedMods=[mods.simpleriding,mods.simplebuilding]
  programArguments.addAll '--tests',(project.findProperty('gametestFilter') ?: 'simpleriding:*').toString(),'--report',layout.buildDirectory.file('riding-junit.xml').get().asFile.absolutePath
 } }
}
