plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
// Forge 26.3 has neither JEI nor Jade (split stage 5b plugins are left out).
ext.forgeExcludedSources = ['**/compat/jei/**', '**/compat/jade/**']
ext.forgeMixinConfigs = ['simplecrucibles.mixins.json', 'simplecrucibles.forge.mixins.json']
// SimpleLib (IdMoves migration, in-world upgrades and their axe way, warm food, shared materials, UI) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
// 0.9.0: SimpleBuilding 26.3 requires simplecrucibles >=0.9.0 (modules stay 0.x until the owner's approval, then 1.0.0).
ext.moduleVersion = '0.9.0'
apply from: rootProject.file('gradle/module-forge.gradle')
// The Enderite crucible and barrel faces are Vanilla-derived textures (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
