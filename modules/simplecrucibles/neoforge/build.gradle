plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
// 1.0.0: SimpleBuilding 26.3 requires simplecrucibles >=1.0.0 (split plan section 5: new sub-mods start at 1.0.0).
ext.moduleVersion = '1.0.0'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { jarJar project(':framework') }
// SimpleLib (IdMoves migration, in-world upgrades and their axe way, warm food, shared materials, UI) nested per principle 6a; compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplecrucibles:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
// The Enderite crucible and barrel faces are Vanilla-derived textures (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Optional JEI and Jade plugins (shared/java/com/simplecrucibles/compat/jei|jade, split stage 5b): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" }; maven { url = "https://api.modrinth.com/maven" } }
dependencies {
    compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}"
    compileOnly("maven.modrinth:jade:${rootProject.mc263_dev_jade_neoforge}") { transitive = false }
}
