plugins { id 'net.fabricmc.fabric-loom' }
apply from: rootProject.file('gradle/module-fabric.gradle')

dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

repositories { maven { url = "https://maven.shedaniel.me/" }; maven { url = "https://maven.terraformersmc.com/releases/" } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.mc263_cloth_version}" }
dependencies { compileOnly "com.terraformersmc:modmenu:${rootProject.mc263_modmenu_version}" }
