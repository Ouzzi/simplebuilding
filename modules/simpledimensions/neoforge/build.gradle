plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
apply from: rootProject.file('gradle/module-neoforge.gradle')

dependencies { jarJar project(':framework') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        gameDirectory = rootProject.layout.projectDirectory.dir('integration/run-neoforge-263')
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simpledimension:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}

// SimpleBuilding joins integration runs through the mods container only; a classpath dependency would
// also load it into the standalone run (principle 8).
// SimpleBuilding's shared library (not a mod) for the integration run, like the other modules.
dependencies { implementation project(':common') }
evaluationDependsOn(':mc26_3:neoforge')
neoForge { mods { simplebuildingIntegration { sourceSet project(':mc26_3:neoforge').sourceSets.main } } }

repositories { maven { url = "https://maven.shedaniel.me/" }; maven { url = "https://maven.terraformersmc.com/releases/" } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}" }
