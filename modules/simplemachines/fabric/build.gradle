plugins { id 'net.fabricmc.fabric-loom' }
// 0.1.0: new module (WP-17); modules stay 0.x until the owner's approval, then 1.0.0.
apply from: rootProject.file('gradle/module-fabric.gradle')
// Bundles the shared framework API (sub-mod switch, config files, creative tab setting, test centre station) for standalone runs.
dependencies { include project(':framework') }
// SimpleLib nested per principle 6a and compiled against: /<modid> config (ConfigCommands, CMD24).
dependencies { include project(':modules:simplelib:fabric'); implementation project(':modules:simplelib:fabric') }
// Hopper minecart item textures are Vanilla-derived (built, never committed; MACH32-MOD stage 3).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Optional JEI plugin (shared/java/com/simplemachines/compat/jei, stage 4: Auto Smither as smithing catalyst): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}" }
