plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simplemobmanners.mixins.json', 'simplemobmanners.forge.mixins.json']
apply from: rootProject.file('gradle/module-forge.gradle')
ext.forgeNativeConfig = [id: 'simplemobmanners', modId: 'simplemobmanners', root: 'modules/simplemobmanners/shared/java', screens: ['com/simplebuilding/modules/simplemobmanners/MobMannersScreen.java'], factory: 'com.simplebuilding.modules.simplemobmanners.MobMannersScreen.create(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
