plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.147'
}
ext.moduleVersion = '1.2.12'
apply from: rootProject.file('gradle/module-neoforge.gradle')
repositories { maven { url = 'https://maven.shedaniel.me/' } }
dependencies { implementation "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}"; implementation project(':common') }
evaluationDependsOn(':mc26_3:neoforge')
neoForge.mods { simplebuilding { sourceSet project(':mc26_3:neoforge').sourceSets.main } }
neoForge.runs {
 moduleIntegrationGameTest {
  type = 'gameTestServer'
  loadedMods = [neoForge.mods.simpletweaks, neoForge.mods.simplebuilding]
  gameDirectory = rootProject.layout.projectDirectory.dir('integration/run-neoforge-263')
  programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simpletweaks:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
 }
}

// Package the shared framework API for production, as well as development runs.
dependencies { jarJar project(':framework') }

// Cross-module test runtime only; production has no Dimensions dependency or internal imports.
if (gradle.startParameter.taskNames.contains("${project.path}:runModuleIntegrationGameTest".toString())) {
 evaluationDependsOn(':modules:simpledimensions:neoforge')
 neoForge.mods { simpledimension { sourceSet project(':modules:simpledimensions:neoforge').sourceSets.main } }
 neoForge.runs.moduleIntegrationGameTest.loadedMods = [neoForge.mods.simpletweaks, neoForge.mods.simplebuilding, neoForge.mods.simpledimension]
}
