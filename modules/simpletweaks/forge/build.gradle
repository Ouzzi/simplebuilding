plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '7.0.36' }
ext.moduleVersion = '0.9.0'
// SimpleLib nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
ext.forgeMixinConfigs = ['simpletweaks.mixins.json', 'simpletweaks.claims.mixins.json', 'simpletweaks.admin.mixins.json', 'simpletweaks.play.mixins.json', 'simpletweaks.protect.mixins.json', 'simpletweaks.protect.client.mixins.json', 'simpletweaks.forge.mixins.json']
apply from: rootProject.file('gradle/module-forge.gradle')
