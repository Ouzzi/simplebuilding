plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
// Forge 26.3 has no JEI (the plugin sources are left out).
ext.forgeExcludedSources = ['**/compat/jei/**']
ext.forgeMixinConfigs = ['simpleblocks.mixins.json', 'simpleblocks.forge.mixins.json']
// SimpleLib (IdMoves migration of the building blocks from SimpleBuilding) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
// 0.9.0-beta.1: SimpleBuilding 26.3 requires simpleblocks >=0.9.0-beta.1 (required sub-mod; first public files are betas, owner W3B 15.11.; version = modules.json).
ext.moduleVersion = '0.9.0-beta.1'
apply from: rootProject.file('gradle/module-forge.gradle')
// The cracked/mossy brick textures are Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
