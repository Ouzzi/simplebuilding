plugins { id 'net.fabricmc.fabric-loom' }
// 0.9.0-beta.1: SimpleBuilding 26.3 requires simpleblocks >=0.9.0-beta.1 (required sub-mod; first public files are betas, owner W3B 15.11.; version = modules.json).
ext.moduleVersion = '0.9.0-beta.1'
apply from: rootProject.file('gradle/module-fabric.gradle')
// Bundles the shared framework API (sub-mod switch, config files, creative tab setting) for standalone runs.
dependencies { include project(':framework') }
// SimpleLib (IdMoves migration of the building blocks from SimpleBuilding) nested per principle 6a; compiled against.
dependencies { include project(':modules:simplelib:fabric'); implementation project(':modules:simplelib:fabric') }
// The cracked/mossy brick textures are Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Optional JEI plugin (shared/java/com/simpleblocks/compat/jei, the Shapecutter category): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies {
    compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}"
}
