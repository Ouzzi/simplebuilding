plugins { id 'net.fabricmc.fabric-loom' }
apply from: rootProject.file('gradle/module-fabric.gradle')
// Bundles the shared framework API (sub-mod switch, config files, creative tab setting) for standalone runs.
dependencies { include project(':framework') }
// The cracked/mossy brick textures are Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Optional JEI plugin (shared/java/com/simpleblocks/compat/jei, the Shaping Saw category): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies {
    compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}"
}
