plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
// 0.9.0: SimpleBuilding 26.3 requires simpleblocks >=0.9.0 (required sub-mod; modules stay 0.x until the owner's approval, then 1.0.0).
ext.moduleVersion = '0.9.0'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { jarJar project(':framework') }
// SimpleLib (IdMoves migration of the building blocks from SimpleBuilding) nested per principle 6a; compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simpleblocks:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
// The cracked/mossy brick textures are Vanilla-derived (built, never committed).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Optional JEI plugin (shared/java/com/simpleblocks/compat/jei, the Shapecutter category): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies {
    compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}"
}
