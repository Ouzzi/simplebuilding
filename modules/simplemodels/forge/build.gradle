plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '7.0.36' }
ext.moduleVersion = '0.1.0'
ext.forgeExcludedSources = []
ext.forgeMixinConfigs = ['simplemodels.mixins.json', 'simplemodels.forge.mixins.json']
// SimpleLib (style blocks for the model browser box, N43) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')

ext.forgeNativeConfig = [id: 'simplemodels', root: 'modules/simplemodels/shared/java', screens: [], factory: 'new com.simplebuilding.modules.simplemodels.client.ModelBrowser(parent)']
apply from: rootProject.file('gradle/forge-native-config.gradle')
