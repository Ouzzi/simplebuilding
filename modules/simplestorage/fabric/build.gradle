plugins { id 'net.fabricmc.fabric-loom' }
// 1.0.0: SimpleBuilding 26.3 requires simplestorage >=1.0.0 (split plan section 5: new sub-mods start at 1.0.0).
ext.moduleVersion = '1.0.0'
apply from: rootProject.file('gradle/module-fabric.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { include project(':framework') }
// SimpleLib (IdMoves migration, container style blocks) nested per principle 6a; compiled against.
dependencies { include project(':modules:simplelib:fabric'); implementation project(':modules:simplelib:fabric') }
// Chest cart and chest boat item textures are Vanilla-derived (built, never committed; split stage 8b-2).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Split stage 8c-2: Trinkets Updated API for TrinketsHook (optional accessory slots, compileOnly; loaded only with trinkets_updated).
repositories {
    exclusiveContent {
        forRepository { maven { url = "https://maven.nucleoid.xyz/" } }
        filter { includeGroup "eu.pb4" }
    }
}
dependencies { compileOnly("eu.pb4:trinkets:${rootProject.mc263_trinkets_version}") { transitive = false } }
