plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
// 0.9.0: SimpleBuilding 26.3 requires simplestorage >=0.9.0 (modules stay 0.x until the owner's approval, then 1.0.0).
ext.moduleVersion = '0.9.0'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { jarJar project(':framework') }
// SimpleLib (IdMoves migration, container style blocks) nested per principle 6a; compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplestorage:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
// Chest cart and chest boat item textures are Vanilla-derived (built, never committed; split stage 8b-2).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
// Split stage 8c-2: Curios API for CuriosHook (optional accessory slots, compileOnly; loaded only with curios).
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.theillusivec4.top/' } }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
}
dependencies { compileOnly("top.theillusivec4.curios:curios-neoforge:${rootProject.mc263_curios_version}:api") { transitive = false } }
