plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simplestorage.mixins.json', 'simplestorage.forge.mixins.json']
// SimpleLib (IdMoves migration, container style blocks) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
// 1.0.0: SimpleBuilding 26.3 requires simplestorage >=1.0.0 (split plan section 5: new sub-mods start at 1.0.0).
ext.moduleVersion = '1.0.0'
apply from: rootProject.file('gradle/module-forge.gradle')
// Chest cart and chest boat item textures are Vanilla-derived (built, never committed; split stage 8b-2).
apply from: rootProject.file('gradle/module-vanilla-derived.gradle')
