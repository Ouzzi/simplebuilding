plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API (guide-book quest installer) for standalone runs.
dependencies { jarJar project(':framework') }
// SimpleLib (crucibles, warm food) nested per principle 6a.
dependencies { jarJar project(':modules:simplelib:neoforge') }
// Simple Crucibles (crucibles, barrels, cauldron: split stage 5) nested like SimpleLib before, so worlds with crucibles keep them.
dependencies { jarJar project(':modules:simplecrucibles:neoforge') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplesandwiches:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
