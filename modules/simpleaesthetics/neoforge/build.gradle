plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
ext.moduleVersion = '0.9.0'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// framework (SubMods switches) nested per principle 3.
dependencies { jarJar project(':framework') }
// Super-mod (PLAN-MODULAUFTEILUNG stage 1c): requires and nests its sub-mods; no class imports.
evaluationDependsOn(':modules:simplevisuals:neoforge')
evaluationDependsOn(':modules:simplesounds:neoforge')
evaluationDependsOn(':modules:simplemodels:neoforge')
dependencies {
    jarJar project(':modules:simplevisuals:neoforge'); runtimeOnly project(':modules:simplevisuals:neoforge')
    jarJar project(':modules:simplesounds:neoforge'); runtimeOnly project(':modules:simplesounds:neoforge')
    jarJar project(':modules:simplemodels:neoforge'); runtimeOnly project(':modules:simplemodels:neoforge')
}
neoForge { mods {
    simplevisuals { sourceSet project(':modules:simplevisuals:neoforge').sourceSets.main }
    simplesounds { sourceSet project(':modules:simplesounds:neoforge').sourceSets.main }
    simplemodels { sourceSet project(':modules:simplemodels:neoforge').sourceSets.main }
} }
// Visuals and Sounds need Cloth Config in the dev runs.
repositories { maven { url = "https://maven.shedaniel.me/" }; maven { url = "https://maven.terraformersmc.com/releases/" } }
dependencies { runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.mc263_cloth_version}" }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        loadedMods = [neoForge.mods.simpleaesthetics, neoForge.mods.simplevisuals, neoForge.mods.simplesounds, neoForge.mods.simplemodels]
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simpleaesthetics:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
