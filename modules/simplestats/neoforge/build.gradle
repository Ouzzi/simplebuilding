plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API (guide book quests) for standalone runs.
dependencies { jarJar project(':framework') }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplestats:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}

// SimpleLib (box style, principle 6a) nested per jarJar and compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }
