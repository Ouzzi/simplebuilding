plugins { id 'net.fabricmc.fabric-loom' }
// 0.9.0-beta.1: SimpleBuilding 26.3 requires simplehammers >=0.9.0-beta.1 (first public files are betas, owner W3B 15.11.; version = modules.json).
ext.moduleVersion = '0.9.0-beta.1'
apply from: rootProject.file('gradle/module-fabric.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { include project(':framework') }
// SimpleLib (IdMoves migration, HammerActions, in-world upgrades, OctetCells) nested per principle 6a; compiled against.
dependencies { include project(':modules:simplelib:fabric'); implementation project(':modules:simplelib:fabric') }
// Optional JEI plugin (shared/java/com/simplehammers/compat/jei): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}" }
// ABN30-10: the optional rose gold hammer textures are Vanilla-derived from the own gold hammer (built, never committed).
apply from: rootProject.file("gradle/module-vanilla-derived.gradle")
