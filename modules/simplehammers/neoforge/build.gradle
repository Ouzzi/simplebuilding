plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
// 0.9.0: SimpleBuilding 26.3 requires simplehammers >=0.9.0 (modules stay 0.x until the owner's approval, then 1.0.0).
ext.moduleVersion = '0.9.0'
apply from: rootProject.file('gradle/module-neoforge.gradle')
// Bundles the shared framework API for standalone runs.
dependencies { jarJar project(':framework') }
// SimpleLib (IdMoves migration, HammerActions, in-world upgrades, OctetCells) nested per principle 6a; compiled against.
evaluationDependsOn(':modules:simplelib:neoforge')
dependencies { jarJar project(':modules:simplelib:neoforge'); implementation project(':modules:simplelib:neoforge') }
// Optional JEI plugin (shared/java/com/simplehammers/compat/jei): compiled against, never bundled.
repositories { maven { url = "https://maven.blamejared.com" } }
dependencies { compileOnly "mezz.jei:jei-${rootProject.mc263_minecraft_version}-common-api:${rootProject.mc263_jei_version}" }

neoForge.runs {
    moduleIntegrationGameTest {
        type = 'gameTestServer'
        programArguments.addAll '--tests', (project.findProperty('gametestFilter') ?: 'simplehammers:*').toString(), '--report', layout.buildDirectory.file('module-junit.xml').get().asFile.absolutePath
    }
}
