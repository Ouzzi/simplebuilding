plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
// Forge 26.3 has no JEI (the plugin is left out).
ext.forgeExcludedSources = ['**/compat/jei/**']
ext.forgeMixinConfigs = ['simplehammers.mixins.json', 'simplehammers.forge.mixins.json']
// SimpleLib (IdMoves migration, HammerActions, in-world upgrades, OctetCells) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
// 0.9.0-beta.1: SimpleBuilding 26.3 requires simplehammers >=0.9.0-beta.1 (first public files are betas, owner W3B 15.11.; version = modules.json).
ext.moduleVersion = '0.9.0-beta.1'
apply from: rootProject.file('gradle/module-forge.gradle')
// ABN30-10: the optional rose gold hammer textures are Vanilla-derived from the own gold hammer (built, never committed).
apply from: rootProject.file("gradle/module-vanilla-derived.gradle")
