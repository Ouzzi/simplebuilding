plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '7.0.36'
}
ext.forgeMixinConfigs = ['simplebeacons.mixins.json', 'simplebeacons.forge.mixins.json']
// SimpleLib (InWorldStrikes, upgrade tools, UI boxes) nested next to framework (principle 6a).
ext.forgeBundleSimplelib = true
apply from: rootProject.file('gradle/module-forge.gradle')
