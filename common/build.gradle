plugins {
    id 'java-library'
}

description = 'Shared cross-loader sources (scaffold)'

repositories {
    mavenCentral()
}

group = rootProject.group
version = rootProject.version

// Targets Java 21, the floor across both supported Minecraft lines (1.21.11 needs 21,
// 26.2 needs 25). Java 25 modules can consume these classes; the reverse would not work.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

dependencies {
    api 'org.slf4j:slf4j-api:2.0.16'
}

tasks.register('portStatus') {
    group = 'migration'
    description = 'Shows current multiloader migration status for common code.'
    doLast {
        println 'Common module scaffold exists. Move cross-loader logic from root Fabric sources into common gradually.'
    }
}
