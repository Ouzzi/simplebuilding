plugins {
    id 'java-library'
}

description = 'Shared cross-loader sources (scaffold)'

group = rootProject.group
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.register('portStatus') {
    group = 'migration'
    description = 'Shows current multiloader migration status for common code.'
    doLast {
        println 'Common module scaffold exists. Move cross-loader logic from root Fabric sources into common gradually.'
    }
}
